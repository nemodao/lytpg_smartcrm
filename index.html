   display_event, display_period_limit_apply, display_period_from, display_period_to, display_hide_to_all,
   participate_period_limit_type, participate_period_from, participate_period_to, min_position_hold_second,
   point_max_cap_enabled, point_max_cap_value, cash_value_per_point_unit, release_auto_delay_day,
   point_expiration_window, terms_url, create_date, create_user, update_date, update_user)
VALUES (#{programId}, #{taskBundleId}, #{taskName}, #{taskDescription}, #{displayHideBookType}, 0, #{tzMinutes},
        #{displayEvent}, #{displayPeriodLimitApply}, #{displayPeriodFrom}, #{displayPeriodTo}, #{displayHideToAll},
        #{participatePeriodLimitType}, #{participatePeriodFrom}, #{participatePeriodTo}, #{minPositionHoldSecond},
        #{pointMaxCapEnabled}, #{pointMaxCapValue}, #{cashValuePerPointUnit}, #{releaseAutoDelayDay},
        #{pointExpirationWindow}, #{termsUrl}, UTC_TIMESTAMP(), #{currentUser}, UTC_TIMESTAMP(), #{currentUser});

-- conversion rows: soft delete what is gone or changed, insert what is new or changed
UPDATE point_task_trading_point_conversion SET deleted = 1
WHERE task_id = #{taskId} AND deleted = 0 AND id NOT IN (#{keptIds});

INSERT INTO point_task_trading_point_conversion
  (deleted, task_id, mt5_group, condition_type, condition_value, point_per_lot, create_date, create_user)
VALUES (0, #{taskId}, #{mt5Group}, #{conditionType}, #{conditionValue}, #{pointPerLot}, UTC_TIMESTAMP(), #{currentUser});</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": { "id": 3201, "enabled": 0 } }

// validation error
{ "success": false, "code": 500, "message": "Please fix the highlighted fields.",
  "result": { "errors": [
    { "field": "participatePeriodTo", "message": "Participate end must be after participate start." },
    { "field": "conversions[3].conditionValue", "message": "Duplicate rate row: Direct\\Mini400 / symbol_group / metal." }
  ] } }

// another live trading task in the program (J2)
{ "success": false, "code": 500, "message": "Program already has a live trading task: 3188 (HSB Coin Trading old). Send confirmDuplicate to continue.",
  "result": { "duplicateTaskIds": [3188] } }</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Please fix the highlighted fields.</code></td><td>with result.errors</td></tr><tr><td><code>Task does not exist.</code></td><td></td></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Task bundle does not exist.</code></td><td></td></tr><tr><td><code>Task bundle does not belong to this program.</code></td><td>J1</td></tr><tr><td><code>Program and task bundle cannot be changed.</code></td><td>J1</td></tr><tr><td><code>Field {field} cannot be changed after clients have traded in this task.</code></td><td>Locks while running tab</td></tr><tr><td><code>Program already has a live trading task: {ids}. Send confirmDuplicate to continue.</code></td><td>J2, only when the task is enabled</td></tr></table></div><div class="specsec"><h4>5. Notes</h4><p>Per-field messages are in the Rules tab. There is no delete-task API; rate rows are only soft-deleted via T1.</p></div></div><div class="specsrc" id="spec-t2" data-title="T2 · /point/admin/trading/enable"><p class="specmeta"><code>POST</code> · <code>/point/admin/trading/enable</code></p><p>Enable / disable 1 trading task (switch on the task card, via EnableConfirmModal).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>Yes</td><td>Task must exist.</td></tr><tr><td><code>enabled</code></td><td>int</td><td>Yes</td><td>0 / 1.</td></tr><tr><td><code>confirmDuplicate</code></td><td>bool</td><td>No</td><td>Used only on enable: <code>true</code> = user has seen the J2 warning and still wants to enable.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds">
<li>Transaction, lock the program as in T1.</li>
<li><b>Enable</b>: re-run all T1 validation on the stored data (task + non-deleted rate rows), plus J6 (at least 1 <code>point_per_lot &gt; 0</code> row). Failure → error with <code>result.errors</code> (FE shows EnableErrorModal).</li>
<li><b>Enable</b>: check J2 with the query below. Another live task exists and <code>confirmDuplicate</code> is not <code>true</code> → error with <code>duplicateTaskIds</code>.</li>
<li><b>Disable</b>: no blocking. Also returns <code>pendingDealCount</code> / <code>pendingPoint</code> (orders calculated but not yet distributed) for FE to show in the confirmation dialog.</li>
<li>UPDATE <code>enabled</code>, <code>update_user</code>, <code>update_date = UTC_TIMESTAMP()</code>.</li></ol>
<p><b>What disabling a task does</b> (from the code): from its next run the coin calculation engine creates no new orders for the task; the app no longer shows the task (client sees another task if any, or <code>tradingTask = false</code>). The coin distribution engine does <b>not</b> check whether the task is still enabled: already-calculated orders are still distributed on schedule; coins already credited stay and can be spent.</p><pre>-- J2: other live trading tasks in the same program (participate window overlaps now or the future)
SELECT d.id, d.task_name
FROM point_task_trading d
JOIN point_task_bundle b ON b.id = d.task_bundle_id
WHERE d.program_id = #{programId}
  AND d.id &lt;&gt; #{id}
  AND d.enabled = 1 AND b.enabled = 1
  AND ( d.participate_period_limit_type = 'no_limit'
        OR d.participate_period_to &gt; UTC_TIMESTAMP() );

-- pending coins of the task (shown when disabling)
SELECT COUNT(*) AS pending_deal_count, COALESCE(SUM(point), 0) AS pending_point
FROM point_task_trading_deal_log
WHERE task_id = #{id} AND release_status = 0;   -- needs index (task_id, ...), DEV-06</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": { "enabled": 0, "pendingDealCount": 3, "pendingPoint": 210 } }</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Task does not exist.</code></td><td></td></tr><tr><td><code>Enabled must be 0 or 1.</code></td><td></td></tr><tr><td><code>Task cannot be enabled: please fix the highlighted fields.</code></td><td>with result.errors</td></tr><tr><td><code>Task needs at least one rate row with coins per lot above 0.</code></td><td>J6</td></tr><tr><td><code>Program already has a live trading task: {ids}. Send confirmDuplicate to continue.</code></td><td>J2</td></tr></table></div><div class="specsec"><h4>5. Notes</h4><p>B3 (enable bundle, Check-in group API) runs the same J2 check for every enabled trading task in that bundle, with the same <code>confirmDuplicate</code> mechanism. Enabling a program (P4) or client group (P5) needs no J2 check because J2 is scoped to 1 program.</p></div></div><div class="specsrc" id="spec-t3" data-title="T3 · /point/admin/trading/get"><p class="specmeta"><code>GET</code> · <code>/point/admin/trading/get</code></p><p>Details of 1 trading task with non-deleted rate rows and <code>lockedFields</code> (opens M4 in View/Edit mode).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>Yes</td><td>Task must exist.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds">
<li>Read the task and rate rows <code>deleted = 0</code> (sorted by <code>mt5_group</code>, priority symbol → symbol_group → any, <code>condition_value</code>).</li>
<li><code>hasData</code> = task has at least 1 <code>point_task_trading_deal_log</code> row.</li>
<li><code>lockedFields</code>: always has <code>programId</code>, <code>taskBundleId</code>; plus <code>tzMinutes</code>, <code>releaseAutoDelayDay</code> when <code>hasData</code> (Locked-while-running tab).</li>
<li><code>warnings</code>: string array for FE to show in yellow, does not block saving: MT5 group with no <code>any</code> row; <code>point_per_lot = 0</code> row; task is enabled and J2 finds an overlapping task.</li>
<li>With <code>pendingDealCount</code>, <code>pendingPoint</code> as in T2.</li></ol><pre>SELECT EXISTS (SELECT 1 FROM point_task_trading_deal_log WHERE task_id = #{id}) AS has_data;

SELECT id, mt5_group, condition_type, condition_value, point_per_lot, create_date, create_user
FROM point_task_trading_point_conversion
WHERE task_id = #{id} AND deleted = 0
ORDER BY mt5_group, FIELD(condition_type, 'symbol', 'symbol_group', 'any'), condition_value;</pre></div><div class="specsec"><h4>3. Response</h4><pre>{

<li>Also returns English <code>reasonText</code> for <code>reason_code</code> (table in Notes).</li></ol><pre>SELECT l.id, l.client_id, l.login_id, l.mt5_group, l.deal_id, l.symbol_full, l.symbol, l.symbol_group,
       l.lot, l.lot_valid, l.position_open_time_utc, l.deal_time_utc, l.period_key,

       l.point_per_lot, l.point, l.release_point, l.un_release_point, l.release_status, l.reason_code,
       l.release_schedule_time, l.release_actual_time, l.release_fail_times, l.create_date
FROM point_task_trading_deal_log l
WHERE l.task_id = #{taskId}
  AND (#{clientId} IS NULL OR l.client_id = #{clientId})

  AND (#{periodKey_begin} IS NULL OR l.period_key &gt;= #{periodKey_begin})
  AND (#{periodKey_end} IS NULL OR l.period_key &lt;= #{periodKey_end})
  AND (#{releaseStatus} IS NULL OR l.release_status = #{releaseStatus})
  AND (#{symbol} IS NULL OR l.symbol = #{symbol})
ORDER BY l.deal_id DESC
LIMIT #{offset}, #{pageSize};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": { "total": 1, "records": [{

}</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Task does not exist.</code></td><td></td></tr><tr><td><code>Release status is not valid.</code></td><td></td></tr><tr><td><code>Date range must be at most 93 days.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Notes</h4><p><code>reason_code</code> present in code: <code>CLIENT_BLACKLISTED</code> (client blacklisted), <code>TASK_NOT_ACTIVE</code> (order opened or closed outside the participation window), <code>HOLD_TIME_NOT_MET</code> (holding time too short), <code>NO_RATE_CONFIG</code> (no matching rate row), <code>ISSUE_FAILED</code> (distribution failed more than 3 times). Empty = valid.</p>
<p>The table has no index starting with <code>task_id</code> (UAT already has ~262,000 rows): one needs to be added, see DEV-06.</p></div></div><div class="specsrc" id="spec-t5" data-title="T5 · /point/admin/trading/dailyLog/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/trading/dailyLog/list</code></p><p>Per-client / per-day summary of 1 task (Daily Log tab of M4). Read-only.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>taskId</code></td><td>long</td><td>Yes</td><td>Task must exist.</td></tr><tr><td><code>clientId</code></td><td>long</td><td>No</td><td>Exact match.</td></tr><tr><td><code>periodKey_begin, periodKey_end</code></td><td>yyyy-MM-dd</td><td>No</td><td>Same as T4.</td></tr><tr><td><code>pageNo, pageSize</code></td><td>int</td><td>No</td><td>1 / 10, max 100.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>Query below, newest date first.</li>
<li>Also returns <code>status</code> computed the same way as the app: <code>pending</code> (scheduled distribution time still in the future) / <code>earning</code> (pending coins remain and cap not reached) / <code>credited</code>, and <code>capped</code> = cap enabled and <code>point_earned &gt;= point_max_cap_value</code>.</li></ol><pre>SELECT id, client_id, period_key, tz_minutes, lot_total, lot_valid, point_total, point_pending, point_earned,
       points_limit_lost, points_fail_lost, total_txn_count, full_release_count, partial_release_count,
       over_limit_count, fail_count, point_max_cap_enabled, point_max_cap_value, cash_value_per_point_unit,
       release_auto_delay_day, release_schedule_time, point_expiration_window, point_expiration_time,

FROM point_task_trading_log
WHERE task_id = #{taskId}
  AND (#{clientId} IS NULL OR client_id = #{clientId})

  AND (#{periodKey_end} IS NULL OR period_key &lt;= #{periodKey_end})
ORDER BY period_key DESC, client_id
LIMIT #{offset}, #{pageSize};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{

table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>Validate, apply the date range.</li>
<li>Get the program's client groups; query below with the program-membership condition (scope SQL in the Overview tab).</li>
<li>Also returns <code>sourceName</code> (<code>trading</code> / <code>daily_checkin</code> / <code>adjust</code> / <code>redeem</code>, derived from the lot's <code>task_log_table</code> as in the app) and <code>typeName</code>.</li></ol><pre>SELECT g.id, g.client_id, g.lot_id, g.source_type, g.type, g.point_amount,
       g.point_balance_before, g.point_balance_after, g.redemption_id, g.external_system, g.external_id,
       g.create_date, g.create_user,
       l.task_log_table, l.point_expiration_time AS lot_expiration_time
FROM point_ledger g
LEFT JOIN point_lot l ON l.id = g.lot_id
WHERE g.create_date &gt;= #{createDate_begin} AND g.create_date &lt; #{createDate_end}
  AND (#{clientId} IS NULL OR g.client_id = #{clientId})
  AND (#{sourceType} IS NULL OR g.source_type = #{sourceType})
  AND (#{type} IS NULL OR g.type = #{type})
  AND g.client_id IN (/* SCOPE_SQL of program */)
ORDER BY g.create_date DESC, g.id DESC
LIMIT #{offset}, #{pageSize};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{

i>
<li>Also returns <code>sourceName</code> and <code>status</code> computed at read time.</li></ol><pre>SELECT id, client_id, task_log_table, task_log_id, source_type, point_earned, point_balance,
       point_expiration_time, cash_value_per_point_unit, archive_at, create_date, create_user, update_date
FROM point_lot
WHERE create_date &gt;= #{createDate_begin} AND create_date &lt; #{createDate_end}
  AND (#{clientId} IS NULL OR client_id = #{clientId})
  AND (#{sourceType} IS NULL OR source_type = #{sourceType})
  AND ( #{status} IS NULL
     OR (#{status} = 'valid'   AND point_balance &gt; 0  AND (point_expiration_time IS NULL OR point_expiration_time &gt; UTC_TIMESTAMP()))
     OR (#{status} = 'used'    AND point_balance = 0  AND (point_expiration_time IS NULL OR point_expiration_time &gt; UTC_TIMESTAMP()))
     OR (#{status} = 'expired' AND point_expiration_time &lt;= UTC_TIMESTAMP()) )
  AND client_id IN (/* SCOPE_SQL of program */)
ORDER BY create_date DESC, id DESC
LIMIT #{offset}, #{pageSize};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": { "total": 1, "records": [{
    "id": 262400, "clientId": 72000101, "taskLogTable": "manual_adjust", "taskLogId": 1848213470001, "sourceType": 2,
    "sourceName": "adjust", "pointEarned": 100, "pointBalance": 100, "pointExpirationTime": "2027-04-19 16:59:59",

    "createDate": "2026-10-21 03:00:00", "createUser": "admin01", "updateDate": "2026-10-21 03:00:00" }] }
}</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Status must be valid, used or expired.</code></td><td></td></tr><tr><td><code>Date range must be at most {n} days.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Notes</h4><p>Note for FE: the client app counts the balance only over lots with an expiry (<code>point_expiration_time &gt; now</code>), whereas coin deduction (redeem, manual deduction) also uses lots with NULL expiry. Currently every lot-creation path writes an expiry, so NULL lots do not appear; if one shows up, it is abnormal data.</p></div></div><div class="specsrc" id="spec-k3" data-title="K3 · /point/admin/coin/adjust"><p class="specmeta"><code>POST</code> · <code>/point/admin/coin/adjust</code></p><p>Manually add / deduct coin for 1 client in the program (Adjust Balance modal). Smart CRM version of <code>POST /point/pointAdjust</code>.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>Yes</td><td>Program must exist.</td></tr><tr><td><code>clientId</code></td><td>long</td><td>Yes</td><td>Client exists (<code>crm_customer_base</code>, <code>deleted = 0</code>) and belongs to the program (Overview tab, program client scope).</td></tr><tr><td><code>point</code></td><td>long</td><td>Yes</td><td>Non-zero. Positive = credit, negative = deduct. |point| ≤ 100,000 (confirmed).</td></tr><tr><td><code>expireDays</code></td><td>int</td><td>No</td><td>1 … 7300, default 180 when not sent. Used only when crediting (<code>point &gt; 0</code>); ignored when deducting (no error). Expiry calculation in step 4.</td></tr><tr><td><code>remark</code></td><td>string</td><td>Yes</td><td>Reason. Trimmed, 5–255 characters.</td></tr><tr><td><code>requestId</code></td><td>string</td><td>Yes</td><td>UUID generated once by FE when the modal opens, kept unchanged on resubmit. 1–64 characters (fits column <code>external_id</code>).</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds">
<li>Validate. Check the client belongs to the program.</li>
<li>Redis lock per client as in the old API (<code>point:manual:client:{clientId}</code>, no wait, 30-second lease). Not acquired → "Another adjustment is in progress".</li>
<li><b>Double-submit protection</b>: if a <code>point_ledger</code> row already exists with <code>external_system = 'smart_crm'</code>, <code>external_id = requestId</code> → return the previous result (<code>duplicated = true</code>), write nothing more. Uses existing index <code>idx_ledger_external</code>. The Redis lock only blocks 2 <i>concurrent</i> requests; requestId also blocks resubmits after the first request has finished.</li>
<li>Call the existing <code>ManualPointServiceImpl</code> logic as is, adding 3 values written to every <code>point_ledger</code> row it creates: <code>external_system = 'smart_crm'</code>, <code>external_id = requestId</code>, <code>remark</code>. <code>create_user</code> = logged-in user. <ul class="rules">
  <li><b>Credit</b>: create 1 new lot <code>task_log_table = 'manual_adjust'</code>, <code>source_type = 2</code>, 1 ledger row <code>type = 5</code>. <b>Lot expiry = 23:59:59 GMT+7 of (credit date in GMT+7 + <code>expireDays</code>)</b>, stored in UTC (i.e. 16:59:59 UTC). Same as the trading engine (expiry fixed at 23:59:59 in the task time zone, <code>PointTaskTradingLogServiceImpl</code>); a manually credited lot belongs to no task, so it uses GMT+7, the default time zone the app's coin APIs use for display (<code>PROGRAM_TZ_MINUTES = 420</code>). Example: credited at <code>2026-10-21 03:00:00</code> UTC (10:00 GMT+7), <code>expireDays = 180</code> → date 2027-04-19 → <code>point_expiration_time = 2027-04-19 16:59:59</code> UTC. Current code computes <code>now + 180 days</code> (not fixed to end of day, number of days taken from config <code>point.manual-adjust.expire-days</code>): must be fixed per DEV-08. Update the snapshot (<code>coin_balance</code> increases, <code>coin_lifetime</code> does <b>not</b> increase).</li>
  <li><b>Deduct</b>: deduct across non-expired lots, earliest expiry first (lock <code>FOR UPDATE</code> rows), 1 ledger row <code>type = 6</code> per lot. Deducting more than the non-expired balance → error, nothing deducted (no negative balance). Update the snapshot.</li>
  </ul></li>
<li>Return the balance after adjustment.</li></ol><pre>-- 1) client belongs to program
SELECT 1 FROM crm_customer_base c
WHERE c.client_id = #{clientId} AND c.deleted = 0
  AND c.group_code IN (SELECT client_group FROM promo_client_group
                       WHERE promo_table = 'point_program' AND promo_config_id = #{programId})
LIMIT 1;

-- 2) idempotency
SELECT id, point_amount, point_balance_after FROM point_ledger
WHERE external_system = 'smart_crm' AND external_id = #{requestId};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "",
  "result": { "clientId": 72000101, "point": -150, "balanceBefore": 3860, "balance": 3710,
              "expirationTime": null, "duplicated": false } }

// add (point &gt; 0): expirationTime = expiry of the new lot, UTC
{ "success": true, "code": 200, "message": "",
  "result": { "clientId": 72000101, "point": 100, "balanceBefore": 3760, "balance": 3860,
              "expirationTime": "2027-04-19 16:59:59", "duplicated": false } }</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Client does not exist.</code></td><td></td></tr><tr><td><code>Client does not belong to this program.</code></td><td></td></tr><tr><td><code>Points must not be 0.</code></td><td></td></tr><tr><td><code>Points must be between -100,000 and 100,000.</code></td><td></td></tr><tr><td><code>Expire days must be between 1 and 7300.</code></td><td>checked only when crediting</td></tr><tr><td><code>Remark is required (5-255 characters).</code></td><td></td></tr><tr><td><code>Request ID is required.</code></td><td></td></tr><tr><td><code>Another adjustment for this client is in progress. Please retry.</code></td><td>Redis lock</td></tr><tr><td><code>Insufficient coins: balance {balance}, requested {point}.</code></td><td>deduction exceeds balance</td></tr></table></div><div class="specsec"><h4>5. Notes</h4><p><b>Developer work needed</b> DEV-07 add column <code>point_ledger.remark</code>; DEV-08 make <code>ManualPointService</code> accept <code>remark</code>, <code>externalSystem</code>, <code>externalId</code>. No "program is open" check needed: manual adjustment must still work after the program is disabled (to compensate former clients); the client only needs to belong to the program.</p>
<p>Expiry of manually credited coins is chosen by the operator (<code>expireDays</code>, default 180), independent of the coin expiry of tasks in the program.</p></div></div><div class="specsrc" id="spec-k4" data-title="K4 · /point/admin/coin/balance"><p class="specmeta"><code>GET</code> · <code>/point/admin/coin/balance</code></p><p>Current balance of 1 client (shown in the Adjust Balance modal before saving).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>Yes</td><td>Program must exist.</td></tr><tr><td><code>clientId</code></td><td>long</td><td>Yes</td><td>Same as K3.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>Check the client belongs to the program.</li>
<li><code>balance</code>: computed directly from <code>point_lot</code> (source of truth, same conditions coin deduction uses). <code>snapshotBalance</code>: read from <code>point_client_coin_snapshot.coin_balance</code> (source used by the redeem API). If the two differ → return <code>snapshotMismatch = true</code> for FE to warn; the daily reconcile job will report to Telegram.</li>
<li>With <code>expiringIn10Days</code> (as in the app) and <code>lifetime</code> (<code>coin_lifetime</code>).</li></ol><pre>SELECT COALESCE(SUM(point_balance), 0) AS balance,
       COALESCE(SUM(CASE WHEN point_expiration_time &lt;= UTC_TIMESTAMP() + INTERVAL 10 DAY THEN point_balance END), 0) AS expiring_in_10_days
FROM point_lot
WHERE client_id = #{clientId} AND point_balance &gt; 0
  AND (point_expiration_time IS NULL OR point_expiration_time &gt; UTC_TIMESTAMP());

SELECT coin_balance, coin_lifetime FROM point_client_coin_snapshot WHERE client_id = #{clientId};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "",
  "result": { "clientId": 72000101, "balance": 3860, "expiringIn10Days": 200, "snapshotBalance": 3860,
              "snapshotMismatch": false, "lifetime": 4180 } }</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Client does not exist.</code></td><td></td></tr><tr><td><code>Client does not belong to this program.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Notes</h4><p>No snapshot row yet (client never had coins) → <code>snapshotBalance = 0</code>, <code>lifetime = 0</code>.</p></div></div><div class="specsrc" id="spec-g1" data-title="G1 · /point/admin/gift/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/gift/list</code></p><p>Gift list of 1 program (Gift List tab (S2)), sorted by sort_order.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>Yes</td><td>Program must exist. Exact filter on <code>point_featured_gift.program_id</code>.</td></tr><tr><td><code>giftName</code></td><td>string</td><td>No</td><td>Filter <code>LIKE %x%</code> on <code>gift_name</code>, trimmed.</td></tr><tr><td><code>category</code></td><td>string</td><td>No</td><td>Exact match on <code>gift_category</code>: <code>e_wallet</code> / <code>voucher</code> / <code>physical</code>. Any other value → error.</td></tr><tr><td><code>enabled</code></td><td>int</td><td>No</td><td><code>1</code> active / <code>0</code> disabled.</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>No</td><td>Default 1.</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>No</td><td>Default 10, max 100.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>Validate parameters; check the program exists.</li>
<li>Run the query below (count <code>total</code> with the same conditions). Sort by <code>sort_order ASC, point_price ASC, id ASC</code> (ties on <code>sort_order</code> by price then id — RI matches index <code>idx_program_dashboard</code>).</li>
<li>Datetimes returned in UTC, exactly as stored in DB (Q3).</li></ol><pre>SELECT g.id, g.gift_name, g.gift_short_name, g.gift_description, g.gift_category,
       g.point_price, g.cash_value, g.gift_image_url, g.external_item_id, g.badge,
       g.sort_order, g.show_on_dashboard, g.use_in_notification,
       g.display_from, g.display_to, g.enabled, g.remark,
       g.create_user, g.create_date, g.update_user, g.update_date
FROM point_featured_gift g
WHERE g.program_id = #{programId}
  AND (#{giftName} IS NULL OR g.gift_name LIKE CONCAT('%', #{giftName}, '%'))
  AND (#{category} IS NULL OR g.gift_category = #{category})
  AND (#{enabled}  IS NULL OR g.enabled = #{enabled})
ORDER BY g.sort_order ASC, g.point_price ASC, g.id ASC
LIMIT #{offset}, #{pageSize};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": {
    "total": 1,
    "records": [{
      "id": 1, "giftName": "Saldo GoPay Rp50.000", "giftShortName": "GoPay 50k",
      "giftDescription": "Saldo GoPay langsung masuk", "giftCategory": "e_wallet",
      "pointPrice": 500, "cashValue": 50000.00, "giftImageUrl": "https://cdn.hsb.co.id/loyalty/gift/gopay-50k.png",
      "externalItemId": "TADA-GOPAY-50", "badge": "hot", "sortOrder": 1,
      "showOnDashboard": 1, "useInNotification": 1,
      "displayFrom": null, "displayTo": null, "enabled": 1, "remark": "Reconciled with TADA 2026-10-20",
      "createUser": "admin01", "createDate": "2026-10-20 08:15:00", "updateUser": null, "updateDate": null
    }]
  }
}</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Invalid gift category.</code></td><td>category filter with invalid value</td></tr></table></div><div class="specsec"><h4>5. Notes</h4><p><code>cash_value</code> is an internal value (IDR), shown only in Smart CRM (admin), never pushed to the client app. See masking rules in the <a href="#rules" class="ref">Rules tab</a>.</p></div></div><div class="specsrc" id="spec-g2" data-title="G2 · /point/admin/gift/save"><p class="specmeta"><code>POST</code> · <code>/point/admin/gift/save</code></p><p>Create (no id) or edit (with id) 1 gift. The program does not change on edit.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>On edit</td><td>Gift must exist.</td></tr><tr><td><code>programId</code></td><td>long</td><td>On create</td><td>Program must exist. On edit: ignored; sending a different program from the current one → error.</td></tr><tr><td><code>giftName</code></td><td>string</td><td>Yes</td><td>Trimmed, 1–128 characters (<code>varchar(128) NOT NULL</code>).</td></tr><tr><td><code>giftShortName</code></td><td>string</td><td>Yes</td><td>Trimmed, 1–32 characters (<code>varchar(32) NOT NULL</code>). Recommended ≤ 25 so push notifications are not truncated.</td></tr><tr><td><code>giftDescription</code></td><td>string</td><td>No</td><td>≤ 255 characters (<code>varchar(255) NOT NULL DEFAULT ''</code>). Empty → <code>''</code>.</td></tr><tr><td><code>giftCategory</code></td><td>string</td><td>Yes</td><td>One of: <code>e_wallet</code> / <code>voucher</code> / <code>physical</code>. ≤ 32 characters.</td></tr><tr><td><code>pointPrice</code></td><td>long</td><td>Yes</td><td>Integer &gt; 0 (<code>bigint NOT NULL</code>). Must match the TADA price (RI1); not checked automatically (TADA has no server-side catalog API), only a warning on edit.</td></tr><tr><td><code>cashValue</code></td><td>decimal</td><td>No</td><td>≥ 0, at most 2 decimal places (<code>decimal(18,2)</code>). Internal value (IDR).</td></tr><tr><td><code>giftImageUrl</code></td><td>string</td><td>No</td><td>≤ 512 characters. If present: public <code>https</code> URL (no login required), hosted on the HSB image server so the link does not change. Empty → email without image.</td></tr><tr><td><code>externalItemId</code></td><td>string</td><td>Required when enabled=1</td><td>≤ 64 characters. Gift ID on TADA, used to reconcile prices. Proposed as mandatory when enabling (RI1).</td></tr><tr><td><code>badge</code></td><td>string</td><td>No</td><td>Empty, <code>hot</code> or <code>new</code> (≤ 16 characters). The app translates it to Indonesian itself.</td></tr><tr><td><code>sortOrder</code></td><td>int</td><td>No</td><td>Integer ≥ 0 (default 0). Ties → sorted by <code>point_price</code>; no error.</td></tr><tr><td><code>showOnDashboard</code></td><td>int</td><td>Yes</td><td>0 / 1.</td></tr><tr><td><code>useInNotification</code></td><td>int</td><td>Yes</td><td>0 / 1.</td></tr><tr><td><code>displayFrom</code></td><td>datetime UTC</td><td>No</td><td><code>yyyy-MM-dd HH:mm:ss</code> UTC. Empty = no limit.</td></tr><tr><td><code>displayTo</code></td><td>datetime UTC</td><td>No</td><td>&gt; <code>displayFrom</code> if both are set. Empty = no limit.</td></tr><tr><td><code>remark</code></td><td>string</td><td>No</td><td>≤ 255 characters.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>Validate per the <a href="#rules" class="ref">Rules tab</a> (GV01–GV09). Collect all field errors, return the first in <code>message</code> and all of them in <code>result.errors</code> so FE can highlight each field in red (Q7/1.5).</li>
<li>Ignore any field not in the list. <code>enabled</code> is not accepted from FE.</li>
<li><b>Create</b>: INSERT with <code>enabled = 0</code> (new gifts are always disabled; admin reviews, then enables via G3). <code>create_user</code> = logged-in user, <code>create_date = UTC_TIMESTAMP()</code>.</li>
<li><b>Edit</b>: UPDATE the fields above; do NOT change <code>program_id</code> and <code>enabled</code>. If the gift has already been redeemed and <code>point_price</code>/<code>external_item_id</code> changes → warning (<a href="#locks" class="ref">Locked-while-running tab</a>.</li></ol><pre>INSERT INTO point_featured_gift
  (program_id, gift_name, gift_short_name, gift_description, gift_category, point_price, cash_value,
   gift_image_url, external_item_id, badge, sort_order, show_on_dashboard, use_in_notification,
   display_from, display_to, enabled, remark, create_date, create_user)
VALUES (#{programId}, #{giftName}, #{giftShortName}, IFNULL(#{giftDescription}, ''), #{giftCategory},
        #{pointPrice}, #{cashValue}, IFNULL(#{giftImageUrl}, ''), IFNULL(#{externalItemId}, ''),
        IFNULL(#{badge}, ''), IFNULL(#{sortOrder}, 0), #{showOnDashboard}, #{useInNotification},
        #{displayFrom}, #{displayTo}, 0, IFNULL(#{remark}, ''), UTC_TIMESTAMP(), #{currentUser});

UPDATE point_featured_gift
SET gift_name = #{giftName}, gift_short_name = #{giftShortName}, gift_description = IFNULL(#{giftDescription}, ''),
    gift_category = #{giftCategory}, point_price = #{pointPrice}, cash_value = #{cashValue},
    gift_image_url = IFNULL(#{giftImageUrl}, ''), external_item_id = IFNULL(#{externalItemId}, ''),
    badge = IFNULL(#{badge}, ''), sort_order = IFNULL(#{sortOrder}, 0),
    show_on_dashboard = #{showOnDashboard}, use_in_notification = #{useInNotification},
    display_from = #{displayFrom}, display_to = #{displayTo}, remark = IFNULL(#{remark}, ''),
    update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE id = #{id};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": { "id": 2, "enabled": 0 } }

// validation failure
{ "success": false, "code": 500, "message": "Gift short name must be at most 32 characters.",
  "result": { "errors": [
    { "field": "giftShortName", "message": "Gift short name must be at most 32 characters." },
    { "field": "pointPrice", "message": "Point price must be greater than 0." } ] } }</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Gift does not exist.</code></td><td>on edit</td></tr><tr><td><code>Gift cannot be moved to another program.</code></td><td>different programId on edit</td></tr><tr><td><code>Gift name is required.</code></td><td></td></tr><tr><td><code>Gift name must be at most 128 characters.</code></td><td></td></tr><tr><td><code>Gift short name is required.</code></td><td></td></tr><tr><td><code>Gift short name must be at most 32 characters.</code></td><td></td></tr><tr><td><code>Gift description must be at most 255 characters.</code></td><td></td></tr><tr><td><code>Invalid gift category.</code></td><td></td></tr><tr><td><code>Point price must be greater than 0.</code></td><td></td></tr><tr><td><code>Cash value must be 0 or greater.</code></td><td></td></tr><tr><td><code>Image URL must be a public https link.</code></td><td></td></tr><tr><td><code>Image URL must be at most 512 characters.</code></td><td></td></tr><tr><td><code>External item id is required when the gift is enabled.</code></td><td></td></tr><tr><td><code>External item id must be at most 64 characters.</code></td><td></td></tr><tr><td><code>Invalid badge.</code></td><td>only '' / hot / new</td></tr><tr><td><code>Sort order must be 0 or greater.</code></td><td></td></tr><tr><td><code>display_from must be earlier than display_to.</code></td><td></td></tr><tr><td><code>Show on dashboard must be 0 or 1.</code></td><td></td></tr><tr><td><code>Use in notification must be 0 or 1.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Notes</h4><p>A newly created gift is disabled, so G3 is the only path that puts a gift on the dashboard. DB default is <code>enabled = 1</code> but the API overwrites it with 0 on create for safety.</p></div></div><div class="specsrc" id="spec-g3" data-title="G3 · /point/admin/gift/enable"><p class="specmeta"><code>POST</code> · <code>/point/admin/gift/enable</code></p><p>Enable/disable 1 gift (switch on the Gift List tab).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>Yes</td><td>Gift must exist.</td></tr><tr><td><code>enabled</code></td><td>int</td><td>Yes</td><td>0 / 1.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>Check the gift exists.</li>
<li>On enable (<code>enabled = 1</code>): <code>external_item_id</code> must be non-empty (RI1 — an ID is needed to reconcile TADA prices). Empty → error.</li>
<li>UPDATE <code>enabled</code>, <code>update_user</code>, <code>update_date = UTC_TIMESTAMP()</code>.</li></ol>
<p>No delete API: <code>enabled = 0</code> is how a gift is removed from the dashboard + messages. <code>enabled</code> takes precedence over all other display fields.</p><pre>UPDATE point_featured_gift
SET enabled = #{enabled}, update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE id = #{id};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": null }</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Gift does not exist.</code></td><td></td></tr><tr><td><code>Enabled must be 0 or 1.</code></td><td></td></tr><tr><td><code>External item id is required before enabling this gift.</code></td><td>RI1</td></tr></table></div></div><div class="specsrc" id="spec-r1" data-title="R1 · /point/admin/redemption/order/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/redemption/order/list</code></p><p>Redemption orders (point_redemption_order) of clients in 1 program. Read-only.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>Yes</td><td>Program must have a client group (RI2).</td></tr><tr><td><code>clientId</code></td><td>long</td><td>No</td><td>Exact match.</td></tr><tr><td><code>orderReference</code></td><td>string</td><td>No</td><td>Exact match on order number.</td></tr><tr><td><code>status</code></td><td>string</td><td>No</td><td><code>new</code> / <code>on process</code> / <code>completed</code> / <code>canceled</code> / <code>failed</code>.</td></tr><tr><td><code>createDate_begin</code></td><td>string</td><td>No</td><td><code>yyyy-MM-dd HH:mm:ss</code> UTC.</td></tr><tr><td><code>createDate_end</code></td><td>string</td><td>No</td><td>UTC, this bound excluded (<code>&lt;</code>).</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>No</td><td>Default 1.</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>No</td><td>Default 10, max 100.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>Get the program's client group: <code>SELECT client_group FROM promo_client_group WHERE promo_table = 'point_program' AND promo_config_id = ?</code>. None → return empty.</li>
<li>Query below; JOIN <code>crm_customer_base</code> to restrict to clients in the group (RI2). <code>o.client_id</code> is <code>varchar</code> → CAST on JOIN (RI6).</li>
  <li>Returns <code>orderDate</code> from column <code>order_date</code> (NEW COLUMN) = order placement time (trxDate from the TADA response), different from <code>create_date</code> (first HSB sync) and <code>last_status_at</code> (latest status change).</li>
<li><b>Mask sensitive data before returning</b> (4.3): do NOT return <code>raw_payload</code>. <code>order_items</code> reduced to an array <code>{itemName, itemType, quantity, status}</code> — <b>mask e-voucher codes/PINs and PLN tokens</b>. <code>recipient</code> returns only the name (partially masked) + city, no full address/phone in the list. <code>fees</code> (IDR amount) is <b>shown normally</b> to Smart CRM users (internal tool — confirmed); never sent to the client app.</li>
<li>Sort by <code>create_date DESC, id DESC</code>.</li></ol><pre>SELECT o.id, o.order_reference, o.order_number, o.client_id, o.status,
       o.order_items, o.recipient, o.fees, o.order_date, o.last_status_at, o.create_date, o.update_date
FROM point_redemption_order o
JOIN crm_customer_base c ON c.client_id = CAST(o.client_id AS UNSIGNED)
WHERE o.external_system = 'tada'
  AND c.deleted = 0
  AND c.group_code = (SELECT client_group FROM promo_client_group
                      WHERE promo_table = 'point_program' AND promo_config_id = #{programId} LIMIT 1)
  AND (#{clientId}       IS NULL OR o.client_id = #{clientId})
  AND (#{orderReference} IS NULL OR o.order_reference = #{orderReference})
  AND (#{status}         IS NULL OR o.status = #{status})
  AND (#{createDateBegin} IS NULL OR o.create_date &gt;= #{createDateBegin})
  AND (#{createDateEnd}   IS NULL OR o.create_date &lt;  #{createDateEnd})
ORDER BY o.create_date DESC, o.id DESC
LIMIT #{offset}, #{pageSize};
-- raw_payload is intentionally NOT selected (raw webhook payload, sensitive).</pre></div><div class="specsec"><h4>3. Response</h4><pre>{

      "clientId": "7209001", "status": "on process",
      "items": [ { "itemName": "Logam Mulia UBS 1 Gram", "itemType": "physical", "quantity": 1, "status": "on process" } ],

    }]
