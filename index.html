<h1>Smart CRM – Loyalty Config: API admin</h1>
<p class="sub">Admin API spec for the Loyalty configuration screens in Smart CRM. Updated: 2026-10-21.</p>
<nav class="tabs" role="tablist"><button type="button" role="tab" data-tab="overview" aria-selected="false">1. Overview</button><button type="button" role="tab" data-tab="dev" aria-selected="false">2. Developer</button><button type="button" role="tab" data-tab="api" aria-selected="false">3. API</button><button type="button" role="tab" data-tab="rules" aria-selected="false">4. Rules</button><button type="button" role="tab" data-tab="locks" aria-selected="false">5. Locks while running</button><button type="button" role="tab" data-tab="preflight" aria-selected="false">6. Data checks</button><button type="button" role="tab" data-tab="log" aria-selected="false">7. Changelog</button></nav>
<section class="panel" id="overview" role="tabpanel">
<h2>Overview</h2>
<p>Admin API spec for the Loyalty (point system) configuration screens in Smart CRM. Covers 33 APIs in 7 groups: permissions, check-in task, trading task, coin, gift, redemption, CleverTap. All validations have been checked against the engine in <code>point_service</code> (Q4 version) and the actual DDL on UAT.</p>
<p>Items the developer needs to implement or answer are in <a href="#dev" class="ref">tab Developer</a>. Before opening the screens, run the queries in the <a href="#preflight" class="ref">Data checks tab</a>.</p>

<h3>Data model</h3>
<p>The point system has 3 levels: <b>program</b> (<code>point_program</code>, attached to exactly 1 client group via <code>promo_client_group</code>) → <b>bundle</b> (<code>point_task_bundle</code>, a group of tasks) → <b>task</b> (<code>point_task_daily_checkin</code>, <code>point_task_trading</code>). A client only sees and earns coin from a task when all 4 levels are enabled: client group, program, bundle, task.</p>
<p>Client scope of a program (used by the Coin, Redemption and Omni Marketing tabs):</p>
<pre>-- Clients of program P (plan 0.1): every client group attached to P, enabled or not
SELECT c.client_id
FROM crm_customer_base c
WHERE c.deleted = 0
  AND c.group_code IN (SELECT g.client_group FROM promo_client_group g
                       WHERE g.promo_table = 'point_program' AND g.promo_config_id = #{programId})</pre>

<h3>Screens and APIs</h3>
<div class="scroll"><table>
<tr><th style="width:24%">Screen</th><th>Content</th><th style="width:22%">API</th></tr><tr><td>S1 – All Point Programs</td><td>One card per program (1 client group tag, switch to enable/disable the client group), filters, create-program button.</td><td><code>P1, P2, P5, P6</code></td></tr><tr><td>S2 – Section 1</td><td>Program info, Modify button (also edits the program enable/disable status).</td><td><code>P3, P4</code></td></tr><tr><td>S2 – tab Task Bundles</td><td>Bundle board in columns, task cards, enable/disable bundle and task, per-bundle blacklist.</td><td><code>B1, B2, B3, L1, L2</code></td></tr><tr><td>Modal task – Check-in</td><td>Tab Config + tab Check-in Log.</td><td><code>C1, C2, C3, C4</code></td></tr><tr><td>Modal task – Trading</td><td>Config tab (with rate rows) + Deal Log tab + Daily Log tab.</td><td><code>T1, T2, T3, T4, T5</code></td></tr><tr><td>S2 – tab Gift List</td><td>Gift list of the program, create/edit, enable/disable.</td><td><code>G1, G2, G3</code></td></tr><tr><td>S2 – tab Redemption</td><td>3 sub-tabs: Orders, Transactions (with manual reconcile marking), Redeem Blacklist.</td><td><code>R1, R2, R5, R3, R4</code></td></tr><tr><td>S2 – tab Coin</td><td>2 sub-tabs: Ledger, Lot; button for manual balance adjustment.</td><td><code>K1, K2, K3, K4</code></td></tr><tr><td>S2 – tab Omni Marketing</td><td>CleverTap notification log.</td><td><code>N1</code></td></tr>
</table></div>

<h3>General conventions</h3>
<div class="scroll"><table>
<tr><th style="width:22%">Content</th><th>Details</th></tr><tr><td>API location</td><td>Prefix <code>/point/admin/…</code> in point_service, next to the existing <code>/point/pointAdjust</code>. The Smart CRM frontend calls via axios (header <code>X-Access-Token</code>). <span class="pending">PENDING</span> DEV-01.</td></tr><tr><td>Call style</td><td>Read: <code>GET</code> + query params. Write: <code>POST</code> + JSON body. Field names in camelCase. Time-range filters use the suffixes <code>_begin</code> / <code>_end</code>.</td></tr><tr><td>Time</td><td>All datetimes in and out are <b>UTC</b>, format <code>yyyy-MM-dd HH:mm:ss</code>, exactly the value in the DB. Task-local date columns (<code>checkin_date</code>, <code>period_key</code>) are kept as raw strings. Do not return entities directly because the entity has <code>@JsonFormat(timezone = "GMT+7")</code>. <span class="pending">PENDING</span> DEV-03.</td></tr><tr><td>Operator</td><td><code>create_user</code> / <code>update_user</code> are taken from the logged-in Smart CRM user, never from the frontend. <span class="pending">PENDING</span> DEV-02.</td></tr><tr><td>Pagination</td><td>Accepts <code>pageNo</code>, <code>pageSize</code> (default 1 / 10, max 100); returns <code>result.records</code>, <code>result.total</code>.</td></tr><tr><td>Errors</td><td><code>success = false</code>, <code>code = 500</code>, <code>message</code> in English (frontend shows it verbatim). Form-save APIs also return <code>result.errors = [{field, message}]</code> so the frontend can highlight each field in red.</td></tr><tr><td>No deletion</td><td>There is no delete API. Only enable/disable, to keep history. Exception: rate rows of a trading task (soft delete via column <code>deleted</code>).</td></tr><tr><td>Created as disabled</td><td>New tasks (check-in, trading) and new gifts are always created with <code>enabled = 0</code>. They can only be enabled via the enable/disable API, so every enable goes through validation.</td></tr><tr><td>Transactions and locks</td><td>Each write API runs in 1 transaction. APIs that check cross-task rules lock the program row first (<code>SELECT … FROM point_program WHERE id = ? FOR UPDATE</code>).</td></tr><tr><td>Warnings requiring confirmation</td><td>Two trading tasks running at the same time in 1 program only trigger a <b>warning</b>: the API returns <code>success = false</code> with <code>result.duplicateTaskIds</code>; the frontend asks the user again and, if confirmed, resends with <code>confirmDuplicate = true</code>. Applies to T1, T2, B3.</td></tr><tr><td>Default time range</td><td>Log and coin lists always have a default time range because the tables are large: deal log 30 days; ledger, lot, notify log 7 days.</td></tr>
</table></div>

<h3>Agreed decisions</h3>
<ul class="rules"><li>Program and client group are 1-to-1. The client group cannot change after the program is created. The DB has no key enforcing this: all checks are in the API (P2, P5).</li><li>Each client_id has only 1 client group (<code>crm_customer_base.group_code</code>). The coin, redemption and notify log tables have no <code>program_id</code>: a program's data is the data of clients whose <code>group_code</code> = the program's client group. If a client changes group, their history follows the current group.</li><li>Program Active = <code>point_program.enabled = 1</code> and <code>promo_client_group.enabled = 1</code>. Program enable/disable status is edited in S2, with a confirmation dialog.</li><li>Each program has at most 1 visible check-in task (hard block, I2). Each program should have only 1 running trading task (warning only, J2).</li><li>Hard-locked on check-in task: <code>point_multiplier_enabled = 0</code>, <code>point_to_cash_convert_type = by_task_fixed_value</code>, <code>checkin_auto = 0</code>. Program: <code>kpi_name_point_multiplier = NULL</code>. No screens for <code>point_multiplier</code>, <code>point_program_point_definition</code>, <code>point_notify_event_config</code>.</li><li><code>display_hide_book_type</code> on program, bundle and task is a trading coin-calculation rule (not just a display filter). Editing is still allowed; the confirmation dialog must state this clearly.</li><li>Manual coin adjustment (K3): reason required, double-submit prevented via <code>requestId</code>, max 100,000 coin per adjustment, cannot deduct more than the balance; manually added coin has an expiry chosen by the user (1–7300 days, default 180), cut off at 23:59:59 GMT+7.</li><li>Bundle blacklist (L1, L2) and redeem blacklist (R3, R4) are 2 different row types in <code>client_promotion_blacklist</code>. The redeem blacklist is global; within a program's tab, only clients of that program are shown and can be added.</li><li>Smart CRM is an internal tool: IDR amounts (<code>idr_amount</code>, <code>fees</code>) are shown as is. Voucher codes / PINs / tokens and recipient info are still masked; columns <code>raw_*</code> are not returned.</li><li>Mark transaction as manually reconciled (R5): only allows <code>reconciled</code> 1 → 2, note required.</li></ul>
</section><section class="panel" id="dev" role="tabpanel">
<h2>Developer items</h2>
<p>List of questions and to-dos needed to implement the APIs in this document. DEV-xx codes are referenced in each API's spec.</p>
<div class="scroll"><table>
<tr><th style="width:8%">Code</th><th style="width:10%">Type</th><th>Content</th><th style="width:16%">Related APIs</th><th style="width:12%">Status</th></tr><tr id="dev-01"><td>DEV-01</td><td>Question</td><td>Host and route prefix for the admin APIs. The Smart CRM frontend calls via axios <code>baseURL = /crm</code>; proposed to place the APIs in point_service with prefix <code>/point/admin/…</code>. How does Smart CRM reach point_service?</td><td>All APIs</td><td><span class="pending">OPEN</span></td></tr><tr id="dev-02"><td>DEV-02</td><td>Question</td><td>How do we get the logged-in user from the Smart CRM token (point_service currently uses <code>request.getAttribute("currentUsername")</code>)?</td><td>All write APIs</td><td><span class="pending">OPEN</span></td></tr><tr id="dev-03"><td>DEV-03</td><td>Code change</td><td>The entity has <code>@JsonFormat(timezone = "GMT+7")</code> while the DB stores UTC, so JSON currently adds 7 hours. Admin APIs must take and return UTC exactly as in the DB: use dedicated DTOs, do not return entities directly.</td><td>All APIs</td><td><span class="pending">OPEN</span></td></tr><tr id="dev-04"><td>DEV-04</td><td>Engine bug</td><td><code>PointTaskTradeProcessServiceImpl</code>: <code>validDeal</code> initializes <code>false</code> and only counts when <code>specific_period</code>, so every deal of task <code>no_limit</code> is recorded as <code>TASK_NOT_ACTIVE</code>, 0 coin. Fix: initialize <code>validDeal = true</code>.</td><td>Engine trading</td><td><span class="pending">REPORTED SEPARATELY</span></td></tr><tr id="dev-05"><td>DEV-05</td><td>DDL</td><td><code>point_task_trading.display_event</code> currently allows NULL: with NULL the app hides the task but the engine still calculates coin. Proposed <code>NOT NULL DEFAULT 'signup'</code> (fix existing NULL rows first).</td><td>T1</td><td><span class="pending">OPEN</span></td></tr><tr id="dev-06"><td>DEV-06</td><td>DDL</td><td>Add indexes for the log-reading screens (see SQL below).</td><td>C1–C4, T2, T4, T5, K1, K2, N1</td><td><span class="pending">OPEN</span></td></tr><tr id="dev-07"><td>DEV-07</td><td>DDL</td><td>Add a reason column for manual coin adjustment: <code>point_ledger.remark</code>.</td><td>K3</td><td><span class="pending">OPEN</span></td></tr><tr id="dev-08"><td>DEV-08</td><td>Code change</td><td><code>ManualPointService.addPoints / deductPoints</code> additionally accepts <code>remark</code>, <code>externalSystem</code>, <code>externalId</code>, <code>expireDays</code>. Expiry of a manually added lot = 23:59:59 GMT+7 of (the add date in GMT+7 + <code>expireDays</code>), stored as UTC. The old API <code>/point/pointAdjust</code> that does not send <code>expireDays</code> keeps the current behavior.</td><td>K3</td><td><span class="pending">OPEN</span></td></tr><tr id="dev-09"><td>DEV-09</td><td>DDL</td><td>Add 3 columns to store who reconciled manually: <code>point_redemption_transaction.reconcile_user</code>, <code>reconcile_remark</code>, <code>reconcile_date</code>.</td><td>R2, R5</td><td><span class="pending">OPEN</span></td></tr><tr id="dev-10"><td>DEV-10</td><td>DDL</td><td>Fix the COMMENT of column <code>point_redemption_transaction.reconciled</code> to match the actual values <code>0/1/2</code> (currently says <code>0/1</code>).</td><td>R2</td><td><span class="pending">OPEN</span></td></tr><tr id="dev-11"><td>DEV-11</td><td>Question</td><td><code>crm_customer_base.fake_account</code> has <code>DEFAULT 1</code>: is this column really the test-account flag?</td><td>—</td><td><span class="pending">OPEN</span></td></tr><tr id="dev-12"><td>DEV-12</td><td>Optional</td><td>The trading rate table has no unique key. Not required (T1 already locks the task and checks duplicates itself).</td><td>T1</td><td>—</td></tr>
</table></div>
<h3>Proposed SQL</h3>
<pre>-- DEV-06: indexes for admin list screens
ALTER TABLE point_task_daily_checkin_log ADD INDEX idx_task_date (task_id, checkin_date);
ALTER TABLE point_task_trading_deal_log  ADD INDEX idx_task_period (task_id, period_key, deal_id);
ALTER TABLE point_task_trading_log       ADD INDEX idx_task_period (task_id, period_key);
ALTER TABLE point_ledger                 ADD INDEX idx_create_date (create_date);
ALTER TABLE point_lot                    ADD INDEX idx_create_date (create_date);
ALTER TABLE point_notify_log             ADD INDEX idx_event_date (event_date);

-- DEV-07: reason of manual coin adjustment
ALTER TABLE point_ledger ADD COLUMN remark varchar(255) DEFAULT NULL;

-- DEV-09: who reconciled a redemption transaction by hand
ALTER TABLE point_redemption_transaction
  ADD COLUMN reconcile_user   varchar(50)  DEFAULT NULL,
  ADD COLUMN reconcile_remark varchar(255) DEFAULT NULL,
  ADD COLUMN reconcile_date   datetime     DEFAULT NULL;</pre>
</section><section class="panel" id="api" role="tabpanel"><h2>API</h2><p>33 admin APIs, grouped. Click <b>Spec details</b> to see the request, processing (with SQL), sample response and error messages.</p><h3>Permissions</h3><p class="note">Used in: S1, S2 Section 1, Task Bundles tab.</p><div class="scroll"><table class="apiidx"><tr><th style="width:7%">Code</th><th style="width:36%">Endpoint</th><th>Purpose</th><th style="width:15%">Details</th></tr><tr id="p1"><td><code>P1</code></td><td><code>GET /point/admin/program/list</code></td><td>Program list for screen S1; each row includes the client group and Active status.</td><td><button type="button" class="specbtn" data-spec="p1">Spec details ▸</button></td></tr><tr id="p2"><td><code>P2</code></td><td><code>POST /point/admin/program/add</code></td><td>Create the program and its client group row in 1 transaction (M1).</td><td><button type="button" class="specbtn" data-spec="p2">Spec details ▸</button></td></tr><tr id="p3"><td><code>P3</code></td><td><code>GET /point/admin/program/get</code></td><td>Details of 1 program for Section 1 of S2.</td><td><button type="button" class="specbtn" data-spec="p3">Spec details ▸</button></td></tr><tr id="p4"><td><code>P4</code></td><td><code>POST /point/admin/program/edit</code></td><td>Edit a program (Modify in Section 1). The client group does not change.</td><td><button type="button" class="specbtn" data-spec="p4">Spec details ▸</button></td></tr><tr id="p5"><td><code>P5</code></td><td><code>POST /point/admin/program/clientGroup/enable</code></td><td>Enable/disable the client group row of 1 program (switch on the S1 card).</td><td><button type="button" class="specbtn" data-spec="p5">Spec details ▸</button></td></tr><tr id="p6"><td><code>P6</code></td><td><code>GET /point/admin/clientGroup/list</code></td><td>Client group dropdown when creating a program: all groups with the program they are attached to (if any).</td><td><button type="button" class="specbtn" data-spec="p6">Spec details ▸</button></td></tr><tr id="b1"><td><code>B1</code></td><td><code>GET /point/admin/bundle/list</code></td><td>Bundle board of 1 program; each bundle includes a task summary (check-in + trading) for rendering cards.</td><td><button type="button" class="specbtn" data-spec="b1">Spec details ▸</button></td></tr><tr id="b2"><td><code>B2</code></td><td><code>POST /point/admin/bundle/save</code></td><td>Create (no id) or edit (with id) a bundle (M2).</td><td><button type="button" class="specbtn" data-spec="b2">Spec details ▸</button></td></tr><tr id="b3"><td><code>B3</code></td><td><code>POST /point/admin/bundle/enable</code></td><td>Enable/disable a bundle.</td><td><button type="button" class="specbtn" data-spec="b3">Spec details ▸</button></td></tr><tr id="l1"><td><code>L1</code></td><td><code>GET /point/admin/blacklist/list</code></td><td>Blacklist of 1 bundle, including whitelisted rows (M3).</td><td><button type="button" class="specbtn" data-spec="l1">Spec details ▸</button></td></tr><tr id="l2"><td><code>L2</code></td><td><code>POST /point/admin/blacklist/save</code></td><td>Add a client to the bundle blacklist, or switch Blacklisted ↔ Whitelisted.</td><td><button type="button" class="specbtn" data-spec="l2">Spec details ▸</button></td></tr></table></div><h3>Check-in task</h3><p class="note">Used in: Task modal (Check-in).</p><div class="scroll"><table class="apiidx"><tr><th style="width:7%">Code</th><th style="width:36%">Endpoint</th><th>Purpose</th><th style="width:15%">Details</th></tr><tr id="c1"><td><code>C1</code></td><td><code>POST /point/admin/checkinTask/save</code></td><td>Create (no id) or edit (with id) a check-in task (Config tab of M4).</td><td><button type="button" class="specbtn" data-spec="c1">Spec details ▸</button></td></tr><tr id="c4"><td><code>C4</code></td><td><code>GET /point/admin/checkinTask/get</code></td><td>Details of 1 check-in task to open the View/Edit modal. <b>Additional</b> to the list: B1 only returns a summary.</td><td><button type="button" class="specbtn" data-spec="c4">Spec details ▸</button></td></tr><tr id="c2"><td><code>C2</code></td><td><code>POST /point/admin/checkinTask/enable</code></td><td>Enable/disable a check-in task.</td><td><button type="button" class="specbtn" data-spec="c2">Spec details ▸</button></td></tr><tr id="c3"><td><code>C3</code></td><td><code>GET /point/admin/checkinTask/log/list</code></td><td>Check-in log of 1 task (Check-in Log tab of M4).</td><td><button type="button" class="specbtn" data-spec="c3">Spec details ▸</button></td></tr></table></div><h3>Trading task</h3><p class="note">Used in: Task modal (Trading).</p><div class="scroll"><table class="apiidx"><tr><th style="width:7%">Code</th><th style="width:36%">Endpoint</th><th>Purpose</th><th style="width:15%">Details</th></tr><tr id="t1"><td><code>T1</code></td><td><code>POST /point/admin/trading/save</code></td><td>Create or edit 1 trading task with all its rate rows in a single save (Config tab of M4).</td><td><button type="button" class="specbtn" data-spec="t1">Spec details ▸</button></td></tr><tr id="t2"><td><code>T2</code></td><td><code>POST /point/admin/trading/enable</code></td><td>Enable / disable 1 trading task (switch on the task card, via EnableConfirmModal).</td><td><button type="button" class="specbtn" data-spec="t2">Spec details ▸</button></td></tr><tr id="t3"><td><code>T3</code></td><td><code>GET /point/admin/trading/get</code></td><td>Details of 1 trading task with non-deleted rate rows and <code>lockedFields</code> (opens M4 in View/Edit mode).</td><td><button type="button" class="specbtn" data-spec="t3">Spec details ▸</button></td></tr><tr id="t4"><td><code>T4</code></td><td><code>GET /point/admin/trading/dealLog/list</code></td><td>Per-deal details of 1 task (Deal Log tab of M4). Read-only.</td><td><button type="button" class="specbtn" data-spec="t4">Spec details ▸</button></td></tr><tr id="t5"><td><code>T5</code></td><td><code>GET /point/admin/trading/dailyLog/list</code></td><td>Per-client / per-day summary of 1 task (Daily Log tab of M4). Read-only.</td><td><button type="button" class="specbtn" data-spec="t5">Spec details ▸</button></td></tr></table></div><h3>Coin</h3><p class="note">Used in: Coin tab.</p><div class="scroll"><table class="apiidx"><tr><th style="width:7%">Code</th><th style="width:36%">Endpoint</th><th>Purpose</th><th style="width:15%">Details</th></tr><tr id="k1"><td><code>K1</code></td><td><code>GET /point/admin/coin/ledger/list</code></td><td>Coin ledger (<code>point_ledger</code>) of clients in the program (Coin tab (S2), Ledger tab). Read-only.</td><td><button type="button" class="specbtn" data-spec="k1">Spec details ▸</button></td></tr><tr id="k2"><td><code>K2</code></td><td><code>GET /point/admin/coin/lot/list</code></td><td>Coin lots (<code>point_lot</code>) of clients in the program (Coin tab (S2), Lot tab). Read-only.</td><td><button type="button" class="specbtn" data-spec="k2">Spec details ▸</button></td></tr><tr id="k3"><td><code>K3</code></td><td><code>POST /point/admin/coin/adjust</code></td><td>Manually add / deduct coin for 1 client in the program (Adjust Balance modal). Smart CRM version of <code>POST /point/pointAdjust</code>.</td><td><button type="button" class="specbtn" data-spec="k3">Spec details ▸</button></td></tr><tr id="k4"><td><code>K4</code></td><td><code>GET /point/admin/coin/balance</code></td><td>Current balance of 1 client (shown in the Adjust Balance modal before saving).</td><td><button type="button" class="specbtn" data-spec="k4">Spec details ▸</button></td></tr></table></div><h3>Gift</h3><p class="note">Used in: Gift List tab.</p><div class="scroll"><table class="apiidx"><tr><th style="width:7%">Code</th><th style="width:36%">Endpoint</th><th>Purpose</th><th style="width:15%">Details</th></tr><tr id="g1"><td><code>G1</code></td><td><code>GET /point/admin/gift/list</code></td><td>Gift list of 1 program (Gift List tab (S2)), sorted by sort_order.</td><td><button type="button" class="specbtn" data-spec="g1">Spec details ▸</button></td></tr><tr id="g2"><td><code>G2</code></td><td><code>POST /point/admin/gift/save</code></td><td>Create (no id) or edit (with id) 1 gift. The program does not change on edit.</td><td><button type="button" class="specbtn" data-spec="g2">Spec details ▸</button></td></tr><tr id="g3"><td><code>G3</code></td><td><code>POST /point/admin/gift/enable</code></td><td>Enable/disable 1 gift (switch on the Gift List tab).</td><td><button type="button" class="specbtn" data-spec="g3">Spec details ▸</button></td></tr></table></div><h3>Redemption</h3><p class="note">Used in: Redemption tab.</p><div class="scroll"><table class="apiidx"><tr><th style="width:7%">Code</th><th style="width:36%">Endpoint</th><th>Purpose</th><th style="width:15%">Details</th></tr><tr id="r1"><td><code>R1</code></td><td><code>GET /point/admin/redemption/order/list</code></td><td>Redemption orders (point_redemption_order) of clients in 1 program. Read-only.</td><td><button type="button" class="specbtn" data-spec="r1">Spec details ▸</button></td></tr><tr id="r2"><td><code>R2</code></td><td><code>GET /point/admin/redemption/transaction/list</code></td><td>Coin deduct/refund transactions (point_redemption_transaction) of clients in 1 program. Read-only.</td><td><button type="button" class="specbtn" data-spec="r2">Spec details ▸</button></td></tr><tr id="r3"><td><code>R3</code></td><td><code>GET /point/admin/redemption/blacklist/list</code></td><td>Redeem blacklist of clients in 1 program (both enabled 0 and 1).</td><td><button type="button" class="specbtn" data-spec="r3">Spec details ▸</button></td></tr><tr id="r4"><td><code>R4</code></td><td><code>POST /point/admin/redemption/blacklist/save</code></td><td>Add a client to the redeem blacklist, or switch Blacklisted ↔ Whitelisted (global block).</td><td><button type="button" class="specbtn" data-spec="r4">Spec details ▸</button></td></tr><tr id="r5"><td><code>R5</code></td><td><code>POST /point/admin/redemption/transaction/reconcile</code></td><td>Mark 1 transaction as 'manually checked' (reconciled 1 → 2). Answer 4.1.</td><td><button type="button" class="specbtn" data-spec="r5">Spec details ▸</button></td></tr></table></div><h3>CleverTap</h3><p class="note">Used in: Omni Marketing tab.</p><div class="scroll"><table class="apiidx"><tr><th style="width:7%">Code</th><th style="width:36%">Endpoint</th><th>Purpose</th><th style="width:15%">Details</th></tr><tr id="n1"><td><code>N1</code></td><td><code>GET /point/admin/notifyLog/list</code></td><td>CleverTap notification log of clients in 1 program, newest first.</td><td><button type="button" class="specbtn" data-spec="n1">Spec details ▸</button></td></tr></table></div><div hidden><div class="specsrc" id="spec-p1" data-title="P1 · /point/admin/program/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/program/list</code></p><p>Program list for screen S1; each row includes the client group and Active status.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>pageNo</code></td><td>int</td><td>No</td><td>Default 1.</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>No</td><td>Default 10, max 100.</td></tr><tr><td><code>programName</code></td><td>string</td><td>No</td><td>Filter <code>LIKE %x%</code>, trimmed.</td></tr><tr><td><code>clientGroup</code></td><td>string</td><td>No</td><td>Exact-match filter.</td></tr><tr><td><code>status</code></td><td>string</td><td>No</td><td><code>active</code> or <code>inactive</code>. Any other value → error.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>Validate parameters.</li>
<li>Run the query below (count <code>total</code> with the same conditions).</li>
<li><code>active = program.enabled = 1 AND client_group_enabled = 1</code>. Program without a client group row (legacy data) → <code>clientGroup = null</code>, <code>active = false</code>.</li></ol><pre>SELECT p.id, p.program_name, p.program_description, p.enabled, p.cash_currency,
       p.display_hide_book_type, p.create_user, p.create_date, p.update_user, p.update_date,
       g.id AS client_group_row_id, g.client_group, g.enabled AS client_group_enabled,
       (p.enabled = 1 AND IFNULL(g.enabled, 0) = 1) AS active
FROM point_program p
LEFT JOIN promo_client_group g
       ON g.promo_table = 'point_program' AND g.promo_config_id = p.id
WHERE (#{programName} IS NULL OR p.program_name LIKE CONCAT('%', #{programName}, '%'))
  AND (#{clientGroup} IS NULL OR g.client_group = #{clientGroup})
  AND (#{status} IS NULL
       OR (#{status} = 'active'   AND p.enabled = 1 AND IFNULL(g.enabled, 0) = 1)
       OR (#{status} = 'inactive' AND NOT (p.enabled = 1 AND IFNULL(g.enabled, 0) = 1)))
ORDER BY active DESC, p.id DESC
LIMIT #{offset}, #{pageSize};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": {
    "total": 1,
    "records": [{
      "id": 1101, "programName": "mitrade_point_program", "programDescription": "MiTrade white-label point program",
      "enabled": 1, "cashCurrency": "USD", "displayHideBookType": 0,
      "clientGroupRowId": 10101, "clientGroup": "mitrade_client", "clientGroupEnabled": 1, "active": true,
      "createUser": "admin01", "createDate": "2026-10-20 08:15:00",
      "updateUser": null, "updateDate": null
    }]
  }
}</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Status must be active or inactive.</code></td><td>Invalid status value</td></tr></table></div><div class="specsec"><h4>5. Notes</h4><p>If legacy data has a program attached to 2 client group rows (violating I1), the query returns 2 rows for that program. Run the queries in the Data checks tab before opening the screens; Smart CRM does not fix legacy data automatically.</p></div></div><div class="specsrc" id="spec-p2" data-title="P2 · /point/admin/program/add"><p class="specmeta"><code>POST</code> · <code>/point/admin/program/add</code></p><p>Create the program and its client group row in 1 transaction (M1).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>programName</code></td><td>string</td><td>Yes</td><td>Trim, 1–64 characters (<code>varchar(64)</code>). Must not duplicate another program, case-insensitive (unique key <code>uk_program_name</code>, collation <code>utf8mb4_0900_ai_ci</code>).</td></tr><tr><td><code>programDescription</code></td><td>string</td><td>Yes</td><td>Trim, 1–255 characters (<code>varchar(255)</code>; DB allows NULL, making it required is a screen decision).</td></tr><tr><td><code>cashCurrency</code></td><td>string</td><td>Yes</td><td>3-letter uppercase code, regex <code>^[A-Z]{3}$</code> (column varchar(16)). The engine uses it for display only.</td></tr><tr><td><code>displayHideBookType</code></td><td>int</td><td>Yes</td><td><code>0</code> shows to all, <code>1</code> hides from A-book, <code>2</code> hides from B-book.</td></tr><tr><td><code>clientGroup</code></td><td>string</td><td>Yes</td><td>Must exist in <code>client_group_configuration</code> (<code>group_code</code>, <code>varchar(50)</code>, unique) with <code>enabled = 1</code>, and not yet attached to any program (I1).</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>Validate field.</li>
<li>Open a transaction. Lock by group so 2 admins cannot create at the same time: <code>SELECT id FROM promo_client_group WHERE promo_table = 'point_program' AND client_group = ? FOR UPDATE</code>. Row exists (including <code>enabled = 0</code>) → "already attached" error.</li>
<li>Check duplicate name: <code>SELECT id FROM point_program WHERE program_name = ?</code> (the collation compares case-insensitively). INSERT can still hit <code>uk_program_name</code> if 2 admins create at the same time → catch DuplicateKey, return the same message.</li>
<li>INSERT <code>point_program</code>: <code>enabled = 1</code>, <code>kpi_name_point_multiplier = NULL</code> (hard-locked), <code>create_user</code> = logged-in user.</li>
<li>INSERT <code>promo_client_group</code>: <code>client_group</code>, <code>promo_table = 'point_program'</code>, <code>promo_config_id</code> = newly created id, <code>enabled = 1</code>.</li>
<li>COMMIT, return both ids.</li></ol>
<p>Creating a program already enabled is safe: with no bundle/task the engine returns nothing to clients.</p><pre>SELECT enabled FROM client_group_configuration WHERE group_code = #{clientGroup};

INSERT INTO point_program
  (program_name, program_description, enabled, cash_currency, kpi_name_point_multiplier,
   display_hide_book_type, create_date, create_user)
VALUES (#{programName}, #{programDescription}, 1, #{cashCurrency}, NULL,
        #{displayHideBookType}, UTC_TIMESTAMP(), #{currentUser});

INSERT INTO promo_client_group
  (client_group, promo_table, promo_config_id, enabled, create_date, create_user)
VALUES (#{clientGroup}, 'point_program', #{newProgramId}, 1, UTC_TIMESTAMP(), #{currentUser});</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": { "id": 1102, "clientGroupRowId": 10102 } }</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Program name is required.</code></td><td></td></tr><tr><td><code>Program name must be at most 64 characters.</code></td><td></td></tr><tr><td><code>Program name already exists.</code></td><td></td></tr><tr><td><code>Program description is required.</code></td><td></td></tr><tr><td><code>Cash currency must be a 3-letter code, for example USD.</code></td><td></td></tr><tr><td><code>Display hide book type must be 0, 1 or 2.</code></td><td></td></tr><tr><td><code>Client group does not exist.</code></td><td></td></tr><tr><td><code>Client group {group} is disabled.</code></td><td>client_group_configuration.enabled = 0</td></tr><tr><td><code>Program description must be at most 255 characters.</code></td><td></td></tr><tr><td><code>Client group {group} is already attached to program {id} ({name}).</code></td><td>I1</td></tr></table></div></div><div class="specsrc" id="spec-p3" data-title="P3 · /point/admin/program/get"><p class="specmeta"><code>GET</code> · <code>/point/admin/program/get</code></p><p>Details of 1 program for Section 1 of S2.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>Yes</td><td>Program must exist.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>Read program + client group row as in P1 (filter <code>p.id = ?</code>).</li>
<li>Also compute <code>bundleCount</code>, <code>checkinTaskCount</code> and <code>hasActivity</code> (program already has check-in or trading logs). FE uses <code>hasActivity</code> to lock field <code>cashCurrency</code> (Locks while running tab).</li></ol><pre>-- check-in side: go through the task ids (needs index idx_task_date, see DEV-06)
SELECT EXISTS (SELECT 1 FROM point_task_daily_checkin_log l
               JOIN point_task_daily_checkin d ON d.id = l.task_id
               WHERE d.program_id = #{id})
    OR EXISTS (SELECT 1 FROM point_task_trading_log WHERE program_id = #{id}) AS has_activity;</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": {
    "id": 1101, "programName": "mitrade_point_program", "programDescription": "MiTrade white-label point program",
    "enabled": 1, "cashCurrency": "USD", "displayHideBookType": 0,
    "clientGroupRowId": 10101, "clientGroup": "mitrade_client", "clientGroupEnabled": 1, "active": true,
    "bundleCount": 1, "checkinTaskCount": 1, "hasActivity": true,
    "createUser": "admin01", "createDate": "2026-10-20 08:15:00", "updateUser": null, "updateDate": null
  }
}</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr></table></div></div><div class="specsrc" id="spec-p4" data-title="P4 · /point/admin/program/edit"><p class="specmeta"><code>POST</code> · <code>/point/admin/program/edit</code></p><p>Edit a program (Modify in Section 1). The client group does not change.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>Yes</td><td>Program must exist.</td></tr><tr><td><code>programName</code></td><td>string</td><td>Yes</td><td>Same as P2; must not duplicate another program (excluding itself).</td></tr><tr><td><code>programDescription</code></td><td>string</td><td>Yes</td><td>Same as P2.</td></tr><tr><td><code>cashCurrency</code></td><td>string</td><td>Yes</td><td>Same as P2. When <code>hasActivity</code> = true, the old value must be kept.</td></tr><tr><td><code>displayHideBookType</code></td><td>int</td><td>Yes</td><td>0 / 1 / 2. Freely editable.</td></tr><tr><td><code>enabled</code></td><td>int</td><td>Yes</td><td>0 / 1.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>Validate. Ignore any other fields the FE sends (<code>kpiNamePointMultiplier</code>, <code>clientGroup</code>…).</li>
<li>If <code>cashCurrency</code> differs from the stored value and the program already has activity (query in P3) → error.</li>
<li>UPDATE <code>point_program</code> with the fields above + <code>update_user</code>, <code>update_date = UTC_TIMESTAMP()</code>.</li></ol>
<p>Disabling a program: all its tasks disappear from the app immediately; coin already credited is unchanged. Re-enabling does not need the I2 check (I2 is evaluated within 1 program, regardless of whether the program is enabled or disabled).</p><pre>UPDATE point_program
SET program_name = #{programName}, program_description = #{programDescription},
    cash_currency = #{cashCurrency}, display_hide_book_type = #{displayHideBookType},
    enabled = #{enabled}, update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE id = #{id};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": null }</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Program name already exists.</code></td><td></td></tr><tr><td><code>Cash currency cannot be changed after clients have earned coins in this program.</code></td><td>Locks while running tab</td></tr><tr><td><code>Enabled must be 0 or 1.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Notes</h4><p><code>displayHideBookType</code>: for check-in it is only a display filter; for trading it is a <b>coin-calculation rule</b> (confirmed by the Trading team): switching to <code>1</code> stops A-book clients from earning coin, switching to <code>2</code> stops B-book clients from earning coin, in every trading task of the program. The API does not change; the FE should state this clearly in the confirmation dialog when the value changes.</p></div></div><div class="specsrc" id="spec-p5" data-title="P5 · /point/admin/program/clientGroup/enable"><p class="specmeta"><code>POST</code> · <code>/point/admin/program/clientGroup/enable</code></p><p>Enable/disable the client group row of 1 program (switch on the S1 card).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>Yes</td><td>Program must have a client group row.</td></tr><tr><td><code>enabled</code></td><td>int</td><td>Yes</td><td>0 / 1.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>Get the program's <code>promo_client_group</code> row.</li>
<li>On enable: check that this group has no other <code>point_program</code> row that is <code>enabled = 1</code> (I1, guards against legacy data).</li>
<li>UPDATE <code>enabled</code>, <code>update_user</code>, <code>update_date</code>.</li></ol><pre>UPDATE promo_client_group
SET enabled = #{enabled}, update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE promo_table = 'point_program' AND promo_config_id = #{programId};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": null }</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Program has no client group.</code></td><td></td></tr><tr><td><code>Client group {group} is already enabled for program {id}.</code></td><td>I1</td></tr></table></div></div><div class="specsrc" id="spec-p6" data-title="P6 · /point/admin/clientGroup/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/clientGroup/list</code></p><p>Client group dropdown when creating a program: all groups with the program they are attached to (if any).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>keyword</code></td><td>string</td><td>No</td><td>Filter <code>group_code LIKE %x%</code>.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>Read <code>client_group_configuration</code>, LEFT JOIN the <code>point_program</code> row of <code>promo_client_group</code>.</li>
<li><code>available = groupEnabled = 1 AND programId IS NULL</code>. FE only allows selecting <code>available = true</code> rows; shows <code>groupDescription</code> next to the group code if present.</li></ol>
<p>No pagination (few groups). Smart CRM already has <code>/partner/clientgroupcode/list</code> reading the same table; this API only adds the program column.</p><pre>SELECT cg.group_code AS client_group, cg.group_description, cg.enabled AS group_enabled,
       g.promo_config_id AS program_id, p.program_name, g.enabled AS client_group_enabled
FROM client_group_configuration cg
LEFT JOIN promo_client_group g
       ON g.client_group = cg.group_code AND g.promo_table = 'point_program'
LEFT JOIN point_program p ON p.id = g.promo_config_id
WHERE (#{keyword} IS NULL OR cg.group_code LIKE CONCAT('%', #{keyword}, '%'))
ORDER BY (g.id IS NULL) DESC, cg.group_code;</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": [
    { "clientGroup": "partner_x_client", "groupDescription": "Partner X clients", "groupEnabled": 1,
      "programId": null, "programName": null, "clientGroupEnabled": null, "available": true },
    { "clientGroup": "mitrade_client", "groupDescription": null, "groupEnabled": 1,
      "programId": 1101, "programName": "mitrade_point_program", "clientGroupEnabled": 1, "available": false }
  ]
}</pre></div><div class="specsec"><h4>4. Error messages</h4><p>Generic errors only (missing parameter, no permission).</p></div><div class="specsec"><h4>5. Notes</h4><p>Per DDL: display name = <code>group_description</code> (<code>varchar(255)</code>, may be NULL → FE shows the group code), status = <code>enabled</code> (1 enabled, 0 disabled). Other columns of the table (exchange rate, default MT5 group…) are not loyalty-related so they are not returned. <code>group_code</code> and <code>promo_client_group.client_group</code> share collation <code>utf8mb4_0900_ai_ci</code> so the JOIN does not need <code>COLLATE</code>.</p></div></div><div class="specsrc" id="spec-b1" data-title="B1 · /point/admin/bundle/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/bundle/list</code></p><p>Bundle board of 1 program; each bundle includes a task summary (check-in + trading) for rendering cards.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>Yes</td><td>Program must exist.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>Get all bundles of the program.</li>
<li>Get all check-in tasks and trading tasks in those bundles (2 queries, grouped by <code>task_bundle_id</code>).</li>
<li>Sorting: <code>enabled</code> bundles first, then by id; within a bundle, <code>enabled</code> tasks first, then by id.</li>
<li>Check-in tasks also include <code>live</code> (currently counted in I2) so the FE can mark them.</li></ol>
<p>No pagination. <code>blacklistCount</code> = number of blacklist rows of the bundle that are <code>enabled = 1</code>.</p><pre>SELECT b.id, b.task_bundle_name, b.task_bundle_description, b.display_hide_book_type, b.enabled,
       (SELECT COUNT(*) FROM client_promotion_blacklist bl
         WHERE bl.enabled = 1 AND bl.promo_table = 'point_program'
           AND bl.promo_config_id = b.program_id AND bl.point_task_bundle_id = b.id) AS blacklist_count
FROM point_task_bundle b WHERE b.program_id = #{programId}
ORDER BY b.enabled DESC, b.id;

SELECT d.id, d.task_bundle_id, d.task_name, d.enabled, d.participate_period_limit_type,
       d.participate_period_from, d.participate_period_to, d.routine_cycle_limit_days, d.claim_type,
       (d.enabled = 1 AND d.display_hide_to_all = 0
        AND (d.display_period_limit_apply = 0 OR UTC_TIMESTAMP() &lt; d.display_period_to)) AS live
FROM point_task_daily_checkin d WHERE d.program_id = #{programId}
ORDER BY d.enabled DESC, d.id;

SELECT t.id, t.task_bundle_id, t.task_name, t.enabled, t.participate_period_limit_type,
       t.participate_period_from, t.participate_period_to, t.min_position_hold_second,
       t.point_max_cap_enabled, t.point_max_cap_value, t.release_auto_delay_day,
       r.rate_min, r.rate_max, IFNULL(r.rate_row_count, 0) AS rate_row_count
FROM point_task_trading t
LEFT JOIN (SELECT task_id, MIN(point_per_lot) AS rate_min, MAX(point_per_lot) AS rate_max,
                  COUNT(*) AS rate_row_count
           FROM point_task_trading_point_conversion
           WHERE deleted = 0
           GROUP BY task_id) r ON r.task_id = t.id
WHERE t.program_id = #{programId}
ORDER BY t.enabled DESC, t.id;</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": [{
    "id": 2101, "taskBundleName": "mitrade_daily_checkin", "taskBundleDescription": "MiTrade daily check-in tasks",
    "displayHideBookType": 0, "enabled": 1, "blacklistCount": 0,
    "tasks": [
      { "taskId": 3101, "taskType": "checkin", "taskName": "mitrade_daily_checkin", "enabled": 1, "live": true,
        "participatePeriodLimitType": "specific_period",
        "participatePeriodFrom": "2026-09-30 17:00:00", "participatePeriodTo": "2027-12-31 17:00:00",
        "routineCycleLimitDays": 7, "claimType": "claim_each_day" },
      { "taskId": 3201, "taskType": "trading", "taskName": "HSB Coin Trading", "enabled": 0,
        "participatePeriodLimitType": "no_limit", "participatePeriodFrom": null, "participatePeriodTo": null,
        "minPositionHoldSecond": 120, "pointMaxCapEnabled": 1, "pointMaxCapValue": 500,
        "releaseAutoDelayDay": 1, "rateMin": 5, "rateMax": 20, "rateRowCount": 4 }
    ]
  }]
}</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Notes</h4><p>The meaning of trading fields belongs to the Trading team; here they are only read out to render cards. Trading card: <code>releaseAutoDelayDay</code> → FE shows T+0 / T+N; <code>rateMin</code> / <code>rateMax</code> / <code>rateRowCount</code> are computed over rate rows <code>deleted = 0</code>; <code>rateRowCount = 0</code> then <code>rateMin</code> / <code>rateMax</code> are <code>null</code> and the FE shows a red No rates badge; the Ended label is set by the FE when <code>specific_period</code> and <code>participatePeriodTo</code> have passed.</p><p><code>live</code> here is a simplified version (task enabled, not fully hidden, display window not yet ended); the exact I2 check is in C1/C2/B3.</p></div></div><div class="specsrc" id="spec-b2" data-title="B2 · /point/admin/bundle/save"><p class="specmeta"><code>POST</code> · <code>/point/admin/bundle/save</code></p><p>Create (no id) or edit (with id) a bundle (M2).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>On edit</td><td>Bundle must exist.</td></tr><tr><td><code>programId</code></td><td>long</td><td>On create</td><td>Program must exist. On edit: ignored; if it differs from the current program → error.</td></tr><tr><td><code>taskBundleName</code></td><td>string</td><td>Yes</td><td>Trim, 1–128 characters (<code>varchar(128)</code>). Must not duplicate another bundle in the same program, case-insensitive. The DB has no unique key on bundle name; the API checks it.</td></tr><tr><td><code>taskBundleDescription</code></td><td>string</td><td>Yes</td><td>Trim, 1–255 characters (<code>varchar(255)</code>).</td></tr><tr><td><code>displayHideBookType</code></td><td>int</td><td>Yes</td><td>0 / 1 / 2. Freely editable.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>Validate.</li>
<li>Create: INSERT with <code>enabled = 1</code>. An empty bundle does not affect the engine.</li>
<li>Edit: UPDATE name, description, book type, <code>update_user</code>, <code>update_date</code>. Never UPDATE <code>program_id</code> (I3).</li></ol><pre>INSERT INTO point_task_bundle
  (program_id, task_bundle_name, task_bundle_description, enabled, display_hide_book_type, create_date, create_user)
VALUES (#{programId}, #{taskBundleName}, #{taskBundleDescription}, 1, #{displayHideBookType}, UTC_TIMESTAMP(), #{currentUser});

UPDATE point_task_bundle
SET task_bundle_name = #{taskBundleName}, task_bundle_description = #{taskBundleDescription},
    display_hide_book_type = #{displayHideBookType}, update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE id = #{id};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": { "id": 2102 } }</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Bundle does not exist.</code></td><td></td></tr><tr><td><code>Bundle cannot be moved to another program.</code></td><td>I3</td></tr><tr><td><code>Bundle name is required.</code></td><td></td></tr><tr><td><code>Bundle name must be at most 128 characters.</code></td><td></td></tr><tr><td><code>Bundle name already exists in this program.</code></td><td></td></tr><tr><td><code>Bundle description is required.</code></td><td></td></tr><tr><td><code>Bundle description must be at most 255 characters.</code></td><td></td></tr><tr><td><code>Display hide book type must be 0, 1 or 2.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Notes</h4><p>Bundle <code>displayHideBookType</code>: same as P4 but scoped to the trading tasks in this bundle (switching to <code>1</code> / <code>2</code> stops A-book / B-book clients from earning coin in those tasks). For check-in it is only a display filter.</p></div></div><div class="specsrc" id="spec-b3" data-title="B3 · /point/admin/bundle/enable"><p class="specmeta"><code>POST</code> · <code>/point/admin/bundle/enable</code></p><p>Enable/disable a bundle.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>Yes</td><td>Bundle must exist.</td></tr><tr><td><code>enabled</code></td><td>int</td><td>Yes</td><td>0 / 1.</td></tr><tr><td><code>confirmDuplicate</code></td><td>bool</td><td>No</td><td>Only used on enable: <code>true</code> = the user has seen the J2 warning (trading) and still wants to enable. Cannot bypass I2 (check-in).</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>Open a transaction, lock the program: <code>SELECT id FROM point_program WHERE id = ? FOR UPDATE</code>.</li>
<li><b>On enable, step 1 – I2 check-in (hard block):</b> for each check-in task <code>enabled = 1</code> in the bundle, run query V15 (Rules tab) with <code>enablingBundleId</code> = this bundle. This catches 2 tasks that are both in the bundle being enabled, not only tasks in other bundles. Conflict → error, not enabled, even with <code>confirmDuplicate = true</code>.</li>
<li><b>On enable, step 2 – J2 trading (warning only, agreed):</b> take the trading tasks <code>enabled = 1</code> in the bundle whose participation window has not ended (<code>no_limit</code> or <code>participate_period_to &gt; now</code>). For each task, run the Trading team's J2 query (spec T2), treating the bundle being enabled as already enabled. Collect all conflicting ids into <code>duplicateTaskIds</code> (including other tasks in this same bundle if the bundle has 2 or more trading tasks). Conflict and <code>confirmDuplicate</code> is not <code>true</code> → return error with <code>duplicateTaskIds</code>, not enabled; the FE asks again and, if confirmed, resends B3 with <code>confirmDuplicate = true</code>.</li>
<li>On disable: no blocking (see answer 4.2).</li>
<li>UPDATE <code>enabled</code>, <code>update_user</code>, <code>update_date</code>.</li></ol><pre>-- step 2, J2 (trading spec T2) adapted for B3: run for each candidate trading task #{candId}
SELECT d.id, d.task_name
FROM point_task_trading d
JOIN point_task_bundle b ON b.id = d.task_bundle_id
WHERE d.program_id = #{programId}
  AND d.id &lt;&gt; #{candId}
  AND d.enabled = 1
  AND (b.enabled = 1 OR b.id = #{bundleId})          -- the bundle being enabled counts as on
  AND ( d.participate_period_limit_type = 'no_limit'
        OR d.participate_period_to &gt; UTC_TIMESTAMP() );

UPDATE point_task_bundle
SET enabled = #{enabled}, update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE id = #{id};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": null }

// I2 (check-in): hard block, confirmDuplicate does not help
{ "success": false, "code": 500,
  "message": "Cannot enable this bundle: check-in task 3102 would be live at the same time as check-in task 3101 (mitrade_daily_checkin). Clients can only see one check-in task at a time.",
  "result": null }

// J2 (trading): warning, resend with confirmDuplicate = true to continue
{ "success": false, "code": 500,
  "message": "Program already has a live trading task: 3188 (HSB Coin Trading old). Send confirmDuplicate to continue.",
  "result": { "duplicateTaskIds": [3188] } }</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Bundle does not exist.</code></td><td></td></tr><tr><td><code>Enabled must be 0 or 1.</code></td><td></td></tr><tr><td><code>Cannot enable this bundle: check-in task {id} would be live at the same time as check-in task {otherId} ({otherName}). Clients can only see one check-in task at a time.</code></td><td>I2, hard block</td></tr><tr><td><code>Program already has a live trading task: {ids}. Send confirmDuplicate to continue.</code></td><td>J2, warning (same message as T2)</td></tr></table></div><div class="specsec"><h4>5. Notes</h4><p>Fixed order: I2 first, then J2. If I2 has already failed, <code>duplicateTaskIds</code> is not returned, so the FE does not ask for confirmation of an enable that will certainly fail. Enabling a program (P4) or client group (P5) does not need I2 or J2 since both are evaluated within 1 program.</p></div></div><div class="specsrc" id="spec-l1" data-title="L1 · /point/admin/blacklist/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/blacklist/list</code></p><p>Blacklist of 1 bundle, including whitelisted rows (M3).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>bundleId</code></td><td>long</td><td>Yes</td><td>Bundle must exist.</td></tr><tr><td><code>clientId</code></td><td>long</td><td>No</td><td>Exact-match filter.</td></tr><tr><td><code>enabled</code></td><td>int</td><td>No</td><td><code>1</code> Blacklisted, <code>0</code> Whitelisted.</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>No</td><td>Default 1.</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>No</td><td>Default 10, max 100.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>Get the bundle's <code>program_id</code>.</li>
<li>Query below, sorted by <code>update_date</code> newest first (the column always has a value because L2 also writes it on INSERT).</li>
<li>Also returns <code>programWideCount</code>: number of rows blocking the <b>whole program</b> (<code>point_task_bundle_id</code> NULL, <code>enabled = 1</code>). Smart CRM does not create this type, but if one exists that client is blocked in every bundle; FE should show a read-only warning.</li></ol><pre>SELECT bl.id, bl.client_id, bl.enabled, bl.remark,
       bl.create_user, bl.create_date, bl.update_user, bl.update_date
FROM client_promotion_blacklist bl
WHERE bl.promo_table = 'point_program'
  AND bl.promo_config_id = #{programId}
  AND bl.point_task_bundle_id = #{bundleId}
  AND (#{clientId} IS NULL OR bl.client_id = #{clientId})
  AND (#{enabled} IS NULL OR bl.enabled = #{enabled})
ORDER BY bl.update_date DESC, bl.id DESC
LIMIT #{offset}, #{pageSize};

SELECT COUNT(*) FROM client_promotion_blacklist
WHERE enabled = 1 AND promo_table = 'point_program'
  AND promo_config_id = #{programId} AND point_task_bundle_id IS NULL;</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": {
    "total": 1, "programWideCount": 0,
    "records": [{ "id": 801, "clientId": 7200101, "enabled": 1, "remark": "Abuse, ticket 1234",
                  "createUser": "admin01", "createDate": "2026-10-21 03:00:00",
                  "updateUser": "admin01", "updateDate": "2026-10-21 03:00:00" }]
  }
}</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Bundle does not exist.</code></td><td></td></tr><tr><td><code>Enabled must be 0 or 1.</code></td><td></td></tr></table></div></div><div class="specsrc" id="spec-l2" data-title="L2 · /point/admin/blacklist/save"><p class="specmeta"><code>POST</code> · <code>/point/admin/blacklist/save</code></p><p>Add a client to the bundle blacklist, or switch Blacklisted ↔ Whitelisted.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>bundleId</code></td><td>long</td><td>Yes</td><td>Bundle must exist.</td></tr><tr><td><code>clientId</code></td><td>long</td><td>Yes</td><td>Positive number.</td></tr><tr><td><code>enabled</code></td><td>int</td><td>Yes</td><td><code>1</code> blacklist, <code>0</code> whitelist.</td></tr><tr><td><code>remark</code></td><td>string</td><td>No</td><td>Trimmed, ≤ 120 characters (<code>varchar(120) NOT NULL</code>). Not sent on create → stored as <code>''</code>. On status change: if sent, it overwrites; if not sent, the old remark is kept.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>Get <code>program_id</code> of the bundle and <code>client_group</code> of the program.</li>
<li>Open transaction: <code>SELECT id, enabled FROM client_promotion_blacklist WHERE client_id = ? AND promo_table = 'point_program' AND promo_config_id = ? AND point_task_bundle_id = ? FOR UPDATE</code>.</li>
<li><b>Row exists</b> → UPDATE <code>enabled</code>, <code>remark</code>, <code>update_user</code>, <code>update_date</code>. No group check (allows whitelisting a client who has changed group).</li>
<li><b>No row yet</b>: <ul class="rules"><li><code>enabled = 0</code> → error (nothing to whitelist).</li>
  <li>Check client: <code>crm_customer_base</code> has <code>client_id</code>, <code>deleted = 0</code>, <code>group_code</code> = client group of the program.</li>
  <li>INSERT new row: <code>promotion_code = ''</code> (NOT NULL column, must not write NULL), <code>remark</code> = sent value or <code>''</code>, also write <code>update_user</code> / <code>update_date</code> = creator / creation time.</li>
  <li>If the INSERT hits <code>uk_client_promo_bundle</code> (2 admins adding at the same time) → catch DuplicateKey, re-read the row just created and UPDATE as in the "row exists" branch.</li></ul></li>
<li>Takes effect on the client's next API call (engine does not cache the blacklist).</li></ol>
<p>All time columns are written with <code>UTC_TIMESTAMP()</code>, not relying on the table's <code>DEFAULT CURRENT_TIMESTAMP</code> (default value follows the MySQL server time zone).</p><pre>SELECT client_id FROM crm_customer_base
WHERE client_id = #{clientId} AND deleted = 0
  AND group_code = #{programClientGroup};

INSERT INTO client_promotion_blacklist
  (client_id, promotion_code, promo_table, promo_config_id, point_task_bundle_id, enabled, remark,
   create_date, create_user, update_date, update_user)
VALUES (#{clientId}, '', 'point_program', #{programId}, #{bundleId}, 1, IFNULL(#{remark}, ''),
        UTC_TIMESTAMP(), #{currentUser}, UTC_TIMESTAMP(), #{currentUser});

UPDATE client_promotion_blacklist
SET enabled = #{enabled}, remark = IFNULL(#{remark}, remark), update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE id = #{id};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": { "id": 801, "enabled": 1 } }</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Bundle does not exist.</code></td><td></td></tr><tr><td><code>Client ID does not exist.</code></td><td></td></tr><tr><td><code>Client {clientId} does not belong to client group {group} of this program.</code></td><td>2.6</td></tr><tr><td><code>Client {clientId} is not on this bundle's blacklist.</code></td><td>whitelist when no row exists</td></tr><tr><td><code>Remark must be at most 120 characters.</code></td><td></td></tr><tr><td><code>Enabled must be 0 or 1.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Notes</h4><p>The INSERT statement matches the real DDL (real DDL on UAT). Unique key <code>uk_client_promo_bundle</code> prevents duplicate bundle-level rows, but still SELECT … FOR UPDATE first to return the correct create / status-change branch.</p></div></div><div class="specsrc" id="spec-c1" data-title="C1 · /point/admin/checkinTask/save"><p class="specmeta"><code>POST</code> · <code>/point/admin/checkinTask/save</code></p><p>Create (no id) or edit (with id) a check-in task (Config tab of M4).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>On edit</td><td>Task must exist.</td></tr><tr><td><code>taskBundleId</code></td><td>long</td><td>On create</td><td>Bundle must exist. On edit: must equal the stored value (I3).</td></tr><tr><td><code>…</code></td><td></td><td></td><td>All fields, types and rules as in the <a href="#rules" class="ref">Rules tab</a>.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>Get bundle → <code>program_id</code>. If FE sends <code>programId</code> it must match (V01).</li>
<li>Normalize: trim strings; overwrite hard-locked fields: <code>point_multiplier_enabled = 0</code>, <code>point_to_cash_convert_type = 'by_task_fixed_value'</code>, <code>checkin_auto = 0</code>; the "auto-saved" fields in the Rules tab (e.g. <code>no_limit</code> → <code>point_expiration_window = 7300</code>).</li>
<li>Run V01–V14 (Rules tab). Collect <b>all</b> field errors, return the first error in <code>message</code> and all of them in <code>result.errors</code> so FE can highlight each field in red.</li>
<li>Edit: if the task already has clients (<code>EXISTS log WHERE task_id = ?</code>) → compare each field with the stored version per the lock table in the Locked-while-running tab (V16).</li>
<li>Open transaction, lock the program (<code>SELECT … FOR UPDATE</code>). Editing a task that is <code>enabled = 1</code> → run V15 (I2) with the new config.</li>
<li>Create: INSERT with <b><code>enabled = 0</code></b>. Admin reviews, then enables via C2 (C2 checks I2). Edit: UPDATE, without changing <code>enabled</code>, <code>program_id</code>, <code>task_bundle_id</code>.</li></ol><pre>-- has participants? (needs index idx_task_date, see DEV-06)
SELECT EXISTS (SELECT 1 FROM point_task_daily_checkin_log WHERE task_id = #{id}) AS has_participants;

INSERT INTO point_task_daily_checkin
  (program_id, task_bundle_id, task_name, task_description, display_hide_book_type, enabled, tz_minutes,
   display_event, display_period_limit_apply, display_period_from, display_period_to, display_hide_to_all,
   participate_event, participate_period_limit_type, participate_period_from, participate_period_to,
   first_day_definition, routine_cycle_limit_days, routine_cycle_repeat, restart_missed_checkin_enabled,
   point_multiplier_enabled, point_distribute_specify_each_day, point_to_cash_convert_type,
   fixed_cash_value_per_point_unit, exp_distribute_specify_each_day, checkin_auto, claim_type,
   claim_require_day_per_cycle, claim_valid_period_type, claim_valid_complete_window,
   point_expiration_type, point_expiration_window, create_date, create_user)
VALUES (#{programId}, #{taskBundleId}, #{taskName}, #{taskDescription}, #{displayHideBookType}, 0, #{tzMinutes},
        #{displayEvent}, #{displayPeriodLimitApply}, #{displayPeriodFrom}, #{displayPeriodTo}, #{displayHideToAll},
        #{participateEvent}, #{participatePeriodLimitType}, #{participatePeriodFrom}, #{participatePeriodTo},
        #{firstDayDefinition}, #{routineCycleLimitDays}, #{routineCycleRepeat}, #{restartMissedCheckinEnabled},
        0, #{pointDistributeSpecifyEachDay}, 'by_task_fixed_value',
        #{fixedCashValuePerPointUnit}, #{expDistributeSpecifyEachDay}, 0, #{claimType},
        #{claimRequireDayPerCycle}, #{claimValidPeriodType}, #{claimValidCompleteWindow},
        #{pointExpirationType}, #{pointExpirationWindow}, UTC_TIMESTAMP(), #{currentUser});</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": { "id": 3102, "enabled": 0 } }

// validation failure
{ "success": false, "code": 500, "message": "Each cycle must have exactly 7 days (cycle 1 has 6).",
  "result": { "errors": [
    { "field": "pointDistributeSpecifyEachDay", "message": "Each cycle must have exactly 7 days (cycle 1 has 6)." },
    { "field": "pointExpirationWindow", "message": "Point expiration window must be between 1 and 7300 days." } ] } }</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>(see message tables in the Rules and Locks tabs)</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Notes</h4><p><code>result.errors</code> is an addition to convention 1.6 (<code>message</code> = first error is still kept). If Smart CRM does not want it, drop it; FE only shows <code>message</code>.</p></div></div><div class="specsrc" id="spec-c4" data-title="C4 · /point/admin/checkinTask/get"><p class="specmeta"><code>GET</code> · <code>/point/admin/checkinTask/get</code></p><p>Details of 1 check-in task to open the View/Edit modal. <b>Additional</b> to the list: B1 only returns a summary.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>Yes</td><td>Task must exist.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>SELECT all fields of the task (datetimes returned in UTC).</li>
<li>Compute <code>participantCount</code> (number of distinct clients in the log), <code>hasParticipants</code>, <code>lockedFields</code> (Locked-while-running tab) so FE can lock fields.</li>
<li><code>pendingClaimClientCount</code>: only when <code>claim_type = 'claim_each_cycle'</code> — number of clients with portions not yet claimed and not yet expired. FE shows this number in the confirmation dialog when disabling a task/bundle/program (4.2).</li></ol><pre>SELECT COUNT(DISTINCT client_id) AS participant_count
FROM point_task_daily_checkin_log WHERE task_id = #{id};

SELECT COUNT(DISTINCT client_id) AS pending_claim_client_count
FROM point_task_daily_checkin_log
WHERE task_id = #{id} AND claim_type = 'claim_each_cycle'
  AND claim_status = 0 AND UTC_TIMESTAMP() &lt; claim_expiration_time;</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": {
    "id": 3101, "programId": 1101, "taskBundleId": 2101, "taskName": "mitrade_daily_checkin",
    "taskDescription": "7-day streak", "displayHideBookType": 0, "enabled": 1, "tzMinutes": 420,
    "displayEvent": "signup", "displayPeriodLimitApply": 1,
    "displayPeriodFrom": "2026-09-30 17:00:00", "displayPeriodTo": "2027-12-31 17:00:00", "displayHideToAll": 0,
    "participateEvent": "signup", "participatePeriodLimitType": "specific_period",
    "participatePeriodFrom": "2026-09-30 17:00:00", "participatePeriodTo": "2027-12-31 17:00:00",
    "firstDayDefinition": 0, "routineCycleLimitDays": 7, "routineCycleRepeat": 9999, "restartMissedCheckinEnabled": 1,
    "pointMultiplierEnabled": 0, "pointDistributeSpecifyEachDay": "{\"cycles\": [[5, 8, 10, 12, 14, 17, 34]]}",
    "pointToCashConvertType": "by_task_fixed_value", "fixedCashValuePerPointUnit": 0,
    "expDistributeSpecifyEachDay": "{\"cycles\": [[0, 0, 0, 0, 0, 0, 0]]}", "checkinAuto": 0,
    "claimType": "claim_each_day", "claimRequireDayPerCycle": null,
    "claimValidPeriodType": "no_limit", "claimValidCompleteWindow": null,
    "pointExpirationType": "days_after_claim", "pointExpirationWindow": 180,
    "participantCount": 1, "hasParticipants": true, "pendingClaimClientCount": 0,
    "lockedFields": ["taskBundleId", "tzMinutes", "firstDayDefinition", "routineCycleLimitDays",
                     "restartMissedCheckinEnabled", "claimType", "claimRequireDayPerCycle"],
    "createUser": "config_import", "createDate": "2026-10-20 08:15:00", "updateUser": null, "updateDate": null
  }
}</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Check-in task does not exist.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Notes</h4><p><code>routineCycleRepeat</code> is not in <code>lockedFields</code> because it can still be <b>increased</b>; FE sets the minimum value = current value. <code>participateEvent</code> is locked when the task runs on a schedule (<code>restart = 0</code>).</p></div></div><div class="specsrc" id="spec-c2" data-title="C2 · /point/admin/checkinTask/enable"><p class="specmeta"><code>POST</code> · <code>/point/admin/checkinTask/enable</code></p><p>Enable/disable a check-in task.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>Yes</td><td>Task must exist.</td></tr><tr><td><code>enabled</code></td><td>int</td><td>Yes</td><td>0 / 1.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>Open transaction, lock the program.</li>
<li>On enable: re-run V01–V14 on the stored version (guards against bad legacy data entered by hand), then V15 (I2) if the bundle is enabled. Error → not enabled.</li>
<li>On disable: no blocking.</li>
<li>UPDATE <code>enabled</code>, <code>update_user</code>, <code>update_date</code>.</li></ol>
<p>A task newly created via C1 is always disabled, so C2 is the only path that puts a task on the app.</p><pre>UPDATE point_task_daily_checkin
SET enabled = #{enabled}, update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE id = #{id};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": null }</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Check-in task does not exist.</code></td><td></td></tr><tr><td><code>Cannot enable: check-in task {otherId} ({otherName}) is already live for an overlapping display period. Clients can only see one check-in task at a time.</code></td><td>I2</td></tr><tr><td><code>Cannot enable: {first validation error}</code></td><td>V01–V14</td></tr></table></div></div><div class="specsrc" id="spec-c3" data-title="C3 · /point/admin/checkinTask/log/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/checkinTask/log/list</code></p><p>Check-in log of 1 task (Check-in Log tab of M4).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>taskId</code></td><td>long</td><td>Yes</td><td>Task must exist.</td></tr><tr><td><code>clientId</code></td><td>long</td><td>No</td><td>Exact match.</td></tr><tr><td><code>checkinDate_begin</code></td><td>string</td><td>No</td><td><code>yyyy-MM-dd</code>. Date in the task's local time (column pre-stored per <code>tz_minutes</code>), not UTC.</td></tr><tr><td><code>checkinDate_end</code></td><td>string</td><td>No</td><td><code>yyyy-MM-dd</code>, inclusive of this day.</td></tr><tr><td><code>cycle</code></td><td>int</td><td>No</td><td>≥ 1.</td></tr><tr><td><code>taskStatus</code></td><td>int</td><td>No</td><td><code>1</code> completed, <code>0</code> pending.</td></tr><tr><td><code>claimStatus</code></td><td>string</td><td>No</td><td><code>to_claim</code> / <code>claimed</code> / <code>expired</code> (computed the same way as the engine, see SQL).</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>No</td><td>Default 1.</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>No</td><td>Default 10, max 100.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>Validate, run query, sort by <code>id DESC</code>.</li>
<li>The returned <code>claimStatus</code> is the computed value; plus <code>claimStatusRaw</code> (0/1 in DB).</li></ol><pre>SELECT l.id, l.client_id, l.checkin_date, l.cycle, l.day_in_cycle, l.task_status, l.claim_type,
       CASE WHEN l.claim_status = 1 THEN 'claimed'
            WHEN UTC_TIMESTAMP() &lt; l.claim_expiration_time THEN 'to_claim'
            ELSE 'expired' END AS claim_status,
       l.claim_status AS claim_status_raw, l.claim_time, l.claim_expiration_time,
       l.point_earned, l.exp_earned, l.cash_value_per_point_unit, l.point_expiration_time,
       l.client_group, l.create_date
FROM point_task_daily_checkin_log l
WHERE l.task_id = #{taskId}
  AND (#{clientId} IS NULL OR l.client_id = #{clientId})
  AND (#{checkinDateBegin} IS NULL OR l.checkin_date &gt;= #{checkinDateBegin})
  AND (#{checkinDateEnd} IS NULL OR l.checkin_date &lt;= #{checkinDateEnd})
  AND (#{cycle} IS NULL OR l.cycle = #{cycle})
  AND (#{taskStatus} IS NULL OR l.task_status = #{taskStatus})
HAVING (#{claimStatus} IS NULL OR claim_status = #{claimStatus})
ORDER BY l.id DESC
LIMIT #{offset}, #{pageSize};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": {
    "total": 1,
    "records": [{
      "id": 181, "clientId": 7200101, "checkinDate": "2026-10-20", "cycle": 1, "dayInCycle": 1, "taskStatus": 1,
      "claimType": "claim_each_day", "claimStatus": "claimed", "claimStatusRaw": 1,
      "claimTime": "2026-10-20 09:03:55", "claimExpirationTime": "2046-10-15 16:59:59",
      "pointEarned": 5, "expEarned": 0, "cashValuePerPointUnit": 0,
      "pointExpirationTime": "2027-04-18 16:59:59", "clientGroup": "mitrade_client",
      "createDate": "2026-10-20 09:03:55"
    }]
  }
}</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Check-in task does not exist.</code></td><td></td></tr><tr><td><code>Check-in date must be in yyyy-MM-dd format.</code></td><td></td></tr><tr><td><code>Claim status must be to_claim, claimed or expired.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Notes</h4><p>Engine only writes <code>task_status = 1</code> (manual check-in); <code>0</code> is reserved for the future. <code>HAVING</code> on a computed column: developer may convert it into an equivalent WHERE condition to use the index.</p></div></div><div class="specsrc" id="spec-t1" data-title="T1 · /point/admin/trading/save"><p class="specmeta"><code>POST</code> · <code>/point/admin/trading/save</code></p><p>Create or edit 1 trading task with all its rate rows in a single save (Config tab of M4).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>No</td><td>Not sent = create. Sent = edit; task must exist.</td></tr><tr><td><code>programId</code></td><td>long</td><td>Yes</td><td>Program must exist. On edit: must equal the stored value (J1).</td></tr><tr><td><code>taskBundleId</code></td><td>long</td><td>Yes</td><td>Bundle must exist and <code>bundle.program_id = programId</code>. On edit: must equal the stored value (J1).</td></tr><tr><td><code>taskName</code></td><td>string</td><td>Yes</td><td>Trimmed, 1–128 characters (varchar(128) NOT NULL).</td></tr><tr><td><code>taskDescription</code></td><td>string</td><td>No</td><td>Trimmed, ≤ 512 characters. Empty → NULL.</td></tr><tr><td><code>…other fields</code></td><td></td><td></td><td>See the full table in the <a href="#rules" class="ref">Rules tab</a>.</td></tr><tr><td><code>conversions[]</code></td><td>array</td><td>Yes</td><td>All rate rows of the task (send the full set, not only the changes). Each element: <code>id</code> (existing row; not sent = new row), <code>mt5Group</code>, <code>conditionType</code>, <code>conditionValue</code>, <code>pointPerLot</code>. Validation in the Rules tab.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds">
<li>Validate each field and cross-field rules (Rules tab). Errors return <code>result.errors = [{field, message}]</code>; rate row fields use the form <code>conversions[2].pointPerLot</code>.</li>
<li>Open transaction. Lock the program: <code>SELECT id FROM point_program WHERE id = ? FOR UPDATE</code>. Edit: also lock the task (<code>SELECT … FROM point_task_trading WHERE id = ? FOR UPDATE</code>).</li>
<li>Edit: compute <code>hasData</code> as in T3; a field in <code>lockedFields</code> whose value differs from the stored value → error (Locked-while-running tab).</li>
<li>Create: INSERT with <code>enabled = 0</code> (convention 1.6). Edit: UPDATE all fields except <code>enabled</code>, <code>program_id</code>, <code>task_bundle_id</code>; explicitly write <code>update_date = UTC_TIMESTAMP()</code> (the column has <code>ON UPDATE CURRENT_TIMESTAMP</code> in MySQL server time).</li>
<li>Rate rows (table has no <code>update_*</code> column and no unique key): <ul class="rules">
  <li>Row with <code>id</code> and the same 4 values → unchanged.</li>
  <li>Row with <code>id</code> but different values → <code>deleted = 1</code> the old row, INSERT a new row (keeps history and creator).</li>
  <li>Row present in DB but not in the request → <code>deleted = 1</code>.</li>
  <li>Row without <code>id</code> → INSERT, <code>create_user</code> = logged-in user.</li>
  </ul></li>
<li>If the task is enabled (<code>enabled = 1</code>) and the participation window / book type / bundle changes: re-run the J2 check as in T2; overlapping tasks found and <code>confirmDuplicate = true</code> not sent → error with the list (FE asks the user again).</li>
<li>COMMIT. The engine reads the new config on its next run (coin calculation every 3 minutes, coin distribution every 10 minutes).</li></ol><pre>INSERT INTO point_task_trading
  (program_id, task_bundle_id, task_name, task_description, display_hide_book_type, enabled, tz_minutes,
