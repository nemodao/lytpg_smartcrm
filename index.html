<p>Comment trong entity Java chỉ ghi 0/1/2, nhưng DDL và code dùng cả <code>-1</code>. Spec theo DDL.</p><div class="scroll"><table><tr><th style="width:11%">send_status</th><th style="width:17%">Nhãn EN</th><th style="width:11%">Nhãn ZH</th><th>Ý nghĩa</th></tr><tr><td><code>-1</code></td><td>Not sent (by design)</td><td>无需发送</td><td>Dòng chỉ ghi lại, không gửi CleverTap (<code>is_send = 0</code>). Là trạng thái cuối, <b>không phải lỗi</b>. Lý do ở <code>send_remark</code>.</td></tr><tr><td><code>0</code></td><td>Pending</td><td>待发送</td><td>Đã ghi dòng, đang gửi. Bình thường chỉ tồn tại vài giây. Dòng đứng ở 0 lâu là bất thường, báo developer.</td></tr><tr><td><code>1</code></td><td>Sent</td><td>发送成功</td><td>CleverTap đã <b>nhận event</b>. Không có nghĩa khách chắc chắn nhận push/email: CleverTap vẫn có thể không gửi do giới hạn kênh của tài khoản, khách tắt thông báo, hoặc campaign đang tắt. Xem kết quả gửi thật trên CleverTap.</td></tr><tr><td><code>2</code></td><td>Failed</td><td>发送失败</td><td>Gọi CleverTap lỗi và <b>không gửi lại</b>. Chỉ gặp ở <code>loyalty_daily_nudge</code>, <code>loyalty_daily_summary</code>, <code>loyalty_weekly_summary</code> (tin theo lịch, gửi muộn là nội dung đã cũ). Các event còn lại khi lỗi thì cả lượt được hoàn tác và lượt chạy sau gửi lại, nên không bao giờ có dòng 2.</td></tr></table></div>
<h4>is_send</h4>
<p><code>1</code> = gửi CleverTap, <code>0</code> = chỉ ghi lại, không gửi. Luôn đi cặp: <code>is_send = 0</code> ⇔ <code>send_status = -1</code>. Bộ lọc <code>isSend</code> giữ theo yêu cầu, nhưng FE có thể chỉ cần dropdown <code>sendStatus</code>.</p>
<h4>send_remark</h4><div class="scroll"><table><tr><th style="width:40%">send_remark</th><th>Khi nào</th></tr><tr><td><code>''</code></td><td>Mặc định, tin được gửi bình thường.</td></tr><tr><td><code>Pre-launch eligible existing clients</code></td><td>Dòng <code>loyalty_enrolled</code> ghi sẵn lúc launch cho khách đã đủ điều kiện từ trước.</td></tr><tr><td><code>non-first coin,current LedgerId=…,first LedgerId=…</code></td><td><code>coin_first_earned</code> bị chặn vì khách đã có coin từ trước (kèm id ledger để tra).</td></tr></table></div>
<h4>payload</h4>
<p>Mỗi số có thêm bản <code>&lt;key&gt;_text</code> định dạng kiểu Indonesia (<code>1540</code> → <code>"1.540"</code>), là chuỗi CleverTap đưa vào câu chữ. Ngày dạng <code>$D_&lt;Unix seconds&gt;</code> là định dạng ngày của CleverTap (ví dụ <code>enrolled_at</code>). FE nên hiện payload dạng JSON thu gọn, bấm để mở.</p>
<p>Ngoài key riêng, phần lớn event có thêm 3 key chung: <code>coin_balance</code>, <code>next_gift_name</code>, <code>coin_to_next_gift</code> (đổi quà và hoàn coin chỉ có <code>coin_balance</code>). Key không có giá trị thì không ghi (ví dụ khách không còn quà kế tiếp).</p>
<div class="scroll"><table><tr><th style="width:34%">event_name</th><th>Key riêng của event</th></tr><tr><td><code>loyalty_enrolled</code></td><td>loyalty_eligible, enrolled_at, coin_per_lot</td></tr><tr><td><code>coin_first_earned</code></td><td>coin_amount</td></tr><tr><td><code>loyalty_daily_nudge</code></td><td>nudge_type, coin_per_lot, last_coin, days_since_ftd</td></tr><tr><td><code>loyalty_daily_summary</code></td><td>today_coin, reachable_gift_name</td></tr><tr><td><code>first_gift_reachable</code></td><td>gift_name, gift_price, gift_image_url</td></tr><tr><td><code>first_gift_almost_reached</code></td><td>gift_name, gift_price, gift_image_url, coin_to_gift, lot_to_gift</td></tr><tr><td><code>loyalty_weekly_summary</code></td><td>week_coin, trading_days, gift_1_… đến gift_3_… (name, price, image_url, percent, status)</td></tr><tr><td><code>coin_redeemed</code></td><td>redemption_id, coin_spent</td></tr><tr><td><code>coin_refunded</code></td><td>redemption_id, coin_refunded</td></tr></table></div>
<p class="note">Danh sách key để tham khảo, đọc từ code; FE không cần map từng key.</p>

</section><section class="panel" id="locks" role="tabpanel">
<h2>Khoá khi đang chạy</h2>
<p>Field nào được sửa khi task / quà đã có khách tham gia. API chi tiết (C4, T3) trả sẵn <code>lockedFields</code> để frontend khoá ô; API lưu kiểm lại phía server.</p>

<h3>Sửa khi đã có khách tham gia</h3>
<p>"Đã có khách" = task có ít nhất 1 dòng trong <code>point_task_daily_checkin_log</code>. Trước thời điểm đó mọi field đều sửa được (trừ bundle). C4 trả sẵn <code>lockedFields</code> cho FE; C1 kiểm lại phía server (V16).</p>
<h4>Check-in task</h4>
<div class="scroll"><table><tr><th style="width:34%">Field</th><th style="width:15%">Trạng thái</th><th>Lý do</th></tr><tr><td><code>taskName, taskDescription</code></td><td>Sửa</td><td>Chỉ hiển thị.</td></tr><tr><td><code>displayHideBookType, displayEvent, displayPeriodLimitApply/From/To, displayHideToAll</code></td><td>Sửa</td><td>Chỉ đổi ai thấy thẻ. Task đang bật thì kiểm lại I2 (V15).</td></tr><tr><td><code>participatePeriodLimitType/From/To</code></td><td>Sửa</td><td>Đổi thời gian được check-in; không làm sai log. Đặt <code>to</code> về quá khứ là kết thúc chiến dịch ngay. Streak: kiểm lại V13 với khung mới.</td></tr><tr><td><code>participateEvent</code></td><td>Streak: sửa · Lịch: khoá</td><td>Kiểu lịch lấy mốc chu kỳ từ thời điểm sự kiện; đổi sự kiện → cycle/day của mọi khách bị tính lại, ô lịch sử và chu kỳ chờ nhận lệch.</td></tr><tr><td><code>tzMinutes</code></td><td>Khoá</td><td>Đổi ranh giới ngày: ngày check-in mới có thể trùng ngày cũ (bị báo đã check-in) hoặc nhảy 2 ngày (đứt chuỗi); hạn điểm lệch.</td></tr><tr><td><code>firstDayDefinition</code></td><td>Khoá</td><td>Mốc chu kỳ của kiểu lịch. Streak không dùng nên không cần sửa.</td></tr><tr><td><code>routineCycleLimitDays</code></td><td>Khoá</td><td>Lịch: cycle/day của mọi khách tính lại từ đầu. Streak: chuỗi đang chạy có thể vượt độ dài mới. Hình dạng JSON cũng phải đổi theo.</td></tr><tr><td><code>routineCycleRepeat</code></td><td>Chỉ tăng</td><td>Giảm → khách đã vượt mức mới bị chặn ngay (<code>OUT_OF_CYCLE</code> / <code>completed</code>). Lịch: tăng thì phải thêm cycle vào JSON (V06).</td></tr><tr><td><code>restartMissedCheckinEnabled</code></td><td>Khoá</td><td>Đổi toàn bộ cách tính chu kỳ.</td></tr><tr><td><code>pointDistributeSpecifyEachDay, expDistributeSpecifyEachDay</code></td><td>Sửa giá trị</td><td>Chỉ áp dụng cho lần check-in sau; log cũ giữ số điểm đã ghi. Hình dạng vẫn theo V05–V07.</td></tr><tr><td><code>fixedCashValuePerPointUnit</code></td><td>Sửa</td><td>Giá trị được chụp vào từng log và lot.</td></tr><tr><td><code>claimType</code></td><td>Khoá</td><td>App vẽ trạng thái nhận theo giá trị hiện tại: đổi từ theo chu kỳ sang theo ngày làm phần chưa nhận bị kẹt, không còn nút nhận.</td></tr><tr><td><code>claimRequireDayPerCycle</code></td><td>Khoá</td><td>Engine đọc giá trị hiện tại cho cả chu kỳ đã đóng → đổi là đổi luật nhận hồi tố.</td></tr><tr><td><code>claimValidPeriodType, claimValidCompleteWindow</code></td><td>Sửa</td><td>Hạn nhận được tính và lưu vào log lúc check-in; chỉ ảnh hưởng log mới.</td></tr><tr><td><code>pointExpirationType, pointExpirationWindow</code></td><td>Sửa</td><td><code>claim_each_day</code>: chỉ ảnh hưởng check-in sau. <code>claim_each_cycle</code>: áp dụng lúc khách bấm nhận, nên cả phần chưa nhận của chu kỳ cũ cũng theo hạn mới.</td></tr><tr><td><code>taskBundleId, programId</code></td><td>Khoá (luôn luôn)</td><td>I3: lịch sử và chuỗi tìm theo bundle.</td></tr></table></div>
<h4>Program và bundle</h4>
<div class="scroll"><table><tr><th style="width:34%">Field</th><th style="width:15%">Trạng thái</th><th>Lý do</th></tr><tr><td><code>point_program.cash_currency</code></td><td>Khoá khi program đã có activity</td><td>Đơn vị của mọi <code>cash_value</code> đã chụp trong log/lot. Check-in hiện để 0 nên rủi ro thấp, nhưng trading có dùng giá trị tiền: nhóm Trading xác nhận phía trading.</td></tr><tr><td><code>point_program.display_hide_book_type</code></td><td>Sửa</td><td>Check-in: chỉ lọc hiển thị. Trading (nhóm Trading xác nhận): luật tính coin, đổi sang 1 / 2 thì khách A / B book thôi được tính coin ở mọi trading task của program.</td></tr><tr><td><code>point_task_bundle.display_hide_book_type</code></td><td>Sửa</td><td>Như trên, phạm vi là các trading task trong bundle.</td></tr><tr><td><code>program_name, program_description, task_bundle_name, task_bundle_description</code></td><td>Sửa</td><td>Chỉ hiển thị.</td></tr></table></div>
<p>Muốn đổi field bị khoá: tạo task mới trong cùng bundle (để trống khung hiển thị chồng nhau, V15), rồi tắt task cũ. Lịch sử của task cũ vẫn giữ.</p>


<h3>Sửa khi đang chạy</h3>
<p>"Có dữ liệu" = task đã có ít nhất 1 dòng <code>point_task_trading_deal_log</code> (<code>hasData</code> ở T3). Trước đó mọi field đều sửa được, trừ program và bundle. T3 trả sẵn <code>lockedFields</code>; T1 kiểm lại phía server (V06). Muốn đổi field bị khoá: tạo task mới, tắt task cũ (lịch sử task cũ giữ nguyên).</p>
<h4>Trading task</h4>
<div class="scroll"><table><tr><th style="width:30%">Field</th><th style="width:18%">Trạng thái</th><th>Lý do / tác dụng</th></tr><tr><td><code>programId, taskBundleId</code></td><td>Khoá (luôn luôn)</td><td>J1.</td></tr><tr><td><code>tzMinutes</code></td><td>Khoá khi có dữ liệu</td><td>Đổi ranh giới ngày: lệnh mới rơi vào <code>period_key</code> khác, log ngày bị tách, trần ngày tính lại từ 0.</td></tr><tr><td><code>releaseAutoDelayDay</code></td><td>Khoá khi có dữ liệu</td><td>J7: ngày đang chạy có 2 kiểu phát; trạng thái pending / earning trên app sai cho ngày đó.</td></tr><tr><td><code>taskName, taskDescription, termsUrl</code></td><td>Sửa</td><td>Chỉ hiển thị.</td></tr><tr><td><code>displayEvent, displayPeriod*, displayHideToAll</code></td><td>Sửa</td><td>Chỉ đổi ai thấy task. Engine không đọc.</td></tr><tr><td><code>displayHideBookType</code></td><td>Sửa (có xác nhận)</td><td>Đổi cả ai được tính coin, từ lần chạy engine kế tiếp (J8). Lệnh đã tính giữ nguyên.</td></tr><tr><td><code>participatePeriod*</code></td><td>Sửa</td><td>Áp dụng cho lệnh xử lý sau khi lưu. Đặt <code>to</code> về quá khứ = kết thúc chương trình ngay (app hiện <code>ended</code>).</td></tr><tr><td><code>minPositionHoldSecond</code></td><td>Sửa</td><td>Áp dụng cho lệnh xử lý sau khi lưu; lệnh cũ giữ kết quả.</td></tr><tr><td><code>pointMaxCapEnabled, pointMaxCapValue</code></td><td>Sửa</td><td>Chụp vào log ngày: khách đã giao dịch hôm nay giữ trần cũ tới hết ngày, từ ngày sau mới theo trần mới.</td></tr><tr><td><code>pointExpirationWindow</code></td><td>Sửa</td><td>Chụp vào log ngày: chỉ coin của ngày mới theo hạn mới.</td></tr><tr><td><code>cashValuePerPointUnit</code></td><td>Sửa</td><td>Chụp vào log ngày và chi tiết lệnh.</td></tr><tr><td><code>conversions[]</code></td><td>Sửa (xoá mềm + thêm)</td><td>Engine đọc lại bảng tỷ lệ mỗi lần chạy: áp dụng cho lệnh xử lý sau khi lưu; lệnh cũ giữ <code>point_per_lot</code> đã chụp.</td></tr><tr><td><code>enabled</code></td><td>Chỉ qua T2</td><td>Quy ước 1.6.</td></tr></table></div>
<p>Nguyên tắc chung: engine <b>chụp</b> cấu hình vào từng lệnh (tỷ lệ, giữ lệnh) và vào log ngày ở lệnh đầu của ngày (trần, hạn, giá trị tiền, kiểu phát). Sửa cấu hình không bao giờ đổi lệnh đã tính hay coin đã cộng.</p>
<h4>Program và bundle (câu hỏi 4.3 của Smart CRM)</h4>
<div class="scroll"><table><tr><th style="width:30%">Field</th><th style="width:18%">Trạng thái</th><th>Lý do</th></tr><tr><td><code>point_program.cash_currency</code></td><td>Khoá khi program đã có activity</td><td>Đồng ý với nhóm Check-in, và phía trading có dùng: <code>cash_value_per_point_unit</code> được chụp vào chi tiết lệnh, log ngày, lô và sổ coin; đơn vị của các số đó là <code>cash_currency</code>. Đổi tiền tệ làm sai nghĩa mọi số đã chụp.</td></tr><tr><td><code>point_program.display_hide_book_type</code></td><td>Sửa (có xác nhận)</td><td>Phía trading là luật tính coin (J8): đổi sang 1 hoặc 2 là khách A/B book của <b>mọi</b> trading task trong program thôi được tính coin và thôi thấy chương trình từ lần chạy kế tiếp. Lệnh đã tính, coin đã cộng giữ nguyên. Đổi lại được bất cứ lúc nào.</td></tr><tr><td><code>point_task_bundle.display_hide_book_type</code></td><td>Sửa (có xác nhận)</td><td>Như trên, phạm vi là các task trong bundle.</td></tr></table></div>


<h3>Sửa quà khi đã có người đổi (trả lời 4.2)</h3>
<p><code>point_featured_gift</code> <b>không bị khóa ngoại</b> bởi order/transaction: mỗi đơn đã lưu <code>coin_amount</code> riêng, nên sửa quà <b>không hồi tố</b> đơn cũ. Vì vậy không có field nào cần khóa cứng ở mức DB; chỉ có 2 field cần <b>cảnh báo</b> vì liên quan đồng bộ giá với TADA.</p>
<div class="scroll"><table><tr><th style="width:38%">Field</th><th style="width:16%">Trạng thái</th><th>Lý do</th></tr><tr><td><code>giftName, giftShortName, giftDescription, badge, remark</code></td><td>Sửa</td><td>Chỉ hiển thị; không ảnh hưởng đơn cũ hay engine.</td></tr><tr><td><code>giftImageUrl</code></td><td>Sửa</td><td>Chỉ ảnh email. Nên giữ link ổn định (host HSB) để email cũ không vỡ ảnh.</td></tr><tr><td><code>giftCategory</code></td><td>Sửa</td><td>Chỉ nhóm/lọc hiển thị.</td></tr><tr><td><code>showOnDashboard, useInNotification, sortOrder, displayFrom, displayTo</code></td><td>Sửa</td><td>Chỉ đổi khi/ở đâu quà hiện. Không đụng đơn đã đổi.</td></tr><tr><td><code>cashValue</code></td><td>Sửa (thận trọng)</td><td>Giá trị thống kê nội bộ; đổi không ảnh hưởng đơn cũ (đơn lưu coin riêng).</td></tr><tr><td><code>pointPrice</code></td><td>Sửa + CẢNH BÁO</td><td>Không hồi tố đơn cũ (mỗi đơn đã lưu <code>coin_amount</code> riêng ở <code>point_redemption_transaction</code>). NHƯNG phải khớp giá TADA (RI1): đổi ở đây mà không đổi trên TADA → dashboard lệch giá thực trừ. Cảnh báo + yêu cầu đối soát lại TADA.</td></tr><tr><td><code>externalItemId</code></td><td>Sửa + CẢNH BÁO</td><td>Là chốt đối soát giá với TADA. Đổi sai → map nhầm quà TADA. Cảnh báo chung khi sửa (nhất là khi quà đang bật).</td></tr><tr><td><code>program_id</code></td><td>Khoá (luôn)</td><td>Quà thuộc đúng 1 program; đổi program là đổi khách nhìn thấy + thống kê. Dùng G2 không bao giờ UPDATE cột này.</td></tr><tr><td><code>enabled</code></td><td>Chỉ qua G3</td><td>Tách khỏi G2 để mọi lần bật đều kiểm <code>external_item_id</code> (RI1).</td></tr></table></div>
<p>Đơn đổi quà đến từ catalog TADA trong webview, <b>không</b> đi qua featured list, nên không dò được "quà này đã có ai đổi chưa" (Smart CRM chốt bỏ việc lưu <code>gift_id</code> vào đơn). Vì vậy khi sửa <code>point_price</code> / <code>external_item_id</code> chỉ cần <b>cảnh báo chung</b> + nhắc đối soát lại TADA, không truy đơn cũ.</p>

</section><section class="panel" id="preflight" role="tabpanel">
<h2>Kiểm tra dữ liệu</h2>
<p>Chạy trên UAT / PRD trước khi mở màn hình. Màn hình giả định dữ liệu hiện có đã đúng các quy tắc engine; query kiểm lỗi phải ra 0 dòng, có dòng thì sửa dữ liệu trước.</p>
<h3>Phân quyền và check-in</h3><pre>-- Run on UAT / PRD before opening the screens. Every query should return no rows.
-- (1) I1: client groups attached to more than one point program
SELECT client_group, COUNT(*) AS programs, GROUP_CONCAT(promo_config_id) AS program_ids
FROM mt5_crm.promo_client_group
WHERE promo_table = 'point_program'
GROUP BY client_group HAVING COUNT(*) &gt; 1;

-- (2) I2: programs with more than one live check-in task right now
SELECT d.program_id, COUNT(*) AS live_tasks, GROUP_CONCAT(d.id) AS task_ids
FROM mt5_crm.point_task_daily_checkin d
JOIN mt5_crm.point_task_bundle b ON b.id = d.task_bundle_id
WHERE d.enabled = 1 AND b.enabled = 1 AND d.display_hide_to_all = 0
  AND (d.display_period_limit_apply = 0
       OR (UTC_TIMESTAMP() &gt;= d.display_period_from AND UTC_TIMESTAMP() &lt; d.display_period_to))
GROUP BY d.program_id HAVING COUNT(*) &gt; 1;

-- (3) I3 / I5 / I6 / I7: check-in tasks that break an engine rule
SELECT d.id, d.task_name,
       CONCAT_WS(', ',
         IF(d.program_id &lt;&gt; b.program_id, 'program_id differs from bundle', NULL),
         IF(d.tz_minutes IS NULL, 'tz_minutes NULL', NULL),
         IF(d.routine_cycle_repeat IS NULL, 'routine_cycle_repeat NULL', NULL),
         IF(d.point_expiration_window IS NULL, 'point_expiration_window NULL', NULL),
         IF(d.display_event NOT IN ('signup','kyc_approve','first_time_deposit','first_trade'), 'display_event', NULL),
         IF(d.participate_event NOT IN ('signup','kyc_approve','first_time_deposit','first_trade'), 'participate_event', NULL),
         IF(d.participate_period_limit_type NOT IN ('no_limit','specific_period'), 'participate_period_limit_type', NULL),
         IF(d.claim_type NOT IN ('claim_each_day','claim_each_cycle'), 'claim_type', NULL),
         IF(IFNULL(d.claim_valid_period_type, '') NOT IN ('days_after_completion','no_limit'), 'claim_valid_period_type', NULL),
         IF(d.point_expiration_type NOT IN ('days_after_claim','no_limit'), 'point_expiration_type', NULL),
         IF(d.restart_missed_checkin_enabled = 1
            AND JSON_LENGTH(d.point_distribute_specify_each_day, '$.cycles') &lt;&gt; 1, 'streak needs 1 cycle', NULL),
         IF(JSON_LENGTH(d.point_distribute_specify_each_day, '$.cycles[0]') &lt;&gt; d.routine_cycle_limit_days,
            'cycle 1 length differs from routine_cycle_limit_days', NULL)
       ) AS problems
FROM mt5_crm.point_task_daily_checkin d
LEFT JOIN mt5_crm.point_task_bundle b ON b.id = d.task_bundle_id
HAVING problems &lt;&gt; '';</pre>
<h3>Trading và coin</h3><pre>-- Run on UAT / PRD before opening the screens. Every query should return no rows.
-- (1) J2: programs with more than one live trading task
SELECT d.program_id, COUNT(*) AS live_tasks, GROUP_CONCAT(d.id) AS task_ids
FROM mt5_crm.point_task_trading d
JOIN mt5_crm.point_task_bundle b ON b.id = d.task_bundle_id
JOIN mt5_crm.point_program p ON p.id = d.program_id
WHERE d.enabled = 1 AND b.enabled = 1 AND p.enabled = 1
  AND (d.participate_period_limit_type = 'no_limit' OR d.participate_period_to &gt; UTC_TIMESTAMP())
GROUP BY d.program_id HAVING COUNT(*) &gt; 1;

-- (2) J1 / J3 / J4 / field ranges: trading tasks that break an engine rule
SELECT d.id, d.task_name,
       CONCAT_WS(', ',
         IF(b.id IS NULL OR d.program_id &lt;&gt; b.program_id, 'program_id differs from bundle', NULL),
         IF(d.display_event IS NULL OR d.display_event NOT IN ('signup','kyc_approve','first_time_deposit','first_trade'), 'display_event', NULL),
         IF(d.display_hide_book_type NOT IN (0,1,2), 'display_hide_book_type', NULL),
         IF(d.display_period_limit_apply = 1 AND (d.display_period_from IS NULL OR d.display_period_to IS NULL
            OR d.display_period_from &gt;= d.display_period_to), 'display period', NULL),
         IF(d.participate_period_limit_type NOT IN ('no_limit','specific_period'), 'participate_period_limit_type', NULL),
         IF(d.participate_period_limit_type = 'specific_period' AND (d.participate_period_from IS NULL
            OR d.participate_period_to IS NULL OR d.participate_period_from &gt;= d.participate_period_to), 'participate period', NULL),
         IF(d.point_max_cap_enabled = 1 AND d.point_max_cap_value &lt; 1, 'daily cap', NULL),
         IF(d.point_expiration_window &lt; 1, 'point_expiration_window', NULL),
         IF(d.terms_url = '', 'terms_url empty string', NULL)
       ) AS problems
FROM mt5_crm.point_task_trading d
LEFT JOIN mt5_crm.point_task_bundle b ON b.id = d.task_bundle_id
HAVING problems &lt;&gt; '';

-- (3) J5: duplicate or broken rate rows
SELECT task_id, LOWER(mt5_group) AS grp, LOWER(condition_type) AS ctype, LOWER(IFNULL(condition_value, '')) AS cval,
       COUNT(*) AS n, GROUP_CONCAT(id) AS ids
FROM mt5_crm.point_task_trading_point_conversion
WHERE deleted = 0
GROUP BY 1, 2, 3, 4 HAVING COUNT(*) &gt; 1;

SELECT id, task_id, mt5_group, condition_type, condition_value, point_per_lot
FROM mt5_crm.point_task_trading_point_conversion
WHERE deleted = 0
  AND ( condition_type NOT IN ('symbol','symbol_group','any')
     OR (condition_type = 'any' AND IFNULL(condition_value, '') NOT IN ('', 'other'))
     OR (condition_type = 'symbol_group' AND condition_value NOT IN ('forex','metal','energy','index','stocks','other'))
     OR (condition_type = 'symbol' AND (condition_value IS NULL OR condition_value LIKE '%.%'))
     OR point_per_lot &lt; 0 );

-- (4) J6: enabled tasks with no positive rate
SELECT d.id, d.task_name FROM mt5_crm.point_task_trading d
WHERE d.enabled = 1
  AND NOT EXISTS (SELECT 1 FROM mt5_crm.point_task_trading_point_conversion v
                  WHERE v.task_id = d.id AND v.deleted = 0 AND v.point_per_lot &gt; 0);</pre>
<h3>Gift và redemption</h3><pre>-- Run on UAT / PRD before opening the screens. (1)-(2) should return no rows; (3)-(4) are reference figures.
-- (1) Gift points to a missing program, or the program has no client group (RI1/RI2)
SELECT g.id, g.program_id, g.gift_name
FROM mt5_crm.point_featured_gift g
LEFT JOIN mt5_crm.point_program p ON p.id = g.program_id
LEFT JOIN mt5_crm.promo_client_group cg
       ON cg.promo_table = 'point_program' AND cg.promo_config_id = g.program_id
WHERE p.id IS NULL OR cg.id IS NULL;

-- (2) Enabled gift without external_item_id (price cannot be reconciled with TADA — RI1)
SELECT id, program_id, gift_name, point_price
FROM mt5_crm.point_featured_gift
WHERE enabled = 1 AND (external_item_id IS NULL OR external_item_id = '');

-- (3) Transactions waiting for manual review (reconciled = 1) — backlog to handle by hand (RI5)
SELECT COUNT(*) AS pending_manual_review
FROM mt5_crm.point_redemption_transaction
WHERE external_system = 'tada' AND status = 1 AND reconciled = 1;

-- (4) Redeem blacklist rows pointing to clients that no longer exist (junk data)
SELECT bl.id, bl.client_id, bl.enabled
FROM mt5_crm.client_promotion_blacklist bl
LEFT JOIN mt5_crm.crm_customer_base c ON c.client_id = bl.client_id AND c.deleted = 0
WHERE bl.promo_table = 'point_redemption_transaction'
  AND bl.promo_config_id = 0 AND bl.point_task_bundle_id = 0
  AND c.client_id IS NULL;</pre>

<div id="specmodal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true">
    <div class="modal-top"><span id="spec-title"></span><button type="button" id="spec-close" aria-label="Đóng">✕</button></div>
    <div id="spec-body" class="modal-body"></div>
  </div>
</div>

</template>

<script>var TITLES = {"en": "Smart CRM – Loyalty Config: Admin API", "zh": "Smart CRM – Loyalty 配置：管理端 API", "vi": "Smart CRM – Loyalty Config: API admin"};
(function () {
  var app = document.getElementById('app'), sel = document.getElementById('lang');
  var FIRST = 'overview', current = FIRST;
  function show(id, push) {
    app.querySelectorAll('.tabs button').forEach(function (b) {
      var on = b.dataset.tab === id;
      b.setAttribute('aria-selected', on ? 'true' : 'false');
      document.getElementById(b.dataset.tab).classList.toggle('on', on);
    });
    current = id;
    if (push) history.replaceState(null, '', '#' + id);
  }
  function go(hash) {
    var el = hash && hash.length > 1 && document.getElementById(hash.slice(1));
    if (!el) return false;
    var panel = el.classList.contains('panel') ? el : el.closest('.panel');
    if (!panel) return false;
    show(panel.id, false);
    if (el !== panel) el.scrollIntoView(); else window.scrollTo(0, 0);
    return true;
  }
  function mount(lang, keepTab) {
    var tpl = document.getElementById('tpl-' + lang) || document.getElementById('tpl-en');
    app.innerHTML = tpl.innerHTML;
    document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang;
    document.title = TITLES[lang] || TITLES.en;
    sel.value = lang;
    if (keepTab) show(current, false);
    else if (!go(location.hash)) show(FIRST, false);
  }
  function closeModal() { var m = document.getElementById('specmodal'); if (m) m.hidden = true; }
  document.addEventListener('click', function (ev) {
    var sb = ev.target.closest('.specbtn');
    if (sb) {
      var src = document.getElementById('spec-' + sb.dataset.spec);
      if (src) {
        document.getElementById('spec-title').textContent = src.dataset.title || '';
        document.getElementById('spec-body').innerHTML = src.innerHTML;
        document.getElementById('specmodal').hidden = false;
      }
      return;
    }
    if (ev.target.closest('#spec-close') || ev.target.id === 'specmodal') { closeModal(); return; }
    var tab = ev.target.closest('.tabs button');
    if (tab) { show(tab.dataset.tab, true); window.scrollTo(0, 0); return; }
    var a = ev.target.closest('a.ref');
    if (a && go(a.getAttribute('href'))) { ev.preventDefault(); history.replaceState(null, '', a.getAttribute('href')); closeModal(); }
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') closeModal(); });
  sel.addEventListener('change', function () { mount(sel.value, true); });
  mount('en', false);
})();
</script>
