    "createDate": "2026-10-20 02:12:00" }] }
}</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Task does not exist.</code></td><td></td></tr><tr><td><code>Release status is not valid.</code></td><td></td></tr><tr><td><code>Date range must be at most 93 days.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Lưu ý</h4><p><code>reason_code</code> có trong code: <code>CLIENT_BLACKLISTED</code> (khách bị blacklist), <code>TASK_NOT_ACTIVE</code> (lệnh mở hoặc đóng ngoài khung tham gia), <code>HOLD_TIME_NOT_MET</code> (giữ lệnh chưa đủ), <code>NO_RATE_CONFIG</code> (không có dòng quy đổi khớp), <code>ISSUE_FAILED</code> (phát lỗi quá 3 lần). Trống = hợp lệ.</p>
<p>Bảng không có index bắt đầu bằng <code>task_id</code> (UAT đã ~262.000 dòng): cần thêm, xem DEV-06.</p></div></div><div class="specsrc" id="spec-t5" data-title="T5 · /point/admin/trading/dailyLog/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/trading/dailyLog/list</code></p><p>Tổng hợp theo khách / ngày của 1 task (tab Daily Log của M4). Chỉ đọc.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>taskId</code></td><td>long</td><td>Có</td><td>Task phải tồn tại.</td></tr><tr><td><code>clientId</code></td><td>long</td><td>Không</td><td>Khớp đúng.</td></tr><tr><td><code>periodKey_begin, periodKey_end</code></td><td>yyyy-MM-dd</td><td>Không</td><td>Như T4.</td></tr><tr><td><code>pageNo, pageSize</code></td><td>int</td><td>Không</td><td>1 / 10, tối đa 100.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Query bên dưới, xếp ngày mới nhất trước.</li>
<li>Trả thêm <code>status</code> tính giống app: <code>pending</code> (giờ hẹn phát còn ở tương lai) / <code>earning</code> (còn coin chờ và chưa chạm trần) / <code>credited</code>, và <code>capped</code> = trần bật và <code>point_earned &gt;= point_max_cap_value</code>.</li></ol><pre>SELECT id, client_id, period_key, tz_minutes, lot_total, lot_valid, point_total, point_pending, point_earned,
       points_limit_lost, points_fail_lost, total_txn_count, full_release_count, partial_release_count,
       over_limit_count, fail_count, point_max_cap_enabled, point_max_cap_value, cash_value_per_point_unit,
       release_auto_delay_day, release_schedule_time, point_expiration_window, point_expiration_time,
       create_date, update_date
FROM point_task_trading_log
WHERE task_id = #{taskId}
  AND (#{clientId} IS NULL OR client_id = #{clientId})
  AND (#{periodKey_begin} IS NULL OR period_key &gt;= #{periodKey_begin})
  AND (#{periodKey_end} IS NULL OR period_key &lt;= #{periodKey_end})
ORDER BY period_key DESC, client_id
LIMIT #{offset}, #{pageSize};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": { "total": 1, "records": [{
    "id": 131, "clientId": 72000101, "periodKey": "2026-10-20", "tzMinutes": 420,
    "lotTotal": 26.500000, "lotValid": 24.000000, "pointTotal": 2210, "pointPending": 0, "pointEarned": 2000,
    "pointsLimitLost": 210, "pointsFailLost": 0, "totalTxnCount": 12, "fullReleaseCount": 11, "partialReleaseCount": 1,

    "status": "credited", "capped": true,
    "createDate": "2026-10-20 01:03:00", "updateDate": "2026-10-20 08:40:12" }] }
}</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Task does not exist.</code></td><td></td></tr><tr><td><code>Date range must be at most 93 days.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Lưu ý</h4><p>Trần, hạn coin, giá trị tiền, kiểu phát được <b>chụp</b> vào dòng này ở lệnh đầu tiên của ngày: đổi cấu hình task không đổi các dòng đã có (tab Khoá khi đang chạy). Index: DEV-06.</p></div></div><div class="specsrc" id="spec-k1" data-title="K1 · /point/admin/coin/ledger/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/coin/ledger/list</code></p><p>Sổ coin (<code>point_ledger</code>) của khách thuộc program (tab Coin (S2), tab Ledger). Chỉ đọc.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>Có</td><td>Program phải tồn tại.</td></tr><tr><td><code>clientId</code></td><td>long</td><td>Không</td><td>Khớp đúng; khách phải thuộc program (khác → danh sách rỗng, không báo lỗi).</td></tr><tr><td><code>sourceType</code></td><td>int</td><td>Không</td><td><code>1</code> task, <code>2</code> điều chỉnh tay, <code>3</code> đổi quà.</td></tr><tr><td><code>type</code></td><td>int</td><td>Không</td><td><code>1</code> earn, <code>2</code> consume, <code>3</code> refund, <code>5</code> adjust_positive, <code>6</code> adjust_negative. (Không có dòng <code>4</code>: hết hạn không ghi sổ.)</td></tr><tr><td><code>createDate_begin, createDate_end</code></td><td>datetime UTC</td><td>Không</td><td>Không gửi = 7 ngày gần nhất. Khoảng tối đa 31 ngày khi không lọc <code>clientId</code>, 366 ngày khi có.</td></tr><tr><td><code>pageNo, pageSize</code></td><td>int</td><td>Không</td><td>1 / 10, tối đa 100.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Validate, áp khoảng ngày.</li>
<li>Lấy danh sách client group của program; query bên dưới với điều kiện thuộc program (SQL phạm vi ở tab Tổng quan).</li>
<li>Trả thêm <code>sourceName</code> (<code>trading</code> / <code>daily_checkin</code> / <code>adjust</code> / <code>redeem</code>, suy từ <code>task_log_table</code> của lô như app) và <code>typeName</code>.</li></ol><pre>SELECT g.id, g.client_id, g.lot_id, g.source_type, g.type, g.point_amount,
       g.point_balance_before, g.point_balance_after, g.redemption_id, g.external_system, g.external_id,
       g.create_date, g.create_user,
       l.task_log_table, l.point_expiration_time AS lot_expiration_time
FROM point_ledger g
LEFT JOIN point_lot l ON l.id = g.lot_id
WHERE g.create_date &gt;= #{createDate_begin} AND g.create_date &lt; #{createDate_end}
  AND (#{clientId} IS NULL OR g.client_id = #{clientId})
  AND (#{sourceType} IS NULL OR g.source_type = #{sourceType})
  AND (#{type} IS NULL OR g.type = #{type})
  AND g.client_id IN (/* SCOPE_SQL of program */)
ORDER BY g.create_date DESC, g.id DESC
LIMIT #{offset}, #{pageSize};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",

}</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Date range must be at most {n} days.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Lưu ý</h4><p>Cột <code>remark</code> chỉ có sau khi developer thêm cột (DEV-07). Index sẵn có <code>idx_client_date (client_id, create_date)</code> đủ cho lọc theo khách; lọc cả program theo ngày cần thêm index <code>create_date</code> (DEV-06).</p></div></div><div class="specsrc" id="spec-k2" data-title="K2 · /point/admin/coin/lot/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/coin/lot/list</code></p><p>Lô coin (<code>point_lot</code>) của khách thuộc program (tab Coin (S2), tab Lot). Chỉ đọc.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>Có</td><td>Program phải tồn tại.</td></tr><tr><td><code>clientId</code></td><td>long</td><td>Không</td><td>Như K1.</td></tr><tr><td><code>sourceType</code></td><td>int</td><td>Không</td><td><code>1</code> task (trading / check-in), <code>2</code> điều chỉnh tay.</td></tr><tr><td><code>status</code></td><td>string</td><td>Không</td><td><code>valid</code>: còn hạn và còn coin; <code>used</code>: còn hạn, hết coin; <code>expired</code>: đã hết hạn. Lô <code>point_expiration_time</code> NULL coi là còn hạn.</td></tr><tr><td><code>createDate_begin, createDate_end</code></td><td>datetime UTC</td><td>Không</td><td>Như K1.</td></tr><tr><td><code>pageNo, pageSize</code></td><td>int</td><td>Không</td><td>1 / 10, tối đa 100.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Như K1, trên <code>point_lot</code>.</li>
<li>Trả thêm <code>sourceName</code> và <code>status</code> tính lúc đọc.</li></ol><pre>SELECT id, client_id, task_log_table, task_log_id, source_type, point_earned, point_balance,
       point_expiration_time, cash_value_per_point_unit, archive_at, create_date, create_user, update_date
FROM point_lot
WHERE create_date &gt;= #{createDate_begin} AND create_date &lt; #{createDate_end}
  AND (#{clientId} IS NULL OR client_id = #{clientId})
  AND (#{sourceType} IS NULL OR source_type = #{sourceType})
  AND ( #{status} IS NULL
     OR (#{status} = 'valid'   AND point_balance &gt; 0  AND (point_expiration_time IS NULL OR point_expiration_time &gt; UTC_TIMESTAMP()))
     OR (#{status} = 'used'    AND point_balance = 0  AND (point_expiration_time IS NULL OR point_expiration_time &gt; UTC_TIMESTAMP()))
     OR (#{status} = 'expired' AND point_expiration_time &lt;= UTC_TIMESTAMP()) )
  AND client_id IN (/* SCOPE_SQL of program */)
ORDER BY create_date DESC, id DESC
LIMIT #{offset}, #{pageSize};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": { "total": 1, "records": [{
    "id": 262400, "clientId": 72000101, "taskLogTable": "manual_adjust", "taskLogId": 1848213470001, "sourceType": 2,
    "sourceName": "adjust", "pointEarned": 100, "pointBalance": 100, "pointExpirationTime": "2027-04-19 16:59:59",
    "cashValuePerPointUnit": 0.0000, "status": "valid", "archiveAt": null,
    "createDate": "2026-10-21 03:00:00", "createUser": "admin01", "updateDate": "2026-10-21 03:00:00" }] }
}</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Status must be valid, used or expired.</code></td><td></td></tr><tr><td><code>Date range must be at most {n} days.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Lưu ý</h4><p>Lưu ý cho FE: app khách hàng đếm số dư chỉ trên lô có hạn (<code>point_expiration_time &gt; now</code>), trong khi trừ coin (đổi quà, trừ tay) dùng cả lô hạn NULL. Hiện mọi đường tạo lô đều ghi hạn, nên lô NULL không xuất hiện; nếu thấy thì là dữ liệu bất thường.</p></div></div><div class="specsrc" id="spec-k3" data-title="K3 · /point/admin/coin/adjust"><p class="specmeta"><code>POST</code> · <code>/point/admin/coin/adjust</code></p><p>Cộng / trừ coin thủ công cho 1 khách thuộc program (modal Adjust Balance). Bản cho Smart CRM của <code>POST /point/pointAdjust</code>.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>Có</td><td>Program phải tồn tại.</td></tr><tr><td><code>clientId</code></td><td>long</td><td>Có</td><td>Khách tồn tại (<code>crm_customer_base</code>, <code>deleted = 0</code>) và thuộc program (tab Tổng quan, phạm vi khách của program).</td></tr><tr><td><code>point</code></td><td>long</td><td>Có</td><td>Khác 0. Dương = cộng, âm = trừ. |point| ≤ 100.000 (đã chốt).</td></tr><tr><td><code>expireDays</code></td><td>int</td><td>Không</td><td>1 … 7300, mặc định 180 khi không gửi. Chỉ dùng khi cộng (<code>point &gt; 0</code>); khi trừ thì bỏ qua (không báo lỗi). Cách tính hạn ở bước 4.</td></tr><tr><td><code>remark</code></td><td>string</td><td>Có</td><td>Lý do. Trim, 5–255 ký tự.</td></tr><tr><td><code>requestId</code></td><td>string</td><td>Có</td><td>UUID FE sinh 1 lần khi mở modal, giữ nguyên khi bấm lại. 1–64 ký tự (vừa cột <code>external_id</code>).</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds">
<li>Validate. Kiểm khách thuộc program.</li>
<li>Khoá Redis theo khách như API cũ (<code>point:manual:client:{clientId}</code>, không chờ, lease 30 giây). Không lấy được → "Another adjustment is in progress".</li>
<li><b>Chống bấm 2 lần</b>: nếu đã có dòng <code>point_ledger</code> với <code>external_system = 'smart_crm'</code>, <code>external_id = requestId</code> → trả lại kết quả lần trước (<code>duplicated = true</code>), không ghi gì thêm. Dùng index sẵn có <code>idx_ledger_external</code>. Khoá Redis chỉ chặn 2 request <i>cùng lúc</i>; requestId chặn cả bấm lại sau khi request đầu đã xong.</li>
<li>Gọi đúng logic <code>ManualPointServiceImpl</code> hiện có, thêm 3 giá trị ghi vào mọi dòng <code>point_ledger</code> sinh ra: <code>external_system = 'smart_crm'</code>, <code>external_id = requestId</code>, <code>remark</code>. <code>create_user</code> = user đăng nhập. <ul class="rules">
  <li><b>Cộng</b>: tạo 1 lô mới <code>task_log_table = 'manual_adjust'</code>, <code>source_type = 2</code>, 1 dòng sổ <code>type = 5</code>. <b>Hạn lô = 23:59:59 GMT+7 của (ngày cộng theo GMT+7 + <code>expireDays</code>)</b>, lưu UTC (tức 16:59:59 UTC). Làm giống engine trading (hạn chốt 23:59:59 theo múi giờ task, <code>PointTaskTradingLogServiceImpl</code>); lô cộng tay không thuộc task nào nên dùng GMT+7, đúng múi giờ mặc định các API coin của app dùng để hiển thị (<code>PROGRAM_TZ_MINUTES = 420</code>). Ví dụ: cộng lúc <code>2026-10-21 03:00:00</code> UTC (10:00 GMT+7), <code>expireDays = 180</code> → ngày 2027-04-19 → <code>point_expiration_time = 2027-04-19 16:59:59</code> UTC. Code hiện tại tính <code>now + 180 days</code> (không chốt cuối ngày, số ngày lấy từ cấu hình <code>point.manual-adjust.expire-days</code>): cần sửa theo DEV-08. Cập nhật snapshot (<code>coin_balance</code> tăng, <code>coin_lifetime</code> <b>không</b> tăng).</li>
  <li><b>Trừ</b>: trừ dần trên các lô còn hạn, hạn gần nhất trước (khoá dòng <code>FOR UPDATE</code>), mỗi lô 1 dòng sổ <code>type = 6</code>. Trừ quá số dư còn hạn → lỗi, không trừ gì (không cho số dư âm). Cập nhật snapshot.</li>
  </ul></li>
<li>Trả số dư sau điều chỉnh.</li></ol><pre>-- 1) client belongs to program
SELECT 1 FROM crm_customer_base c
WHERE c.client_id = #{clientId} AND c.deleted = 0
  AND c.group_code IN (SELECT client_group FROM promo_client_group
                       WHERE promo_table = 'point_program' AND promo_config_id = #{programId})
LIMIT 1;

-- 2) idempotency
SELECT id, point_amount, point_balance_after FROM point_ledger
WHERE external_system = 'smart_crm' AND external_id = #{requestId};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "",
  "result": { "clientId": 72000101, "point": -150, "balanceBefore": 3860, "balance": 3710,
              "expirationTime": null, "duplicated": false } }

// add (point &gt; 0): expirationTime = expiry of the new lot, UTC
{ "success": true, "code": 200, "message": "",
  "result": { "clientId": 72000101, "point": 100, "balanceBefore": 3760, "balance": 3860,
              "expirationTime": "2027-04-19 16:59:59", "duplicated": false } }</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Client does not exist.</code></td><td></td></tr><tr><td><code>Client does not belong to this program.</code></td><td></td></tr><tr><td><code>Points must not be 0.</code></td><td></td></tr><tr><td><code>Points must be between -100,000 and 100,000.</code></td><td></td></tr><tr><td><code>Expire days must be between 1 and 7300.</code></td><td>chỉ kiểm khi cộng</td></tr><tr><td><code>Remark is required (5-255 characters).</code></td><td></td></tr><tr><td><code>Request ID is required.</code></td><td></td></tr><tr><td><code>Another adjustment for this client is in progress. Please retry.</code></td><td>khoá Redis</td></tr><tr><td><code>Insufficient coins: balance {balance}, requested {point}.</code></td><td>trừ quá số dư</td></tr></table></div><div class="specsec"><h4>5. Lưu ý</h4><p><b>Cần developer làm thêm</b> DEV-07 thêm cột <code>point_ledger.remark</code>; DEV-08 cho <code>ManualPointService</code> nhận <code>remark</code>, <code>externalSystem</code>, <code>externalId</code>. Không cần "kiểm program đang mở": điều chỉnh tay vẫn cần làm được khi program đã tắt (bù cho khách cũ); chỉ cần khách thuộc program.</p>
<p>Hạn coin cộng tay do người thao tác chọn (<code>expireDays</code>, mặc định 180), độc lập với hạn coin của task trong program.</p></div></div><div class="specsrc" id="spec-k4" data-title="K4 · /point/admin/coin/balance"><p class="specmeta"><code>GET</code> · <code>/point/admin/coin/balance</code></p><p>Số dư hiện tại của 1 khách (hiện trong modal Adjust Balance trước khi lưu).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>Có</td><td>Program phải tồn tại.</td></tr><tr><td><code>clientId</code></td><td>long</td><td>Có</td><td>Như K3.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Kiểm khách thuộc program.</li>
<li><code>balance</code>: tính trực tiếp từ <code>point_lot</code> (nguồn đúng, cùng điều kiện mà trừ coin dùng). <code>snapshotBalance</code>: đọc <code>point_client_coin_snapshot.coin_balance</code> (nguồn API đổi quà dùng). Hai số lệch → trả <code>snapshotMismatch = true</code> để FE cảnh báo; job đối soát hằng ngày sẽ báo về Telegram.</li>
<li>Kèm <code>expiringIn10Days</code> (như app) và <code>lifetime</code> (<code>coin_lifetime</code>).</li></ol><pre>SELECT COALESCE(SUM(point_balance), 0) AS balance,
       COALESCE(SUM(CASE WHEN point_expiration_time &lt;= UTC_TIMESTAMP() + INTERVAL 10 DAY THEN point_balance END), 0) AS expiring_in_10_days
FROM point_lot
WHERE client_id = #{clientId} AND point_balance &gt; 0
  AND (point_expiration_time IS NULL OR point_expiration_time &gt; UTC_TIMESTAMP());

SELECT coin_balance, coin_lifetime FROM point_client_coin_snapshot WHERE client_id = #{clientId};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "",
  "result": { "clientId": 72000101, "balance": 3860, "expiringIn10Days": 200, "snapshotBalance": 3860,
              "snapshotMismatch": false, "lifetime": 4180 } }</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Client does not exist.</code></td><td></td></tr><tr><td><code>Client does not belong to this program.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Lưu ý</h4><p>Chưa có dòng snapshot (khách chưa từng có coin) → <code>snapshotBalance = 0</code>, <code>lifetime = 0</code>.</p></div></div><div class="specsrc" id="spec-g1" data-title="G1 · /point/admin/gift/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/gift/list</code></p><p>Danh sách quà của 1 program (tab Gift List (S2)), sắp theo sort_order.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>Có</td><td>Program phải tồn tại. Lọc đúng <code>point_featured_gift.program_id</code>.</td></tr><tr><td><code>giftName</code></td><td>string</td><td>Không</td><td>Lọc <code>LIKE %x%</code> trên <code>gift_name</code>, đã trim.</td></tr><tr><td><code>category</code></td><td>string</td><td>Không</td><td>Khớp đúng <code>gift_category</code>: <code>e_wallet</code> / <code>voucher</code> / <code>physical</code>. Giá trị khác → lỗi.</td></tr><tr><td><code>enabled</code></td><td>int</td><td>Không</td><td><code>1</code> đang dùng / <code>0</code> đã tắt.</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>Không</td><td>Mặc định 1.</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>Không</td><td>Mặc định 10, tối đa 100.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Validate tham số; kiểm program tồn tại.</li>
<li>Chạy query bên dưới (đếm <code>total</code> cùng điều kiện). Sắp <code>sort_order ASC, point_price ASC, id ASC</code> (trùng <code>sort_order</code> thì theo giá rồi id — RI khớp index <code>idx_program_dashboard</code>).</li>
<li>Datetime trả UTC đúng giá trị DB (Q3).</li></ol><pre>SELECT g.id, g.gift_name, g.gift_short_name, g.gift_description, g.gift_category,
       g.point_price, g.cash_value, g.gift_image_url, g.external_item_id, g.badge,
       g.sort_order, g.show_on_dashboard, g.use_in_notification,
       g.display_from, g.display_to, g.enabled, g.remark,
       g.create_user, g.create_date, g.update_user, g.update_date
FROM point_featured_gift g
WHERE g.program_id = #{programId}
  AND (#{giftName} IS NULL OR g.gift_name LIKE CONCAT('%', #{giftName}, '%'))
  AND (#{category} IS NULL OR g.gift_category = #{category})
  AND (#{enabled}  IS NULL OR g.enabled = #{enabled})
ORDER BY g.sort_order ASC, g.point_price ASC, g.id ASC
LIMIT #{offset}, #{pageSize};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": {
    "total": 1,
    "records": [{
      "id": 1, "giftName": "Saldo GoPay Rp50.000", "giftShortName": "GoPay 50k",
      "giftDescription": "Saldo GoPay langsung masuk", "giftCategory": "e_wallet",
      "pointPrice": 500, "cashValue": 50000.00, "giftImageUrl": "https://cdn.hsb.co.id/loyalty/gift/gopay-50k.png",
      "externalItemId": "TADA-GOPAY-50", "badge": "hot", "sortOrder": 1,
      "showOnDashboard": 1, "useInNotification": 1,
      "displayFrom": null, "displayTo": null, "enabled": 1, "remark": "Reconciled with TADA 2026-10-20",
      "createUser": "admin01", "createDate": "2026-10-20 08:15:00", "updateUser": null, "updateDate": null
    }]
  }
}</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Invalid gift category.</code></td><td>category lọc sai giá trị</td></tr></table></div><div class="specsec"><h4>5. Lưu ý</h4><p><code>cash_value</code> là giá trị nội bộ (IDR), chỉ hiện trong Smart CRM (admin), không bao giờ đẩy ra app khách. Xem quy tắc che ở <a href="#rules" class="ref">tab Quy tắc</a>.</p></div></div><div class="specsrc" id="spec-g2" data-title="G2 · /point/admin/gift/save"><p class="specmeta"><code>POST</code> · <code>/point/admin/gift/save</code></p><p>Tạo (không có id) hoặc sửa (có id) 1 quà. Program không đổi khi sửa.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>Khi sửa</td><td>Quà phải tồn tại.</td></tr><tr><td><code>programId</code></td><td>long</td><td>Khi tạo</td><td>Program phải tồn tại. Khi sửa: bỏ qua; gửi khác program hiện tại → lỗi.</td></tr><tr><td><code>giftName</code></td><td>string</td><td>Có</td><td>Trim, 1–128 ký tự (<code>varchar(128) NOT NULL</code>).</td></tr><tr><td><code>giftShortName</code></td><td>string</td><td>Có</td><td>Trim, 1–32 ký tự (<code>varchar(32) NOT NULL</code>). Khuyến nghị ≤ 25 để push không bị cắt.</td></tr><tr><td><code>giftDescription</code></td><td>string</td><td>Không</td><td>≤ 255 ký tự (<code>varchar(255) NOT NULL DEFAULT ''</code>). Rỗng → <code>''</code>.</td></tr><tr><td><code>giftCategory</code></td><td>string</td><td>Có</td><td>Thuộc danh sách: <code>e_wallet</code> / <code>voucher</code> / <code>physical</code>. ≤ 32 ký tự.</td></tr><tr><td><code>pointPrice</code></td><td>long</td><td>Có</td><td>Nguyên &gt; 0 (<code>bigint NOT NULL</code>). Phải khớp giá TADA (RI1); không kiểm tự động (TADA không có API catalog phía server), chỉ cảnh báo khi sửa.</td></tr><tr><td><code>cashValue</code></td><td>decimal</td><td>Không</td><td>≥ 0, tối đa 2 chữ số thập phân (<code>decimal(18,2)</code>). Giá trị nội bộ (IDR).</td></tr><tr><td><code>giftImageUrl</code></td><td>string</td><td>Không</td><td>≤ 512 ký tự. Nếu có: URL <code>https</code> công khai (không cần login), host trên server ảnh HSB để link không đổi. Rỗng → email không kèm ảnh.</td></tr><tr><td><code>externalItemId</code></td><td>string</td><td>Có khi enabled=1</td><td>≤ 64 ký tự. ID quà trên TADA, dùng để đối soát giá. Đề xuất bắt buộc khi bật (RI1).</td></tr><tr><td><code>badge</code></td><td>string</td><td>Không</td><td>Rỗng, <code>hot</code> hoặc <code>new</code> (≤ 16 ký tự). App tự dịch sang tiếng Indo.</td></tr><tr><td><code>sortOrder</code></td><td>int</td><td>Không</td><td>Nguyên ≥ 0 (mặc định 0). Trùng nhau → sắp theo <code>point_price</code>; không lỗi.</td></tr><tr><td><code>showOnDashboard</code></td><td>int</td><td>Có</td><td>0 / 1.</td></tr><tr><td><code>useInNotification</code></td><td>int</td><td>Có</td><td>0 / 1.</td></tr><tr><td><code>displayFrom</code></td><td>datetime UTC</td><td>Không</td><td><code>yyyy-MM-dd HH:mm:ss</code> UTC. Rỗng = không giới hạn.</td></tr><tr><td><code>displayTo</code></td><td>datetime UTC</td><td>Không</td><td>&gt; <code>displayFrom</code> nếu cả hai có. Rỗng = không giới hạn.</td></tr><tr><td><code>remark</code></td><td>string</td><td>Không</td><td>≤ 255 ký tự.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Validate theo <a href="#rules" class="ref">tab Quy tắc</a> (GV01–GV09). Gom mọi lỗi field, trả lỗi đầu ở <code>message</code> và toàn bộ ở <code>result.errors</code> để FE tô đỏ từng ô (Q7/1.5).</li>
<li>Bỏ qua mọi field không nằm trong danh sách. <code>enabled</code> không nhận từ FE.</li>
<li><b>Tạo</b>: INSERT với <code>enabled = 0</code> (quà mới luôn tắt; admin xem lại rồi bật bằng G3). <code>create_user</code> = user đăng nhập, <code>create_date = UTC_TIMESTAMP()</code>.</li>
<li><b>Sửa</b>: UPDATE các field trên; KHÔNG đổi <code>program_id</code> và <code>enabled</code>. Nếu quà đã có người đổi và đổi <code>point_price</code>/<code>external_item_id</code> → cảnh báo (<a href="#locks" class="ref">tab Khoá khi đang chạy</a>.</li></ol><pre>INSERT INTO point_featured_gift
  (program_id, gift_name, gift_short_name, gift_description, gift_category, point_price, cash_value,
   gift_image_url, external_item_id, badge, sort_order, show_on_dashboard, use_in_notification,
   display_from, display_to, enabled, remark, create_date, create_user)
VALUES (#{programId}, #{giftName}, #{giftShortName}, IFNULL(#{giftDescription}, ''), #{giftCategory},
        #{pointPrice}, #{cashValue}, IFNULL(#{giftImageUrl}, ''), IFNULL(#{externalItemId}, ''),
        IFNULL(#{badge}, ''), IFNULL(#{sortOrder}, 0), #{showOnDashboard}, #{useInNotification},
        #{displayFrom}, #{displayTo}, 0, IFNULL(#{remark}, ''), UTC_TIMESTAMP(), #{currentUser});

UPDATE point_featured_gift
SET gift_name = #{giftName}, gift_short_name = #{giftShortName}, gift_description = IFNULL(#{giftDescription}, ''),
    gift_category = #{giftCategory}, point_price = #{pointPrice}, cash_value = #{cashValue},
    gift_image_url = IFNULL(#{giftImageUrl}, ''), external_item_id = IFNULL(#{externalItemId}, ''),
    badge = IFNULL(#{badge}, ''), sort_order = IFNULL(#{sortOrder}, 0),
    show_on_dashboard = #{showOnDashboard}, use_in_notification = #{useInNotification},
    display_from = #{displayFrom}, display_to = #{displayTo}, remark = IFNULL(#{remark}, ''),
    update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE id = #{id};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": { "id": 2, "enabled": 0 } }

// validation failure
{ "success": false, "code": 500, "message": "Gift short name must be at most 32 characters.",
  "result": { "errors": [
    { "field": "giftShortName", "message": "Gift short name must be at most 32 characters." },
    { "field": "pointPrice", "message": "Point price must be greater than 0." } ] } }</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Gift does not exist.</code></td><td>khi sửa</td></tr><tr><td><code>Gift cannot be moved to another program.</code></td><td>programId khác khi sửa</td></tr><tr><td><code>Gift name is required.</code></td><td></td></tr><tr><td><code>Gift name must be at most 128 characters.</code></td><td></td></tr><tr><td><code>Gift short name is required.</code></td><td></td></tr><tr><td><code>Gift short name must be at most 32 characters.</code></td><td></td></tr><tr><td><code>Gift description must be at most 255 characters.</code></td><td></td></tr><tr><td><code>Invalid gift category.</code></td><td></td></tr><tr><td><code>Point price must be greater than 0.</code></td><td></td></tr><tr><td><code>Cash value must be 0 or greater.</code></td><td></td></tr><tr><td><code>Image URL must be a public https link.</code></td><td></td></tr><tr><td><code>Image URL must be at most 512 characters.</code></td><td></td></tr><tr><td><code>External item id is required when the gift is enabled.</code></td><td></td></tr><tr><td><code>External item id must be at most 64 characters.</code></td><td></td></tr><tr><td><code>Invalid badge.</code></td><td>chỉ '' / hot / new</td></tr><tr><td><code>Sort order must be 0 or greater.</code></td><td></td></tr><tr><td><code>display_from must be earlier than display_to.</code></td><td></td></tr><tr><td><code>Show on dashboard must be 0 or 1.</code></td><td></td></tr><tr><td><code>Use in notification must be 0 or 1.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Lưu ý</h4><p>Quà mới tạo ở trạng thái tắt nên G3 là cửa duy nhất đưa quà lên dashboard. DB mặc định <code>enabled = 1</code> nhưng API ghi đè 0 lúc tạo cho an toàn.</p></div></div><div class="specsrc" id="spec-g3" data-title="G3 · /point/admin/gift/enable"><p class="specmeta"><code>POST</code> · <code>/point/admin/gift/enable</code></p><p>Bật/tắt 1 quà (switch trên tab Gift List).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>Có</td><td>Quà phải tồn tại.</td></tr><tr><td><code>enabled</code></td><td>int</td><td>Có</td><td>0 / 1.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Kiểm quà tồn tại.</li>
<li>Khi bật (<code>enabled = 1</code>): yêu cầu <code>external_item_id</code> không rỗng (RI1 — có ID để đối soát giá TADA). Rỗng → lỗi.</li>
<li>UPDATE <code>enabled</code>, <code>update_user</code>, <code>update_date = UTC_TIMESTAMP()</code>.</li></ol>
<p>Không có API xoá: <code>enabled = 0</code> là cách gỡ quà khỏi dashboard + message. <code>enabled</code> ưu tiên hơn mọi field hiển thị khác.</p><pre>UPDATE point_featured_gift
SET enabled = #{enabled}, update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE id = #{id};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": null }</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Gift does not exist.</code></td><td></td></tr><tr><td><code>Enabled must be 0 or 1.</code></td><td></td></tr><tr><td><code>External item id is required before enabling this gift.</code></td><td>RI1</td></tr></table></div></div><div class="specsrc" id="spec-r1" data-title="R1 · /point/admin/redemption/order/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/redemption/order/list</code></p><p>Danh sách đơn đổi quà (point_redemption_order) của khách thuộc 1 program. Chỉ đọc.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>Có</td><td>Program phải có client group (RI2).</td></tr><tr><td><code>clientId</code></td><td>long</td><td>Không</td><td>Khớp đúng.</td></tr><tr><td><code>orderReference</code></td><td>string</td><td>Không</td><td>Khớp đúng mã đơn.</td></tr><tr><td><code>status</code></td><td>string</td><td>Không</td><td><code>new</code> / <code>on process</code> / <code>completed</code> / <code>canceled</code> / <code>failed</code>.</td></tr><tr><td><code>createDate_begin</code></td><td>string</td><td>Không</td><td><code>yyyy-MM-dd HH:mm:ss</code> UTC.</td></tr><tr><td><code>createDate_end</code></td><td>string</td><td>Không</td><td>UTC, không tính mốc này (<code>&lt;</code>).</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>Không</td><td>Mặc định 1.</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>Không</td><td>Mặc định 10, tối đa 100.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Lấy client group của program: <code>SELECT client_group FROM promo_client_group WHERE promo_table = 'point_program' AND promo_config_id = ?</code>. Không có → trả rỗng.</li>
<li>Query bên dưới; JOIN <code>crm_customer_base</code> để giới hạn khách thuộc group (RI2). <code>o.client_id</code> là <code>varchar</code> → CAST khi JOIN (RI6).</li>
  <li>Trả <code>orderDate</code> từ cột <code>order_date</code> (CỘT MỚI) = thời điểm đặt đơn (trxDate từ response TADA), khác <code>create_date</code> (lần đầu HSB sync) và <code>last_status_at</code> (đổi trạng thái gần nhất).</li>
<li><b>Che dữ liệu nhạy cảm trước khi trả</b> (4.3): KHÔNG trả <code>raw_payload</code>. <code>order_items</code> rút gọn thành mảng <code>{itemName, itemType, quantity, status}</code> — <b>che mã e-voucher/PIN và token PLN</b>. <code>recipient</code> chỉ trả tên (che bớt) + thành phố, không trả địa chỉ/điện thoại đầy đủ ở danh sách. <code>fees</code> (tiền IDR) <b>hiển thị bình thường</b> cho người dùng Smart CRM (công cụ nội bộ — đã chốt); không ra app khách.</li>
<li>Sắp <code>create_date DESC, id DESC</code>.</li></ol><pre>SELECT o.id, o.order_reference, o.order_number, o.client_id, o.status,
       o.order_items, o.recipient, o.fees, o.order_date, o.last_status_at, o.create_date, o.update_date
FROM point_redemption_order o
JOIN crm_customer_base c ON c.client_id = CAST(o.client_id AS UNSIGNED)
WHERE o.external_system = 'tada'
  AND c.deleted = 0
  AND c.group_code = (SELECT client_group FROM promo_client_group
                      WHERE promo_table = 'point_program' AND promo_config_id = #{programId} LIMIT 1)
  AND (#{clientId}       IS NULL OR o.client_id = #{clientId})
  AND (#{orderReference} IS NULL OR o.order_reference = #{orderReference})
  AND (#{status}         IS NULL OR o.status = #{status})
  AND (#{createDateBegin} IS NULL OR o.create_date &gt;= #{createDateBegin})
  AND (#{createDateEnd}   IS NULL OR o.create_date &lt;  #{createDateEnd})
ORDER BY o.create_date DESC, o.id DESC
LIMIT #{offset}, #{pageSize};
-- raw_payload is intentionally NOT selected (raw webhook payload, sensitive).</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": {
    "total": 1,
    "records": [{
      "id": 10, "orderReference": "CI23062210514901613152", "orderNumber": "TADA18102908185099",
      "clientId": "7209001", "status": "on process",
      "items": [ { "itemName": "Logam Mulia UBS 1 Gram", "itemType": "physical", "quantity": 1, "status": "on process" } ],
      "recipient": { "name": "Jo***", "city": "Jakarta" },
      "fees": [ { "name": "Shipping", "amount": 20000 } ],
      "orderDate": "2026-06-22 10:51:50",
      "lastStatusAt": "2026-10-20 03:12:05", "createDate": "2026-10-20 03:00:00", "updateDate": "2026-10-20 03:12:05"
    }]
  }
}</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Program has no client group.</code></td><td>RI2</td></tr><tr><td><code>Order status is invalid.</code></td><td>status lọc sai</td></tr></table></div><div class="specsec"><h4>5. Lưu ý</h4><p>API chi tiết order (địa chỉ giao đầy đủ, mã voucher) <b>chưa cần ở phase này</b> (Smart CRM chốt). Khi làm vẫn che mã/PIN/token + log truy cập.</p></div></div><div class="specsrc" id="spec-r2" data-title="R2 · /point/admin/redemption/transaction/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/redemption/transaction/list</code></p><p>Danh sách giao dịch trừ/hoàn coin (point_redemption_transaction) của khách thuộc 1 program. Chỉ đọc.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>Có</td><td>Program phải có client group.</td></tr><tr><td><code>clientId</code></td><td>long</td><td>Không</td><td>Khớp đúng.</td></tr><tr><td><code>orderReference</code></td><td>string</td><td>Không</td><td>Khớp đúng.</td></tr><tr><td><code>status</code></td><td>int</td><td>Không</td><td><code>1</code> đã trừ / <code>2</code> đã hoàn.</td></tr><tr><td><code>reconciled</code></td><td>int</td><td>Không</td><td><code>0</code> chưa đối soát / <code>1</code> chờ người kiểm / <code>2</code> đã đối soát (RI5).</td></tr><tr><td><code>createDate_begin</code></td><td>string</td><td>Không</td><td>UTC.</td></tr><tr><td><code>createDate_end</code></td><td>string</td><td>Không</td><td>UTC, <code>&lt;</code>.</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>Không</td><td>Mặc định 1.</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>Không</td><td>Mặc định 10, tối đa 100.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Lấy client group của program như R1.</li>
<li>Query bên dưới; JOIN <code>crm_customer_base</code> theo <code>client_id</code> (ở đây là <code>bigint</code>, không cần CAST).</li>
<li><b>Che</b> (4.3): KHÔNG trả <code>raw_request</code>, <code>raw_response</code>. <code>idr_amount</code> (tiền IDR) <b>hiển thị bình thường</b> cho người dùng Smart CRM (nội bộ — đã chốt); không ra app khách.</li>
<li>Trả thêm <code>reconcile_user</code>, <code>reconcile_remark</code>, <code>reconcile_date</code> (3 CỘT MỚI) để FE hiện ai đã kiểm (xem R5).</li>
<li>Sắp <code>create_date DESC, id DESC</code>.</li></ol><pre>SELECT t.id, t.order_reference, t.client_id, t.trx_id, t.coin_amount, t.idr_amount,
       t.status, t.reconciled, t.redeem_date, t.void_trx_id, t.void_date, t.fail_reason,
       t.reconcile_user, t.reconcile_remark, t.reconcile_date,   -- 3 NEW columns (R5, DEV-09)
       t.create_date, t.update_date
FROM point_redemption_transaction t
JOIN crm_customer_base c ON c.client_id = t.client_id
WHERE t.external_system = 'tada'
  AND c.deleted = 0
  AND c.group_code = (SELECT client_group FROM promo_client_group
                      WHERE promo_table = 'point_program' AND promo_config_id = #{programId} LIMIT 1)
  AND (#{clientId}        IS NULL OR t.client_id = #{clientId})
  AND (#{orderReference}  IS NULL OR t.order_reference = #{orderReference})
  AND (#{status}          IS NULL OR t.status = #{status})
  AND (#{reconciled}      IS NULL OR t.reconciled = #{reconciled})
  AND (#{createDateBegin} IS NULL OR t.create_date &gt;= #{createDateBegin})
  AND (#{createDateEnd}   IS NULL OR t.create_date &lt;  #{createDateEnd})
ORDER BY t.create_date DESC, t.id DESC
LIMIT #{offset}, #{pageSize};
-- raw_request / raw_response are intentionally NOT selected (raw payload, sensitive).</pre></div><div class="specsec"><h4>3. Response</h4><pre>{

      "createDate": "2026-10-21 03:00:00", "updateDate": "2026-10-21 09:32:36"
    }]

}</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Program has no client group.</code></td><td></td></tr><tr><td><code>Status must be 1 or 2.</code></td><td></td></tr><tr><td><code>Reconciled must be 0, 1 or 2.</code></td><td>RI5</td></tr></table></div><div class="specsec"><h4>5. Lưu ý</h4><p>Giao dịch bị từ chối (thiếu dư, blacklist, vượt hạn...) <b>không lưu</b> vào bảng (engine xóa dòng), nên bảng này chỉ có đơn đã trừ/hoàn thành công.</p></div></div><div class="specsrc" id="spec-r3" data-title="R3 · /point/admin/redemption/blacklist/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/redemption/blacklist/list</code></p><p>Danh sách blacklist redeem của khách thuộc 1 program (cả enabled 0 và 1).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>Có</td><td>Program phải có client group.</td></tr><tr><td><code>clientId</code></td><td>long</td><td>Không</td><td>Khớp đúng.</td></tr><tr><td><code>enabled</code></td><td>int</td><td>Không</td><td><code>1</code> Blacklisted, <code>0</code> Whitelisted.</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>Không</td><td>Mặc định 1.</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>Không</td><td>Mặc định 10, tối đa 100.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Lấy client group của program.</li>
<li>Lọc đúng dòng redeem toàn cục (<code>promo_table = 'point_redemption_transaction'</code>, <code>promo_config_id = 0</code>, <code>point_task_bundle_id = 0</code>), JOIN <code>crm_customer_base</code> giới hạn khách của program.</li>
<li>Sắp <code>update_date DESC, id DESC</code>.</li></ol>
<p><b>Lưu ý UI (RI3):</b> dòng này chặn khách đổi quà ở MỌI program. FE phải nói rõ "chặn toàn hệ thống", không phải chỉ program này.</p><pre>SELECT bl.id, bl.client_id, bl.enabled, bl.remark,
       bl.create_user, bl.create_date, bl.update_user, bl.update_date
FROM client_promotion_blacklist bl
JOIN crm_customer_base c ON c.client_id = bl.client_id
WHERE bl.promo_table = 'point_redemption_transaction'
  AND bl.promo_config_id = 0 AND bl.point_task_bundle_id = 0
  AND c.deleted = 0
  AND c.group_code = (SELECT client_group FROM promo_client_group
                      WHERE promo_table = 'point_program' AND promo_config_id = #{programId} LIMIT 1)
  AND (#{clientId} IS NULL OR bl.client_id = #{clientId})
  AND (#{enabled}  IS NULL OR bl.enabled = #{enabled})
ORDER BY bl.update_date DESC, bl.id DESC
LIMIT #{offset}, #{pageSize};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{

    "total": 1,

                  "updateUser": "admin01", "updateDate": "2026-10-21 03:00:00" }]

}</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Program has no client group.</code></td><td></td></tr><tr><td><code>Enabled must be 0 or 1.</code></td><td></td></tr></table></div></div><div class="specsrc" id="spec-r4" data-title="R4 · /point/admin/redemption/blacklist/save"><p class="specmeta"><code>POST</code> · <code>/point/admin/redemption/blacklist/save</code></p><p>Thêm khách vào blacklist redeem, hoặc đổi Blacklisted ↔ Whitelisted (chặn toàn cục).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>Có</td><td>Dùng để kiểm khách thuộc program khi THÊM mới.</td></tr><tr><td><code>clientId</code></td><td>long</td><td>Có</td><td>Số dương.</td></tr><tr><td><code>enabled</code></td><td>int</td><td>Có</td><td><code>1</code> blacklist, <code>0</code> whitelist.</td></tr><tr><td><code>remark</code></td><td>string</td><td>Không</td><td>Trim, ≤ 120 ký tự (<code>varchar(120) NOT NULL</code>). Thêm mới không gửi → <code>''</code>; đổi trạng thái: có gửi thì ghi đè, không gửi giữ cũ.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Lấy client group của program.</li>
<li>Mở transaction: <code>SELECT id, enabled FROM client_promotion_blacklist WHERE client_id = ? AND promo_table = 'point_redemption_transaction' AND promo_config_id = 0 AND point_task_bundle_id = 0 FOR UPDATE</code>.</li>
<li><b>Đã có dòng</b> → UPDATE <code>enabled</code>, <code>remark</code>, <code>update_user</code>, <code>update_date</code>. Không kiểm group (cho whitelist khách đã đổi group).</li>
<li><b>Chưa có dòng</b>: <code>enabled = 0</code> → lỗi (không có gì để whitelist). Ngược lại kiểm khách tồn tại + thuộc client group của program (2.3/RI2), rồi INSERT: <code>promotion_code = ''</code> (NOT NULL), <code>promo_config_id = 0</code>, <code>point_task_bundle_id = 0</code>, <code>enabled = 1</code>, remark, ghi <code>create/update_user</code> + <code>UTC_TIMESTAMP()</code>. Trùng <code>uk_client_promo_bundle</code> (2 admin cùng lúc) → bắt DuplicateKey, đọc lại và UPDATE.</li>
<li>Có hiệu lực ngay ở lần gọi API kế của khách (engine không cache blacklist).</li></ol><pre>SELECT client_id FROM crm_customer_base
WHERE client_id = #{clientId} AND deleted = 0
  AND group_code = (SELECT client_group FROM promo_client_group
                    WHERE promo_table = 'point_program' AND promo_config_id = #{programId} LIMIT 1);

INSERT INTO client_promotion_blacklist
  (client_id, promotion_code, promo_table, promo_config_id, point_task_bundle_id, enabled, remark,
   create_date, create_user, update_date, update_user)
VALUES (#{clientId}, '', 'point_redemption_transaction', 0, 0, 1, IFNULL(#{remark}, ''),
        UTC_TIMESTAMP(), #{currentUser}, UTC_TIMESTAMP(), #{currentUser});

UPDATE client_promotion_blacklist
SET enabled = #{enabled}, remark = IFNULL(#{remark}, remark),
    update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE id = #{id};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": { "id": 9001, "enabled": 1 } }</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Client ID does not exist.</code></td><td></td></tr><tr><td><code>Client {clientId} does not belong to client group {group} of this program.</code></td><td>RI2</td></tr><tr><td><code>Client {clientId} is not on the redeem blacklist.</code></td><td>whitelist khi chưa có dòng</td></tr><tr><td><code>Remark must be at most 120 characters.</code></td><td></td></tr><tr><td><code>Enabled must be 0 or 1.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Lưu ý</h4><p>Khớp DDL thật trên UAT. Dòng redeem dùng <code>promo_config_id = 0</code>, <code>point_task_bundle_id = 0</code> (không NULL) nên <code>uk_client_promo_bundle</code> chặn trùng được. Khác hẳn blacklist theo bundle của nhóm Check-in (<code>promo_table = 'point_program'</code>).</p></div></div><div class="specsrc" id="spec-r5" data-title="R5 · /point/admin/redemption/transaction/reconcile"><p class="specmeta"><code>POST</code> · <code>/point/admin/redemption/transaction/reconcile</code></p><p>Đánh dấu 1 giao dịch 'đã kiểm tay' (reconciled 1 → 2). Trả lời 4.1.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>Có</td><td>Giao dịch phải tồn tại, đang <code>status = 1</code> và <code>reconciled = 1</code>.</td></tr><tr><td><code>remark</code></td><td>string</td><td>Có</td><td>Trim, 5–255 ký tự. Ghi chú người kiểm (bắt buộc, giống điều chỉnh coin K3 của nhóm Trading).</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Kiểm giao dịch tồn tại, <code>status = 1</code>, <code>reconciled = 1</code> (chỉ đơn job đã cảnh báo cần người kiểm mới cho đánh dấu).</li>
<li>Validate <code>remark</code>: bắt buộc, 5–255 ký tự.</li>
<li>UPDATE có điều kiện (chốt chặn: chỉ đổi khi còn <code>reconciled = 1</code>): set <code>reconciled = 2</code> và ghi người kiểm / ghi chú / thời điểm vào 3 cột MỚI <code>reconcile_user</code>, <code>reconcile_remark</code>, <code>reconcile_date</code> (Smart CRM đã yêu cầu developer thêm 3 cột này).</li></ol>
<p>Không cho đổi <code>0 → 2</code> (job tự xử) hay đụng <code>2</code>. Đây là thao tác tay bù cho đơn mồ côi (#16): job chỉ cảnh báo và set 1, người vận hành hoàn tiền/xử lý trên TADA rồi đánh dấu 2 ở đây.</p><pre>UPDATE point_redemption_transaction
SET reconciled = 2,
    reconcile_user = #{currentUser}, reconcile_remark = #{remark}, reconcile_date = UTC_TIMESTAMP(),
    update_date = UTC_TIMESTAMP()
WHERE id = #{id} AND status = 1 AND reconciled = 1;
-- reconcile_user / reconcile_remark / reconcile_date are 3 NEW columns the developer must add to point_redemption_transaction (DEV-09).</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": null }</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Transaction does not exist.</code></td><td></td></tr><tr><td><code>Only transactions pending manual review (reconciled = 1) can be marked as reconciled.</code></td><td>RI5</td></tr><tr><td><code>Remark is required and must be between 5 and 255 characters.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Lưu ý</h4><p>Smart CRM đã chốt giữ R5. 3 cột <code>reconcile_user</code> / <code>reconcile_remark</code> / <code>reconcile_date</code> là <b>cột mới</b> cần developer thêm vào <code>point_redemption_transaction</code> (Smart CRM gửi dev).</p></div></div><div class="specsrc" id="spec-n1" data-title="N1 · /point/admin/notifyLog/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/notifyLog/list</code></p><p>Danh sách log thông báo CleverTap của các khách thuộc 1 program (tab Omni Marketing (S2)), mới nhất trước.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>Có</td><td>Program phải tồn tại.</td></tr><tr><td><code>clientId</code></td><td>long</td><td>Không</td><td>Khớp đúng.</td></tr><tr><td><code>eventName</code></td><td>string</td><td>Không</td><td>Một trong 9 giá trị ở <a href="#values" class="ref">bảng 3.1</a>.</td></tr><tr><td><code>subType</code></td><td>string</td><td>Không</td><td><code>first_coin</code> / <code>last_trade_earned</code> / <code>not_traded</code> (bảng 3.2). Không gửi = không lọc.</td></tr><tr><td><code>isSend</code></td><td>int</td><td>Không</td><td><code>0</code> hoặc <code>1</code>.</td></tr><tr><td><code>sendStatus</code></td><td>int</td><td>Không</td><td><code>-1</code> / <code>0</code> / <code>1</code> / <code>2</code> (bảng 3.3).</td></tr><tr><td><code>eventDate_begin</code></td><td>string</td><td>Không</td><td><code>yyyy-MM-dd HH:mm:ss</code>, UTC, tính cả mốc này.</td></tr><tr><td><code>eventDate_end</code></td><td>string</td><td>Không</td><td><code>yyyy-MM-dd HH:mm:ss</code>, UTC, tính cả mốc này. Phải ≥ <code>eventDate_begin</code>.</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>Không</td><td>Mặc định 1.</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>Không</td><td>Mặc định 10, tối đa 100.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds">
<li>Validate tham số (bảng Request). Sai → lỗi, không query.</li>
<li>Kiểm program tồn tại, rồi lấy <code>client_group</code> của program (SQL (1), (2)). Program chưa có client group → lỗi.</li>
<li>Chạy query danh sách và <code>COUNT(*)</code> cùng điều kiện. Khách thuộc program = <code>crm_customer_base.group_code = client_group</code> (quy tắc 2.1).</li>
<li>Map sang DTO: datetime định dạng UTC đúng giá trị DB; <code>payload</code> parse thành object JSON (DB NULL → <code>null</code>); <code>isSend</code> trả <code>0</code>/<code>1</code>.</li>
</ol><pre>-- (1) program exists
SELECT id FROM point_program WHERE id = #{programId};

-- (2) client group of the program (1-1, including enabled = 0 rows: logs are history)

LIMIT 1;</pre><pre>SELECT l.id, l.client_id, l.event_name, l.sub_type, l.period_key, l.ref_key, l.payload,
       l.event_date, l.is_send, l.send_status, l.send_date, l.send_remark,

FROM point_notify_log l
WHERE EXISTS (SELECT 1 FROM crm_customer_base cb
              WHERE cb.client_id = l.client_id AND cb.group_code = #{clientGroup})
  &lt;if clientId&gt;       AND l.client_id = #{clientId}            &lt;/if&gt;
  &lt;if eventName&gt;      AND l.event_name = #{eventName}          &lt;/if&gt;
  &lt;if subType&gt;        AND l.sub_type = #{subType}              &lt;/if&gt;
  &lt;if isSend&gt;         AND l.is_send = #{isSend}                &lt;/if&gt;
  &lt;if sendStatus&gt;     AND l.send_status = #{sendStatus}        &lt;/if&gt;

  &lt;if eventDateEnd&gt;   AND l.event_date &lt;= #{eventDateEnd}      &lt;/if&gt;
ORDER BY l.event_date DESC, l.id DESC
LIMIT #{offset}, #{pageSize};

-- total: SELECT COUNT(*) with the same FROM + WHERE</pre></div><div class="specsec"><h4>3. Response</h4><pre>{

      {

        "payload": { "loyalty_eligible": true },
        "eventDate": "2026-10-15 03:00:00", "isSend": 0, "sendStatus": -1, "sendDate": null,
        "sendRemark": "Pre-launch eligible existing clients", "createDate": "2026-10-15 02:41:10", "createUser": "system",
        "updateDate": null, "updateUser": ""
      }
    ]
  }
}</pre><p>Sắp xếp: <code>event_date DESC, id DESC</code>.</p></div><div class="specsec"><h4>4. Message lỗi</h4><div class="scroll"><table><tr><th>message</th><th style="width:26%">Ghi chú</th></tr><tr><td><code>Program ID is required.</code></td><td></td></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Program has no client group.</code></td><td>Cùng message với nhóm Check-in</td></tr><tr><td><code>Event name is not valid.</code></td><td>Ngoài bảng 3.1</td></tr><tr><td><code>Sub type is not valid.</code></td><td>Ngoài bảng 3.2</td></tr><tr><td><code>Is send must be 0 or 1.</code></td><td></td></tr><tr><td><code>Send status must be -1, 0, 1 or 2.</code></td><td></td></tr><tr><td><code>Event date must be in yyyy-MM-dd HH:mm:ss format.</code></td><td>_begin hoặc _end</td></tr><tr><td><code>Event date end must not be before event date begin.</code></td><td></td></tr><tr><td><code>Page size must be at most 100.</code></td><td></td></tr></table></div></div><div class="specsec"><h4>5. Lưu ý</h4><ul class="rules">
<li>Dùng SQL động (<code>&lt;if&gt;</code> của MyBatis), <b>không</b> viết <code>(#{x} IS NULL OR column = #{x})</code>: dạng đó làm MySQL bỏ qua index khi lọc theo <code>clientId</code>.</li>
<li><code>EXISTS</code> thay cho <code>JOIN</code>: <code>crm_customer_base.client_id</code> không unique, JOIN có thể nhân đôi dòng log.</li>
<li>Không SELECT cột nào của <code>crm_customer_base</code> (bảng có email, số điện thoại, mật khẩu, số giấy tờ). Chỉ dùng <code>group_code</code> bên trong <code>EXISTS</code>.</li>
<li>Không lọc <code>crm_customer_base.deleted</code>: log là lịch sử, khách đã xoá vẫn xem được log cũ.</li>
<li>Hệ quả của quy tắc 2.1 (Smart CRM đã nêu): khách đổi <code>group_code</code> thì toàn bộ log cũ của khách chuyển sang program mới khi xem.</li>
<li>Không có API ghi: Smart CRM không sửa, không gửi lại log.</li>
</ul></div></div></div></section><section class="panel" id="rules" role="tabpanel">
<h2>Quy tắc và validation</h2>
<p>Các quy tắc engine mà API phải giữ (vi phạm thì engine không báo lỗi mà chạy sai lặng lẽ), và validation từng field của các form.</p>
<h3>Quy tắc engine – phân quyền và check-in</h3><div class="scroll"><table><tr><th style="width:6%">#</th><th style="width:44%">Quy tắc</th><th>Nếu vi phạm</th></tr><tr><td>I1</td><td>Một client_group chỉ có đúng 1 dòng <code>promo_client_group</code> với <code>promo_table = 'point_program'</code>, tính cả dòng <code>enabled = 0</code>.</td><td>Engine tìm task theo <code>client_group</code>. Group gắn 2 program đang bật → khách thấy 2 check-in task → <code>getList</code> trả <code>CONFIG_REASON_02</code> và ẩn hết; trading API thì lặng lẽ lấy task có id nhỏ nhất.</td></tr><tr><td>I2</td><td>Trong 1 program, tại mọi thời điểm chỉ có tối đa <b>1 check-in task đang sống</b>: task <code>enabled = 1</code>, bundle <code>enabled = 1</code>, <code>display_hide_to_all = 0</code> và khung hiển thị chồng nhau.</td><td>Cùng lý do <code>CONFIG_REASON_02</code>: chỉ cần 2 task cùng hiện là <b>toàn bộ</b> khách của program mất thẻ check-in. Đây là quy tắc mục 2 chưa có.</td></tr><tr><td>I3</td><td><code>task.program_id = bundle.program_id</code>. Task không đổi bundle, bundle không đổi program sau khi tạo.</td><td>Lịch sử và chuỗi streak được tìm theo cả <code>program_id + task_bundle_id + task_id</code>. Đổi bundle là khách mất chuỗi và lịch sử trên app.</td></tr><tr><td>I4</td><td>JSON điểm/exp có dạng <code>{"cycles": [[...], ...]}</code>, phần tử là số nguyên ≥ 0, mỗi cycle đúng <code>routine_cycle_limit_days</code> phần tử. Streak (<code>restart = 1</code>) có đúng 1 cycle; lịch (<code>restart = 0</code>) có đúng <code>routine_cycle_repeat</code> cycle.</td><td>Engine không báo lỗi khi thiếu: ngày không có cấu hình được <b>0 điểm</b>. Streak luôn đọc cycle 1; lịch đọc cycle thứ <i>n</i>.</td></tr><tr><td>I5</td><td><code>point_expiration_window</code> không được NULL, kể cả khi <code>point_expiration_type = 'no_limit'</code>.</td><td>Engine trả hạn = NULL khi window NULL → <code>point_lot.point_expiration_time</code> NULL → coin đã cộng nhưng mọi truy vấn số dư (<code>point_expiration_time &gt; now</code>) đều bỏ qua: khách không thấy, không tiêu được.</td></tr><tr><td>I6</td><td><code>tz_minutes</code>, <code>routine_cycle_repeat</code>, <code>routine_cycle_limit_days</code> phải được API ghi rõ, không để DB tự điền default.</td><td>DDL là NOT NULL kèm default: <code>tz_minutes = 0</code> (giờ UTC), <code>routine_cycle_repeat = 1</code>, <code>routine_cycle_limit_days = 7</code>. Bỏ sót thì task vẫn lưu được nhưng chạy sai lặng lẽ: ngày tính theo UTC, hoặc khách streak bị chặn vĩnh viễn ngay khi sang chu kỳ 2.</td></tr><tr><td>I7</td><td>Mọi field kiểu enum phải đúng một giá trị trong danh sách (tab Quy tắc).</td><td>Sai <code>display_event</code> → task không bao giờ hiện. Sai <code>participate_period_limit_type</code> → không check-in được. Sai <code>claim_valid_period_type</code> → hạn nhận NULL → claim theo chu kỳ không bao giờ nhận được. <code>claim_valid_period_type</code> và <code>point_expiration_type</code> được để NULL ở bảng task nhưng là NOT NULL ở bảng log: để NULL thì <b>mọi lần check-in đều lỗi</b> (<code>CHECKIN_FAIL</code>).</td></tr><tr><td>I8</td><td>Blacklist chỉ có 2 cấp: cả program (<code>point_task_bundle_id</code> NULL) và 1 bundle. Không có cấp task.</td><td>Engine đọc dòng <code>enabled = 1</code>, <code>promo_table = 'point_program'</code>, <code>promo_config_id</code> = program của task; bundle NULL chặn cả program, bundle khớp chặn bundle đó.</td></tr></table></div>
<h3>Quy tắc engine – trading và coin</h3><div class="scroll"><table><tr><th style="width:6%">#</th><th style="width:44%">Quy tắc</th><th>Nếu vi phạm</th></tr><tr><td>J1</td><td><code>task.program_id = bundle.program_id</code>; task không đổi bundle, không đổi program sau khi tạo.</td><td>Log ngày và chi tiết lệnh chụp <code>program_id</code> / <code>task_bundle_id</code>. Blacklist cấp bundle tra theo bundle hiện tại của task: đổi bundle là đổi tập khách bị chặn.</td></tr><tr><td>J2</td><td>Mỗi program chỉ nên có <b>1 trading task đang sống</b> (task + bundle + program bật, khung tham gia đang mở). Đã chốt 2026-10-21: có 2 task là lỗi người cấu hình; Smart CRM <b>cảnh báo và đòi xác nhận</b>, không chặn cứng (xem Quyết định đã chốt ở tab Tổng quan).</td><td>Mỗi lệnh chỉ được gán cho <b>1</b> task (engine duyệt task theo id tăng dần, bỏ task bị chặn book type, lấy task đầu tiên khách không bị blacklist), nên <b>không</b> nhân đôi coin. Nhưng app chọn task theo điều kiện <i>hiển thị</i> còn engine theo điều kiện <i>tham gia</i>: hai bên có thể chọn 2 task khác nhau → coin vào task mà app không hiện.</td></tr><tr><td>J3</td><td><code>participate_period_limit_type = 'specific_period'</code> thì phải có <b>cả</b> <code>participate_period_from</code> và <code>participate_period_to</code>, <code>from &lt; to</code>.</td><td>Engine chọn task bằng <code>now &gt;= from AND now &lt; to</code>: thiếu 1 đầu là NULL → task không bao giờ được tính coin. Ngoài ra lệnh phải được <b>mở và đóng</b> trong khung này mới được tính.</td></tr><tr><td>J4</td><td><code>display_event</code> phải là 1 trong 4 giá trị (tab Quy tắc), không để NULL.</td><td>Cột cho phép NULL. NULL hoặc sai giá trị → app không bao giờ hiện task, nhưng engine <b>vẫn tính coin</b> (engine không đọc display_event): khách có coin mà không thấy chương trình.</td></tr><tr><td>J5</td><td>Dòng quy đổi: không trùng <code>(mt5_group, condition_type, condition_value)</code> không phân biệt hoa thường; dòng <code>any</code> lưu <code>condition_value = 'other'</code>.</td><td>Engine đưa mọi dòng vào 1 map với khoá chữ thường: 2 dòng trùng (kể cả khác hoa thường) thì dòng nạp sau đè dòng trước, không đoán được. Dòng <code>any</code> có value khác <code>other</code> / rỗng thì <b>không bao giờ khớp</b>.</td></tr><tr><td>J6</td><td>Muốn task tính coin được, phải có ít nhất 1 dòng quy đổi <code>point_per_lot &gt; 0</code>.</td><td>Không có dòng nào: mọi lệnh bị ghi <code>NO_RATE_CONFIG</code>, 0 coin; app ẩn bảng tỷ lệ và <code>rateRange = null</code>.</td></tr><tr><td>J7</td><td><code>tz_minutes</code>, <code>release_auto_delay_day</code> không đổi khi task đã có dữ liệu (tab Khoá khi đang chạy).</td><td><code>tz_minutes</code> quyết định ranh giới ngày (<code>period_key</code>) và trần ngày. <code>release_auto_delay_day</code> được chụp vào log ngày ở lệnh đầu tiên của ngày, còn giờ hẹn phát của từng lệnh tính theo cấu hình lúc xử lý: đổi giữa chừng làm 1 ngày có 2 kiểu phát.</td></tr><tr><td>J8</td><td><code>display_hide_book_type</code> ở 3 cấp (program, bundle, task) là luật <b>tính coin</b>, không chỉ hiển thị.</td><td>Engine bỏ qua task nếu cấp nào khớp book type của khách: khách A/B book bị chặn không được tính coin. Đổi giá trị có hiệu lực từ lần chạy engine kế tiếp (≤ 3 phút).</td></tr></table></div>
<h3>Quy tắc engine – gift và redemption</h3><div class="scroll"><table><tr><th style="width:6%">#</th><th style="width:44%">Quy tắc</th><th>Nếu vi phạm</th></tr><tr><td>RI1</td><td><code>point_featured_gift</code> chỉ là <b>danh sách quà hiển thị</b> (dashboard + message). Nó <b>không phải</b> catalog mà TADA trừ coin: TADA tự quản catalog riêng. <code>point_price</code> phải bằng đúng giá trên TADA.</td><td>Nếu lệch, dashboard hiện 1 giá nhưng khi khách đổi trong webview TADA lại trừ số coin khác → khiếu nại. Không có ràng buộc DB nào ép khớp; phải đối soát tay với TADA (dùng <code>external_item_id</code>).</td></tr><tr><td>RI2</td><td><code>point_redemption_order</code> và <code>point_redemption_transaction</code> <b>không có</b> cột <code>program_id</code>. Dữ liệu redemption của 1 program = các <code>client_id</code> có <code>crm_customer_base.group_code</code> = client group của program (qua <code>promo_client_group</code>).</td><td>Khách đổi <code>group_code</code> thì toàn bộ lịch sử redeem/coin của họ chuyển sang view của program mới. Lọc theo khách, không theo khóa ngoại program.</td></tr><tr><td>RI3</td><td>Blacklist redeem là <b>1 dòng toàn cục/khách</b>: <code>promo_table='point_redemption_transaction'</code>, <code>promo_config_id=0</code>, <code>point_task_bundle_id=0</code>, <code>enabled=1</code>.</td><td>Dòng này chặn khách đổi quà ở <b>MỌI</b> program, không chỉ program đang xem. Engine đọc nó ở get-point / redeem-point / redeem/session (chặn tiêu) nhưng <b>KHÔNG</b> ở topup-point (hoàn vẫn chạy). Tab theo program chỉ là view lọc theo khách của program.</td></tr><tr><td>RI4</td><td><code>point_redemption_transaction</code> là bản ghi tiền (<code>status</code> 1=đã trừ / 2=đã hoàn, <code>coin_amount</code>). <code>point_redemption_order</code> là cache trạng thái đơn do webhook TADA đồng bộ. Hai bảng chung <code>external_system + order_reference</code> (unique <code>uk_partner_order</code>).</td><td>Coin đã được luồng partner redeem-point trừ từ trước; Smart CRM <b>chỉ đọc</b> order/transaction. Mọi sửa đổi tiền phải đi qua engine, không sửa tay ở đây.</td></tr><tr><td>RI5</td><td><code>reconciled</code> có 3 giá trị: <code>0</code> chưa đối soát, <code>1</code> chờ người kiểm (job đã cảnh báo), <code>2</code> đã đối soát — theo enum <code>PointRedeemReconciledEnum</code> trong bản đã deploy.</td><td>DDL comment trên UAT vẫn ghi cũ <code>0=未对账,1=已对账</code> (chỉ 2 giá trị) — lỗi thời, cần dev cập nhật comment. Smart CRM dùng 0/1/2; thao tác 'đánh dấu đã kiểm' chỉ chuyển 1 → 2.</td></tr><tr><td>RI6</td><td>Kiểu <code>client_id</code> khác nhau giữa các bảng: <code>point_redemption_order.client_id</code> là <code>varchar(32)</code>, <code>point_redemption_transaction.client_id</code> là <code>bigint</code>, <code>crm_customer_base.client_id</code> là <code>bigint</code>.</td><td>JOIN order với crm phải CAST (<code>CAST(o.client_id AS UNSIGNED)</code>); so <code>group_code</code> giữa bảng có thể cần <code>COLLATE</code> (sự cố 1267 từng gặp ở check-in). Giữ cùng collation <code>utf8mb4_0900_ai_ci</code>.</td></tr></table></div>

<h3>Validation check-in task (C1, C2)</h3>
<p>Áp dụng cho C1 (tạo/sửa) và chạy lại khi bật bằng C2. "Lưu tự động" nghĩa là backend tự ghi giá trị đó, bỏ qua giá trị FE gửi.</p>
<h4>Từng field</h4>
<div class="scroll"><table>
<tr><th style="width:19%">Field</th><th style="width:9%">Kiểu</th><th style="width:11%">Bắt buộc</th><th style="width:31%">Giá trị hợp lệ</th><th>Engine dùng thế nào</th></tr><tr><td><code>taskName</code></td><td>string</td><td>Có</td><td>Trim, 1–100 ký tự (varchar(100)).</td><td>Chỉ hiển thị.</td></tr><tr><td><code>taskDescription</code></td><td>string</td><td>Không</td><td>≤ 255 ký tự (<code>varchar(255)</code>).</td><td>Chỉ hiển thị.</td></tr><tr><td><code>displayHideBookType</code></td><td>int</td><td>Có</td><td><code>0</code> / <code>1</code> / <code>2</code>.</td><td>So với <code>client_book_type</code> của khách (NULL = 9). Chỉ ẩn thẻ ở <code>getList</code>; API check-in không kiểm lại book type.</td></tr><tr><td><code>tzMinutes</code></td><td>int</td><td>Có</td><td>−720 … 840, bội số của 15. Ví dụ GMT+7 = <code>420</code>.</td><td>Ranh giới ngày, ngày check-in, hạn điểm (23:59:59 theo giờ này). Cột NOT NULL DEFAULT 0: không gửi thì task chạy theo giờ UTC (I6).</td></tr><tr><td><code>displayEvent</code></td><td>string</td><td>Có</td><td><code>signup</code> / <code>kyc_approve</code> / <code>first_time_deposit</code> / <code>first_trade</code>.</td><td>Khách chỉ thấy thẻ sau khi đạt sự kiện. Giá trị khác → không ai thấy.</td></tr><tr><td><code>displayPeriodLimitApply</code></td><td>int</td><td>Có</td><td><code>0</code> không giới hạn / <code>1</code> giới hạn.</td><td></td></tr><tr><td><code>displayPeriodFrom</code></td><td>datetime UTC</td><td>Khi apply = 1</td><td><code>yyyy-MM-dd HH:mm:ss</code> UTC. Apply = 0 → lưu NULL.</td><td>Hiện khi <code>from ≤ now &lt; to</code>.</td></tr><tr><td><code>displayPeriodTo</code></td><td>datetime UTC</td><td>Khi apply = 1</td><td>&gt; <code>displayPeriodFrom</code>.</td><td>Mốc <code>to</code> không tính (đến đúng giây đó thì ẩn).</td></tr><tr><td><code>displayHideToAll</code></td><td>int</td><td>Có</td><td><code>0</code> / <code>1</code>.</td><td>1 = ẩn với mọi khách (kể cả người đang chạy dở).</td></tr><tr><td><code>participateEvent</code></td><td>string</td><td>Có</td><td>Cùng 4 giá trị như <code>displayEvent</code>.</td><td>Chưa đạt sự kiện → <code>participate_status = not_allow</code>. Kiểu lịch dùng mốc thời gian của sự kiện để tính cycle.</td></tr><tr><td><code>participatePeriodLimitType</code></td><td>string</td><td>Có</td><td><code>no_limit</code> / <code>specific_period</code>.</td><td>Giá trị khác → API check-in không bao giờ tìm thấy task.</td></tr><tr><td><code>participatePeriodFrom</code></td><td>datetime UTC</td><td>Khi specific_period</td><td>UTC. <code>no_limit</code> → lưu NULL.</td><td>Check-in được khi <code>from ≤ now &lt; to</code>.</td></tr><tr><td><code>participatePeriodTo</code></td><td>datetime UTC</td><td>Khi specific_period</td><td>&gt; <code>participatePeriodFrom</code>.</td><td></td></tr><tr><td><code>restartMissedCheckinEnabled</code></td><td>int</td><td>Có</td><td><code>1</code> streak (lỡ 1 ngày hoặc xong chu kỳ → về Day 1) / <code>0</code> lịch (chu kỳ chạy theo ngày kể từ sự kiện, dù có check-in hay không).</td><td>Quyết định công thức cycle và cách đọc JSON điểm.</td></tr><tr><td><code>routineCycleLimitDays</code></td><td>int</td><td>Có</td><td>1 … 366.</td><td>Số ngày một chu kỳ.</td></tr><tr><td><code>routineCycleRepeat</code></td><td>int</td><td>Có</td><td>≥ 1; streak có thêm V13.</td><td>Khách có <code>cycle &gt;</code> giá trị này bị chặn vĩnh viễn (<code>OUT_OF_CYCLE</code>, thẻ hiện <code>completed</code>). Cột NOT NULL DEFAULT 1 (I6).</td></tr><tr><td><code>firstDayDefinition</code></td><td>int</td><td>Khi restart = 0</td><td><code>0</code> ngày xảy ra sự kiện là Day 1 / <code>1</code> ngày hôm sau là Day 1. Streak → lưu 0.</td><td>Chỉ kiểu lịch dùng.</td></tr><tr><td><code>pointDistributeSpecifyEachDay</code></td><td>JSON string</td><td>Có</td><td><code>{"cycles": [[n, …], …]}</code>, n nguyên 0 … 2147483647 (<code>point_earned</code> là <code>int</code>); hình dạng theo V04–V07. Cột kiểu <code>json</code>: MySQL tự chuẩn hoá khoảng trắn <h4>SQL kiểm I2 (V15)</h4>
<pre>-- V15: other live check-in tasks of the same program whose display window overlaps the candidate
SELECT d.id, d.task_name
FROM point_task_daily_checkin d
JOIN point_task_bundle b ON b.id = d.task_bundle_id
WHERE d.program_id = #{programId}
  AND d.id &lt;&gt; #{candidateId}                       -- 0 when creating
  AND d.enabled = 1 AND d.display_hide_to_all = 0
  AND (b.enabled = 1 OR b.id = #{enablingBundleId})  -- B3: bundle being enabled counts as on; C1/C2: 0
  AND (d.display_period_limit_apply = 0 OR d.display_period_to &gt; UTC_TIMESTAMP())   -- not finished
  AND ( #{candApply} = 0 OR d.display_period_limit_apply = 0
        OR (d.display_period_from &lt; #{candTo} AND #{candFrom} &lt; d.display_period_to) )
LIMIT 1;</pre>
<h4>Ví dụ JSON điểm hợp lệ</h4>
<pre>-- streak, 7 days (MiTrade):
{"cycles": [[5, 8, 10, 12, 14, 17, 34]]}

-- calendar, routine_cycle_limit_days = 3, routine_cycle_repeat = 2:
{"cycles": [[10, 20, 30], [10, 20, 40]]}</pre>
<p>Kiểu lịch với số chu kỳ lớn (ví dụ 52 tuần) sẽ có JSON dài: FE có thể cho nhập 1 chu kỳ rồi "áp dụng cho mọi chu kỳ" và gửi bản đã nhân ra.</p>

<ul class="rules">
<li><b>Trùng lặp:</b> khoá <code>(mt5Group, conditionType, conditionValue)</code> so không phân biệt hoa thường, trong các dòng chưa xoá của task. Bảng không có unique key, nên API khoá dòng task (T1 bước 2) rồi mới kiểm.</li>
<li><b>Thứ tự ưu tiên:</b> symbol &gt; symbol_group &gt; any trong cùng nhóm MT5; không có dòng khớp → <code>NO_RATE_CONFIG</code>, 0 coin.</li>
<li><b>Dòng any:</b> không bắt buộc (cảnh báo V09). Cấu hình HSB: mỗi nhóm có 4 dòng symbol_group (metal, forex, energy, index) và 1 dòng any (phủ cổ phiếu và mọi mã còn lại).</li>
<li>Số dòng: 1 … 500 mỗi task.</li>
</ul>

<h3 id="values">Giá trị hợp lệ</h3>
<p>Danh sách cố định trong code (<code>NotifyEventEnum</code>, <code>NotifySendStatusEnum</code>); chỉ đổi khi developer thêm event mới, lúc đó code cũng phải đổi. Vì vậy N1 <b>không</b> trả kèm danh sách: FE khai báo hằng số cho dropdown và nhãn trong <code>en_US.js</code> / <code>zh_CN.js</code>. Giá trị lạ (event mới chưa khai báo) → FE hiện nguyên chuỗi.</p>
