}</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Date range must be at most {n} days.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. 注意</h4><p><code>remark</code> 列需 developer 新增后才有（DEV-07）。现有索引 <code>idx_client_date (client_id, create_date)</code> 足以按客户筛选；按日期筛选整个积分计划需新增索引 <code>create_date</code>（DEV-06）。</p></div></div><div class="specsrc" id="spec-k2" data-title="K2 · /point/admin/coin/lot/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/coin/lot/list</code></p><p>积分计划内客户的 Coin 批次（<code>point_lot</code>）（Coin 标签页 (S2)，Lot 标签页）。只读。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>是</td><td>积分计划必须存在。</td></tr><tr><td><code>clientId</code></td><td>long</td><td>否</td><td>同 K1。</td></tr><tr><td><code>sourceType</code></td><td>int</td><td>否</td><td><code>1</code> 任务（trading / check-in），<code>2</code> 手动调整。</td></tr><tr><td><code>status</code></td><td>string</td><td>否</td><td><code>valid</code>：未过期且仍有 Coin；<code>used</code>：未过期，Coin 已用完；<code>expired</code>：已过期。<code>point_expiration_time</code> 为 NULL 的批次视为未过期。</td></tr><tr><td><code>createDate_begin, createDate_end</code></td><td>datetime UTC</td><td>否</td><td>同 K1。</td></tr><tr><td><code>pageNo, pageSize</code></td><td>int</td><td>否</td><td>1 / 10，最大 100。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>同 K1，作用于 <code>point_lot</code>。</li>
<li>额外返回读取时计算的 <code>sourceName</code> 和 <code>status</code>。</li></ol><pre>SELECT id, client_id, task_log_table, task_log_id, source_type, point_earned, point_balance,
       point_expiration_time, cash_value_per_point_unit, archive_at, create_date, create_user, update_date
FROM point_lot
WHERE create_date &gt;= #{createDate_begin} AND create_date &lt; #{createDate_end}
  AND (#{clientId} IS NULL OR client_id = #{clientId})
  AND (#{sourceType} IS NULL OR source_type = #{sourceType})
  AND ( #{status} IS NULL
     OR (#{status} = 'valid'   AND point_balance &gt; 0  AND (point_expiration_time IS NULL OR point_expiration_time &gt; UTC_TIMESTAMP()))
     OR (#{status} = 'used'    AND point_balance = 0  AND (point_expiration_time IS NULL OR point_expiration_time &gt; UTC_TIMESTAMP()))
     OR (#{status} = 'expired' AND point_expiration_time &lt;= UTC_TIMESTAMP()) )
  AND client_id IN (/* SCOPE_SQL of program */)
ORDER BY create_date DESC, id DESC
LIMIT #{offset}, #{pageSize};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": { "total": 1, "records": [{
    "id": 262400, "clientId": 72000101, "taskLogTable": "manual_adjust", "taskLogId": 1848213470001, "sourceType": 2,
    "sourceName": "adjust", "pointEarned": 100, "pointBalance": 100, "pointExpirationTime": "2027-04-19 16:59:59",
    "cashValuePerPointUnit": 0.0000, "status": "valid", "archiveAt": null,
    "createDate": "2026-10-21 03:00:00", "createUser": "admin01", "updateDate": "2026-10-21 03:00:00" }] }
}</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Status must be valid, used or expired.</code></td><td></td></tr><tr><td><code>Date range must be at most {n} days.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. 注意</h4><p>前端注意：客户 app 只按有有效期的批次计算余额（<code>point_expiration_time &gt; now</code>），而扣减 Coin（兑换、手动扣减）也会使用有效期为 NULL 的批次。目前所有生成批次的路径都会写入有效期，因此不会出现 NULL 批次；若出现则属于异常数据。</p></div></div><div class="specsrc" id="spec-k3" data-title="K3 · /point/admin/coin/adjust"><p class="specmeta"><code>POST</code> · <code>/point/admin/coin/adjust</code></p><p>为积分计划内的 1 个客户手工增加 / 扣减 Coin（Adjust Balance 弹窗）。<code>POST /point/pointAdjust</code> 的 Smart CRM 版本。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>是</td><td>积分计划必须存在。</td></tr><tr><td><code>clientId</code></td><td>long</td><td>是</td><td>客户存在（<code>crm_customer_base</code>、<code>deleted = 0</code>）且属于该积分计划（概览标签页，积分计划的客户范围）。</td></tr><tr><td><code>point</code></td><td>long</td><td>是</td><td>不为 0。正数 = 增加，负数 = 扣减。|point| ≤ 100,000（已确认）。</td></tr><tr><td><code>expireDays</code></td><td>int</td><td>否</td><td>1 … 7300，不传时默认 180。仅在增加时使用（<code>point &gt; 0</code>）；扣减时忽略（不报错）。有效期计算见第 4 步。</td></tr><tr><td><code>remark</code></td><td>string</td><td>是</td><td>原因。去首尾空格，5–255 字符。</td></tr><tr><td><code>requestId</code></td><td>string</td><td>是</td><td>前端在打开弹窗时生成一次的 UUID，重复提交时保持不变。1–64 字符（适配 <code>external_id</code> 列）。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds">
<li>校验。检查客户属于该积分计划。</li>
<li>与旧 API 相同，按客户加 Redis 锁（<code>point:manual:client:{clientId}</code>，不等待，租期 30 秒）。获取失败 → "Another adjustment is in progress"。</li>
<li><b>防重复提交</b>：若已存在 <code>external_system = 'smart_crm'</code>、<code>external_id = requestId</code> 的 <code>point_ledger</code> 行 → 返回上次结果（<code>duplicated = true</code>），不再写入任何数据。使用现有索引 <code>idx_ledger_external</code>。Redis 锁只拦截<i>并发</i>的 2 个请求；requestId 还能拦截首个请求完成后的重复提交。</li>
<li>直接调用现有的 <code>ManualPointServiceImpl</code> 逻辑，并为其生成的每条 <code>point_ledger</code> 行额外写入 3 个值：<code>external_system = 'smart_crm'</code>、<code>external_id = requestId</code>、<code>remark</code>。<code>create_user</code> = 当前登录用户。<ul class="rules">
  <li><b>增加</b>：生成 1 个新批次 <code>task_log_table = 'manual_adjust'</code>、<code>source_type = 2</code>，1 条流水 <code>type = 5</code>。<b>批次有效期 =（按 GMT+7 的增加日期 + <code>expireDays</code>）当天 GMT+7 23:59:59</b>，以 UTC 存储（即 16:59:59 UTC）。与交易引擎一致（有效期截止于任务时区 23:59:59，<code>PointTaskTradingLogServiceImpl</code>）；手动增加的批次不属于任何任务，因此使用 GMT+7，即 app 各 Coin API 默认用于展示的时区（<code>PROGRAM_TZ_MINUTES = 420</code>）。示例：在 <code>2026-10-21 03:00:00</code> UTC（10:00 GMT+7）增加，<code>expireDays = 180</code> → 日期 2027-04-19 → <code>point_expiration_time = 2027-04-19 16:59:59</code> UTC。当前代码计算的是 <code>now + 180 days</code>（未截止到当天结束，天数取自配置 <code>point.manual-adjust.expire-days</code>）：需按 DEV-08 修改。更新快照（<code>coin_balance</code> 增加，<code>coin_lifetime</code> <b>不</b>增加）。</li>
  <li><b>扣减</b>：在未过期批次上依次扣减，有效期最近的优先（锁定 <code>FOR UPDATE</code> 行），每个批次 1 条流水 <code>type = 6</code>。扣减超过未过期余额 → 报错，不做任何扣减（不允许负余额）。更新快照。</li>
  </ul></li>
<li>返回调整后的余额。</li></ol><pre>-- 1) client belongs to program
SELECT 1 FROM crm_customer_base c
WHERE c.client_id = #{clientId} AND c.deleted = 0
  AND c.group_code IN (SELECT client_group FROM promo_client_group
                       WHERE promo_table = 'point_program' AND promo_config_id = #{programId})
LIMIT 1;

-- 2) idempotency
SELECT id, point_amount, point_balance_after FROM point_ledger
WHERE external_system = 'smart_crm' AND external_id = #{requestId};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "",
  "result": { "clientId": 72000101, "point": -150, "balanceBefore": 3860, "balance": 3710,
              "expirationTime": null, "duplicated": false } }

// add (point &gt; 0): expirationTime = expiry of the new lot, UTC
{ "success": true, "code": 200, "message": "",
  "result": { "clientId": 72000101, "point": 100, "balanceBefore": 3760, "balance": 3860,
              "expirationTime": "2027-04-19 16:59:59", "duplicated": false } }</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Client does not exist.</code></td><td></td></tr><tr><td><code>Client does not belong to this program.</code></td><td></td></tr><tr><td><code>Points must not be 0.</code></td><td></td></tr><tr><td><code>Points must be between -100,000 and 100,000.</code></td><td></td></tr><tr><td><code>Expire days must be between 1 and 7300.</code></td><td>仅在增加时校验</td></tr><tr><td><code>Remark is required (5-255 characters).</code></td><td></td></tr><tr><td><code>Request ID is required.</code></td><td></td></tr><tr><td><code>Another adjustment for this client is in progress. Please retry.</code></td><td>Redis 锁</td></tr><tr><td><code>Insufficient coins: balance {balance}, requested {point}.</code></td><td>扣减超过余额</td></tr></table></div><div class="specsec"><h4>5. 注意</h4><p><b>需要 developer 补充开发</b> DEV-07 新增列 <code>point_ledger.remark</code>；DEV-08 让 <code>ManualPointService</code> 接收 <code>remark</code>、<code>externalSystem</code>、<code>externalId</code>。无需“检查积分计划是否开启”：积分计划停用后仍需能手动调整（补偿老客户）；只需客户属于该积分计划。</p>
<p>手动增加的 Coin 有效期由操作人选择（<code>expireDays</code>，默认 180），与积分计划内任务的 Coin 有效期无关。</p></div></div><div class="specsrc" id="spec-k4" data-title="K4 · /point/admin/coin/balance"><p class="specmeta"><code>GET</code> · <code>/point/admin/coin/balance</code></p><p>1 个客户的当前余额（保存前在 Adjust Balance 弹窗中显示）。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>是</td><td>积分计划必须存在。</td></tr><tr><td><code>clientId</code></td><td>long</td><td>是</td><td>同 K3。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>检查客户属于该积分计划。</li>
<li><code>balance</code>：直接由 <code>point_lot</code> 计算（准确来源，与扣减 Coin 使用相同条件）。<code>snapshotBalance</code>：读取 <code>point_client_coin_snapshot.coin_balance</code>（兑换 API 使用的来源）。两者不一致 → 返回 <code>snapshotMismatch = true</code> 供前端警告；每日对账任务会推送到 Telegram。</li>
<li>附带 <code>expiringIn10Days</code>（同 app）和 <code>lifetime</code>（<code>coin_lifetime</code>）。</li></ol><pre>SELECT COALESCE(SUM(point_balance), 0) AS balance,
       COALESCE(SUM(CASE WHEN point_expiration_time &lt;= UTC_TIMESTAMP() + INTERVAL 10 DAY THEN point_balance END), 0) AS expiring_in_10_days
FROM point_lot
WHERE client_id = #{clientId} AND point_balance &gt; 0
  AND (point_expiration_time IS NULL OR point_expiration_time &gt; UTC_TIMESTAMP());

SELECT coin_balance, coin_lifetime FROM point_client_coin_snapshot WHERE client_id = #{clientId};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "",
  "result": { "clientId": 72000101, "balance": 3860, "expiringIn10Days": 200, "snapshotBalance": 3860,
              "snapshotMismatch": false, "lifetime": 4180 } }</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Client does not exist.</code></td><td></td></tr><tr><td><code>Client does not belong to this program.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. 注意</h4><p>尚无快照行（客户从未有过 Coin）→ <code>snapshotBalance = 0</code>、<code>lifetime = 0</code>。</p></div></div><div class="specsrc" id="spec-g1" data-title="G1 · /point/admin/gift/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/gift/list</code></p><p>1 个积分计划的礼品列表（Gift List 标签页 (S2)），按 sort_order 排序。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>是</td><td>积分计划必须存在。按 <code>point_featured_gift.program_id</code> 精确筛选。</td></tr><tr><td><code>giftName</code></td><td>string</td><td>否</td><td>在 <code>gift_name</code> 上筛选 <code>LIKE %x%</code>，已去首尾空格。</td></tr><tr><td><code>category</code></td><td>string</td><td>否</td><td>精确匹配 <code>gift_category</code>：<code>e_wallet</code> / <code>voucher</code> / <code>physical</code>。其他值 → 报错。</td></tr><tr><td><code>enabled</code></td><td>int</td><td>否</td><td><code>1</code> 使用中 / <code>0</code> 已停用。</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>否</td><td>默认 1。</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>否</td><td>默认 10，最大 100。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>校验参数；检查积分计划存在。</li>
<li>执行下方查询（用相同条件统计 <code>total</code>）。按 <code>sort_order ASC, point_price ASC, id ASC</code> 排序（<code>sort_order</code> 相同时按价格再按 id —— RI 与索引 <code>idx_program_dashboard</code> 匹配）。</li>
<li>Datetime 以 UTC 返回，与 DB 值一致（Q3）。</li></ol><pre>SELECT g.id, g.gift_name, g.gift_short_name, g.gift_description, g.gift_category,
       g.point_price, g.cash_value, g.gift_image_url, g.external_item_id, g.badge,
       g.sort_order, g.show_on_dashboard, g.use_in_notification,
       g.display_from, g.display_to, g.enabled, g.remark,
       g.create_user, g.create_date, g.update_user, g.update_date
FROM point_featured_gift g
WHERE g.program_id = #{programId}
  AND (#{giftName} IS NULL OR g.gift_name LIKE CONCAT('%', #{giftName}, '%'))
  AND (#{category} IS NULL OR g.gift_category = #{category})
  AND (#{enabled}  IS NULL OR g.enabled = #{enabled})
ORDER BY g.sort_order ASC, g.point_price ASC, g.id ASC
LIMIT #{offset}, #{pageSize};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": {
    "total": 1,
    "records": [{
      "id": 1, "giftName": "Saldo GoPay Rp50.000", "giftShortName": "GoPay 50k",
      "giftDescription": "Saldo GoPay langsung masuk", "giftCategory": "e_wallet",
      "pointPrice": 500, "cashValue": 50000.00, "giftImageUrl": "https://cdn.hsb.co.id/loyalty/gift/gopay-50k.png",
      "externalItemId": "TADA-GOPAY-50", "badge": "hot", "sortOrder": 1,
      "showOnDashboard": 1, "useInNotification": 1,
      "displayFrom": null, "displayTo": null, "enabled": 1, "remark": "Reconciled with TADA 2026-10-20",
      "createUser": "admin01", "createDate": "2026-10-20 08:15:00", "updateUser": null, "updateDate": null
    }]
  }
}</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Invalid gift category.</code></td><td>category 筛选值无效</td></tr></table></div><div class="specsec"><h4>5. 注意</h4><p><code>cash_value</code> 是内部值（IDR），只在 Smart CRM（管理端）显示，绝不推送到客户 app。脱敏规则见<a href="#rules" class="ref">规则标签页</a>。</p></div></div><div class="specsrc" id="spec-g2" data-title="G2 · /point/admin/gift/save"><p class="specmeta"><code>POST</code> · <code>/point/admin/gift/save</code></p><p>创建（无 id）或修改（有 id）1 个礼品。修改时积分计划不变。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>修改时</td><td>礼品必须存在。</td></tr><tr><td><code>programId</code></td><td>long</td><td>创建时</td><td>积分计划必须存在。修改时：忽略；传入与当前不同的积分计划 → 报错。</td></tr><tr><td><code>giftName</code></td><td>string</td><td>是</td><td>去首尾空格，1–128 字符（<code>varchar(128) NOT NULL</code>）。</td></tr><tr><td><code>giftShortName</code></td><td>string</td><td>是</td><td>去首尾空格，1–32 字符（<code>varchar(32) NOT NULL</code>）。建议 ≤ 25，避免推送被截断。</td></tr><tr><td><code>giftDescription</code></td><td>string</td><td>否</td><td>≤ 255 字符（<code>varchar(255) NOT NULL DEFAULT ''</code>）。为空 → <code>''</code>。</td></tr><tr><td><code>giftCategory</code></td><td>string</td><td>是</td><td>取值范围：<code>e_wallet</code> / <code>voucher</code> / <code>physical</code>。≤ 32 字符。</td></tr><tr><td><code>pointPrice</code></td><td>long</td><td>是</td><td>整数 &gt; 0（<code>bigint NOT NULL</code>）。必须与 TADA 价格一致（RI1）；不自动校验（TADA 没有服务端 catalog API），仅在修改时警告。</td></tr><tr><td><code>cashValue</code></td><td>decimal</td><td>否</td><td>≥ 0，最多 2 位小数（<code>decimal(18,2)</code>）。内部值（IDR）。</td></tr><tr><td><code>giftImageUrl</code></td><td>string</td><td>否</td><td>≤ 512 字符。如有：公开的 <code>https</code> URL（无需登录），托管在 HSB 图片服务器上以保证链接不变。为空 → 邮件不带图片。</td></tr><tr><td><code>externalItemId</code></td><td>string</td><td>enabled=1 时必填</td><td>≤ 64 字符。礼品在 TADA 上的 ID，用于价格对账。建议启用时必填（RI1）。</td></tr><tr><td><code>badge</code></td><td>string</td><td>否</td><td>为空、<code>hot</code> 或 <code>new</code>（≤ 16 字符）。app 自行翻译成印尼语。</td></tr><tr><td><code>sortOrder</code></td><td>int</td><td>否</td><td>整数 ≥ 0（默认 0）。相同值 → 按 <code>point_price</code> 排序；不报错。</td></tr><tr><td><code>showOnDashboard</code></td><td>int</td><td>是</td><td>0 / 1.</td></tr><tr><td><code>useInNotification</code></td><td>int</td><td>是</td><td>0 / 1.</td></tr><tr><td><code>displayFrom</code></td><td>datetime UTC</td><td>否</td><td><code>yyyy-MM-dd HH:mm:ss</code> UTC。为空 = 不限制。</td></tr><tr><td><code>displayTo</code></td><td>datetime UTC</td><td>否</td><td>两者都有值时须 &gt; <code>displayFrom</code>。为空 = 不限制。</td></tr><tr><td><code>remark</code></td><td>string</td><td>否</td><td>≤ 255 字符。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>按<a href="#rules" class="ref">规则标签页</a>校验（GV01–GV09）。收集所有字段错误，在 <code>message</code> 返回第一个，在 <code>result.errors</code> 返回全部，供前端逐个标红（Q7/1.5）。</li>
<li>忽略不在列表中的字段。<code>enabled</code> 不接受前端传入。</li>
<li><b>新建</b>：INSERT 时 <code>enabled = 0</code>（新礼品始终为停用；管理员复核后通过 G3 启用）。<code>create_user</code> = 当前登录用户，<code>create_date = UTC_TIMESTAMP()</code>。</li>
<li><b>修改</b>：UPDATE 上述字段；不修改 <code>program_id</code> 和 <code>enabled</code>。若礼品已有人兑换且修改了 <code>point_price</code>/<code>external_item_id</code> → 警告（<a href="#locks" class="ref">运行中锁定标签页</a>。</li></ol><pre>INSERT INTO point_featured_gift
  (program_id, gift_name, gift_short_name, gift_description, gift_category, point_price, cash_value,
   gift_image_url, external_item_id, badge, sort_order, show_on_dashboard, use_in_notification,
   display_from, display_to, enabled, remark, create_date, create_user)
VALUES (#{programId}, #{giftName}, #{giftShortName}, IFNULL(#{giftDescription}, ''), #{giftCategory},
        #{pointPrice}, #{cashValue}, IFNULL(#{giftImageUrl}, ''), IFNULL(#{externalItemId}, ''),
        IFNULL(#{badge}, ''), IFNULL(#{sortOrder}, 0), #{showOnDashboard}, #{useInNotification},
        #{displayFrom}, #{displayTo}, 0, IFNULL(#{remark}, ''), UTC_TIMESTAMP(), #{currentUser});

UPDATE point_featured_gift
SET gift_name = #{giftName}, gift_short_name = #{giftShortName}, gift_description = IFNULL(#{giftDescription}, ''),
    gift_category = #{giftCategory}, point_price = #{pointPrice}, cash_value = #{cashValue},
    gift_image_url = IFNULL(#{giftImageUrl}, ''), external_item_id = IFNULL(#{externalItemId}, ''),
    badge = IFNULL(#{badge}, ''), sort_order = IFNULL(#{sortOrder}, 0),
    show_on_dashboard = #{showOnDashboard}, use_in_notification = #{useInNotification},
    display_from = #{displayFrom}, display_to = #{displayTo}, remark = IFNULL(#{remark}, ''),
    update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE id = #{id};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": { "id": 2, "enabled": 0 } }

// validation failure
{ "success": false, "code": 500, "message": "Gift short name must be at most 32 characters.",
  "result": { "errors": [
    { "field": "giftShortName", "message": "Gift short name must be at most 32 characters." },
    { "field": "pointPrice", "message": "Point price must be greater than 0." } ] } }</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Gift does not exist.</code></td><td>修改时</td></tr><tr><td><code>Gift cannot be moved to another program.</code></td><td>修改时 programId 不同</td></tr><tr><td><code>Gift name is required.</code></td><td></td></tr><tr><td><code>Gift name must be at most 128 characters.</code></td><td></td></tr><tr><td><code>Gift short name is required.</code></td><td></td></tr><tr><td><code>Gift short name must be at most 32 characters.</code></td><td></td></tr><tr><td><code>Gift description must be at most 255 characters.</code></td><td></td></tr><tr><td><code>Invalid gift category.</code></td><td></td></tr><tr><td><code>Point price must be greater than 0.</code></td><td></td></tr><tr><td><code>Cash value must be 0 or greater.</code></td><td></td></tr><tr><td><code>Image URL must be a public https link.</code></td><td></td></tr><tr><td><code>Image URL must be at most 512 characters.</code></td><td></td></tr><tr><td><code>External item id is required when the gift is enabled.</code></td><td></td></tr><tr><td><code>External item id must be at most 64 characters.</code></td><td></td></tr><tr><td><code>Invalid badge.</code></td><td>仅 '' / hot / new</td></tr><tr><td><code>Sort order must be 0 or greater.</code></td><td></td></tr><tr><td><code>display_from must be earlier than display_to.</code></td><td></td></tr><tr><td><code>Show on dashboard must be 0 or 1.</code></td><td></td></tr><tr><td><code>Use in notification must be 0 or 1.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. 注意</h4><p>新建的礼品为停用状态，因此 G3 是礼品上架到 dashboard 的唯一入口。DB 默认值为 <code>enabled = 1</code>，但为安全起见 API 在新建时覆盖为 0。</p></div></div><div class="specsrc" id="spec-g3" data-title="G3 · /point/admin/gift/enable"><p class="specmeta"><code>POST</code> · <code>/point/admin/gift/enable</code></p><p>启用/停用 1 个礼品（Gift List 标签页上的开关）。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>是</td><td>礼品必须存在。</td></tr><tr><td><code>enabled</code></td><td>int</td><td>是</td><td>0 / 1.</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>检查礼品存在。</li>
<li>启用时（<code>enabled = 1</code>）：要求 <code>external_item_id</code> 不为空（RI1 —— 需要 ID 来对账 TADA 价格）。为空 → 报错。</li>
<li>UPDATE <code>enabled</code>, <code>update_user</code>, <code>update_date = UTC_TIMESTAMP()</code>.</li></ol>
<p>没有删除 API：<code>enabled = 0</code> 是将礼品从 dashboard + 消息中下架的方式。<code>enabled</code> 优先于其他所有展示字段。</p><pre>UPDATE point_featured_gift
SET enabled = #{enabled}, update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE id = #{id};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": null }</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Gift does not exist.</code></td><td></td></tr><tr><td><code>Enabled must be 0 or 1.</code></td><td></td></tr><tr><td><code>External item id is required before enabling this gift.</code></td><td>RI1</td></tr></table></div></div><div class="specsrc" id="spec-r1" data-title="R1 · /point/admin/redemption/order/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/redemption/order/list</code></p><p>1 个积分计划内客户的兑换订单列表（point_redemption_order）。只读。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>是</td><td>积分计划必须有客户组（RI2）。</td></tr><tr><td><code>clientId</code></td><td>long</td><td>否</td><td>精确匹配。</td></tr><tr><td><code>orderReference</code></td><td>string</td><td>否</td><td>精确匹配订单号。</td></tr><tr><td><code>status</code></td><td>string</td><td>否</td><td><code>new</code> / <code>on process</code> / <code>completed</code> / <code>canceled</code> / <code>failed</code>.</td></tr><tr><td><code>createDate_begin</code></td><td>string</td><td>否</td><td><code>yyyy-MM-dd HH:mm:ss</code> UTC.</td></tr><tr><td><code>createDate_end</code></td><td>string</td><td>否</td><td>UTC，不含该时间点（<code>&lt;</code>）。</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>否</td><td>默认 1。</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>否</td><td>默认 10，最大 100。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>获取积分计划的客户组：<code>SELECT client_group FROM promo_client_group WHERE promo_table = 'point_program' AND promo_config_id = ?</code>。没有 → 返回空。</li>
<li>见下方查询；JOIN <code>crm_customer_base</code> 以限定属于该客户组的客户（RI2）。<code>o.client_id</code> 是 <code>varchar</code> → JOIN 时 CAST（RI6）。</li>
  <li>返回 <code>orderDate</code>，取自列 <code>order_date</code>（新列）= 下单时间（TADA response 中的 trxDate），区别于 <code>create_date</code>（HSB 首次同步时间）和 <code>last_status_at</code>（最近一次状态变更时间）。</li>
<li><b>返回前对敏感数据脱敏</b>（4.3）：不返回 <code>raw_payload</code>。<code>order_items</code> 精简为数组 <code>{itemName, itemType, quantity, status}</code> —— <b>遮盖 e-voucher 码/PIN 和 PLN token</b>。<code>recipient</code> 在列表中只返回姓名（部分遮盖）+ 城市，不返回完整地址/电话。<code>fees</code>（IDR 金额）对 Smart CRM 用户<b>正常显示</b>（内部工具 —— 已确认）；不输出到客户 app。</li>
<li>按 <code>create_date DESC, id DESC</code> 排序。</li></ol><pre>SELECT o.id, o.order_reference, o.order_number, o.client_id, o.status,
       o.order_items, o.recipient, o.fees, o.order_date, o.last_status_at, o.create_date, o.update_date
FROM point_redemption_order o
JOIN crm_customer_base c ON c.client_id = CAST(o.client_id AS UNSIGNED)
WHERE o.external_system = 'tada'
  AND c.deleted = 0
  AND c.group_code = (SELECT client_group FROM promo_client_group
                      WHERE promo_table = 'point_program' AND promo_config_id = #{programId} LIMIT 1)
  AND (#{clientId}       IS NULL OR o.client_id = #{clientId})
  AND (#{orderReference} IS NULL OR o.order_reference = #{orderReference})
  AND (#{status}         IS NULL OR o.status = #{status})
  AND (#{createDateBegin} IS NULL OR o.create_date &gt;= #{createDateBegin})
  AND (#{createDateEnd}   IS NULL OR o.create_date &lt;  #{createDateEnd})
ORDER BY o.create_date DESC, o.id DESC
LIMIT #{offset}, #{pageSize};
-- raw_payload is intentionally NOT selected (raw webhook payload, sensitive).</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": {
    "total": 1,
    "records": [{
      "id": 10, "orderReference": "CI23062210514901613152", "orderNumber": "TADA18102908185099",
      "clientId": "7209001", "status": "on process",
      "items": [ { "itemName": "Logam Mulia UBS 1 Gram", "itemType": "physical", "quantity": 1, "status": "on process" } ],
      "recipient": { "name": "Jo***", "city": "Jakarta" },
      "fees": [ { "name": "Shipping", "amount": 20000 } ],
      "orderDate": "2026-06-22 10:51:50",
      "lastStatusAt": "2026-10-20 03:12:05", "createDate": "2026-10-20 03:00:00", "updateDate": "2026-10-20 03:12:05"
    }]
  }
}</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Program has no client group.</code></td><td>RI2</td></tr><tr><td><code>Order status is invalid.</code></td><td>status 筛选值无效</td></tr></table></div><div class="specsec"><h4>5. 注意</h4><p>订单详情 API（完整收货地址、券码）<b>本阶段暂不需要</b>（Smart CRM 已确认）。将来实现时仍需遮盖码/PIN/token 并记录访问日志。</p></div></div><div class="specsrc" id="spec-r2" data-title="R2 · /point/admin/redemption/transaction/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/redemption/transaction/list</code></p><p>1 个积分计划内客户的 Coin 扣减/退还交易列表（point_redemption_transaction）。只读。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>是</td><td>积分计划必须有客户组。</td></tr><tr><td><code>clientId</code></td><td>long</td><td>否</td><td>精确匹配。</td></tr><tr><td><code>orderReference</code></td><td>string</td><td>否</td><td>精确匹配。</td></tr><tr><td><code>status</code></td><td>int</td><td>否</td><td><code>1</code> 已扣减 / <code>2</code> 已退还。</td></tr><tr><td><code>reconciled</code></td><td>int</td><td>否</td><td><code>0</code> 未对账 / <code>1</code> 待人工核对 / <code>2</code> 已对账（RI5）。</td></tr><tr><td><code>createDate_begin</code></td><td>string</td><td>否</td><td>UTC.</td></tr><tr><td><code>createDate_end</code></td><td>string</td><td>否</td><td>UTC, <code>&lt;</code>.</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>否</td><td>默认 1。</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>否</td><td>默认 10，最大 100。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>按 R1 方式获取积分计划的客户组。</li>
<li>见下方查询；按 <code>client_id</code> JOIN <code>crm_customer_base</code>（此处为 <code>bigint</code>，无需 CAST）。</li>
<li><b>脱敏</b>（4.3）：不返回 <code>raw_request</code>、<code>raw_response</code>。<code>idr_amount</code>（IDR 金额）对 Smart CRM 用户<b>正常显示</b>（内部 —— 已确认）；不输出到客户 app。</li>
<li>额外返回 <code>reconcile_user</code>、<code>reconcile_remark</code>、<code>reconcile_date</code>（3 个新列），供前端显示核对人（见 R5）。</li>
<li>按 <code>create_date DESC, id DESC</code> 排序。</li></ol><pre>SELECT t.id, t.order_reference, t.client_id, t.trx_id, t.coin_amount, t.idr_amount,
       t.status, t.reconciled, t.redeem_date, t.void_trx_id, t.void_date, t.fail_reason,
       t.reconcile_user, t.reconcile_remark, t.reconcile_date,   -- 3 NEW columns (R5, DEV-09)

FROM point_redemption_transaction t
JOIN crm_customer_base c ON c.client_id = t.client_id
WHERE t.external_system = 'tada'
  AND c.deleted = 0
  AND c.group_code = (SELECT client_group FROM promo_client_group
                      WHERE promo_table = 'point_program' AND promo_config_id = #{programId} LIMIT 1)

  AND (#{createDateEnd}   IS NULL OR t.create_date &lt;  #{createDateEnd})
ORDER BY t.create_date DESC, t.id DESC
LIMIT #{offset}, #{pageSize};
-- raw_request / raw_response are intentionally NOT selected (raw payload, sensitive).</pre></div><div class="specsec"><h4>3. Response</h4><pre>{

    "total": 1,
    "records": [{

    }]

}</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Program has no client group.</code></td><td></td></tr><tr><td><code>Status must be 1 or 2.</code></td><td></td></tr><tr><td><code>Reconciled must be 0, 1 or 2.</code></td><td>RI5</td></tr></table></div><div class="specsec"><h4>5. 注意</h4><p>被拒绝的交易（余额不足、黑名单、超出限额...）<b>不会保存</b>到表中（引擎删除该行），因此该表只包含扣减/退还成功的订单。</p></div></div><div class="specsrc" id="spec-r3" data-title="R3 · /point/admin/redemption/blacklist/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/redemption/blacklist/list</code></p><p>1 个积分计划内客户的兑换黑名单列表（enabled 为 0 和 1 均包含）。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>是</td><td>积分计划必须有客户组。</td></tr><tr><td><code>clientId</code></td><td>long</td><td>否</td><td>精确匹配。</td></tr><tr><td><code>enabled</code></td><td>int</td><td>否</td><td><code>1</code> Blacklisted, <code>0</code> Whitelisted.</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>否</td><td>默认 1。</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>否</td><td>默认 10，最大 100。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>获取积分计划的客户组。</li>
<li>精确筛选全局 redeem 行（<code>promo_table = 'point_redemption_transaction'</code>、<code>promo_config_id = 0</code>、<code>point_task_bundle_id = 0</code>），JOIN <code>crm_customer_base</code> 限定为该积分计划的客户。</li>
<li>按 <code>update_date DESC, id DESC</code> 排序。</li></ol>
<p><b>UI 注意（RI3）：</b> 该行会禁止客户在所有积分计划中兑换礼品。前端必须明确提示“全系统禁止”，而不仅限于当前积分计划。</p><pre>SELECT bl.id, bl.client_id, bl.enabled, bl.remark,
       bl.create_user, bl.create_date, bl.update_user, bl.update_date
FROM client_promotion_blacklist bl
JOIN crm_customer_base c ON c.client_id = bl.client_id
WHERE bl.promo_table = 'point_redemption_transaction'
  AND bl.promo_config_id = 0 AND bl.point_task_bundle_id = 0
  AND c.deleted = 0
  AND c.group_code = (SELECT client_group FROM promo_client_group
                      WHERE promo_table = 'point_program' AND promo_config_id = #{programId} LIMIT 1)
  AND (#{clientId} IS NULL OR bl.client_id = #{clientId})
  AND (#{enabled}  IS NULL OR bl.enabled = #{enabled})
ORDER BY bl.update_date DESC, bl.id DESC
LIMIT #{offset}, #{pageSize};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": {
    "total": 1,

                  "createUser": "admin01", "createDate": "2026-10-21 03:00:00",
                  "updateUser": "admin01", "updateDate": "2026-10-21 03:00:00" }]

}</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Program has no client group.</code></td><td></td></tr><tr><td><code>Enabled must be 0 or 1.</code></td><td></td></tr></table></div></div><div class="specsrc" id="spec-r4" data-title="R4 · /point/admin/redemption/blacklist/save"><p class="specmeta"><code>POST</code> · <code>/point/admin/redemption/blacklist/save</code></p><p>将客户加入兑换黑名单，或切换 Blacklisted ↔ Whitelisted（全局拦截）。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>是</td><td>用于新增时校验客户是否属于该积分计划。</td></tr><tr><td><code>clientId</code></td><td>long</td><td>是</td><td>正数。</td></tr><tr><td><code>enabled</code></td><td>int</td><td>是</td><td><code>1</code> blacklist, <code>0</code> whitelist.</td></tr><tr><td><code>remark</code></td><td>string</td><td>否</td><td>Trim，≤ 120 字符（<code>varchar(120) NOT NULL</code>）。新增时未传 → <code>''</code>；变更状态时：传了则覆盖，未传则保留原值。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>获取积分计划的客户组。</li>
<li>开启事务：<code>SELECT id, enabled FROM client_promotion_blacklist WHERE client_id = ? AND promo_table = 'point_redemption_transaction' AND promo_config_id = 0 AND point_task_bundle_id = 0 FOR UPDATE</code>。</li>
<li><b>已有记录</b> → UPDATE <code>enabled</code>、<code>remark</code>、<code>update_user</code>、<code>update_date</code>。不校验客户组（允许对已换组的客户执行 whitelist）。</li>
<li><b>尚无记录</b>：<code>enabled = 0</code> → 报错（没有可 whitelist 的记录）。否则校验客户存在且属于该积分计划的客户组（2.3/RI2），然后 INSERT：<code>promotion_code = ''</code>（NOT NULL）、<code>promo_config_id = 0</code>、<code>point_task_bundle_id = 0</code>、<code>enabled = 1</code>、remark，写入 <code>create/update_user</code> + <code>UTC_TIMESTAMP()</code>。<code>uk_client_promo_bundle</code> 重复（2 个管理员同时操作）→ 捕获 DuplicateKey，重新读取后 UPDATE。</li>
<li>在客户下一次调用 API 时立即生效（引擎不缓存黑名单）。</li></ol><pre>SELECT client_id FROM crm_customer_base
WHERE client_id = #{clientId} AND deleted = 0
  AND group_code = (SELECT client_group FROM promo_client_group
                    WHERE promo_table = 'point_program' AND promo_config_id = #{programId} LIMIT 1);

INSERT INTO client_promotion_blacklist
  (client_id, promotion_code, promo_table, promo_config_id, point_task_bundle_id, enabled, remark,
   create_date, create_user, update_date, update_user)
VALUES (#{clientId}, '', 'point_redemption_transaction', 0, 0, 1, IFNULL(#{remark}, ''),
        UTC_TIMESTAMP(), #{currentUser}, UTC_TIMESTAMP(), #{currentUser});

UPDATE client_promotion_blacklist
SET enabled = #{enabled}, remark = IFNULL(#{remark}, remark),
    update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE id = #{id};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": { "id": 9001, "enabled": 1 } }</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Client ID does not exist.</code></td><td></td></tr><tr><td><code>Client {clientId} does not belong to client group {group} of this program.</code></td><td>RI2</td></tr><tr><td><code>Client {clientId} is not on the redeem blacklist.</code></td><td>无记录时加入白名单</td></tr><tr><td><code>Remark must be at most 120 characters.</code></td><td></td></tr><tr><td><code>Enabled must be 0 or 1.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. 注意</h4><p>与 UAT 上的实际 DDL 一致。redeem 行使用 <code>promo_config_id = 0</code>、<code>point_task_bundle_id = 0</code>（非 NULL），因此 <code>uk_client_promo_bundle</code> 可以防重。与 Check-in 组按任务包划分的黑名单（<code>promo_table = 'point_program'</code>）完全不同。</p></div></div><div class="specsrc" id="spec-r5" data-title="R5 · /point/admin/redemption/transaction/reconcile"><p class="specmeta"><code>POST</code> · <code>/point/admin/redemption/transaction/reconcile</code></p><p>将 1 笔交易标记为“已手工核对”（reconciled 1 → 2）。回复 4.1。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>是</td><td>交易必须存在，且为 <code>status = 1</code> 和 <code>reconciled = 1</code>。</td></tr><tr><td><code>remark</code></td><td>string</td><td>是</td><td>Trim，5–255 字符。审核人备注（必填，与 Trading 组 K3 Coin 调整一致）。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>校验交易存在、<code>status = 1</code>、<code>reconciled = 1</code>（仅允许标记 job 已警告需人工审核的订单）。</li>
<li>校验 <code>remark</code>：必填，5–255 字符。</li>
<li>带条件的 UPDATE（防护：仅当仍为 <code>reconciled = 1</code> 时才变更）：set <code>reconciled = 2</code>，并将审核人 / 备注 / 时间写入 3 个新列 <code>reconcile_user</code>、<code>reconcile_remark</code>、<code>reconcile_date</code>（Smart CRM 已要求开发添加这 3 列）。</li></ol>
<p>不允许修改 <code>0 → 2</code>（由 job 自动处理），也不允许改动 <code>2</code>。这是针对孤儿订单（#16）的人工补充操作：job 只发出警告并 set 1，运营人员在 TADA 上退款/处理后，在此标记为 2。</p><pre>UPDATE point_redemption_transaction
SET reconciled = 2,
    reconcile_user = #{currentUser}, reconcile_remark = #{remark}, reconcile_date = UTC_TIMESTAMP(),
    update_date = UTC_TIMESTAMP()
WHERE id = #{id} AND status = 1 AND reconciled = 1;
-- reconcile_user / reconcile_remark / reconcile_date are 3 NEW columns the developer must add to point_redemption_transaction (DEV-09).</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": null }</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Transaction does not exist.</code></td><td></td></tr><tr><td><code>Only transactions pending manual review (reconciled = 1) can be marked as reconciled.</code></td><td>RI5</td></tr><tr><td><code>Remark is required and must be between 5 and 255 characters.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. 注意</h4><p>Smart CRM 已确定保留 R5。3 列 <code>reconcile_user</code> / <code>reconcile_remark</code> / <code>reconcile_date</code> 是需要开发添加到 <code>point_redemption_transaction</code> 的<b>新列</b>（由 Smart CRM 发给开发）。</p></div></div><div class="specsrc" id="spec-n1" data-title="N1 · /point/admin/notifyLog/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/notifyLog/list</code></p><p>某积分计划下客户的 CleverTap 通知日志列表（Omni Marketing 标签页（S2）），最新的在前。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>是</td><td>积分计划必须存在。</td></tr><tr><td><code>clientId</code></td><td>long</td><td>否</td><td>精确匹配。</td></tr><tr><td><code>eventName</code></td><td>string</td><td>否</td><td><a href="#values" class="ref">表 3.1</a> 中 9 个值之一。</td></tr><tr><td><code>subType</code></td><td>string</td><td>否</td><td><code>first_coin</code> / <code>last_trade_earned</code> / <code>not_traded</code>（表 3.2）。不传 = 不筛选。</td></tr><tr><td><code>isSend</code></td><td>int</td><td>否</td><td><code>0</code> 或 <code>1</code>。</td></tr><tr><td><code>sendStatus</code></td><td>int</td><td>否</td><td><code>-1</code> / <code>0</code> / <code>1</code> / <code>2</code>（表 3.3）。</td></tr><tr><td><code>eventDate_begin</code></td><td>string</td><td>否</td><td><code>yyyy-MM-dd HH:mm:ss</code>，UTC，包含该时间点。</td></tr><tr><td><code>eventDate_end</code></td><td>string</td><td>否</td><td><code>yyyy-MM-dd HH:mm:ss</code>，UTC，包含该时间点。必须 ≥ <code>eventDate_begin</code>。</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>否</td><td>默认 1。</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>否</td><td>默认 10，最大 100。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds">
<li>校验参数（Request 表）。不合法 → 报错，不执行查询。</li>
<li>校验积分计划存在，再获取该积分计划的 <code>client_group</code>（SQL (1)、(2)）。积分计划尚未配置客户组 → 报错。</li>
<li>以相同条件执行列表查询和 <code>COUNT(*)</code>。属于该积分计划的客户 = <code>crm_customer_base.group_code = client_group</code>（规则 2.1）。</li>
<li>映射为 DTO：datetime 按 UTC 格式输出，保持 DB 原值；<code>payload</code> 解析为 JSON 对象（DB NULL → <code>null</code>）；<code>isSend</code> 返回 <code>0</code>/<code>1</code>。</li>
</ol><pre>-- (1) program exists

ORDER BY l.event_date DESC, l.id DESC

        "updateDate": null, "updateUser": ""
      }
    ]
  }
}</pre><p>排序：<code>event_date DESC, id DESC</code>。</p></div><div class="specsec"><h4>4. 错误 message</h4><div class="scroll"><table><tr><th>message</th><th style="width:26%">备注</th></tr><tr><td><code>Program ID is required.</code></td><td></td></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Program has no client group.</code></td><td>与 Check-in 组相同的 message</td></tr><tr><td><code>Event name is not valid.</code></td><td>不在表 3.1 中</td></tr><tr><td><code>Sub type is not valid.</code></td><td>不在表 3.2 中</td></tr><tr><td><code>Is send must be 0 or 1.</code></td><td></td></tr><tr><td><code>Send status must be -1, 0, 1 or 2.</code></td><td></td></tr><tr><td><code>Event date must be in yyyy-MM-dd HH:mm:ss format.</code></td><td>_begin 或 _end</td></tr><tr><td><code>Event date end must not be before event date begin.</code></td><td></td></tr><tr><td><code>Page size must be at most 100.</code></td><td></td></tr></table></div></div><div class="specsec"><h4>5. 注意</h4><ul class="rules">
<li>使用动态 SQL（MyBatis 的 <code>&lt;if&gt;</code>），<b>不要</b>写 <code>(#{x} IS NULL OR column = #{x})</code>：这种写法会导致 MySQL 在按 <code>clientId</code> 过滤时不走索引。</li>
<li>用 <code>EXISTS</code> 代替 <code>JOIN</code>：<code>crm_customer_base.client_id</code> 不唯一，JOIN 可能导致日志行重复。</li>
<li>不要 SELECT <code>crm_customer_base</code> 的任何列（该表含邮箱、手机号、密码、证件号）。仅在 <code>EXISTS</code> 内部使用 <code>group_code</code>。</li>
<li>不过滤 <code>crm_customer_base.deleted</code>：日志是历史记录，已删除客户的旧日志仍可查看。</li>
<li>规则 2.1 的后果（Smart CRM 已指出）：客户变更 <code>group_code</code> 后，查看时其全部旧日志都会归入新的积分计划。</li>
<li>无写入 API：Smart CRM 不修改、不重发日志。</li>
</ul></div></div></div></section><section class="panel" id="rules" role="tabpanel">
<h2>规则与校验</h2>
<p>API 必须遵守的引擎规则（一旦违反，引擎不会报错，而是静默地错误运行），以及各表单逐字段的校验。</p>
<h3>引擎规则 – 权限与签到</h3><div class="scroll"><table><tr><th style="width:6%">#</th><th style="width:44%">规则</th><th>违反后果</th></tr><tr><td>I1</td><td>一个 client_group 只能有恰好 1 条 <code>promo_table = 'point_program'</code> 的 <code>promo_client_group</code> 行，<code>enabled = 0</code> 的行也计算在内。</td><td>引擎按 <code>client_group</code> 查找任务。一个客户组关联 2 个已启用的积分计划 → 客户看到 2 个签到任务 → <code>getList</code> 返回 <code>CONFIG_REASON_02</code> 并全部隐藏；交易 API 则静默选取 id 最小的任务。</td></tr><tr><td>I2</td><td>在 1 个积分计划内，任意时刻最多只能有 <b>1 个生效中的签到任务</b>：任务 <code>enabled = 1</code>、任务包 <code>enabled = 1</code>、<code>display_hide_to_all = 0</code> 且展示时间窗重叠。</td><td>原因同 <code>CONFIG_REASON_02</code>：只要有 2 个任务同时展示，该积分计划的<b>所有</b>客户都会丢失签到卡片。这是第 2 节尚未包含的规则。</td></tr><tr><td>I3</td><td><code>task.program_id = bundle.program_id</code>。创建后任务不能更换任务包，任务包也不能更换积分计划。</td><td>历史记录和连签链也按 <code>program_id + task_bundle_id + task_id</code> 查找。更换任务包会导致客户在 app 上丢失连签和历史记录。</td></tr><tr><td>I4</td><td>积分/exp JSON 格式为 <code>{"cycles": [[...], ...]}</code>，元素为 ≥ 0 的整数，每个 cycle 恰好 <code>routine_cycle_limit_days</code> 个元素。Streak（<code>restart = 1</code>）恰好 1 个 cycle；日历型（<code>restart = 0</code>）恰好 <code>routine_cycle_repeat</code> 个 cycle。</td><td>缺失时引擎不报错：没有配置的那天得 <b>0 积分</b>。Streak 始终读取 cycle 1；日历型读取第 <i>n</i> 个 cycle。</td></tr><tr><td>I5</td><td><code>point_expiration_window</code> 不能为 NULL，即使 <code>point_expiration_type = 'no_limit'</code> 时也一样。</td><td>window 为 NULL 时引擎返回的到期时间 = NULL → <code>point_lot.point_expiration_time</code> 为 NULL → Coin 已入账，但所有余额查询（<code>point_expiration_time &gt; now</code>）都会忽略：客户看不到，也无法使用。</td></tr><tr><td>I6</td><td><code>tz_minutes</code>、<code>routine_cycle_repeat</code>、<code>routine_cycle_limit_days</code> 必须由 API 显式写入，不能依赖 DB 默认值。</td><td>DDL 为 NOT NULL 且带默认值：<code>tz_minutes = 0</code>（UTC 时间）、<code>routine_cycle_repeat = 1</code>、<code>routine_cycle_limit_days = 7</code>。若遗漏，任务仍可保存，但会静默错误运行：日期按 UTC 计算，或连签客户一进入第 2 个周期就被永久拦截。</td></tr><tr><td>I7</td><td>所有枚举字段都必须是列表中的某一个值（规则标签页）。</td><td><code>display_event</code> 错误 → 任务永不展示。<code>participate_period_limit_type</code> 错误 → 无法签到。<code>claim_valid_period_type</code> 错误 → 领取期限为 NULL → 按周期领取永远领不到。<code>claim_valid_period_type</code> 和 <code>point_expiration_type</code> 在任务表中允许 NULL，但在日志表中为 NOT NULL：若为 NULL，则<b>每次签到都会报错</b>（<code>CHECKIN_FAIL</code>）。</td></tr><tr><td>I8</td><td>黑名单只有 2 个层级：整个积分计划（<code>point_task_bundle_id</code> 为 NULL）和单个任务包。没有任务级。</td><td>引擎读取 <code>enabled = 1</code>、<code>promo_table = 'point_program'</code>、<code>promo_config_id</code> = 任务所属积分计划的行；bundle 为 NULL 则拦截整个积分计划，bundle 匹配则拦截该任务包。</td></tr></table></div>
<h3>引擎规则 – 交易与 Coin</h3><div class="scroll"><table><tr><th style="width:6%">#</th><th style="width:44%">规则</th><th>违反后果</th></tr><tr><td>J1</td><td><code>task.program_id = bundle.program_id</code>；创建后任务不能更换任务包，也不能更换积分计划。</td><td>每日日志和订单明细会快照 <code>program_id</code> / <code>task_bundle_id</code>。任务包级黑名单按任务当前所属的任务包查找：更换任务包即改变被拦截的客户集合。</td></tr><tr><td>J2</td><td>每个积分计划应只有 <b>1 个生效中的交易任务</b>（任务 + 任务包 + 积分计划均已启用，参与时间窗开启中）。2026-10-21 已确认：存在 2 个任务属于配置人员的错误；Smart CRM <b>给出警告并要求确认</b>，不做硬性拦截（见概览标签页中的“已确认决策”）。</td><td>每笔订单只会分配给 <b>1</b> 个任务（引擎按 id 升序遍历任务，跳过被 book type 拦截的任务，取第一个客户未被列入黑名单的任务），因此<b>不会</b>重复发放 Coin。但 app 按<i>展示</i>条件选任务，而引擎按<i>参与</i>条件选：两边可能选中 2 个不同的任务 → Coin 计入 app 未展示的任务。</td></tr><tr><td>J3</td><td><code>participate_period_limit_type = 'specific_period'</code> 时必须<b>同时</b>有 <code>participate_period_from</code> 和 <code>participate_period_to</code>，且 <code>from &lt; to</code>。</td><td>引擎用 <code>now &gt;= from AND now &lt; to</code> 选择任务：缺少任一端即为 NULL → 该任务永远不计 Coin。此外，订单必须在该时间窗内<b>开仓并平仓</b>才会计入。</td></tr><tr><td>J4</td><td><code>display_event</code> 必须是 4 个值之一（规则标签页），不能为 NULL。</td><td>该列允许 NULL。NULL 或非法值 → app 永不展示该任务，但引擎<b>仍会计算 Coin</b>（引擎不读取 display_event）：客户有 Coin，却看不到该积分计划。</td></tr><tr><td>J5</td><td>兑换比例行：<code>(mt5_group, condition_type, condition_value)</code> 不可重复（不区分大小写）；<code>any</code> 行存储 <code>condition_value = 'other'</code>。</td><td>引擎将所有行放入 1 个以小写为键的 map：有 2 行重复（即使仅大小写不同）时，后加载的行会覆盖先前的行，结果不可预测。<code>any</code> 行的 value 不是 <code>other</code> 或为空时，<b>永远无法匹配</b>。</td></tr><tr><td>J6</td><td>任务要能计算 Coin，必须至少有 1 条兑换比例行 <code>point_per_lot &gt; 0</code>。</td><td>没有任何行：所有订单都记为 <code>NO_RATE_CONFIG</code>，0 Coin；app 隐藏比例表和 <code>rateRange = null</code>。</td></tr><tr><td>J7</td><td>任务已有数据后，<code>tz_minutes</code>、<code>release_auto_delay_day</code> 不可修改（“运行中锁定”标签页）。</td><td><code>tz_minutes</code> 决定日期边界（<code>period_key</code>）和每日上限。<code>release_auto_delay_day</code> 在当天第一笔订单时快照到每日日志，而每笔订单的预定发放时间按处理时的配置计算：中途修改会导致同一天出现两种发放方式。</td></tr><tr><td>J8</td><td>3 个层级（积分计划、任务包、任务）上的 <code>display_hide_book_type</code> 是<b>Coin 计算</b>规则，而不只是展示设置。</td><td>任一层级匹配客户的 book type 时，引擎就跳过该任务：被拦截的 A-book/B-book 客户不计 Coin。修改值从下一次引擎运行起生效（≤ 3 分钟）。</td></tr></table></div>
<h3>引擎规则 – 礼品与 redemption</h3><div class="scroll"><table><tr><th style="width:6%">#</th><th style="width:44%">规则</th><th>违反后果</th></tr><tr><td>RI1</td><td><code>point_featured_gift</code> 只是<b>展示用的礼品列表</b>（dashboard + message）。它<b>不是</b> TADA 扣 Coin 所依据的 catalog：TADA 自行管理 catalog。<code>point_price</code> 必须与 TADA 上的价格完全一致。</td><td>若不一致，dashboard 显示一个价格，但客户在 webview 中兑换时 TADA 扣除的 Coin 数量不同 → 引发投诉。没有 DB 约束强制一致；需与 TADA 手工对账（使用 <code>external_item_id</code>）。</td></tr><tr><td>RI2</td><td><code>point_redemption_order</code> 和 <code>point_redemption_transaction</code> <b>没有</b> <code>program_id</code> 列。某积分计划的 redemption 数据 = <code>crm_customer_base.group_code</code> 等于该积分计划客户组的 <code>client_id</code>（通过 <code>promo_client_group</code>）。</td><td>客户变更 <code>group_code</code> 后，其全部 redeem/Coin 历史都会转到新积分计划的视图中。按客户过滤，而不是按积分计划外键过滤。</td></tr><tr><td>RI3</td><td>redeem 黑名单是<b>每个客户 1 条全局记录</b>：<code>promo_table='point_redemption_transaction'</code>、<code>promo_config_id=0</code>、<code>point_task_bundle_id=0</code>、<code>enabled=1</code>。</td><td>该行会禁止客户在<b>所有</b>积分计划中兑换，而不只是当前查看的积分计划。引擎在 get-point / redeem-point / redeem/session 中读取它（拦截消费），但在 topup-point 中<b>不读取</b>（退款照常执行）。按积分计划划分的标签页只是按该积分计划客户过滤的视图。</td></tr><tr><td>RI4</td><td><code>point_redemption_transaction</code> 是资金记录（<code>status</code> 1=已扣 / 2=已退，<code>coin_amount</code>）。<code>point_redemption_order</code> 是由 TADA webhook 同步的订单状态缓存。两表共用 <code>external_system + order_reference</code>（unique <code>uk_partner_order</code>）。</td><td>Coin 已由 partner redeem-point 流程预先扣除；Smart CRM <b>只读取</b> order/transaction。任何资金变更都必须经由引擎，不能在此手工修改。</td></tr><tr><td>RI5</td><td><code>reconciled</code> 有 3 个值：<code>0</code> 未对账，<code>1</code> 待人工审核（job 已警告），<code>2</code> 已对账 —— 依据已部署版本中的枚举 <code>PointRedeemReconciledEnum</code>。</td><td>UAT 上的 DDL comment 仍是旧的 <code>0=未对账,1=已对账</code>（只有 2 个值）—— 已过时，需开发更新 comment。Smart CRM 使用 0/1/2；“标记为已审核”操作只会将 1 → 2。</td></tr><tr><td>RI6</td><td>各表中 <code>client_id</code> 的类型不同：<code>point_redemption_order.client_id</code> 为 <code>varchar(32)</code>，<code>point_redemption_transaction.client_id</code> 为 <code>bigint</code>，<code>crm_customer_base.client_id</code> 为 <code>bigint</code>。</td><td>order 与 crm JOIN 时必须 CAST（<code>CAST(o.client_id AS UNSIGNED)</code>）；跨表比较 <code>group_code</code> 可能需要 <code>COLLATE</code>（签到模块曾遇到 1267 错误）。保持相同的 collation <code>utf8mb4_0900_ai_ci</code>。</td></tr></table></div>

<h3>Validation check-in task (C1, C2)</h3>
<p>适用于 C1（创建/编辑），并在通过 C2 启用时重新执行。“自动保存”表示后端自行写入该值，忽略前端传入的值。</p>
<h4>逐字段</h4>
<div class="scroll"><table>
<tr><th style="width:19%">Field</th><th style="width:9%">类型</th><th style="width:11%">必填</th><th style="width:31%">合法值</th><th>引擎如何使用</th></tr><tr><td><code>taskName</code></td><td>string</td><td>是</td><td>Trim，1–100 字符（varchar(100)）。</td><td>仅用于展示。</td></tr><tr><td><code>taskDescription</code></td><td>string</td><td>否</td><td>≤ 255 字符（<code>varchar(255)</code>）。</td><td>仅用于展示。</td></tr><tr><td><code>displayHideBookType</code></td><td>int</td><td>是</td><td><code>0</code> / <code>1</code> / <code>2</code>.</td><td>与客户的 <code>client_book_type</code> 比较（NULL = 9）。仅在 <code>getList</code> 中隐藏卡片；签到 API 不会再次校验 book type。</td></tr><tr><td><code>tzMinutes</code></td><td>int</td><td>是</td><td>−720 … 840，须为 15 的倍数。例如 GMT+7 = <code>420</code>。</td><td>日期边界、签到日期、积分到期时间（按该时区 23:59:59）。该列为 NOT NULL DEFAULT 0：不传则任务按 UTC 运行（I6）。</td></tr><tr><td><code>displayEvent</code></td><td>string</td><td>是</td><td><code>signup</code> / <code>kyc_approve</code> / <code>first_time_deposit</code> / <code>first_trade</code>.</td><td>客户达成事件后才能看到卡片。其他值 → 所有人都看不到。</td></tr><tr><td><code>displayPeriodLimitApply</code></td><td>int</td><td>是</td><td><code>0</code> 不限 / <code>1</code> 限定。</td><td></td></tr><tr><td><code>displayPeriodFrom</code></td><td>datetime UTC</td><td>Khi apply = 1</td><td><code>yyyy-MM-dd HH:mm:ss</code> UTC。Apply = 0 → 存 NULL。</td><td>当 <code>from ≤ now &lt; to</code> 时展示。</td></tr><tr><td><code>displayPeriodTo</code></td><td>datetime UTC</td><td>Khi apply = 1</td><td>&gt; <code>displayPeriodFrom</code>.</td><td><code>to</code> 时间点不包含在内（到达该秒即隐藏）。</td></tr><tr><td><code>displayHideToAll</code></td><td>int</td><td>是</td><td><code>0</code> / <code>1</code>.</td><td>1 = 对所有客户隐藏（包括正在进行中的客户）。</td></tr><tr><td><code>participateEvent</code></td><td>string</td><td>是</td><td>与 <code>displayEvent</code> 相同的 4 个值。</td><td>未达成事件 → <code>participate_status = not_allow</code>。日历型用事件发生的时间点计算 cycle。</td></tr><tr><td><code>participatePeriodLimitType</code></td><td>string</td><td>是</td><td><code>no_limit</code> / <code>specific_period</code>.</td><td>其他值 → 签到 API 永远找不到该任务。</td></tr><tr><td><code>participatePeriodFrom</code></td><td>datetime UTC</td><td>Khi specific_period</td><td>UTC。<code>no_limit</code> → 存 NULL。</td><td>当 <code>from ≤ now &lt; to</code> 时可签到。</td></tr><tr><td><code>participatePeriodTo</code></td><td>datetime UTC</td><td>Khi specific_period</td><td>&gt; <code>participatePeriodFrom</code>.</td><td></td></tr><tr><td><code>restartMissedCheckinEnabled</code></td><td>int</td><td>是</td><td><code>1</code> 连签（漏签 1 天或周期结束 → 回到 Day 1）/ <code>0</code> 日历型（周期按自事件起的天数推进，无论是否签到）。</td><td>决定 cycle 计算公式及积分 JSON 的读取方式。</td></tr><tr><td><code>routineCycleLimitDays</code></td><td>int</td><td>是</td><td>1 … 366.</td><td>每个周期的天数。</td></tr><tr><td><code>routineCycleRepeat</code></td><td>int</td><td>是</td><td>≥ 1；streak 另有 V13。</td><td><code>cycle &gt;</code> 该值的客户会被永久拦截（<code>OUT_OF_CYCLE</code>，卡片显示 <code>completed</code>）。该列为 NOT NULL DEFAULT 1（I6）。</td></tr><tr><td><code>firstDayDefinition</code></td><td>int</td><td>Khi restart = 0</td><td><code>0</code> 事件发生当天为 Day 1 / <code>1</code> 次日为 Day 1。Streak → 存 0。</td><td>仅日历型使用。</td></tr><tr><td><code>pointDistributeSpecifyEachDay</code></td><td>JSON string</td><td>是</td><td><code>{"cycles": [[n, …], …]}</code>，n 为整数 0 … 2147483647（<code>point_earned</code> 为 <code>int</code>）；结构遵循 V04–V07。列类型为 <code>json</code>：MySQL 保存时会自动规范化空白字符。</td><td>每天的积分。缺少某天 → 0 积分，不报错（I4）。</td></tr><tr><td><code>expDistributeSpecifyEachDay</code></td><td>JSON string</td><td>否</td><td>与积分 JSON 结构相同。留空 → 后端按相同结构存全 0。</td><td>EXP 尚未在其他模块中使用。</td></tr><tr><td><code>fixedCashValuePerPointUnit</code></td><td>decimal</td><td>是</td><td>0 … 99999999999999.9999，最多 4 位小数（<code>decimal(18,4)</code>）。建议默认值 <code>0</code>。</td><td>快照到日志和批次。引擎将 NULL 视为 0，但建议存数值。</td></tr><tr><td><code>claimType</code></td><td>string</td><td>是</td><td><code>claim_each_day</code>（签到即发放积分）/ <code>claim_each_cycle</code>（周期结束后客户点击领取）。</td><td></td></tr><tr><td><code>claimRe <h4>跨字段规则</h4>
<div class="scroll"><table>
<tr><th style="width:6%">#</th><th style="width:50%">规则</th><th>message</th></tr><tr><td>V01</td><td>任务包存在；<code>programId</code>（如有传）= 该任务包的 <code>program_id</code>；编辑时 <code>taskBundleId</code> 不可变。</td><td><code>Check-in task bundle does not exist. / Program does not match the bundle's program. / Check-in task cannot be moved to another bundle.</code></td></tr><tr><td>V02</td><td><code>displayPeriodLimitApply = 1</code> → 必须有 from、to 且 from &lt; to。为 0 → 两者均存 NULL。</td><td><code>Display period from and to are required when the display period is limited. / Display period to must be later than display period from.</code></td></tr><tr><td>V03</td><td><code>specific_period</code> → 必须有 from、to 且 from &lt; to。<code>no_limit</code> → 存 NULL。</td><td><code>Participate period from and to are required for specific_period. / Participate period to must be later than participate period from.</code></td></tr><tr><td>V04</td><td>积分 JSON 可解析，且为对象，键 <code>cycles</code> = 由 ≥ 0 整数数组组成的数组。</td><td><code>Daily points must be JSON like {"cycles": [[5, 8, 10]]} with whole numbers of 0 or more.</code></td></tr><tr><td>V05</td><td>Streak（<code>restart = 1</code>）→ 恰好 1 个 cycle。</td><td><code>Streak tasks must have exactly one cycle of daily points.</code></td></tr><tr><td>V06</td><td>日历型（<code>restart = 0</code>）→ cycle 数 = <code>routineCycleRepeat</code>。</td><td><code>Calendar tasks need one list of daily points per cycle: expected {repeat}, got {n}.</code></td></tr><tr><td>V07</td><td>每个 cycle 恰好 <code>routineCycleLimitDays</code> 个元素。</td><td><code>Each cycle must have exactly {L} days (cycle {k} has {m}).</code></td></tr><tr><td>V08</td><td>exp JSON（如有传）与积分 JSON 结构相同，并遵循 V04。</td><td><code>Daily EXP must have the same cycles and days as daily points.</code></td></tr><tr><td>V09</td><td><code>claim_each_cycle</code> → <code>claimRequireDayPerCycle</code> 取值范围为 1 … L。</td><td><code>Minimum check-ins per cycle must be between 1 and {L}.</code></td></tr><tr><td>V10</td><td><code>claim_each_cycle</code> → <code>claimValidPeriodType</code> 必须合法。<code>claim_each_day</code> → 后端存 <code>no_limit</code>，window 为 NULL。</td><td><code>Claim valid period type must be days_after_completion or no_limit.</code></td></tr><tr><td>V11</td><td><code>days_after_completion</code> → window 1 … 7300.</td><td><code>Claim valid window must be between 1 and 7300 days.</code></td></tr><tr><td>V12</td><td><code>days_after_claim</code> → <code>pointExpirationWindow</code> 1 … 7300。<code>no_limit</code> → 存 7300。</td><td><code>Point expiration window must be between 1 and 7300 days.</code></td></tr><tr><td>V13</td><td>Streak → <code>routineCycleRepeat</code> ≥ 参与时间窗的天数（<code>specific_period</code>，向上取整）或 ≥ 9999（<code>no_limit</code>）。每天最多开启 1 个新 cycle，因此该取值可保证没有客户触及上限。</td><td><code>For streak tasks, cycle repeat must be at least {days} so that clients are never blocked by the cycle limit.</code></td></tr><tr><td>V14</td><td>所有枚举值都在列表内；所有数字都在上表范围内；字符串长度不超过上表所列；<code>tzMinutes</code> 为 15 的倍数。DB 有默认值的字段（<code>tzMinutes</code>、<code>routineCycleLimitDays</code>、<code>routineCycleRepeat</code>、<code>restartMissedCheckinEnabled</code>）仍必须传（I6）。</td><td><code>{Field} is required. / {Field} must be one of: {values}. / {Field} must be between {min} and {max}. / {Field} must be at most {n} characters.</code></td></tr><tr><td>V15</td><td><b>I2.</b> 任务保存/启用后若处于生效中（任务启用、任务包启用、<code>display_hide_to_all = 0</code>），则同一积分计划内不能存在其他展示时间窗重叠的生效中签到任务。两个时间窗在任一方不限（<code>apply = 0</code>）或 <code>from1 &lt; to2 AND from2 &lt; to1</code> 时视为重叠。时间窗已结束的任务不计入。</td><td><code>Check-in task {otherId} ({otherName}) is already live for an overlapping display period. Clients can only see one check-in task at a time.</code></td></tr><tr><td>V16</td><td>任务已有客户参与 → “运行中锁定”标签页中被锁定的字段必须保持不变；<code>routineCycleRepeat</code> 只能增加。</td><td><code>{Field} cannot be changed after clients have checked in to this task. / Cycle repeat can only be increased after clients have checked in.</code></td></tr>

<h4>I2 校验 SQL（V15）</h4>
<pre>-- V15: other live check-in tasks of the same program whose display window overlaps the candidate
SELECT d.id, d.task_name
FROM point_task_daily_checkin d
JOIN point_task_bundle b ON b.id = d.task_bundle_id
WHERE d.program_id = #{programId}
  AND d.id &lt;&gt; #{candidateId}                       -- 0 when creating
  AND d.enabled = 1 AND d.display_hide_to_all = 0
  AND (b.enabled = 1 OR b.id = #{enablingBundleId})  -- B3: bundle being enabled counts as on; C1/C2: 0
  AND (d.display_period_limit_apply = 0 OR d.display_period_to &gt; UTC_TIMESTAMP())   -- not finished
  AND ( #{candApply} = 0 OR d.display_period_limit_apply = 0
        OR (d.display_period_from &lt; #{candTo} AND #{candFrom} &lt; d.display_period_to) )
LIMIT 1;</pre>
<h4>合法积分 JSON 示例</h4>
<pre>-- streak, 7 days (MiTrade):
{"cycles": [[5, 8, 10, 12, 14, 17, 34]]}

-- calendar, routine_cycle_limit_days = 3, routine_cycle_repeat = 2:
{"cycles": [[10, 20, 30], [10, 20, 40]]}</pre>
<p>周期数较多的日历型（例如 52 周）JSON 会很长：前端可让用户只录入 1 个周期，然后“应用到所有周期”，再发送展开后的数据。</p>


<h3>Validation trading task (T1, T2)</h3>
<p>适用于 T1，并在通过 T2 启用时重新执行。所有字段与 <code>point_task_trading</code> 列一一对应（camelCase）。T1 不接收 <code>enabled</code>。</p>
<h4>任务字段</h4>
<div class="scroll"><table>
<tr><th style="width:19%">Field</th><th style="width:9%">类型</th><th style="width:11%">必填</th><th style="width:28%">合法值</th><th>引擎如何使用</th></tr><tr><td><code>taskName</code></td><td>string</td><td>是</td><td>Trim, 1–128.</td><td>仅在 admin 中展示。</td></tr><tr><td><code>taskDescription</code></td><td>string</td><td>否</td><td>Trim，≤ 512；空 → NULL。</td><td>仅在 admin 中展示。</td></tr><tr><td><code>displayHideBookType</code></td><td>int</td><td>是</td><td><code>0</code> 不拦截，<code>1</code> 拦截 A-book，<code>2</code> 拦截 B-book。</td><td>同时拦截<b>展示和 Coin 计算</b>（J8）。与积分计划、任务包上的值组合：任一层级匹配即拦截。</td></tr><tr><td><code>tzMinutes</code></td><td>int</td><td>是</td><td>−720 … 840，须被 15 整除。HSB：420。</td><td>用于划分交易日、每日上限、Coin 到期时间（任务时区 23:59:59）。有数据后锁定（J7）。</td></tr><tr><td><code>displayEvent</code></td><td>string</td><td>是</td><td><code>signup</code> / <code>kyc_approve</code> / <code>first_time_deposit</code> / <code>first_trade</code>.</td><td>仅 app 使用（J4）。面向未登录客户的版本只展示 <code>signup</code> 的任务。</td></tr><tr><td><code>displayPeriodLimitApply</code></td><td>int</td><td>是</td><td>0 / 1.</td><td>1 = 仅在时间窗内展示。</td></tr><tr><td><code>displayPeriodFrom, displayPeriodTo</code></td><td>datetime UTC</td><td>Khi apply = 1</td><td>两者必填，<code>from &lt; to</code>。Apply = 0 → 存 NULL。</td><td>App：<code>now &gt;= from AND now &lt; to</code>。引擎不使用：在展示时间窗之外也照常计算 Coin。</td></tr><tr><td><code>displayHideToAll</code></td><td>int</td><td>是</td><td>0 / 1.</td><td>1 = 对所有客户隐藏，已有该任务每日日志的客户除外。引擎对所有客户<b>仍会计算 Coin</b>：用于内部封闭测试，而不是用来停止活动（要停止请停用任务）。</td></tr><tr><td><code>participatePeriodLimitType</code></td><td>string</td><td>是</td><td><code>no_limit</code> / <code>specific_period</code>.</td><td>引擎仅在时间窗内计算 Coin（J3）。</td></tr><tr><td><code>participatePeriodFrom, participatePeriodTo</code></td><td>datetime UTC</td><td>Khi specific_period</td><td>两者必填，<code>from &lt; to</code>（J3）。no_limit → 存 NULL。</td><td>订单必须在时间窗内<b>开仓并平仓</b>。超过 <code>to</code>：app 显示 <code>ended = true</code>，引擎停止计算。</td></tr><tr><td><code>minPositionHoldSecond</code></td><td>int</td><td>是</td><td>0 … 604800（7 天）。HSB：180。</td><td>持仓时间更短的订单 → <code>HOLD_TIME_NOT_MET</code>，0 Coin。处理时快照到每笔订单。</td></tr><tr><td><code>pointMaxCapEnabled</code></td><td>int</td><td>是</td><td>0 / 1.</td><td>每个客户每天的 Coin 上限（按任务时区）。</td></tr><tr><td><code>pointMaxCapValue</code></td><td>long</td><td>Khi enabled = 1</td><td>启用时 1 … 100,000,000。停用 → 存 0。</td><td>在当天第一笔订单时快照到每日日志；修改只对每个客户的新一天生效。</td></tr><tr><td><code>cashValuePerPointUnit</code></td><td>decimal(18,4)</td><td>是</td><td>≥ 0，最多 4 位小数。HSB：0。</td><td>仅用于计算参考金额（订单明细中的 <code>cash</code>）。单位 = <code>point_program.cash_currency</code>。</td></tr><tr><td><code>releaseAutoDelayDay</code></td><td>int</td><td>是</td><td>0 … 30. 0 = <code>in-day</code>.</td><td>N &gt; 0：某交易日的 Coin 在该日 + N 天的 00:00（任务时区）一次性到账。有数据后锁定（J7）。</td></tr><tr><td><code>pointExpirationWindow</code></td><td>int</td><td>是</td><td>1 … 7300（天）。HSB：180。</td><td>Coin 有效期 = 交易日（delayed 时为发放日）+ N 天，任务时区 23:59:59。为 NULL 时引擎按 999999 天处理——不允许存 NULL。</td></tr><tr><td><code>termsUrl</code></td><td>string</td><td>否</td><td>≤ 1000，以 <code>https://</code> 开头。为空 → NULL。</td><td>原样返回给 app；NULL / 空则隐藏条款按钮。</td></tr>

<h4>兑换比例行（<code>point_task_trading_point_conversion</code>）</h4>
<div class="scroll"><table>
<tr><th style="width:19%">Field</th><th style="width:9%">类型</th><th style="width:30%">合法值</th><th>引擎如何使用</th></tr><tr><td><code>mt5Group</code></td><td>string</td><td>Trim，1–64 个字符（varchar(64)）。完整的 MT5 组名，例如 <code>Direct\Mini400</code>。</td><td>与账户的 <code>mt5_users.Group</code> 做不区分大小写的匹配。<code>1F\Direct\Mini10</code> 这类变体组视为不同的组。</td></tr><tr><td><code>conditionType</code></td><td>string</td><td><code>symbol</code> / <code>symbol_group</code> / <code>any</code>（以小写存储）。</td><td>一笔订单匹配同一 MT5 组的多行时的优先级：<b>symbol &gt; symbol_group &gt; any</b>。只考虑账户所属 MT5 组的行。</td></tr><tr><td><code>conditionValue (symbol)</code></td><td>string</td><td>1–64 个字符，不含点号，以大写存储（例如 <code>XAUUSD</code>）。</td><td>引擎与 MT5 品种代码中点号之前的部分比较（<code>XAUUSD.VIP</code> → <code>XAUUSD</code>）。</td></tr><tr><td><code>conditionValue (symbol_group)</code></td><td>string</td><td><code>forex</code> / <code>metal</code> / <code>energy</code> / <code>index</code> / <code>stocks</code> / <code>other</code>.</td><td>引擎根据 <code>mt5_symbols</code> 中的品种路径推断分组：包含 forex / metal / energ / index 或 indices / stock；其余为 other。</td></tr><tr><td><code>conditionValue (any)</code></td><td>string</td><td>后端始终存 <code>other</code>，忽略前端传入的值。</td><td>引擎只匹配 value 为 <code>other</code> 或空的 any 行（J5）。非必需，但缺少时，不在已列分组内的品种得 0 Coin（V09）。</td></tr><tr><td><code>pointPerLot</code></td><td>decimal(18,4)</td><td>0 … 1,000,000，最多 4 位小数。</td><td>订单 Coin = lot × pointPerLot，向下取整。<code>0</code> 合法：用于把某个品种排除在活动之外（值为 0 的 symbol 行阻止回落到 symbol_group / any）；app 在比例表中隐藏值为 0 的行。</td></tr>
</table></div>
<ul class="rules">
<li><b>重复：</b>键 <code>(mt5Group, conditionType, conditionValue)</code> 在该任务未删除的行中不区分大小写比较。表没有 unique key，所以 API 先锁定任务行（T1 第 2 步）再检查。</li>
<li><b>优先级：</b>同一 MT5 组内 symbol &gt; symbol_group &gt; any；无匹配行 → <code>NO_RATE_CONFIG</code>，0 Coin。</li>
<li><b>any 行：</b>非必需（警告 V09）。HSB 配置：每个组有 4 行 symbol_group（metal、forex、energy、index）和 1 行 any（覆盖股票及其余所有品种）。</li>
<li>行数：每个任务 1 … 500。</li>
</ul>

<h3 id="values">合法值</h3>
<p>列表在代码中固定（<code>NotifyEventEnum</code>、<code>NotifySendStatusEnum</code>）；只有开发新增 event 时才会变，而那时代码也必须改。因此 N1 <b>不</b>返回该列表：前端在 <code>en_US.js</code> / <code>zh_CN.js</code> 中为下拉框和标签声明常量。未知值（尚未声明的新 event）→ 前端原样显示字符串。</p>
<h4>event_name（9 个值）</h4><div class="scroll"><table><tr><th style="width:22%">event_name</th><th style="width:10%">消息编码</th><th style="width:15%">EN 标签</th><th style="width:11%">ZH 标签</th><th>何时记录日志</th></tr><tr><td><code>loyalty_enrolled</code></td><td>M2</td><td>Welcome</td><td>欢迎加入</td><td>客户刚满足参与积分计划的条件（job 每 10 分钟扫描一次）。上线时，已满足条件的客户预先写入 1 行 <code>is_send = 0</code>，不发送（这批客户由 CleverTap 自行运行 M1）。</td></tr><tr><td><code>coin_first_earned</code></td><td>M4</td><td>First coin</td><td>首次获得 Coin</td><td>客户首次获得 Coin（终身一次）。非首次的流水记录为 <code>is_send = 0</code> 并附原因。</td></tr><tr><td><code>loyalty_daily_nudge</code></td><td>T0 / T5 / T1</td><td>Daily nudge</td><td>每日提醒</td><td>周一至周五 14:00 WIB，客户今天尚未交易。消息类型在 <code>sub_type</code> 中（表 3.2）。</td></tr><tr><td><code>loyalty_daily_summary</code></td><td>T4</td><td>Daily summary</td><td>每日总结</td><td>周一至周五 19:30 WIB，客户当天获得了 Coin。</td></tr><tr><td><code>first_gift_reachable</code></td><td>M10</td><td>First gift reachable</td><td>首次可兑换礼物</td><td>每天 10:00 WIB，余额首次足以兑换一个礼品。终身 1 次。</td></tr><tr><td><code>first_gift_almost_reached</code></td><td>T6</td><td>First gift almost reached</td><td>首次接近礼物</td><td>每天 10:00 WIB，余额首次达到“接近下一个礼品”的阈值。终身 1 次。</td></tr><tr><td><code>loyalty_weekly_summary</code></td><td>T7</td><td>Weekly summary</td><td>每周总结</td><td>周六 09:00 WIB，上周总结。</td></tr><tr><td><code>coin_redeemed</code></td><td>M12</td><td>Coin redeemed</td><td>兑换成功</td><td>客户成功兑换礼品。<code>ref_key</code> = <code>redemption_id</code>。</td></tr><tr><td><code>coin_refunded</code></td><td>M13</td><td>Coin refunded</td><td>Coin 已退还</td><td>兑换订单的 Coin 被退回。<code>ref_key</code> = <code>redemption_id</code>。</td></tr></table></div>
<h4>sub_type</h4>
<p>只有 <code>loyalty_daily_nudge</code> 有 <code>sub_type</code>。前端应仅在已选择 <code>eventName = loyalty_daily_nudge</code> 时启用此下拉框。</p><div class="scroll"><table><tr><th style="width:18%">sub_type</th><th style="width:8%">消息编码</th><th style="width:17%">EN 标签</th><th style="width:12%">ZH 标签</th><th>含义</th></tr><tr><td><code>''</code></td><td>—</td><td>—</td><td>—</td><td>除 <code>loyalty_daily_nudge</code> 外的所有 event。前端显示为空。</td></tr><tr><td><code>first_coin</code></td><td>T0</td><td>First coin nudge</td><td>首币引导</td><td>客户已首次入金但尚无 Coin，处于首次入金后 14 天内。终身最多 3 次。</td></tr><tr><td><code>last_trade_earned</code></td><td>T5</td><td>Earned last trading day</td><td>上一交易日有收获</td><td>上一交易日获得了 Coin，今天尚未交易。每周最多 2 次。</td></tr><tr><td><code>not_traded</code></td><td>T1</td><td>Not traded today</td><td>今日未交易</td><td>今天尚未交易。每周最多 1 次。</td></tr></table></div>
<h4>send_status</h4>
<p>Java entity 中的注释只写了 0/1/2，但 DDL 和代码还使用 <code>-1</code>。规格以 DDL 为准。</p><div class="scroll"><table><tr><th style="width:11%">send_status</th><th style="width:17%">EN 标签</th><th style="width:11%">ZH 标签</th><th>含义</th></tr><tr><td><code>-1</code></td><td>Not sent (by design)</td><td>无需发送</td><td>该行仅记录，不发送到 CleverTap（<code>is_send = 0</code>）。这是终态，<b>不是错误</b>。原因见 <code>send_remark</code>。</td></tr><tr><td><code>0</code></td><td>Pending</td><td>待发送</td><td>已写入行，正在发送。正常只持续几秒。长时间停留在 0 属异常，请通知开发。</td></tr><tr><td><code>1</code></td><td>Sent</td><td>发送成功</td><td>CleverTap 已<b>接收 event</b>。不代表客户一定收到 push/邮件：CleverTap 仍可能因账户渠道限制、客户关闭通知或 campaign 已停用而不发送。实际发送结果请在 CleverTap 查看。</td></tr><tr><td><code>2</code></td><td>Failed</td><td>发送失败</td><td>调用 CleverTap 失败且<b>不重发</b>。仅出现在 <code>loyalty_daily_nudge</code>、<code>loyalty_daily_summary</code>、<code>loyalty_weekly_summary</code>（定时消息，延迟发送内容已过时）。其他 event 失败时整轮回滚、下一轮重发，因此不会出现值为 2 的行。</td></tr></table></div>
<h4>is_send</h4>
<p><code>1</code> = 发送到 CleverTap，<code>0</code> = 仅记录、不发送。始终成对：<code>is_send = 0</code> ⇔ <code>send_status = -1</code>。<code>isSend</code> 筛选按需求保留，但前端可能只需要 <code>sendStatus</code> 下拉框。</p>
<h4>send_remark</h4><div class="scroll"><table><tr><th style="width:40%">send_remark</th><th>何时</th></tr><tr><td><code>''</code></td><td>默认，消息正常发送。</td></tr><tr><td><code>Pre-launch eligible existing clients</code></td><td>上线时为此前已满足条件的客户预先写入的 <code>loyalty_enrolled</code> 行。</td></tr><tr><td><code>non-first coin,current LedgerId=…,first LedgerId=…</code></td><td><code>coin_first_earned</code> 被拦截，因为客户此前已有 Coin（附流水 id 便于查询）。</td></tr></table></div>
<h4>payload</h4>
<p>每个数字还有一个印尼格式的 <code>&lt;key&gt;_text</code> 版本（<code>1540</code> → <code>"1.540"</code>），是 CleverTap 填入文案的字符串。<code>$D_&lt;Unix seconds&gt;</code> 形式的日期是 CleverTap 的日期格式（例如 <code>enrolled_at</code>）。前端应以折叠的 JSON 显示 payload，点击展开。</p>
<p>除专属 key 外，大部分 event 还有 3 个公共 key：<code>coin_balance</code>、<code>next_gift_name</code>、<code>coin_to_next_gift</code>（兑换和 Coin 退回只有 <code>coin_balance</code>）。无值的 key 不写入（例如客户已没有下一个礼品）。</p>
<div class="scroll"><table><tr><th style="width:34%">event_name</th><th>event 专属 key</th></tr><tr><td><code>loyalty_enrolled</code></td><td>loyalty_eligible, enrolled_at, coin_per_lot</td></tr><tr><td><code>coin_first_earned</code></td><td>coin_amount</td></tr><tr><td><code>loyalty_daily_nudge</code></td><td>nudge_type, coin_per_lot, last_coin, days_since_ftd</td></tr><tr><td><code>loyalty_daily_summary</code></td><td>today_coin, reachable_gift_name</td></tr><tr><td><code>first_gift_reachable</code></td><td>gift_name, gift_price, gift_image_url</td></tr><tr><td><code>first_gift_almost_reached</code></td><td>gift_name, gift_price, gift_image_url, coin_to_gift, lot_to_gift</td></tr><tr><td><code>loyalty_weekly_summary</code></td><td>week_coin、trading_days、gift_1_… 至 gift_3_…（name、price、image_url、percent、status）</td></tr><tr><td><code>coin_redeemed</code></td><td>redemption_id, coin_spent</td></tr><tr><td><code>coin_refunded</code></td><td>redemption_id, coin_refunded</td></tr></table></div>
