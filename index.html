<h3>SQL đề xuất</h3>
<pre>-- DEV-06: indexes for admin list screens
ALTER TABLE point_task_daily_checkin_log ADD INDEX idx_task_date (task_id, checkin_date);
ALTER TABLE point_task_trading_deal_log  ADD INDEX idx_task_period (task_id, period_key, deal_id);
ALTER TABLE point_task_trading_log       ADD INDEX idx_task_period (task_id, period_key);
ALTER TABLE point_ledger                 ADD INDEX idx_create_date (create_date);
ALTER TABLE point_lot                    ADD INDEX idx_create_date (create_date);
ALTER TABLE point_notify_log             ADD INDEX idx_event_date (event_date);

-- DEV-07: reason of manual coin adjustment
ALTER TABLE point_ledger ADD COLUMN remark varchar(255) DEFAULT NULL;

-- DEV-09: who reconciled a redemption transaction by hand
ALTER TABLE point_redemption_transaction
  ADD COLUMN reconcile_user   varchar(50)  DEFAULT NULL,
  ADD COLUMN reconcile_remark varchar(255) DEFAULT NULL,
  ADD COLUMN reconcile_date   datetime     DEFAULT NULL;</pre>
</section><section class="panel" id="api" role="tabpanel"><h2>API</h2><p>33 API admin, chia theo nhóm. Bấm <b>Spec chi tiết</b> để xem request, xử lý (kèm SQL), response mẫu và message lỗi.</p><h3>Phân quyền</h3><p class="note">Dùng ở: S1, S2 Section 1, tab Task Bundles.</p><div class="scroll"><table class="apiidx"><tr><th style="width:7%">Mã</th><th style="width:36%">Endpoint</th><th>Mục đích</th><th style="width:15%">Chi tiết</th></tr><tr id="p1"><td><code>P1</code></td><td><code>GET /point/admin/program/list</code></td><td>Danh sách program cho màn S1, mỗi dòng kèm client group và trạng thái Active.</td><td><button type="button" class="specbtn" data-spec="p1">Spec chi tiết ▸</button></td></tr><tr id="p2"><td><code>P2</code></td><td><code>POST /point/admin/program/add</code></td><td>Tạo program và dòng client group trong 1 transaction (M1).</td><td><button type="button" class="specbtn" data-spec="p2">Spec chi tiết ▸</button></td></tr><tr id="p3"><td><code>P3</code></td><td><code>GET /point/admin/program/get</code></td><td>Chi tiết 1 program cho Section 1 của S2.</td><td><button type="button" class="specbtn" data-spec="p3">Spec chi tiết ▸</button></td></tr><tr id="p4"><td><code>P4</code></td><td><code>POST /point/admin/program/edit</code></td><td>Sửa program (Modify ở Section 1). Client group không đổi.</td><td><button type="button" class="specbtn" data-spec="p4">Spec chi tiết ▸</button></td></tr><tr id="p5"><td><code>P5</code></td><td><code>POST /point/admin/program/clientGroup/enable</code></td><td>Bật/tắt dòng client group của 1 program (switch trên card S1).</td><td><button type="button" class="specbtn" data-spec="p5">Spec chi tiết ▸</button></td></tr><tr id="p6"><td><code>P6</code></td><td><code>GET /point/admin/clientGroup/list</code></td><td>Dropdown chọn client group khi tạo program: mọi group kèm program đang gắn (nếu có).</td><td><button type="button" class="specbtn" data-spec="p6">Spec chi tiết ▸</button></td></tr><tr id="b1"><td><code>B1</code></td><td><code>GET /point/admin/bundle/list</code></td><td>Board bundle của 1 program, mỗi bundle kèm tóm tắt task (check-in + trading) để vẽ thẻ.</td><td><button type="button" class="specbtn" data-spec="b1">Spec chi tiết ▸</button></td></tr><tr id="b2"><td><code>B2</code></td><td><code>POST /point/admin/bundle/save</code></td><td>Tạo (không có id) hoặc sửa (có id) bundle (M2).</td><td><button type="button" class="specbtn" data-spec="b2">Spec chi tiết ▸</button></td></tr><tr id="b3"><td><code>B3</code></td><td><code>POST /point/admin/bundle/enable</code></td><td>Bật/tắt bundle.</td><td><button type="button" class="specbtn" data-spec="b3">Spec chi tiết ▸</button></td></tr><tr id="l1"><td><code>L1</code></td><td><code>GET /point/admin/blacklist/list</code></td><td>Danh sách blacklist của 1 bundle, gồm cả dòng đã whitelist (M3).</td><td><button type="button" class="specbtn" data-spec="l1">Spec chi tiết ▸</button></td></tr><tr id="l2"><td><code>L2</code></td><td><code>POST /point/admin/blacklist/save</code></td><td>Thêm khách vào blacklist của bundle, hoặc đổi Blacklisted ↔ Whitelisted.</td><td><button type="button" class="specbtn" data-spec="l2">Spec chi tiết ▸</button></td></tr></table></div><h3>Check-in task</h3><p class="note">Dùng ở: Modal task (Check-in).</p><div class="scroll"><table class="apiidx"><tr><th style="width:7%">Mã</th><th style="width:36%">Endpoint</th><th>Mục đích</th><th style="width:15%">Chi tiết</th></tr><tr id="c1"><td><code>C1</code></td><td><code>POST /point/admin/checkinTask/save</code></td><td>Tạo (không có id) hoặc sửa (có id) check-in task (tab Config của M4).</td><td><button type="button" class="specbtn" data-spec="c1">Spec chi tiết ▸</button></td></tr><tr id="c4"><td><code>C4</code></td><td><code>GET /point/admin/checkinTask/get</code></td><td>Chi tiết 1 check-in task để mở modal View/Edit. <b>Bổ sung</b> so với danh sách: B1 chỉ trả tóm tắt.</td><td><button type="button" class="specbtn" data-spec="c4">Spec chi tiết ▸</button></td></tr><tr id="c2"><td><code>C2</code></td><td><code>POST /point/admin/checkinTask/enable</code></td><td>Bật/tắt check-in task.</td><td><button type="button" class="specbtn" data-spec="c2">Spec chi tiết ▸</button></td></tr><tr id="c3"><td><code>C3</code></td><td><code>GET /point/admin/checkinTask/log/list</code></td><td>Check-in log của 1 task (tab Check-in Log của M4).</td><td><button type="button" class="specbtn" data-spec="c3">Spec chi tiết ▸</button></td></tr></table></div><h3>Trading task</h3><p class="note">Dùng ở: Modal task (Trading).</p><div class="scroll"><table class="apiidx"><tr><th style="width:7%">Mã</th><th style="width:36%">Endpoint</th><th>Mục đích</th><th style="width:15%">Chi tiết</th></tr><tr id="t1"><td><code>T1</code></td><td><code>POST /point/admin/trading/save</code></td><td>Tạo hoặc sửa 1 trading task kèm toàn bộ dòng quy đổi trong 1 lần lưu (tab Config của M4).</td><td><button type="button" class="specbtn" data-spec="t1">Spec chi tiết ▸</button></td></tr><tr id="t2"><td><code>T2</code></td><td><code>POST /point/admin/trading/enable</code></td><td>Bật / tắt 1 trading task (switch trên thẻ task, qua EnableConfirmModal).</td><td><button type="button" class="specbtn" data-spec="t2">Spec chi tiết ▸</button></td></tr><tr id="t3"><td><code>T3</code></td><td><code>GET /point/admin/trading/get</code></td><td>Chi tiết 1 trading task kèm dòng quy đổi chưa xoá và <code>lockedFields</code> (mở M4 ở chế độ View/Edit).</td><td><button type="button" class="specbtn" data-spec="t3">Spec chi tiết ▸</button></td></tr><tr id="t4"><td><code>T4</code></td><td><code>GET /point/admin/trading/dealLog/list</code></td><td>Chi tiết từng lệnh của 1 task (tab Deal Log của M4). Chỉ đọc.</td><td><button type="button" class="specbtn" data-spec="t4">Spec chi tiết ▸</button></td></tr><tr id="t5"><td><code>T5</code></td><td><code>GET /point/admin/trading/dailyLog/list</code></td><td>Tổng hợp theo khách / ngày của 1 task (tab Daily Log của M4). Chỉ đọc.</td><td><button type="button" class="specbtn" data-spec="t5">Spec chi tiết ▸</button></td></tr></table></div><h3>Coin</h3><p class="note">Dùng ở: tab Coin.</p><div class="scroll"><table class="apiidx"><tr><th style="width:7%">Mã</th><th style="width:36%">Endpoint</th><th>Mục đích</th><th style="width:15%">Chi tiết</th></tr><tr id="k1"><td><code>K1</code></td><td><code>GET /point/admin/coin/ledger/list</code></td><td>Sổ coin (<code>point_ledger</code>) của khách thuộc program (tab Coin (S2), tab Ledger). Chỉ đọc.</td><td><button type="button" class="specbtn" data-spec="k1">Spec chi tiết ▸</button></td></tr><tr id="k2"><td><code>K2</code></td><td><code>GET /point/admin/coin/lot/list</code></td><td>Lô coin (<code>point_lot</code>) của khách thuộc program (tab Coin (S2), tab Lot). Chỉ đọc.</td><td><button type="button" class="specbtn" data-spec="k2">Spec chi tiết ▸</button></td></tr><tr id="k3"><td><code>K3</code></td><td><code>POST /point/admin/coin/adjust</code></td><td>Cộng / trừ coin thủ công cho 1 khách thuộc program (modal Adjust Balance). Bản cho Smart CRM của <code>POST /point/pointAdjust</code>.</td><td><button type="button" class="specbtn" data-spec="k3">Spec chi tiết ▸</button></td></tr><tr id="k4"><td><code>K4</code></td><td><code>GET /point/admin/coin/balance</code></td><td>Số dư hiện tại của 1 khách (hiện trong modal Adjust Balance trước khi lưu).</td><td><button type="button" class="specbtn" data-spec="k4">Spec chi tiết ▸</button></td></tr></table></div><h3>Gift</h3><p class="note">Dùng ở: tab Gift List.</p><div class="scroll"><table class="apiidx"><tr><th style="width:7%">Mã</th><th style="width:36%">Endpoint</th><th>Mục đích</th><th style="width:15%">Chi tiết</th></tr><tr id="g1"><td><code>G1</code></td><td><code>GET /point/admin/gift/list</code></td><td>Danh sách quà của 1 program (tab Gift List (S2)), sắp theo sort_order.</td><td><button type="button" class="specbtn" data-spec="g1">Spec chi tiết ▸</button></td></tr><tr id="g2"><td><code>G2</code></td><td><code>POST /point/admin/gift/save</code></td><td>Tạo (không có id) hoặc sửa (có id) 1 quà. Program không đổi khi sửa.</td><td><button type="button" class="specbtn" data-spec="g2">Spec chi tiết ▸</button></td></tr><tr id="g3"><td><code>G3</code></td><td><code>POST /point/admin/gift/enable</code></td><td>Bật/tắt 1 quà (switch trên tab Gift List).</td><td><button type="button" class="specbtn" data-spec="g3">Spec chi tiết ▸</button></td></tr></table></div><h3>Redemption</h3><p class="note">Dùng ở: tab Redemption.</p><div class="scroll"><table class="apiidx"><tr><th style="width:7%">Mã</th><th style="width:36%">Endpoint</th><th>Mục đích</th><th style="width:15%">Chi tiết</th></tr><tr id="r1"><td><code>R1</code></td><td><code>GET /point/admin/redemption/order/list</code></td><td>Danh sách đơn đổi quà (point_redemption_order) của khách thuộc 1 program. Chỉ đọc.</td><td><button type="button" class="specbtn" data-spec="r1">Spec chi tiết ▸</button></td></tr><tr id="r2"><td><code>R2</code></td><td><code>GET /point/admin/redemption/transaction/list</code></td><td>Danh sách giao dịch trừ/hoàn coin (point_redemption_transaction) của khách thuộc 1 program. Chỉ đọc.</td><td><button type="button" class="specbtn" data-spec="r2">Spec chi tiết ▸</button></td></tr><tr id="r3"><td><code>R3</code></td><td><code>GET /point/admin/redemption/blacklist/list</code></td><td>Danh sách blacklist redeem của khách thuộc 1 program (cả enabled 0 và 1).</td><td><button type="button" class="specbtn" data-spec="r3">Spec chi tiết ▸</button></td></tr><tr id="r4"><td><code>R4</code></td><td><code>POST /point/admin/redemption/blacklist/save</code></td><td>Thêm khách vào blacklist redeem, hoặc đổi Blacklisted ↔ Whitelisted (chặn toàn cục).</td><td><button type="button" class="specbtn" data-spec="r4">Spec chi tiết ▸</button></td></tr><tr id="r5"><td><code>R5</code></td><td><code>POST /point/admin/redemption/transaction/reconcile</code></td><td>Đánh dấu 1 giao dịch 'đã kiểm tay' (reconciled 1 → 2). Trả lời 4.1.</td><td><button type="button" class="specbtn" data-spec="r5">Spec chi tiết ▸</button></td></tr></table></div><h3>CleverTap</h3><p class="note">Dùng ở: tab Omni Marketing.</p><div class="scroll"><table class="apiidx"><tr><th style="width:7%">Mã</th><th style="width:36%">Endpoint</th><th>Mục đích</th><th style="width:15%">Chi tiết</th></tr><tr id="n1"><td><code>N1</code></td><td><code>GET /point/admin/notifyLog/list</code></td><td>Danh sách log thông báo CleverTap của các khách thuộc 1 program, mới nhất trước.</td><td><button type="button" class="specbtn" data-spec="n1">Spec chi tiết ▸</button></td></tr></table></div><div hidden><div class="specsrc" id="spec-p1" data-title="P1 · /point/admin/program/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/program/list</code></p><p>Danh sách program cho màn S1, mỗi dòng kèm client group và trạng thái Active.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>pageNo</code></td><td>int</td><td>Không</td><td>Mặc định 1.</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>Không</td><td>Mặc định 10, tối đa 100.</td></tr><tr><td><code>programName</code></td><td>string</td><td>Không</td><td>Lọc <code>LIKE %x%</code>, đã trim.</td></tr><tr><td><code>clientGroup</code></td><td>string</td><td>Không</td><td>Lọc khớp đúng.</td></tr><tr><td><code>status</code></td><td>string</td><td>Không</td><td><code>active</code> hoặc <code>inactive</code>. Giá trị khác → lỗi.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Validate tham số.</li>
<li>Chạy query bên dưới (đếm <code>total</code> bằng cùng điều kiện).</li>
<li><code>active = program.enabled = 1 AND client_group_enabled = 1</code>. Program chưa có dòng client group (dữ liệu cũ) → <code>clientGroup = null</code>, <code>active = false</code>.</li></ol><pre>SELECT p.id, p.program_name, p.program_description, p.enabled, p.cash_currency,
       p.display_hide_book_type, p.create_user, p.create_date, p.update_user, p.update_date,
       g.id AS client_group_row_id, g.client_group, g.enabled AS client_group_enabled,
       (p.enabled = 1 AND IFNULL(g.enabled, 0) = 1) AS active
FROM point_program p
LEFT JOIN promo_client_group g
       ON g.promo_table = 'point_program' AND g.promo_config_id = p.id
WHERE (#{programName} IS NULL OR p.program_name LIKE CONCAT('%', #{programName}, '%'))
  AND (#{clientGroup} IS NULL OR g.client_group = #{clientGroup})
  AND (#{status} IS NULL
       OR (#{status} = 'active'   AND p.enabled = 1 AND IFNULL(g.enabled, 0) = 1)
       OR (#{status} = 'inactive' AND NOT (p.enabled = 1 AND IFNULL(g.enabled, 0) = 1)))
ORDER BY active DESC, p.id DESC
LIMIT #{offset}, #{pageSize};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": {
    "total": 1,
    "records": [{
      "id": 1101, "programName": "mitrade_point_program", "programDescription": "MiTrade white-label point program",
      "enabled": 1, "cashCurrency": "USD", "displayHideBookType": 0,
      "clientGroupRowId": 10101, "clientGroup": "mitrade_client", "clientGroupEnabled": 1, "active": true,
      "createUser": "admin01", "createDate": "2026-10-20 08:15:00",
      "updateUser": null, "updateDate": null
    }]
  }
}</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Status must be active or inactive.</code></td><td>status sai giá trị</td></tr></table></div><div class="specsec"><h4>5. Lưu ý</h4><p>Nếu dữ liệu cũ có program gắn 2 dòng client group (vi phạm I1), query sẽ trả 2 dòng cho program đó. Chạy query ở tab Kiểm tra dữ liệu trước khi mở màn hình; Smart CRM không tự sửa dữ liệu cũ.</p></div></div><div class="specsrc" id="spec-p2" data-title="P2 · /point/admin/program/add"><p class="specmeta"><code>POST</code> · <code>/point/admin/program/add</code></p><p>Tạo program và dòng client group trong 1 transaction (M1).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>programName</code></td><td>string</td><td>Có</td><td>Trim, 1–64 ký tự (<code>varchar(64)</code>). Không trùng program khác, không phân biệt hoa thường (unique key <code>uk_program_name</code>, collation <code>utf8mb4_0900_ai_ci</code>).</td></tr><tr><td><code>programDescription</code></td><td>string</td><td>Có</td><td>Trim, 1–255 ký tự (<code>varchar(255)</code>; DB cho NULL, bắt buộc là quyết định của màn hình).</td></tr><tr><td><code>cashCurrency</code></td><td>string</td><td>Có</td><td>Mã 3 chữ in hoa, regex <code>^[A-Z]{3}$</code> (cột varchar(16)). Engine chỉ dùng để hiển thị.</td></tr><tr><td><code>displayHideBookType</code></td><td>int</td><td>Có</td><td><code>0</code> hiện cho tất cả, <code>1</code> ẩn A book, <code>2</code> ẩn B book.</td></tr><tr><td><code>clientGroup</code></td><td>string</td><td>Có</td><td>Phải có trong <code>client_group_configuration</code> (<code>group_code</code>, <code>varchar(50)</code>, unique) với <code>enabled = 1</code>, và chưa gắn program nào (I1).</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Validate field.</li>
<li>Mở transaction. Khoá theo group để 2 admin không tạo cùng lúc: <code>SELECT id FROM promo_client_group WHERE promo_table = 'point_program' AND client_group = ? FOR UPDATE</code>. Có dòng (kể cả <code>enabled = 0</code>) → lỗi "already attached".</li>
<li>Kiểm tên trùng: <code>SELECT id FROM point_program WHERE program_name = ?</code> (collation tự so không phân biệt hoa thường). INSERT vẫn có thể dính <code>uk_program_name</code> nếu 2 admin tạo cùng lúc → bắt DuplicateKey, trả cùng message.</li>
<li>INSERT <code>point_program</code>: <code>enabled = 1</code>, <code>kpi_name_point_multiplier = NULL</code> (khoá cứng), <code>create_user</code> = user đăng nhập.</li>
<li>INSERT <code>promo_client_group</code>: <code>client_group</code>, <code>promo_table = 'point_program'</code>, <code>promo_config_id</code> = id vừa tạo, <code>enabled = 1</code>.</li>
<li>COMMIT, trả 2 id.</li></ol>
<p>Tạo program bật sẵn là an toàn: chưa có bundle/task thì engine không trả gì cho khách.</p><pre>SELECT enabled FROM client_group_configuration WHERE group_code = #{clientGroup};

INSERT INTO point_program
  (program_name, program_description, enabled, cash_currency, kpi_name_point_multiplier,
   display_hide_book_type, create_date, create_user)
VALUES (#{programName}, #{programDescription}, 1, #{cashCurrency}, NULL,
        #{displayHideBookType}, UTC_TIMESTAMP(), #{currentUser});

INSERT INTO promo_client_group
  (client_group, promo_table, promo_config_id, enabled, create_date, create_user)
VALUES (#{clientGroup}, 'point_program', #{newProgramId}, 1, UTC_TIMESTAMP(), #{currentUser});</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": { "id": 1102, "clientGroupRowId": 10102 } }</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Program name is required.</code></td><td></td></tr><tr><td><code>Program name must be at most 64 characters.</code></td><td></td></tr><tr><td><code>Program name already exists.</code></td><td></td></tr><tr><td><code>Program description is required.</code></td><td></td></tr><tr><td><code>Cash currency must be a 3-letter code, for example USD.</code></td><td></td></tr><tr><td><code>Display hide book type must be 0, 1 or 2.</code></td><td></td></tr><tr><td><code>Client group does not exist.</code></td><td></td></tr><tr><td><code>Client group {group} is disabled.</code></td><td>client_group_configuration.enabled = 0</td></tr><tr><td><code>Program description must be at most 255 characters.</code></td><td></td></tr><tr><td><code>Client group {group} is already attached to program {id} ({name}).</code></td><td>I1</td></tr></table></div></div><div class="specsrc" id="spec-p3" data-title="P3 · /point/admin/program/get"><p class="specmeta"><code>GET</code> · <code>/point/admin/program/get</code></p><p>Chi tiết 1 program cho Section 1 của S2.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>Có</td><td>Program phải tồn tại.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Đọc program + dòng client group như P1 (lọc <code>p.id = ?</code>).</li>
<li>Tính thêm <code>bundleCount</code>, <code>checkinTaskCount</code> và <code>hasActivity</code> (program đã có log check-in hoặc log trading). FE dùng <code>hasActivity</code> để khoá ô <code>cashCurrency</code> (tab Khoá khi đang chạy).</li></ol><pre>-- check-in side: go through the task ids (needs index idx_task_date, see DEV-06)
SELECT EXISTS (SELECT 1 FROM point_task_daily_checkin_log l
               JOIN point_task_daily_checkin d ON d.id = l.task_id
               WHERE d.program_id = #{id})
    OR EXISTS (SELECT 1 FROM point_task_trading_log WHERE program_id = #{id}) AS has_activity;</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": {
    "id": 1101, "programName": "mitrade_point_program", "programDescription": "MiTrade white-label point program",
    "enabled": 1, "cashCurrency": "USD", "displayHideBookType": 0,
    "clientGroupRowId": 10101, "clientGroup": "mitrade_client", "clientGroupEnabled": 1, "active": true,
    "bundleCount": 1, "checkinTaskCount": 1, "hasActivity": true,
    "createUser": "admin01", "createDate": "2026-10-20 08:15:00", "updateUser": null, "updateDate": null
  }
}</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr></table></div></div><div class="specsrc" id="spec-p4" data-title="P4 · /point/admin/program/edit"><p class="specmeta"><code>POST</code> · <code>/point/admin/program/edit</code></p><p>Sửa program (Modify ở Section 1). Client group không đổi.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>Có</td><td>Program phải tồn tại.</td></tr><tr><td><code>programName</code></td><td>string</td><td>Có</td><td>Như P2; không trùng program khác (trừ chính nó).</td></tr><tr><td><code>programDescription</code></td><td>string</td><td>Có</td><td>Như P2.</td></tr><tr><td><code>cashCurrency</code></td><td>string</td><td>Có</td><td>Như P2. Khi <code>hasActivity</code> = true thì phải giữ nguyên giá trị cũ.</td></tr><tr><td><code>displayHideBookType</code></td><td>int</td><td>Có</td><td>0 / 1 / 2. Sửa tự do.</td></tr><tr><td><code>enabled</code></td><td>int</td><td>Có</td><td>0 / 1.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Validate. Bỏ qua mọi field khác FE gửi (<code>kpiNamePointMultiplier</code>, <code>clientGroup</code>…).</li>
<li>Nếu <code>cashCurrency</code> khác giá trị đang lưu và program đã có activity (query ở P3) → lỗi.</li>
<li>UPDATE <code>point_program</code> các field trên + <code>update_user</code>, <code>update_date = UTC_TIMESTAMP()</code>.</li></ol>
<p>Tắt program: mọi task của program biến mất khỏi app ngay; coin đã cộng không đổi. Bật lại không cần kiểm I2 (I2 tính trong 1 program, không phụ thuộc program bật hay tắt).</p><pre>UPDATE point_program
SET program_name = #{programName}, program_description = #{programDescription},
    cash_currency = #{cashCurrency}, display_hide_book_type = #{displayHideBookType},
    enabled = #{enabled}, update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE id = #{id};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": null }</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Program name already exists.</code></td><td></td></tr><tr><td><code>Cash currency cannot be changed after clients have earned coins in this program.</code></td><td>tab Khoá khi đang chạy</td></tr><tr><td><code>Enabled must be 0 or 1.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Lưu ý</h4><p><code>displayHideBookType</code>: với check-in chỉ là lọc hiển thị; với trading là <b>luật tính coin</b> (nhóm Trading xác nhận): đổi sang <code>1</code> thì khách A book thôi được tính coin, đổi sang <code>2</code> thì khách B book thôi được tính coin, ở mọi trading task trong program. API không đổi; FE nên nói rõ điều này trong hộp xác nhận khi đổi giá trị.</p></div></div><div class="specsrc" id="spec-p5" data-title="P5 · /point/admin/program/clientGroup/enable"><p class="specmeta"><code>POST</code> · <code>/point/admin/program/clientGroup/enable</code></p><p>Bật/tắt dòng client group của 1 program (switch trên card S1).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>Có</td><td>Program phải có dòng client group.</td></tr><tr><td><code>enabled</code></td><td>int</td><td>Có</td><td>0 / 1.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Lấy dòng <code>promo_client_group</code> của program.</li>
<li>Khi bật: kiểm group này không có dòng <code>point_program</code> nào khác đang <code>enabled = 1</code> (I1, phòng dữ liệu cũ).</li>
<li>UPDATE <code>enabled</code>, <code>update_user</code>, <code>update_date</code>.</li></ol><pre>UPDATE promo_client_group
SET enabled = #{enabled}, update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE promo_table = 'point_program' AND promo_config_id = #{programId};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": null }</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Program has no client group.</code></td><td></td></tr><tr><td><code>Client group {group} is already enabled for program {id}.</code></td><td>I1</td></tr></table></div></div><div class="specsrc" id="spec-p6" data-title="P6 · /point/admin/clientGroup/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/clientGroup/list</code></p><p>Dropdown chọn client group khi tạo program: mọi group kèm program đang gắn (nếu có).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>keyword</code></td><td>string</td><td>Không</td><td>Lọc <code>group_code LIKE %x%</code>.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Đọc <code>client_group_configuration</code>, LEFT JOIN dòng <code>point_program</code> của <code>promo_client_group</code>.</li>
<li><code>available = groupEnabled = 1 AND programId IS NULL</code>. FE chỉ cho chọn dòng <code>available = true</code>; hiện <code>groupDescription</code> cạnh mã group nếu có.</li></ol>
<p>Không phân trang (số group ít). Smart CRM đã có <code>/partner/clientgroupcode/list</code> đọc cùng bảng; API này chỉ thêm cột program.</p><pre>SELECT cg.group_code AS client_group, cg.group_description, cg.enabled AS group_enabled,
       g.promo_config_id AS program_id, p.program_name, g.enabled AS client_group_enabled
FROM client_group_configuration cg
LEFT JOIN promo_client_group g
       ON g.client_group = cg.group_code AND g.promo_table = 'point_program'
LEFT JOIN point_program p ON p.id = g.promo_config_id
WHERE (#{keyword} IS NULL OR cg.group_code LIKE CONCAT('%', #{keyword}, '%'))
ORDER BY (g.id IS NULL) DESC, cg.group_code;</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": [
    { "clientGroup": "partner_x_client", "groupDescription": "Partner X clients", "groupEnabled": 1,
      "programId": null, "programName": null, "clientGroupEnabled": null, "available": true },
    { "clientGroup": "mitrade_client", "groupDescription": null, "groupEnabled": 1,
      "programId": 1101, "programName": "mitrade_point_program", "clientGroupEnabled": 1, "available": false }
  ]
}</pre></div><div class="specsec"><h4>4. Message lỗi</h4><p>Chỉ lỗi chung (thiếu tham số, không có quyền).</p></div><div class="specsec"><h4>5. Lưu ý</h4><p>Theo DDL: tên hiển thị = <code>group_description</code> (<code>varchar(255)</code>, có thể NULL → FE hiện mã group), trạng thái = <code>enabled</code> (1 bật, 0 tắt). Các cột khác của bảng (tỷ giá, nhóm MT5 mặc định…) không liên quan loyalty nên không trả. <code>group_code</code> và <code>promo_client_group.client_group</code> cùng collation <code>utf8mb4_0900_ai_ci</code> nên JOIN không cần <code>COLLATE</code>.</p></div></div><div class="specsrc" id="spec-b1" data-title="B1 · /point/admin/bundle/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/bundle/list</code></p><p>Board bundle của 1 program, mỗi bundle kèm tóm tắt task (check-in + trading) để vẽ thẻ.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>Có</td><td>Program phải tồn tại.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Lấy mọi bundle của program.</li>
<li>Lấy mọi check-in task và trading task thuộc các bundle đó (2 query, gộp theo <code>task_bundle_id</code>).</li>
<li>Sắp xếp: bundle <code>enabled</code> trước rồi theo id; trong bundle, task <code>enabled</code> trước rồi theo id.</li>
<li>Check-in task có thêm <code>live</code> (đang tính vào I2) để FE đánh dấu.</li></ol>
<p>Không phân trang. <code>blacklistCount</code> = số dòng blacklist đang <code>enabled = 1</code> của bundle.</p><pre>SELECT b.id, b.task_bundle_name, b.task_bundle_description, b.display_hide_book_type, b.enabled,
       (SELECT COUNT(*) FROM client_promotion_blacklist bl
         WHERE bl.enabled = 1 AND bl.promo_table = 'point_program'
           AND bl.promo_config_id = b.program_id AND bl.point_task_bundle_id = b.id) AS blacklist_count
FROM point_task_bundle b WHERE b.program_id = #{programId}
ORDER BY b.enabled DESC, b.id;

SELECT d.id, d.task_bundle_id, d.task_name, d.enabled, d.participate_period_limit_type,
       d.participate_period_from, d.participate_period_to, d.routine_cycle_limit_days, d.claim_type,
       (d.enabled = 1 AND d.display_hide_to_all = 0
        AND (d.display_period_limit_apply = 0 OR UTC_TIMESTAMP() &lt; d.display_period_to)) AS live
FROM point_task_daily_checkin d WHERE d.program_id = #{programId}
ORDER BY d.enabled DESC, d.id;

SELECT t.id, t.task_bundle_id, t.task_name, t.enabled, t.participate_period_limit_type,
       t.participate_period_from, t.participate_period_to, t.min_position_hold_second,
       t.point_max_cap_enabled, t.point_max_cap_value, t.release_auto_delay_day,
       r.rate_min, r.rate_max, IFNULL(r.rate_row_count, 0) AS rate_row_count
FROM point_task_trading t
LEFT JOIN (SELECT task_id, MIN(point_per_lot) AS rate_min, MAX(point_per_lot) AS rate_max,
                  COUNT(*) AS rate_row_count
           FROM point_task_trading_point_conversion
           WHERE deleted = 0
           GROUP BY task_id) r ON r.task_id = t.id
WHERE t.program_id = #{programId}
ORDER BY t.enabled DESC, t.id;</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": [{
    "id": 2101, "taskBundleName": "mitrade_daily_checkin", "taskBundleDescription": "MiTrade daily check-in tasks",
    "displayHideBookType": 0, "enabled": 1, "blacklistCount": 0,
    "tasks": [
      { "taskId": 3101, "taskType": "checkin", "taskName": "mitrade_daily_checkin", "enabled": 1, "live": true,
        "participatePeriodLimitType": "specific_period",
        "participatePeriodFrom": "2026-09-30 17:00:00", "participatePeriodTo": "2027-12-31 17:00:00",
        "routineCycleLimitDays": 7, "claimType": "claim_each_day" },
      { "taskId": 3201, "taskType": "trading", "taskName": "HSB Coin Trading", "enabled": 0,
        "participatePeriodLimitType": "no_limit", "participatePeriodFrom": null, "participatePeriodTo": null,
        "minPositionHoldSecond": 120, "pointMaxCapEnabled": 1, "pointMaxCapValue": 500,
        "releaseAutoDelayDay": 1, "rateMin": 5, "rateMax": 20, "rateRowCount": 4 }
    ]
  }]
}</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Lưu ý</h4><p>Ý nghĩa field trading là việc của nhóm Trading; ở đây chỉ đọc ra để vẽ thẻ. Thẻ trading: <code>releaseAutoDelayDay</code> → FE hiện T+0 / T+N; <code>rateMin</code> / <code>rateMax</code> / <code>rateRowCount</code> tính trên dòng quy đổi <code>deleted = 0</code>; <code>rateRowCount = 0</code> thì <code>rateMin</code> / <code>rateMax</code> là <code>null</code> và FE báo đỏ No rates; nhãn Ended do FE tự gắn khi <code>specific_period</code> và <code>participatePeriodTo</code> đã qua.</p><p><code>live</code> ở đây là bản đơn giản (task bật, không ẩn hết, khung hiển thị chưa kết thúc); kiểm I2 chính xác nằm ở C1/C2/B3.</p></div></div><div class="specsrc" id="spec-b2" data-title="B2 · /point/admin/bundle/save"><p class="specmeta"><code>POST</code> · <code>/point/admin/bundle/save</code></p><p>Tạo (không có id) hoặc sửa (có id) bundle (M2).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>Khi sửa</td><td>Bundle phải tồn tại.</td></tr><tr><td><code>programId</code></td><td>long</td><td>Khi tạo</td><td>Program phải tồn tại. Khi sửa: bỏ qua; nếu gửi khác program hiện tại → lỗi.</td></tr><tr><td><code>taskBundleName</code></td><td>string</td><td>Có</td><td>Trim, 1–128 ký tự (<code>varchar(128)</code>). Không trùng bundle khác trong cùng program, không phân biệt hoa thường. DB không có unique key cho tên bundle, API tự kiểm.</td></tr><tr><td><code>taskBundleDescription</code></td><td>string</td><td>Có</td><td>Trim, 1–255 ký tự (<code>varchar(255)</code>).</td></tr><tr><td><code>displayHideBookType</code></td><td>int</td><td>Có</td><td>0 / 1 / 2. Sửa tự do.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Validate.</li>
<li>Tạo: INSERT với <code>enabled = 1</code>. Bundle rỗng không ảnh hưởng engine.</li>
<li>Sửa: UPDATE tên, mô tả, book type, <code>update_user</code>, <code>update_date</code>. Không bao giờ UPDATE <code>program_id</code> (I3).</li></ol><pre>INSERT INTO point_task_bundle
  (program_id, task_bundle_name, task_bundle_description, enabled, display_hide_book_type, create_date, create_user)
VALUES (#{programId}, #{taskBundleName}, #{taskBundleDescription}, 1, #{displayHideBookType}, UTC_TIMESTAMP(), #{currentUser});

UPDATE point_task_bundle
SET task_bundle_name = #{taskBundleName}, task_bundle_description = #{taskBundleDescription},
    display_hide_book_type = #{displayHideBookType}, update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE id = #{id};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": { "id": 2102 } }</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Bundle does not exist.</code></td><td></td></tr><tr><td><code>Bundle cannot be moved to another program.</code></td><td>I3</td></tr><tr><td><code>Bundle name is required.</code></td><td></td></tr><tr><td><code>Bundle name must be at most 128 characters.</code></td><td></td></tr><tr><td><code>Bundle name already exists in this program.</code></td><td></td></tr><tr><td><code>Bundle description is required.</code></td><td></td></tr><tr><td><code>Bundle description must be at most 255 characters.</code></td><td></td></tr><tr><td><code>Display hide book type must be 0, 1 or 2.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Lưu ý</h4><p><code>displayHideBookType</code> của bundle: như P4 nhưng phạm vi là các trading task trong bundle này (đổi sang <code>1</code> / <code>2</code> thì khách A book / B book thôi được tính coin ở các task đó). Với check-in chỉ là lọc hiển thị.</p></div></div><div class="specsrc" id="spec-b3" data-title="B3 · /point/admin/bundle/enable"><p class="specmeta"><code>POST</code> · <code>/point/admin/bundle/enable</code></p><p>Bật/tắt bundle.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>Có</td><td>Bundle phải tồn tại.</td></tr><tr><td><code>enabled</code></td><td>int</td><td>Có</td><td>0 / 1.</td></tr><tr><td><code>confirmDuplicate</code></td><td>bool</td><td>Không</td><td>Chỉ dùng khi bật: <code>true</code> = người dùng đã xem cảnh báo J2 (trading) và vẫn muốn bật. Không bỏ qua được I2 (check-in).</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Mở transaction, khoá program: <code>SELECT id FROM point_program WHERE id = ? FOR UPDATE</code>.</li>
<li><b>Khi bật, bước 1 – I2 check-in (chặn cứng):</b> với từng check-in task <code>enabled = 1</code> trong bundle, chạy query V15 (tab Quy tắc) với <code>enablingBundleId</code> = bundle này. Nhờ vậy bắt được cả 2 task cùng nằm trong bundle đang bật lên, không chỉ task ở bundle khác. Trùng → lỗi, không bật, kể cả khi <code>confirmDuplicate = true</code>.</li>
<li><b>Khi bật, bước 2 – J2 trading (chỉ cảnh báo, đã chốt):</b> lấy các trading task <code>enabled = 1</code> trong bundle mà khung tham gia chưa kết thúc (<code>no_limit</code> hoặc <code>participate_period_to &gt; now</code>). Với mỗi task, chạy query J2 của nhóm Trading (spec T2), coi bundle đang bật lên là đã bật. Gom mọi id trùng vào <code>duplicateTaskIds</code> (gồm cả task khác trong chính bundle này nếu bundle có từ 2 trading task trở lên). Có trùng mà <code>confirmDuplicate</code> không phải <code>true</code> → trả lỗi kèm <code>duplicateTaskIds</code>, không bật; FE hỏi lại, đồng ý thì gửi lại B3 với <code>confirmDuplicate = true</code>.</li>
<li>Khi tắt: không chặn (xem trả lời 4.2).</li>
<li>UPDATE <code>enabled</code>, <code>update_user</code>, <code>update_date</code>.</li></ol><pre>-- step 2, J2 (trading spec T2) adapted for B3: run for each candidate trading task #{candId}
SELECT d.id, d.task_name
FROM point_task_trading d
JOIN point_task_bundle b ON b.id = d.task_bundle_id
WHERE d.program_id = #{programId}
  AND d.id &lt;&gt; #{candId}
  AND d.enabled = 1
  AND (b.enabled = 1 OR b.id = #{bundleId})          -- the bundle being enabled counts as on
  AND ( d.participate_period_limit_type = 'no_limit'
        OR d.participate_period_to &gt; UTC_TIMESTAMP() );

UPDATE point_task_bundle
SET enabled = #{enabled}, update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE id = #{id};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": null }

// I2 (check-in): hard block, confirmDuplicate does not help
{ "success": false, "code": 500,
  "message": "Cannot enable this bundle: check-in task 3102 would be live at the same time as check-in task 3101 (mitrade_daily_checkin). Clients can only see one check-in task at a time.",
  "result": null }

// J2 (trading): warning, resend with confirmDuplicate = true to continue
{ "success": false, "code": 500,
  "message": "Program already has a live trading task: 3188 (HSB Coin Trading old). Send confirmDuplicate to continue.",
  "result": { "duplicateTaskIds": [3188] } }</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Bundle does not exist.</code></td><td></td></tr><tr><td><code>Enabled must be 0 or 1.</code></td><td></td></tr><tr><td><code>Cannot enable this bundle: check-in task {id} would be live at the same time as check-in task {otherId} ({otherName}). Clients can only see one check-in task at a time.</code></td><td>I2, chặn cứng</td></tr><tr><td><code>Program already has a live trading task: {ids}. Send confirmDuplicate to continue.</code></td><td>J2, cảnh báo (cùng message với T2)</td></tr></table></div><div class="specsec"><h4>5. Lưu ý</h4><p>Thứ tự cố định: I2 trước, J2 sau. Nếu I2 đã lỗi thì không trả <code>duplicateTaskIds</code>, để FE không hỏi xác nhận cho một lần bật chắc chắn thất bại. Bật program (P4) và client group (P5) không cần I2 hay J2 vì cả hai tính trong 1 program.</p></div></div><div class="specsrc" id="spec-l1" data-title="L1 · /point/admin/blacklist/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/blacklist/list</code></p><p>Danh sách blacklist của 1 bundle, gồm cả dòng đã whitelist (M3).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>bundleId</code></td><td>long</td><td>Có</td><td>Bundle phải tồn tại.</td></tr><tr><td><code>clientId</code></td><td>long</td><td>Không</td><td>Lọc khớp đúng.</td></tr><tr><td><code>enabled</code></td><td>int</td><td>Không</td><td><code>1</code> Blacklisted, <code>0</code> Whitelisted.</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>Không</td><td>Mặc định 1.</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>Không</td><td>Mặc định 10, tối đa 100.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Lấy <code>program_id</code> của bundle.</li>
<li>Query bên dưới, sắp theo <code>update_date</code> mới nhất trước (cột luôn có giá trị vì L2 ghi cả lúc INSERT).</li>
<li>Trả thêm <code>programWideCount</code>: số dòng chặn <b>cả program</b> (<code>point_task_bundle_id</code> NULL, <code>enabled = 1</code>). Smart CRM không tạo loại này, nhưng nếu có thì khách đó bị chặn ở mọi bundle; FE nên hiện cảnh báo chỉ đọc.</li></ol><pre>SELECT bl.id, bl.client_id, bl.enabled, bl.remark,
       bl.create_user, bl.create_date, bl.update_user, bl.update_date
FROM client_promotion_blacklist bl
WHERE bl.promo_table = 'point_program'
  AND bl.promo_config_id = #{programId}
  AND bl.point_task_bundle_id = #{bundleId}
  AND (#{clientId} IS NULL OR bl.client_id = #{clientId})
  AND (#{enabled} IS NULL OR bl.enabled = #{enabled})
ORDER BY bl.update_date DESC, bl.id DESC
LIMIT #{offset}, #{pageSize};

SELECT COUNT(*) FROM client_promotion_blacklist
WHERE enabled = 1 AND promo_table = 'point_program'
  AND promo_config_id = #{programId} AND point_task_bundle_id IS NULL;</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": {
    "total": 1, "programWideCount": 0,
    "records": [{ "id": 801, "clientId": 7200101, "enabled": 1, "remark": "Abuse, ticket 1234",
                  "createUser": "admin01", "createDate": "2026-10-21 03:00:00",
                  "updateUser": "admin01", "updateDate": "2026-10-21 03:00:00" }]
  }
}</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Bundle does not exist.</code></td><td></td></tr><tr><td><code>Enabled must be 0 or 1.</code></td><td></td></tr></table></div></div><div class="specsrc" id="spec-l2" data-title="L2 · /point/admin/blacklist/save"><p class="specmeta"><code>POST</code> · <code>/point/admin/blacklist/save</code></p><p>Thêm khách vào blacklist của bundle, hoặc đổi Blacklisted ↔ Whitelisted.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>bundleId</code></td><td>long</td><td>Có</td><td>Bundle phải tồn tại.</td></tr><tr><td><code>clientId</code></td><td>long</td><td>Có</td><td>Số dương.</td></tr><tr><td><code>enabled</code></td><td>int</td><td>Có</td><td><code>1</code> blacklist, <code>0</code> whitelist.</td></tr><tr><td><code>remark</code></td><td>string</td><td>Không</td><td>Trim, ≤ 120 ký tự (<code>varchar(120) NOT NULL</code>). Không gửi khi thêm mới → lưu <code>''</code>. Khi đổi trạng thái: có gửi thì ghi đè, không gửi thì giữ remark cũ.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Lấy <code>program_id</code> của bundle và <code>client_group</code> của program.</li>
<li>Mở transaction: <code>SELECT id, enabled FROM client_promotion_blacklist WHERE client_id = ? AND promo_table = 'point_program' AND promo_config_id = ? AND point_task_bundle_id = ? FOR UPDATE</code>.</li>
<li><b>Đã có dòng</b> → UPDATE <code>enabled</code>, <code>remark</code>, <code>update_user</code>, <code>update_date</code>. Không kiểm group (cho phép whitelist khách đã đổi group).</li>
<li><b>Chưa có dòng</b>: <ul class="rules"><li><code>enabled = 0</code> → lỗi (không có gì để whitelist).</li>
  <li>Kiểm khách: <code>crm_customer_base</code> có <code>client_id</code>, <code>deleted = 0</code>, <code>group_code</code> = client group của program.</li>
  <li>INSERT dòng mới: <code>promotion_code = ''</code> (cột NOT NULL, không được ghi NULL), <code>remark</code> = giá trị gửi hoặc <code>''</code>, ghi luôn <code>update_user</code> / <code>update_date</code> = người tạo / thời điểm tạo.</li>
  <li>Nếu INSERT dính <code>uk_client_promo_bundle</code> (2 admin thêm cùng lúc) → bắt DuplicateKey, đọc lại dòng vừa có và UPDATE như nhánh "đã có dòng".</li></ul></li>
<li>Có hiệu lực ngay ở lần gọi API kế tiếp của khách (engine không cache blacklist).</li></ol>
<p>Mọi cột thời gian ghi bằng <code>UTC_TIMESTAMP()</code>, không dựa vào <code>DEFAULT CURRENT_TIMESTAMP</code> của bảng (giá trị default theo múi giờ của MySQL server).</p><pre>SELECT client_id FROM crm_customer_base
WHERE client_id = #{clientId} AND deleted = 0
  AND group_code = #{programClientGroup};

INSERT INTO client_promotion_blacklist
  (client_id, promotion_code, promo_table, promo_config_id, point_task_bundle_id, enabled, remark,
   create_date, create_user, update_date, update_user)
VALUES (#{clientId}, '', 'point_program', #{programId}, #{bundleId}, 1, IFNULL(#{remark}, ''),
        UTC_TIMESTAMP(), #{currentUser}, UTC_TIMESTAMP(), #{currentUser});

UPDATE client_promotion_blacklist
SET enabled = #{enabled}, remark = IFNULL(#{remark}, remark), update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE id = #{id};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": { "id": 801, "enabled": 1 } }</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Bundle does not exist.</code></td><td></td></tr><tr><td><code>Client ID does not exist.</code></td><td></td></tr><tr><td><code>Client {clientId} does not belong to client group {group} of this program.</code></td><td>2.6</td></tr><tr><td><code>Client {clientId} is not on this bundle's blacklist.</code></td><td>whitelist khi chưa có dòng</td></tr><tr><td><code>Remark must be at most 120 characters.</code></td><td></td></tr><tr><td><code>Enabled must be 0 or 1.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Lưu ý</h4><p>Câu INSERT đã khớp DDL thật (DDL thật trên UAT). Unique key <code>uk_client_promo_bundle</code> chặn trùng cho dòng theo bundle, nhưng vẫn SELECT … FOR UPDATE trước để trả đúng nhánh thêm mới / đổi trạng thái.</p></div></div><div class="specsrc" id="spec-c1" data-title="C1 · /point/admin/checkinTask/save"><p class="specmeta"><code>POST</code> · <code>/point/admin/checkinTask/save</code></p><p>Tạo (không có id) hoặc sửa (có id) check-in task (tab Config của M4).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>Khi sửa</td><td>Task phải tồn tại.</td></tr><tr><td><code>taskBundleId</code></td><td>long</td><td>Khi tạo</td><td>Bundle phải tồn tại. Khi sửa: phải bằng giá trị đang lưu (I3).</td></tr><tr><td><code>…</code></td><td></td><td></td><td>Đủ field, kiểu và quy tắc ở <a href="#rules" class="ref">tab Quy tắc</a>.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Lấy bundle → <code>program_id</code>. Nếu FE gửi <code>programId</code> thì phải khớp (V01).</li>
<li>Chuẩn hoá: trim chuỗi; ghi đè các field khoá cứng: <code>point_multiplier_enabled = 0</code>, <code>point_to_cash_convert_type = 'by_task_fixed_value'</code>, <code>checkin_auto = 0</code>; các field "lưu tự động" ở tab Quy tắc (ví dụ <code>no_limit</code> → <code>point_expiration_window = 7300</code>).</li>
<li>Chạy V01–V14 (tab Quy tắc). Gom <b>mọi</b> lỗi field, trả lỗi đầu tiên trong <code>message</code> và toàn bộ trong <code>result.errors</code> để FE tô đỏ từng ô.</li>
<li>Sửa: nếu task đã có khách (<code>EXISTS log WHERE task_id = ?</code>) → so từng field với bản đang lưu theo bảng khoá ở tab Khoá khi đang chạy (V16).</li>
<li>Mở transaction, khoá program (<code>SELECT … FOR UPDATE</code>). Sửa task đang <code>enabled = 1</code> → chạy V15 (I2) với cấu hình mới.</li>
<li>Tạo: INSERT với <b><code>enabled = 0</code></b>. Admin xem lại rồi bật bằng C2 (C2 kiểm I2). Sửa: UPDATE, không đổi <code>enabled</code>, <code>program_id</code>, <code>task_bundle_id</code>.</li></ol><pre>-- has participants? (needs index idx_task_date, see DEV-06)
SELECT EXISTS (SELECT 1 FROM point_task_daily_checkin_log WHERE task_id = #{id}) AS has_participants;

INSERT INTO point_task_daily_checkin
  (program_id, task_bundle_id, task_name, task_description, display_hide_book_type, enabled, tz_minutes,
   display_event, display_period_limit_apply, display_period_from, display_period_to, display_hide_to_all,
   participate_event, participate_period_limit_type, participate_period_from, participate_period_to,
   first_day_definition, routine_cycle_limit_days, routine_cycle_repeat, restart_missed_checkin_enabled,
   point_multiplier_enabled, point_distribute_specify_each_day, point_to_cash_convert_type,
   fixed_cash_value_per_point_unit, exp_distribute_specify_each_day, checkin_auto, claim_type,
   claim_require_day_per_cycle, claim_valid_period_type, claim_valid_complete_window,
   point_expiration_type, point_expiration_window, create_date, create_user)
VALUES (#{programId}, #{taskBundleId}, #{taskName}, #{taskDescription}, #{displayHideBookType}, 0, #{tzMinutes},
        #{displayEvent}, #{displayPeriodLimitApply}, #{displayPeriodFrom}, #{displayPeriodTo}, #{displayHideToAll},
        #{participateEvent}, #{participatePeriodLimitType}, #{participatePeriodFrom}, #{participatePeriodTo},
        #{firstDayDefinition}, #{routineCycleLimitDays}, #{routineCycleRepeat}, #{restartMissedCheckinEnabled},
        0, #{pointDistributeSpecifyEachDay}, 'by_task_fixed_value',
        #{fixedCashValuePerPointUnit}, #{expDistributeSpecifyEachDay}, 0, #{claimType},
        #{claimRequireDayPerCycle}, #{claimValidPeriodType}, #{claimValidCompleteWindow},
        #{pointExpirationType}, #{pointExpirationWindow}, UTC_TIMESTAMP(), #{currentUser});</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": { "id": 3102, "enabled": 0 } }

// validation failure
{ "success": false, "code": 500, "message": "Each cycle must have exactly 7 days (cycle 1 has 6).",
  "result": { "errors": [
    { "field": "pointDistributeSpecifyEachDay", "message": "Each cycle must have exactly 7 days (cycle 1 has 6)." },
    { "field": "pointExpirationWindow", "message": "Point expiration window must be between 1 and 7300 days." } ] } }</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>(see message tables in the Rules and Locks tabs)</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Lưu ý</h4><p><code>result.errors</code> là bổ sung so với quy ước 1.6 (vẫn giữ <code>message</code> = lỗi đầu tiên). Nếu Smart CRM không muốn thì bỏ, FE chỉ hiện <code>message</code>.</p></div></div><div class="specsrc" id="spec-c4" data-title="C4 · /point/admin/checkinTask/get"><p class="specmeta"><code>GET</code> · <code>/point/admin/checkinTask/get</code></p><p>Chi tiết 1 check-in task để mở modal View/Edit. <b>Bổ sung</b> so với danh sách: B1 chỉ trả tóm tắt.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>Có</td><td>Task phải tồn tại.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>SELECT toàn bộ field của task (datetime trả UTC).</li>
<li>Tính <code>participantCount</code> (số khách khác nhau trong log), <code>hasParticipants</code>, <code>lockedFields</code> (tab Khoá khi đang chạy) để FE khoá ô.</li>
<li><code>pendingClaimClientCount</code>: chỉ khi <code>claim_type = 'claim_each_cycle'</code> — số khách còn phần chưa nhận và chưa hết hạn. FE hiện số này trong hộp xác nhận khi tắt task/bundle/program (4.2).</li></ol><pre>SELECT COUNT(DISTINCT client_id) AS participant_count
FROM point_task_daily_checkin_log WHERE task_id = #{id};

SELECT COUNT(DISTINCT client_id) AS pending_claim_client_count
FROM point_task_daily_checkin_log
WHERE task_id = #{id} AND claim_type = 'claim_each_cycle'
  AND claim_status = 0 AND UTC_TIMESTAMP() &lt; claim_expiration_time;</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": {
    "id": 3101, "programId": 1101, "taskBundleId": 2101, "taskName": "mitrade_daily_checkin",
    "taskDescription": "7-day streak", "displayHideBookType": 0, "enabled": 1, "tzMinutes": 420,
    "displayEvent": "signup", "displayPeriodLimitApply": 1,
    "displayPeriodFrom": "2026-09-30 17:00:00", "displayPeriodTo": "2027-12-31 17:00:00", "displayHideToAll": 0,
    "participateEvent": "signup", "participatePeriodLimitType": "specific_period",
    "participatePeriodFrom": "2026-09-30 17:00:00", "participatePeriodTo": "2027-12-31 17:00:00",
    "firstDayDefinition": 0, "routineCycleLimitDays": 7, "routineCycleRepeat": 9999, "restartMissedCheckinEnabled": 1,
    "pointMultiplierEnabled": 0, "pointDistributeSpecifyEachDay": "{\"cycles\": [[5, 8, 10, 12, 14, 17, 34]]}",
    "pointToCashConvertType": "by_task_fixed_value", "fixedCashValuePerPointUnit": 0,
    "expDistributeSpecifyEachDay": "{\"cycles\": [[0, 0, 0, 0, 0, 0, 0]]}", "checkinAuto": 0,
    "claimType": "claim_each_day", "claimRequireDayPerCycle": null,
    "claimValidPeriodType": "no_limit", "claimValidCompleteWindow": null,
    "pointExpirationType": "days_after_claim", "pointExpirationWindow": 180,
    "participantCount": 1, "hasParticipants": true, "pendingClaimClientCount": 0,
    "lockedFields": ["taskBundleId", "tzMinutes", "firstDayDefinition", "routineCycleLimitDays",
                     "restartMissedCheckinEnabled", "claimType", "claimRequireDayPerCycle"],
    "createUser": "config_import", "createDate": "2026-10-20 08:15:00", "updateUser": null, "updateDate": null
  }
}</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Check-in task does not exist.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Lưu ý</h4><p><code>routineCycleRepeat</code> không nằm trong <code>lockedFields</code> vì vẫn được <b>tăng</b>; FE đặt giá trị tối thiểu = giá trị hiện tại. <code>participateEvent</code> bị khoá khi task chạy kiểu lịch (<code>restart = 0</code>).</p></div></div><div class="specsrc" id="spec-c2" data-title="C2 · /point/admin/checkinTask/enable"><p class="specmeta"><code>POST</code> · <code>/point/admin/checkinTask/enable</code></p><p>Bật/tắt check-in task.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>Có</td><td>Task phải tồn tại.</td></tr><tr><td><code>enabled</code></td><td>int</td><td>Có</td><td>0 / 1.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Mở transaction, khoá program.</li>
<li>Khi bật: chạy lại V01–V14 trên bản đang lưu (phòng dữ liệu cũ nhập tay sai), rồi V15 (I2) nếu bundle đang bật. Lỗi → không bật.</li>
<li>Khi tắt: không chặn.</li>
<li>UPDATE <code>enabled</code>, <code>update_user</code>, <code>update_date</code>.</li></ol>
<p>Task mới tạo bằng C1 luôn ở trạng thái tắt, nên C2 là cửa duy nhất đưa task lên app.</p><pre>UPDATE point_task_daily_checkin
SET enabled = #{enabled}, update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE id = #{id};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": null }</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Check-in task does not exist.</code></td><td></td></tr><tr><td><code>Cannot enable: check-in task {otherId} ({otherName}) is already live for an overlapping display period. Clients can only see one check-in task at a time.</code></td><td>I2</td></tr><tr><td><code>Cannot enable: {first validation error}</code></td><td>V01–V14</td></tr></table></div></div><div class="specsrc" id="spec-c3" data-title="C3 · /point/admin/checkinTask/log/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/checkinTask/log/list</code></p><p>Check-in log của 1 task (tab Check-in Log của M4).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>taskId</code></td><td>long</td><td>Có</td><td>Task phải tồn tại.</td></tr><tr><td><code>clientId</code></td><td>long</td><td>Không</td><td>Khớp đúng.</td></tr><tr><td><code>checkinDate_begin</code></td><td>string</td><td>Không</td><td><code>yyyy-MM-dd</code>. Ngày theo giờ địa phương của task (cột lưu sẵn theo <code>tz_minutes</code>), không phải UTC.</td></tr><tr><td><code>checkinDate_end</code></td><td>string</td><td>Không</td><td><code>yyyy-MM-dd</code>, tính cả ngày này.</td></tr><tr><td><code>cycle</code></td><td>int</td><td>Không</td><td>≥ 1.</td></tr><tr><td><code>taskStatus</code></td><td>int</td><td>Không</td><td><code>1</code> completed, <code>0</code> pending.</td></tr><tr><td><code>claimStatus</code></td><td>string</td><td>Không</td><td><code>to_claim</code> / <code>claimed</code> / <code>expired</code> (tính giống engine, xem SQL).</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>Không</td><td>Mặc định 1.</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>Không</td><td>Mặc định 10, tối đa 100.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Validate, chạy query, sắp <code>id DESC</code>.</li>
<li><code>claimStatus</code> trả ra là giá trị đã tính; kèm <code>claimStatusRaw</code> (0/1 trong DB).</li></ol><pre>SELECT l.id, l.client_id, l.checkin_date, l.cycle, l.day_in_cycle, l.task_status, l.claim_type,
       CASE WHEN l.claim_status = 1 THEN 'claimed'
            WHEN UTC_TIMESTAMP() &lt; l.claim_expiration_time THEN 'to_claim'
            ELSE 'expired' END AS claim_status,
       l.claim_status AS claim_status_raw, l.claim_time, l.claim_expiration_time,
       l.point_earned, l.exp_earned, l.cash_value_per_point_unit, l.point_expiration_time,
       l.client_group, l.create_date
FROM point_task_daily_checkin_log l
WHERE l.task_id = #{taskId}
  AND (#{clientId} IS NULL OR l.client_id = #{clientId})
  AND (#{checkinDateBegin} IS NULL OR l.checkin_date &gt;= #{checkinDateBegin})
  AND (#{checkinDateEnd} IS NULL OR l.checkin_date &lt;= #{checkinDateEnd})
  AND (#{cycle} IS NULL OR l.cycle = #{cycle})
  AND (#{taskStatus} IS NULL OR l.task_status = #{taskStatus})
HAVING (#{claimStatus} IS NULL OR claim_status = #{claimStatus})
ORDER BY l.id DESC
LIMIT #{offset}, #{pageSize};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": {
    "total": 1,
    "records": [{
      "id": 181, "clientId": 7200101, "checkinDate": "2026-10-20", "cycle": 1, "dayInCycle": 1, "taskStatus": 1,
      "claimType": "claim_each_day", "claimStatus": "claimed", "claimStatusRaw": 1,
      "claimTime": "2026-10-20 09:03:55", "claimExpirationTime": "2046-10-15 16:59:59",
      "pointEarned": 5, "expEarned": 0, "cashValuePerPointUnit": 0,
      "pointExpirationTime": "2027-04-18 16:59:59", "clientGroup": "mitrade_client",
      "createDate": "2026-10-20 09:03:55"
    }]
  }
}</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Check-in task does not exist.</code></td><td></td></tr><tr><td><code>Check-in date must be in yyyy-MM-dd format.</code></td><td></td></tr><tr><td><code>Claim status must be to_claim, claimed or expired.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Lưu ý</h4><p>Engine chỉ ghi <code>task_status = 1</code> (check-in thủ công); <code>0</code> giữ cho tương lai. <code>HAVING</code> trên cột tính toán: developer có thể chuyển thành điều kiện WHERE tương đương để dùng index.</p></div></div><div class="specsrc" id="spec-t1" data-title="T1 · /point/admin/trading/save"><p class="specmeta"><code>POST</code> · <code>/point/admin/trading/save</code></p><p>Tạo hoặc sửa 1 trading task kèm toàn bộ dòng quy đổi trong 1 lần lưu (tab Config của M4).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>Không</td><td>Không gửi = tạo mới. Có = sửa; task phải tồn tại.</td></tr><tr><td><code>programId</code></td><td>long</td><td>Có</td><td>Program phải tồn tại. Sửa: phải bằng giá trị đang lưu (J1).</td></tr><tr><td><code>taskBundleId</code></td><td>long</td><td>Có</td><td>Bundle phải tồn tại và <code>bundle.program_id = programId</code>. Sửa: phải bằng giá trị đang lưu (J1).</td></tr><tr><td><code>taskName</code></td><td>string</td><td>Có</td><td>Trim, 1–128 ký tự (varchar(128) NOT NULL).</td></tr><tr><td><code>taskDescription</code></td><td>string</td><td>Không</td><td>Trim, ≤ 512 ký tự. Rỗng → NULL.</td></tr><tr><td><code>…other fields</code></td><td></td><td></td><td>Xem bảng đầy đủ ở <a href="#rules" class="ref">tab Quy tắc</a>.</td></tr><tr><td><code>conversions[]</code></td><td>array</td><td>Có</td><td>Toàn bộ dòng quy đổi của task (gửi đủ, không gửi phần thay đổi). Mỗi phần tử: <code>id</code> (dòng đã có, không gửi = dòng mới), <code>mt5Group</code>, <code>conditionType</code>, <code>conditionValue</code>, <code>pointPerLot</code>. Validation ở tab Quy tắc.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds">
<li>Validate từng field và liên field (tab Quy tắc). Lỗi trả <code>result.errors = [{field, message}]</code>, field của dòng quy đổi dạng <code>conversions[2].pointPerLot</code>.</li>
<li>Mở transaction. Khoá program: <code>SELECT id FROM point_program WHERE id = ? FOR UPDATE</code>. Sửa: khoá thêm task (<code>SELECT … FROM point_task_trading WHERE id = ? FOR UPDATE</code>).</li>
<li>Sửa: tính <code>hasData</code> như T3; field nằm trong <code>lockedFields</code> mà giá trị khác giá trị đang lưu → lỗi (tab Khoá khi đang chạy).</li>
<li>Tạo: INSERT với <code>enabled = 0</code> (quy ước 1.6). Sửa: UPDATE mọi field trừ <code>enabled</code>, <code>program_id</code>, <code>task_bundle_id</code>; ghi rõ <code>update_date = UTC_TIMESTAMP()</code> (cột có <code>ON UPDATE CURRENT_TIMESTAMP</code> theo giờ server MySQL).</li>
<li>Dòng quy đổi (bảng không có cột <code>update_*</code>, không có unique key): <ul class="rules">
  <li>Dòng có <code>id</code>, cùng 4 giá trị → giữ nguyên.</li>
  <li>Dòng có <code>id</code> nhưng khác giá trị → <code>deleted = 1</code> dòng cũ, INSERT dòng mới (giữ lịch sử, biết ai tạo).</li>
  <li>Dòng đang có trong DB mà không có trong request → <code>deleted = 1</code>.</li>
  <li>Dòng không có <code>id</code> → INSERT, <code>create_user</code> = user đăng nhập.</li>
  </ul></li>
<li>Nếu task đang bật (<code>enabled = 1</code>) và có thay đổi khung tham gia / book type / bundle: chạy lại kiểm J2 như T2; có task trùng mà chưa gửi <code>confirmDuplicate = true</code> → lỗi kèm danh sách (FE hỏi lại người dùng).</li>
<li>COMMIT. Engine đọc cấu hình mới ở lần chạy kế tiếp (tính coin 3 phút, phát coin 10 phút).</li></ol><pre>INSERT INTO point_task_trading
  (program_id, task_bundle_id, task_name, task_description, display_hide_book_type, enabled, tz_minutes,
   display_event, display_period_limit_apply, display_period_from, display_period_to, display_hide_to_all,
   participate_period_limit_type, participate_period_from, participate_period_to, min_position_hold_second,
   point_max_cap_enabled, point_max_cap_value, cash_value_per_point_unit, release_auto_delay_day,
   point_expiration_window, terms_url, create_date, create_user, update_date, update_user)
VALUES (#{programId}, #{taskBundleId}, #{taskName}, #{taskDescription}, #{displayHideBookType}, 0, #{tzMinutes},
        #{displayEvent}, #{displayPeriodLimitApply}, #{displayPeriodFrom}, #{displayPeriodTo}, #{displayHideToAll},
        #{participatePeriodLimitType}, #{participatePeriodFrom}, #{participatePeriodTo}, #{minPositionHoldSecond},
        #{pointMaxCapEnabled}, #{pointMaxCapValue}, #{cashValuePerPointUnit}, #{releaseAutoDelayDay},
        #{pointExpirationWindow}, #{termsUrl}, UTC_TIMESTAMP(), #{currentUser}, UTC_TIMESTAMP(), #{currentUser});

-- conversion rows: soft delete what is gone or changed, insert what is new or changed
UPDATE point_task_trading_point_conversion SET deleted = 1
WHERE task_id = #{taskId} AND deleted = 0 AND id NOT IN (#{keptIds});

INSERT INTO point_task_trading_point_conversion
  (deleted, task_id, mt5_group, condition_type, condition_value, point_per_lot, create_date, create_user)
VALUES (0, #{taskId}, #{mt5Group}, #{conditionType}, #{conditionValue}, #{pointPerLot}, UTC_TIMESTAMP(), #{currentUser});</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": { "id": 3201, "enabled": 0 } }

// validation error
{ "success": false, "code": 500, "message": "Please fix the highlighted fields.",
  "result": { "errors": [
    { "field": "participatePeriodTo", "message": "Participate end must be after participate start." },
    { "field": "conversions[3].conditionValue", "message": "Duplicate rate row: Direct\\Mini400 / symbol_group / metal." }
  ] } }

// another live trading task in the program (J2)
{ "success": false, "code": 500, "message": "Program already has a live trading task: 3188 (HSB Coin Trading old). Send confirmDuplicate to continue.",
  "result": { "duplicateTaskIds": [3188] } }</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Please fix the highlighted fields.</code></td><td>kèm result.errors</td></tr><tr><td><code>Task does not exist.</code></td><td></td></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Task bundle does not exist.</code></td><td></td></tr><tr><td><code>Task bundle does not belong to this program.</code></td><td>J1</td></tr><tr><td><code>Program and task bundle cannot be changed.</code></td><td>J1</td></tr><tr><td><code>Field {field} cannot be changed after clients have traded in this task.</code></td><td>tab Khoá khi đang chạy</td></tr><tr><td><code>Program already has a live trading task: {ids}. Send confirmDuplicate to continue.</code></td><td>J2, chỉ khi task đang bật</td></tr></table></div><div class="specsec"><h4>5. Lưu ý</h4><p>Các message của từng field ở tab Quy tắc. Không có API xoá task; dòng quy đổi chỉ xoá mềm qua T1.</p></div></div><div class="specsrc" id="spec-t2" data-title="T2 · /point/admin/trading/enable"><p class="specmeta"><code>POST</code> · <code>/point/admin/trading/enable</code></p><p>Bật / tắt 1 trading task (switch trên thẻ task, qua EnableConfirmModal).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>Có</td><td>Task phải tồn tại.</td></tr><tr><td><code>enabled</code></td><td>int</td><td>Có</td><td>0 / 1.</td></tr><tr><td><code>confirmDuplicate</code></td><td>bool</td><td>Không</td><td>Chỉ dùng khi bật: <code>true</code> = người dùng đã xem cảnh báo J2 và vẫn muốn bật.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds">
<li>Transaction, khoá program như T1.</li>
<li><b>Bật</b>: chạy lại toàn bộ validation của T1 trên dữ liệu đang lưu (task + dòng quy đổi chưa xoá), thêm J6 (ít nhất 1 dòng <code>point_per_lot &gt; 0</code>). Sai → lỗi kèm <code>result.errors</code> (FE hiện EnableErrorModal).</li>
<li><b>Bật</b>: kiểm J2 bằng query bên dưới. Có task khác đang sống mà <code>confirmDuplicate</code> không phải <code>true</code> → lỗi kèm <code>duplicateTaskIds</code>.</li>
<li><b>Tắt</b>: không chặn. Trả kèm <code>pendingDealCount</code> / <code>pendingPoint</code> (lệnh đã tính, chưa phát) để FE hiện trong hộp xác nhận.</li>
<li>UPDATE <code>enabled</code>, <code>update_user</code>, <code>update_date = UTC_TIMESTAMP()</code>.</li></ol>
<p><b>Tắt task có tác dụng gì</b> (đọc trong code): engine tính coin không tạo lệnh mới cho task từ lần chạy kế tiếp; app không còn thấy task (khách thấy task khác nếu có, hoặc <code>tradingTask = false</code>). Engine phát coin <b>không</b> kiểm task còn bật: lệnh đã tính vẫn được phát đúng hẹn, coin đã cộng giữ nguyên và tiêu được.</p><pre>-- J2: other live trading tasks in the same program (participate window overlaps now or the future)
SELECT d.id, d.task_name
FROM point_task_trading d
JOIN point_task_bundle b ON b.id = d.task_bundle_id
WHERE d.program_id = #{programId}
  AND d.id &lt;&gt; #{id}
  AND d.enabled = 1 AND b.enabled = 1
  AND ( d.participate_period_limit_type = 'no_limit'
        OR d.participate_period_to &gt; UTC_TIMESTAMP() );

-- pending coins of the task (shown when disabling)
SELECT COUNT(*) AS pending_deal_count, COALESCE(SUM(point), 0) AS pending_point
FROM point_task_trading_deal_log
WHERE task_id = #{id} AND release_status = 0;   -- needs index (task_id, ...), DEV-06</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": { "enabled": 0, "pendingDealCount": 3, "pendingPoint": 210 } }</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Task does not exist.</code></td><td></td></tr><tr><td><code>Enabled must be 0 or 1.</code></td><td></td></tr><tr><td><code>Task cannot be enabled: please fix the highlighted fields.</code></td><td>kèm result.errors</td></tr><tr><td><code>Task needs at least one rate row with coins per lot above 0.</code></td><td>J6</td></tr><tr><td><code>Program already has a live trading task: {ids}. Send confirmDuplicate to continue.</code></td><td>J2</td></tr></table></div><div class="specsec"><h4>5. Lưu ý</h4><p>B3 (bật bundle, API của nhóm Check-in) gọi cùng kiểm J2 cho mọi trading task đang bật trong bundle đó, cùng cơ chế <code>confirmDuplicate</code>. Bật program (P4) và client group (P5) không cần kiểm J2 vì J2 tính trong 1 program.</p></div></div><div class="specsrc" id="spec-t3" data-title="T3 · /point/admin/trading/get"><p class="specmeta"><code>GET</code> · <code>/point/admin/trading/get</code></p><p>Chi tiết 1 trading task kèm dòng quy đổi chưa xoá và <code>lockedFields</code> (mở M4 ở chế độ View/Edit).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>Có</td><td>Task phải tồn tại.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds">
<li>Đọc task, dòng quy đổi <code>deleted = 0</code> (xếp <code>mt5_group</code>, ưu tiên symbol → symbol_group → any, <code>condition_value</code>).</li>
<li><code>hasData</code> = task đã có ít nhất 1 dòng <code>point_task_trading_deal_log</code>.</li>
<li><code>lockedFields</code>: luôn có <code>programId</code>, <code>taskBundleId</code>; thêm <code>tzMinutes</code>, <code>releaseAutoDelayDay</code> khi <code>hasData</code> (tab Khoá khi đang chạy).</li>
<li><code>warnings</code>: mảng chuỗi để FE hiện vàng, không chặn lưu: nhóm MT5 không có dòng <code>any</code>; dòng <code>point_per_lot = 0</code>; task đang bật mà J2 có task trùng.</li>
<li>Kèm <code>pendingDealCount</code>, <code>pendingPoint</code> như T2.</li></ol><pre>SELECT EXISTS (SELECT 1 FROM point_task_trading_deal_log WHERE task_id = #{id}) AS has_data;

SELECT id, mt5_group, condition_type, condition_value, point_per_lot, create_date, create_user
FROM point_task_trading_point_conversion
WHERE task_id = #{id} AND deleted = 0
ORDER BY mt5_group, FIELD(condition_type, 'symbol', 'symbol_group', 'any'), condition_value;</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": {
    "id": 3201, "programId": 1201, "taskBundleId": 2201,
    "taskName": "HSB Coin Trading", "taskDescription": "HSB Coin Trading",
    "enabled": 1, "displayHideBookType": 0, "tzMinutes": 420,
    "displayEvent": "signup", "displayPeriodLimitApply": 0, "displayPeriodFrom": null, "displayPeriodTo": null,
    "displayHideToAll": 0,
    "participatePeriodLimitType": "no_limit", "participatePeriodFrom": null, "participatePeriodTo": null,
    "minPositionHoldSecond": 180, "pointMaxCapEnabled": 1, "pointMaxCapValue": 2000,
    "cashValuePerPointUnit": 0.0000, "releaseAutoDelayDay": 0, "pointExpirationWindow": 180,
    "termsUrl": "https://.../terms.pdf",
    "createUser": "qa_fe", "createDate": "2026-10-14 09:40:11", "updateUser": "admin01", "updateDate": "2026-10-20 03:12:00",
    "conversions": [
      { "id": 101, "mt5Group": "Direct\\Mini400", "conditionType": "symbol_group", "conditionValue": "energy", "pointPerLot": 70.0000 },

    ],

}</pre></div><div class="specsec"><h4>4. Message lỗi</h4><table><tr><th>message</th><th style="width:22%">Ghi chú</th></tr><tr><td><code>Task does not exist.</code></td><td></td></tr></table></div></div><div class="specsrc" id="spec-t4" data-title="T4 · /point/admin/trading/dealLog/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/trading/dealLog/list</code></p><p>Chi tiết từng lệnh của 1 task (tab Deal Log của M4). Chỉ đọc.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Kiểu</th><th style="width:12%">Bắt buộc</th><th>Validation</th></tr><tr><td><code>taskId</code></td><td>long</td><td>Có</td><td>Task phải tồn tại.</td></tr><tr><td><code>clientId</code></td><td>long</td><td>Không</td><td>Khớp đúng.</td></tr><tr><td><code>loginId</code></td><td>long</td><td>Không</td><td>Khớp đúng.</td></tr><tr><td><code>periodKey_begin, periodKey_end</code></td><td>yyyy-MM-dd</td><td>Không</td><td>Ngày giao dịch theo giờ task, gồm 2 đầu. Không gửi = 30 ngày gần nhất theo giờ task. Khoảng tối đa 93 ngày.</td></tr><tr><td><code>releaseStatus</code></td><td>int</td><td>Không</td><td><code>0</code> chờ phát, <code>1</code> phát đủ, <code>2</code> phát một phần, <code>-1</code> từ chối, <code>-2</code> vượt trần.</td></tr><tr><td><code>symbol</code></td><td>string</td><td>Không</td><td>Mã không đuôi, khớp đúng (ví dụ <code>XAUUSD</code>).</td></tr><tr><td><code>pageNo, pageSize</code></td><td>int</td><td>Không</td><td>1 / 10, tối đa 100.</td></tr></table></div></div><div class="specsec"><h4>2. Xử lý</h4><ol class="conds"><li>Validate, áp khoảng ngày mặc định.</li><li>Query bên dưới; <code>total</code> đếm cùng điều kiện.</li>
<li>Trả thêm <code>reasonText</code> tiếng Anh cho <code>reason_code</code> (bảng ở Lưu ý).</li></ol><pre>SELECT l.id, l.client_id, l.login_id, l.mt5_group, l.deal_id, l.symbol_full, l.symbol, l.symbol_group,
       l.lot, l.lot_valid, l.position_open_time_utc, l.deal_time_utc, l.period_key,
       l.position_hold_second, l.min_position_hold_second, l.position_hold_qualified, l.is_blacklisted,
       l.point_per_lot, l.point, l.release_point, l.un_release_point, l.release_status, l.reason_code,
       l.release_schedule_time, l.release_actual_time, l.release_fail_times, l.create_date
FROM point_task_trading_deal_log l
WHERE l.task_id = #{taskId}
  AND (#{clientId} IS NULL OR l.client_id = #{clientId})
  AND (#{loginId} IS NULL OR l.login_id = #{loginId})
  AND (#{periodKey_begin} IS NULL OR l.period_key &gt;= #{periodKey_begin})
  AND (#{periodKey_end} IS NULL OR l.period_key &lt;= #{periodKey_end})
  AND (#{releaseStatus} IS NULL OR l.release_status = #{releaseStatus})
  AND (#{symbol} IS NULL OR l.symbol = #{symbol})
ORDER BY l.deal_id DESC
LIMIT #{offset}, #{pageSize};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": { "total": 1, "records": [{
    "id": 262301, "clientId": 72000101, "loginId": 31000101, "mt5Group": "Direct\\Mini400",
    "dealId": 5000280112, "symbolFull": "XAUUSD.VIP", "symbol": "XAUUSD", "symbolGroup": "metal",
    "lot": 0.500000, "lotValid": 0.500000, "positionOpenTimeUtc": "2026-10-20 02:01:10", "dealTimeUtc": "2026-10-20 02:09:44",
    "periodKey": "2026-10-20", "positionHoldSecond": 514, "minPositionHoldSecond": 180, "positionHoldQualified": 1,
    "isBlacklisted": 0, "pointPerLot": 70.0000, "point": 35, "releasePoint": 35, "unReleasePoint": 0,
