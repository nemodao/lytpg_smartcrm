}</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Program has no client group.</code></td><td>RI2</td></tr><tr><td><code>Order status is invalid.</code></td><td>invalid status filter</td></tr></table></div><div class="specsec"><h4>5. Notes</h4><p>Order detail API (full shipping address, voucher code) is <b>not needed in this phase</b> (confirmed by Smart CRM). When built, still mask codes/PINs/tokens + log access.</p></div></div><div class="specsrc" id="spec-r2" data-title="R2 · /point/admin/redemption/transaction/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/redemption/transaction/list</code></p><p>Coin deduct/refund transactions (point_redemption_transaction) of clients in 1 program. Read-only.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>Yes</td><td>Program must have a client group.</td></tr><tr><td><code>clientId</code></td><td>long</td><td>No</td><td>Exact match.</td></tr><tr><td><code>orderReference</code></td><td>string</td><td>No</td><td>Exact match.</td></tr><tr><td><code>status</code></td><td>int</td><td>No</td><td><code>1</code> deducted / <code>2</code> refunded.</td></tr><tr><td><code>reconciled</code></td><td>int</td><td>No</td><td><code>0</code> not reconciled / <code>1</code> awaiting reviewer / <code>2</code> reconciled (RI5).</td></tr><tr><td><code>createDate_begin</code></td><td>string</td><td>No</td><td>UTC.</td></tr><tr><td><code>createDate_end</code></td><td>string</td><td>No</td><td>UTC, <code>&lt;</code>.</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>No</td><td>Default 1.</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>No</td><td>Default 10, max 100.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>Get the program's client group as in R1.</li>
<li>Query below; JOIN <code>crm_customer_base</code> on <code>client_id</code> (here it is <code>bigint</code>, no CAST needed).</li>
<li><b>Masking</b> (4.3): do NOT return <code>raw_request</code>, <code>raw_response</code>. <code>idr_amount</code> (IDR amount) is <b>shown normally</b> to Smart CRM users (internal — confirmed); never sent to the client app.</li>
<li>Also returns <code>reconcile_user</code>, <code>reconcile_remark</code>, <code>reconcile_date</code> (3 NEW COLUMNS) so FE can show who reviewed (see R5).</li>
<li>Sort by <code>create_date DESC, id DESC</code>.</li></ol><pre>SELECT t.id, t.order_reference, t.client_id, t.trx_id, t.coin_amount, t.idr_amount,
       t.status, t.reconciled, t.redeem_date, t.void_trx_id, t.void_date, t.fail_reason,
       t.reconcile_user, t.reconcile_remark, t.reconcile_date,   -- 3 NEW columns (R5, DEV-09)
       t.create_date, t.update_date
FROM point_redemption_transaction t
JOIN crm_customer_base c ON c.client_id = t.client_id
WHERE t.external_system = 'tada'
  AND c.deleted = 0
  AND c.group_code = (SELECT client_group FROM promo_client_group
                      WHERE promo_table = 'point_program' AND promo_config_id = #{programId} LIMIT 1)
  AND (#{clientId}        IS NULL OR t.client_id = #{clientId})
  AND (#{orderReference}  IS NULL OR t.order_reference = #{orderReference})
  AND (#{status}          IS NULL OR t.status = #{status})
  AND (#{reconciled}      IS NULL OR t.reconciled = #{reconciled})
  AND (#{createDateBegin} IS NULL OR t.create_date &gt;= #{createDateBegin})
  AND (#{createDateEnd}   IS NULL OR t.create_date &lt;  #{createDateEnd})
ORDER BY t.create_date DESC, t.id DESC
LIMIT #{offset}, #{pageSize};
-- raw_request / raw_response are intentionally NOT selected (raw payload, sensitive).</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": {
    "total": 1,
    "records": [{
      "id": 26, "orderReference": "CI23062210514901613152", "clientId": 7209001, "trxId": 110001,
      "coinAmount": 1000, "idrAmount": 100000, "status": 1, "reconciled": 2,
      "redeemDate": "2026-10-21 03:00:00", "voidTrxId": null, "voidDate": null, "failReason": null,
      "reconcileUser": "admin01", "reconcileRemark": "Verified on TADA, refunded manually", "reconcileDate": "2026-10-21 10:05:00",
      "createDate": "2026-10-21 03:00:00", "updateDate": "2026-10-21 09:32:36"
    }]
  }
}</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Program has no client group.</code></td><td></td></tr><tr><td><code>Status must be 1 or 2.</code></td><td></td></tr><tr><td><code>Reconciled must be 0, 1 or 2.</code></td><td>RI5</td></tr></table></div><div class="specsec"><h4>5. Notes</h4><p>Rejected transactions (insufficient balance, blacklist, limit exceeded...) are <b>not stored</b> in the table (engine deletes the row), so this table only contains orders successfully deducted/refunded.</p></div></div><div class="specsrc" id="spec-r3" data-title="R3 · /point/admin/redemption/blacklist/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/redemption/blacklist/list</code></p><p>Redeem blacklist of clients in 1 program (both enabled 0 and 1).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>Yes</td><td>Program must have a client group.</td></tr><tr><td><code>clientId</code></td><td>long</td><td>No</td><td>Exact match.</td></tr><tr><td><code>enabled</code></td><td>int</td><td>No</td><td><code>1</code> Blacklisted, <code>0</code> Whitelisted.</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>No</td><td>Default 1.</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>No</td><td>Default 10, max 100.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>Get the program's client group.</li>
<li>Filter exactly the global redeem rows (<code>promo_table = 'point_redemption_transaction'</code>, <code>promo_config_id = 0</code>, <code>point_task_bundle_id = 0</code>); JOIN <code>crm_customer_base</code> to restrict to the program's clients.</li>
<li>Sort by <code>update_date DESC, id DESC</code>.</li></ol>
<p><b>UI note (RI3):</b> this row blocks the client from redeeming gifts in ALL programs. The FE must clearly say "blocked system-wide", not just this program.</p><pre>SELECT bl.id, bl.client_id, bl.enabled, bl.remark,
       bl.create_user, bl.create_date, bl.update_user, bl.update_date
FROM client_promotion_blacklist bl
JOIN crm_customer_base c ON c.client_id = bl.client_id
WHERE bl.promo_table = 'point_redemption_transaction'
  AND bl.promo_config_id = 0 AND bl.point_task_bundle_id = 0
  AND c.deleted = 0
  AND c.group_code = (SELECT client_group FROM promo_client_group
                      WHERE promo_table = 'point_program' AND promo_config_id = #{programId} LIMIT 1)
  AND (#{clientId} IS NULL OR bl.client_id = #{clientId})
  AND (#{enabled}  IS NULL OR bl.enabled = #{enabled})
ORDER BY bl.update_date DESC, bl.id DESC
LIMIT #{offset}, #{pageSize};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": {
    "total": 1,
    "records": [{ "id": 9001, "clientId": 7209004, "enabled": 1, "remark": "Fraud, ticket 1234",
                  "createUser": "admin01", "createDate": "2026-10-21 03:00:00",
                  "updateUser": "admin01", "updateDate": "2026-10-21 03:00:00" }]
  }
}</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Program has no client group.</code></td><td></td></tr><tr><td><code>Enabled must be 0 or 1.</code></td><td></td></tr></table></div></div><div class="specsrc" id="spec-r4" data-title="R4 · /point/admin/redemption/blacklist/save"><p class="specmeta"><code>POST</code> · <code>/point/admin/redemption/blacklist/save</code></p><p>Add a client to the redeem blacklist, or switch Blacklisted ↔ Whitelisted (global block).</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>Yes</td><td>Used to check that the client belongs to the program when ADDING a new row.</td></tr><tr><td><code>clientId</code></td><td>long</td><td>Yes</td><td>Positive number.</td></tr><tr><td><code>enabled</code></td><td>int</td><td>Yes</td><td><code>1</code> blacklist, <code>0</code> whitelist.</td></tr><tr><td><code>remark</code></td><td>string</td><td>No</td><td>Trim, ≤ 120 characters (<code>varchar(120) NOT NULL</code>). On add, if not sent → <code>''</code>; on status change: if sent, overwrite; if not sent, keep the old value.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>Get the program's client group.</li>
<li>Open transaction: <code>SELECT id, enabled FROM client_promotion_blacklist WHERE client_id = ? AND promo_table = 'point_redemption_transaction' AND promo_config_id = 0 AND point_task_bundle_id = 0 FOR UPDATE</code>.</li>
<li><b>Row exists</b> → UPDATE <code>enabled</code>, <code>remark</code>, <code>update_user</code>, <code>update_date</code>. No group check (allows whitelisting clients who have changed group).</li>
<li><b>No row yet</b>: <code>enabled = 0</code> → error (nothing to whitelist). Otherwise check the client exists + belongs to the program's client group (2.3/RI2), then INSERT: <code>promotion_code = ''</code> (NOT NULL), <code>promo_config_id = 0</code>, <code>point_task_bundle_id = 0</code>, <code>enabled = 1</code>, remark, set <code>create/update_user</code> + <code>UTC_TIMESTAMP()</code>. Duplicate <code>uk_client_promo_bundle</code> (2 admins at the same time) → catch DuplicateKey, re-read and UPDATE.</li>
<li>Takes effect immediately on the client's next API call (the engine does not cache the blacklist).</li></ol><pre>SELECT client_id FROM crm_customer_base
WHERE client_id = #{clientId} AND deleted = 0
  AND group_code = (SELECT client_group FROM promo_client_group
                    WHERE promo_table = 'point_program' AND promo_config_id = #{programId} LIMIT 1);

INSERT INTO client_promotion_blacklist
  (client_id, promotion_code, promo_table, promo_config_id, point_task_bundle_id, enabled, remark,
   create_date, create_user, update_date, update_user)
VALUES (#{clientId}, '', 'point_redemption_transaction', 0, 0, 1, IFNULL(#{remark}, ''),
        UTC_TIMESTAMP(), #{currentUser}, UTC_TIMESTAMP(), #{currentUser});

UPDATE client_promotion_blacklist
SET enabled = #{enabled}, remark = IFNULL(#{remark}, remark),
    update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE id = #{id};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": { "id": 9001, "enabled": 1 } }</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Client ID does not exist.</code></td><td></td></tr><tr><td><code>Client {clientId} does not belong to client group {group} of this program.</code></td><td>RI2</td></tr><tr><td><code>Client {clientId} is not on the redeem blacklist.</code></td><td>whitelist when no row exists</td></tr><tr><td><code>Remark must be at most 120 characters.</code></td><td></td></tr><tr><td><code>Enabled must be 0 or 1.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Notes</h4><p>Matches the actual DDL on UAT. Redeem rows use <code>promo_config_id = 0</code>, <code>point_task_bundle_id = 0</code> (not NULL), so <code>uk_client_promo_bundle</code> can prevent duplicates. Completely different from the Check-in group's per-bundle blacklist (<code>promo_table = 'point_program'</code>).</p></div></div><div class="specsrc" id="spec-r5" data-title="R5 · /point/admin/redemption/transaction/reconcile"><p class="specmeta"><code>POST</code> · <code>/point/admin/redemption/transaction/reconcile</code></p><p>Mark 1 transaction as 'manually checked' (reconciled 1 → 2). Answer 4.1.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>Yes</td><td>The transaction must exist and be <code>status = 1</code> and <code>reconciled = 1</code>.</td></tr><tr><td><code>remark</code></td><td>string</td><td>Yes</td><td>Trim, 5–255 characters. Reviewer's note (required, same as the Trading group's K3 coin adjustment).</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds"><li>Check the transaction exists, <code>status = 1</code>, <code>reconciled = 1</code> (only orders the job has flagged as needing manual review can be marked).</li>
<li>Validate <code>remark</code>: required, 5–255 characters.</li>
<li>Conditional UPDATE (guard: change only while still <code>reconciled = 1</code>): set <code>reconciled = 2</code> and write reviewer / note / timestamp into 3 NEW columns <code>reconcile_user</code>, <code>reconcile_remark</code>, <code>reconcile_date</code> (Smart CRM has asked the developer to add these 3 columns).</li></ol>
<p>Do not allow changing <code>0 → 2</code> (handled by the job) or touching <code>2</code>. This is a manual step that covers orphan orders (#16): the job only warns and sets 1; the operator refunds/handles it on TADA, then marks 2 here.</p><pre>UPDATE point_redemption_transaction
SET reconciled = 2,
    reconcile_user = #{currentUser}, reconcile_remark = #{remark}, reconcile_date = UTC_TIMESTAMP(),
    update_date = UTC_TIMESTAMP()
WHERE id = #{id} AND status = 1 AND reconciled = 1;
-- reconcile_user / reconcile_remark / reconcile_date are 3 NEW columns the developer must add to point_redemption_transaction (DEV-09).</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": null }</pre></div><div class="specsec"><h4>4. Error messages</h4><table><tr><th>message</th><th style="width:22%">Notes</th></tr><tr><td><code>Transaction does not exist.</code></td><td></td></tr><tr><td><code>Only transactions pending manual review (reconciled = 1) can be marked as reconciled.</code></td><td>RI5</td></tr><tr><td><code>Remark is required and must be between 5 and 255 characters.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. Notes</h4><p>Smart CRM has decided to keep R5. The 3 columns <code>reconcile_user</code> / <code>reconcile_remark</code> / <code>reconcile_date</code> are <b>new columns</b> the developer must add to <code>point_redemption_transaction</code> (Smart CRM sends this to dev).</p></div></div><div class="specsrc" id="spec-n1" data-title="N1 · /point/admin/notifyLog/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/notifyLog/list</code></p><p>List of CleverTap notification logs for the clients of a program (Omni Marketing tab (S2)), newest first.</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">Type</th><th style="width:12%">Required</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>Yes</td><td>Program must exist.</td></tr><tr><td><code>clientId</code></td><td>long</td><td>No</td><td>Exact match.</td></tr><tr><td><code>eventName</code></td><td>string</td><td>No</td><td>One of the 9 values in <a href="#values" class="ref">table 3.1</a>.</td></tr><tr><td><code>subType</code></td><td>string</td><td>No</td><td><code>first_coin</code> / <code>last_trade_earned</code> / <code>not_traded</code> (table 3.2). Not sent = no filter.</td></tr><tr><td><code>isSend</code></td><td>int</td><td>No</td><td><code>0</code> or <code>1</code>.</td></tr><tr><td><code>sendStatus</code></td><td>int</td><td>No</td><td><code>-1</code> / <code>0</code> / <code>1</code> / <code>2</code> (table 3.3).</td></tr><tr><td><code>eventDate_begin</code></td><td>string</td><td>No</td><td><code>yyyy-MM-dd HH:mm:ss</code>, UTC, inclusive.</td></tr><tr><td><code>eventDate_end</code></td><td>string</td><td>No</td><td><code>yyyy-MM-dd HH:mm:ss</code>, UTC, inclusive. Must be ≥ <code>eventDate_begin</code>.</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>No</td><td>Default 1.</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>No</td><td>Default 10, max 100.</td></tr></table></div></div><div class="specsec"><h4>2. Processing</h4><ol class="conds">
<li>Validate parameters (Request table). Invalid → error, no query.</li>
<li>Check the program exists, then get the program's <code>client_group</code> (SQL (1), (2)). Program has no client group → error.</li>
<li>Run the list query and <code>COUNT(*)</code> with the same conditions. Clients of the program = <code>crm_customer_base.group_code = client_group</code> (rule 2.1).</li>
<li>Map to DTO: datetime in UTC format with the exact DB value; <code>payload</code> parsed into a JSON object (DB NULL → <code>null</code>); <code>isSend</code> returns <code>0</code>/<code>1</code>.</li>
</ol><pre>-- (1) program exists
SELECT id FROM point_program WHERE id = #{programId};

-- (2) client group of the program (1-1, including enabled = 0 rows: logs are history)
SELECT client_group
FROM promo_client_group
WHERE promo_table = 'point_program' AND promo_config_id = #{programId}
LIMIT 1;</pre><pre>SELECT l.id, l.client_id, l.event_name, l.sub_type, l.period_key, l.ref_key, l.payload,
       l.event_date, l.is_send, l.send_status, l.send_date, l.send_remark,
       l.create_date, l.create_user, l.update_date, l.update_user
FROM point_notify_log l
WHERE EXISTS (SELECT 1 FROM crm_customer_base cb
              WHERE cb.client_id = l.client_id AND cb.group_code = #{clientGroup})
  &lt;if clientId&gt;       AND l.client_id = #{clientId}            &lt;/if&gt;
  &lt;if eventName&gt;      AND l.event_name = #{eventName}          &lt;/if&gt;
  &lt;if subType&gt;        AND l.sub_type = #{subType}              &lt;/if&gt;
  &lt;if isSend&gt;         AND l.is_send = #{isSend}                &lt;/if&gt;
  &lt;if sendStatus&gt;     AND l.send_status = #{sendStatus}        &lt;/if&gt;
  &lt;if eventDateBegin&gt; AND l.event_date &gt;= #{eventDateBegin}    &lt;/if&gt;
  &lt;if eventDateEnd&gt;   AND l.event_date &lt;= #{eventDateEnd}      &lt;/if&gt;
ORDER BY l.event_date DESC, l.id DESC
LIMIT #{offset}, #{pageSize};

-- total: SELECT COUNT(*) with the same FROM + WHERE</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": {
    "total": 2,
    "records": [
      {
        "id": 305, "clientId": 7200101, "eventName": "loyalty_daily_nudge", "subType": "last_trade_earned",
        "periodKey": "2026-10-17", "refKey": "2026-10-21",
        "payload": { "nudge_type": "last_trade_earned", "last_coin": 120, "last_coin_text": "120",
                     "coin_per_lot": 10, "coin_per_lot_text": "10",
                     "coin_balance": 1540, "coin_balance_text": "1.540",
                     "next_gift_name": "Voucher GoPay 50K", "coin_to_next_gift": 460, "coin_to_next_gift_text": "460" },
        "eventDate": "2026-10-21 07:00:00", "isSend": 1, "sendStatus": 1, "sendDate": "2026-10-21 07:00:02",
        "sendRemark": "", "createDate": "2026-10-21 07:00:01", "createUser": "system",
        "updateDate": "2026-10-21 07:00:02", "updateUser": "system"
      },
      {
        "id": 12, "clientId": 7200102, "eventName": "loyalty_enrolled", "subType": "",
        "periodKey": "lifetime", "refKey": "2026-10-15",
        "payload": { "loyalty_eligible": true },
        "eventDate": "2026-10-15 03:00:00", "isSend": 0, "sendStatus": -1, "sendDate": null,
        "sendRemark": "Pre-launch eligible existing clients", "createDate": "2026-10-15 02:41:10", "createUser": "system",
        "updateDate": null, "updateUser": ""
      }
    ]
  }
}</pre><p>Sort: <code>event_date DESC, id DESC</code>.</p></div><div class="specsec"><h4>4. Error messages</h4><div class="scroll"><table><tr><th>message</th><th style="width:26%">Notes</th></tr><tr><td><code>Program ID is required.</code></td><td></td></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Program has no client group.</code></td><td>Same message as the Check-in group</td></tr><tr><td><code>Event name is not valid.</code></td><td>Not in table 3.1</td></tr><tr><td><code>Sub type is not valid.</code></td><td>Not in table 3.2</td></tr><tr><td><code>Is send must be 0 or 1.</code></td><td></td></tr><tr><td><code>Send status must be -1, 0, 1 or 2.</code></td><td></td></tr><tr><td><code>Event date must be in yyyy-MM-dd HH:mm:ss format.</code></td><td>_begin or _end</td></tr><tr><td><code>Event date end must not be before event date begin.</code></td><td></td></tr><tr><td><code>Page size must be at most 100.</code></td><td></td></tr></table></div></div><div class="specsec"><h4>5. Notes</h4><ul class="rules">
<li>Use dynamic SQL (MyBatis <code>&lt;if&gt;</code>); do <b>not</b> write <code>(#{x} IS NULL OR column = #{x})</code>: that form makes MySQL skip the index when filtering by <code>clientId</code>.</li>
<li><code>EXISTS</code> instead of <code>JOIN</code>: <code>crm_customer_base.client_id</code> is not unique, so a JOIN may duplicate log rows.</li>
<li>Do not SELECT any column of <code>crm_customer_base</code> (the table holds email, phone number, password, ID document number). Only use <code>group_code</code> inside <code>EXISTS</code>.</li>
<li>Do not filter <code>crm_customer_base.deleted</code>: logs are history; old logs of deleted clients remain viewable.</li>
<li>Consequence of rule 2.1 (raised by Smart CRM): if a client changes <code>group_code</code>, all of their old logs move to the new program when viewed.</li>
<li>No write API: Smart CRM does not edit or resend logs.</li>
</ul></div></div></div></section><section class="panel" id="rules" role="tabpanel">
<h2>Rules and validation</h2>
<p>Engine rules the API must preserve (if violated, the engine does not raise an error but silently runs incorrectly), and per-field validation of the forms.</p>
<h3>Engine rules – permissions and check-in</h3><div class="scroll"><table><tr><th style="width:6%">#</th><th style="width:44%">Rule</th><th>If violated</th></tr><tr><td>I1</td><td>A client_group has exactly 1 <code>promo_client_group</code> row with <code>promo_table = 'point_program'</code>, including <code>enabled = 0</code> rows.</td><td>The engine looks up tasks by <code>client_group</code>. A group linked to 2 enabled programs → the client sees 2 check-in tasks → <code>getList</code> returns <code>CONFIG_REASON_02</code> and hides everything; the trading API silently picks the task with the smallest id.</td></tr><tr><td>I2</td><td>Within 1 program, at any time there is at most <b>1 live check-in task</b>: task <code>enabled = 1</code>, bundle <code>enabled = 1</code>, <code>display_hide_to_all = 0</code> and overlapping display windows.</td><td>Same reason as <code>CONFIG_REASON_02</code>: as soon as 2 tasks are visible at the same time, <b>all</b> clients of the program lose the check-in card. This rule is not yet in section 2.</td></tr><tr><td>I3</td><td><code>task.program_id = bundle.program_id</code>. A task does not change bundle, and a bundle does not change program after creation.</td><td>History and streak chains are looked up by <code>program_id + task_bundle_id + task_id</code> as well. Changing the bundle makes the client lose their streak and history in the app.</td></tr><tr><td>I4</td><td>The points/exp JSON has the form <code>{"cycles": [[...], ...]}</code>; elements are integers ≥ 0; each cycle has exactly <code>routine_cycle_limit_days</code> elements. Streak (<code>restart = 1</code>) has exactly 1 cycle; calendar (<code>restart = 0</code>) has exactly <code>routine_cycle_repeat</code> cycles.</td><td>The engine does not raise an error when entries are missing: a day without config gets <b>0 points</b>. Streak always reads cycle 1; calendar reads cycle number <i>n</i>.</td></tr><tr><td>I5</td><td><code>point_expiration_window</code> must not be NULL, even when <code>point_expiration_type = 'no_limit'</code>.</td><td>The engine returns expiry = NULL when window is NULL → <code>point_lot.point_expiration_time</code> NULL → coins are credited but every balance query (<code>point_expiration_time &gt; now</code>) skips them: the client cannot see or spend them.</td></tr><tr><td>I6</td><td><code>tz_minutes</code>, <code>routine_cycle_repeat</code>, <code>routine_cycle_limit_days</code> must be written explicitly by the API, not left to DB defaults.</td><td>The DDL is NOT NULL with defaults: <code>tz_minutes = 0</code> (UTC time), <code>routine_cycle_repeat = 1</code>, <code>routine_cycle_limit_days = 7</code>. If omitted, the task still saves but silently runs incorrectly: days are computed in UTC, or streak clients get permanently blocked as soon as they enter cycle 2.</td></tr><tr><td>I7</td><td>Every enum field must be exactly one value from the list (Rules tab).</td><td>Wrong <code>display_event</code> → the task never shows. Wrong <code>participate_period_limit_type</code> → check-in impossible. Wrong <code>claim_valid_period_type</code> → claim deadline NULL → per-cycle claims can never be received. <code>claim_valid_period_type</code> and <code>point_expiration_type</code> may be NULL in the task table but are NOT NULL in the log table: if left NULL, <b>every check-in fails</b> (<code>CHECKIN_FAIL</code>).</td></tr><tr><td>I8</td><td>The blacklist has only 2 levels: whole program (<code>point_task_bundle_id</code> NULL) and a single bundle. There is no task level.</td><td>The engine reads rows with <code>enabled = 1</code>, <code>promo_table = 'point_program'</code>, <code>promo_config_id</code> = the task's program; a NULL bundle blocks the whole program, a matching bundle blocks that bundle.</td></tr></table></div>
<h3>Engine rules – trading and coin</h3><div class="scroll"><table><tr><th style="width:6%">#</th><th style="width:44%">Rule</th><th>If violated</th></tr><tr><td>J1</td><td><code>task.program_id = bundle.program_id</code>; a task does not change bundle or program after creation.</td><td>Daily logs and order details snapshot <code>program_id</code> / <code>task_bundle_id</code>. The bundle-level blacklist is looked up by the task's current bundle: changing the bundle changes the set of blocked clients.</td></tr><tr><td>J2</td><td>Each program should have only <b>1 live trading task</b> (task + bundle + program enabled, participation window open). Confirmed 2026-10-21: having 2 tasks is a configuration error; Smart CRM <b>warns and requires confirmation</b>, with no hard block (see Confirmed decisions in the Overview tab).</td><td>Each order is assigned to only <b>1</b> task (the engine iterates tasks by ascending id, skips tasks blocked by book type, and takes the first task where the client is not blacklisted), so coins are <b>not</b> doubled. But the app picks the task by <i>display</i> conditions while the engine uses <i>participation</i> conditions: the two may pick 2 different tasks → coins go to a task the app does not show.</td></tr><tr><td>J3</td><td><code>participate_period_limit_type = 'specific_period'</code> requires <b>both</b> <code>participate_period_from</code> and <code>participate_period_to</code>, and <code>from &lt; to</code>.</td><td>The engine selects tasks with <code>now &gt;= from AND now &lt; to</code>: a missing bound is NULL → the task never earns coins. Also, an order must be <b>opened and closed</b> within this window to count.</td></tr><tr><td>J4</td><td><code>display_event</code> must be 1 of 4 values (Rules tab), not NULL.</td><td>The column allows NULL. NULL or an invalid value → the app never shows the task, but the engine <b>still awards coins</b> (the engine does not read display_event): the client has coins but cannot see the program.</td></tr><tr><td>J5</td><td>Rate rows: no duplicate <code>(mt5_group, condition_type, condition_value)</code> (case-insensitive); the <code>any</code> row stores <code>condition_value = 'other'</code>.</td><td>The engine loads all rows into 1 map keyed in lowercase: with 2 duplicate rows (even if they differ only in case) the row loaded later overwrites the earlier one, unpredictably. A <code>any</code> row whose value is not <code>other</code> / is empty <b>never matches</b>.</td></tr><tr><td>J6</td><td>For the task to earn coins, there must be at least 1 rate row <code>point_per_lot &gt; 0</code>.</td><td>No rows at all: every order is logged as <code>NO_RATE_CONFIG</code>, 0 coins; the app hides the rate table and <code>rateRange = null</code>.</td></tr><tr><td>J7</td><td><code>tz_minutes</code>, <code>release_auto_delay_day</code> cannot change once the task has data (Lock while running tab).</td><td><code>tz_minutes</code> determines the day boundary (<code>period_key</code>) and the daily cap. <code>release_auto_delay_day</code> is snapshotted into the daily log at the first order of the day, while each order's scheduled payout time uses the config at processing time: changing it midway gives one day two payout patterns.</td></tr><tr><td>J8</td><td><code>display_hide_book_type</code> at 3 levels (program, bundle, task) is a <b>coin calculation</b> rule, not just a display setting.</td><td>The engine skips the task if any level matches the client's book type: blocked A-book/B-book clients earn no coins. Value changes take effect from the next engine run (≤ 3 minutes).</td></tr></table></div>
<h3>Engine rules – gift and redemption</h3><div class="scroll"><table><tr><th style="width:6%">#</th><th style="width:44%">Rule</th><th>If violated</th></tr><tr><td>RI1</td><td><code>point_featured_gift</code> is only the <b>displayed gift list</b> (dashboard + message). It is <b>not</b> the catalog TADA deducts coins against: TADA manages its own catalog. <code>point_price</code> must equal the exact price on TADA.</td><td>If they differ, the dashboard shows one price but when the client redeems in the webview TADA deducts a different coin amount → complaints. No DB constraint enforces a match; reconcile manually with TADA (using <code>external_item_id</code>).</td></tr><tr><td>RI2</td><td><code>point_redemption_order</code> and <code>point_redemption_transaction</code> do <b>not have</b> a <code>program_id</code> column. A program's redemption data = the <code>client_id</code> whose <code>crm_customer_base.group_code</code> = the program's client group (via <code>promo_client_group</code>).</td><td>If a client changes <code>group_code</code>, their entire redeem/coin history moves to the new program's view. Filter by client, not by a program foreign key.</td></tr><tr><td>RI3</td><td>The redeem blacklist is <b>1 global row per client</b>: <code>promo_table='point_redemption_transaction'</code>, <code>promo_config_id=0</code>, <code>point_task_bundle_id=0</code>, <code>enabled=1</code>.</td><td>This row blocks the client from redeeming in <b>ALL</b> programs, not just the one being viewed. The engine reads it in get-point / redeem-point / redeem/session (blocks spending) but <b>NOT</b> in topup-point (refunds still go through). The per-program tab is only a view filtered by the program's clients.</td></tr><tr><td>RI4</td><td><code>point_redemption_transaction</code> is the money record (<code>status</code> 1=deducted / 2=refunded, <code>coin_amount</code>). <code>point_redemption_order</code> is the order-status cache synced by the TADA webhook. The two tables share <code>external_system + order_reference</code> (unique <code>uk_partner_order</code>).</td><td>Coins have already been deducted by the partner redeem-point flow; Smart CRM <b>only reads</b> order/transaction. Any money change must go through the engine; no manual edits here.</td></tr><tr><td>RI5</td><td><code>reconciled</code> has 3 values: <code>0</code> not reconciled, <code>1</code> awaiting manual review (the job has warned), <code>2</code> reconciled — per enum <code>PointRedeemReconciledEnum</code> in the deployed version.</td><td>The DDL comment on UAT still shows the old <code>0=未对账,1=已对账</code> (only 2 values) — outdated; dev needs to update the comment. Smart CRM uses 0/1/2; the 'mark as reviewed' action only moves 1 → 2.</td></tr><tr><td>RI6</td><td>The <code>client_id</code> type differs between tables: <code>point_redemption_order.client_id</code> is <code>varchar(32)</code>, <code>point_redemption_transaction.client_id</code> is <code>bigint</code>, <code>crm_customer_base.client_id</code> is <code>bigint</code>.</td><td>JOINing order with crm requires CAST (<code>CAST(o.client_id AS UNSIGNED)</code>); comparing <code>group_code</code> across tables may need <code>COLLATE</code> (error 1267 was hit before in check-in). Keep the same collation <code>utf8mb4_0900_ai_ci</code>.</td></tr></table></div>

<h3>Validation check-in task (C1, C2)</h3>
<p>Applies to C1 (create/edit) and re-runs when enabling via C2. "Auto-saved" means the backend writes that value itself, ignoring the value sent by the FE.</p>
<h4>Field by field</h4>
<div class="scroll"><table>
<tr><th style="width:19%">Field</th><th style="width:9%">Type</th><th style="width:11%">Required</th><th style="width:31%">Valid values</th><th>How the engine uses it</th></tr><tr><td><code>taskName</code></td><td>string</td><td>Yes</td><td>Trim, 1–100 characters (varchar(100)).</td><td>Display only.</td></tr><tr><td><code>taskDescription</code></td><td>string</td><td>No</td><td>≤ 255 characters (<code>varchar(255)</code>).</td><td>Display only.</td></tr><tr><td><code>displayHideBookType</code></td><td>int</td><td>Yes</td><td><code>0</code> / <code>1</code> / <code>2</code>.</td><td>Compared with the client's <code>client_book_type</code> (NULL = 9). Only hides the card in <code>getList</code>; the check-in API does not re-check book type.</td></tr><tr><td><code>tzMinutes</code></td><td>int</td><td>Yes</td><td>−720 … 840, a multiple of 15. E.g. GMT+7 = <code>420</code>.</td><td>Day boundary, check-in date, point expiry (23:59:59 in this time zone). Column is NOT NULL DEFAULT 0: if not sent, the task runs on UTC (I6).</td></tr><tr><td><code>displayEvent</code></td><td>string</td><td>Yes</td><td><code>signup</code> / <code>kyc_approve</code> / <code>first_time_deposit</code> / <code>first_trade</code>.</td><td>The client only sees the card after reaching the event. Other values → nobody sees it.</td></tr><tr><td><code>displayPeriodLimitApply</code></td><td>int</td><td>Yes</td><td><code>0</code> unlimited / <code>1</code> limited.</td><td></td></tr><tr><td><code>displayPeriodFrom</code></td><td>datetime UTC</td><td>Khi apply = 1</td><td><code>yyyy-MM-dd HH:mm:ss</code> UTC. Apply = 0 → store NULL.</td><td>Shown when <code>from ≤ now &lt; to</code>.</td></tr><tr><td><code>displayPeriodTo</code></td><td>datetime UTC</td><td>Khi apply = 1</td><td>&gt; <code>displayPeriodFrom</code>.</td><td>The <code>to</code> bound is exclusive (hidden at exactly that second).</td></tr><tr><td><code>displayHideToAll</code></td><td>int</td><td>Yes</td><td><code>0</code> / <code>1</code>.</td><td>1 = hidden from all clients (including those mid-way through).</td></tr><tr><td><code>participateEvent</code></td><td>string</td><td>Yes</td><td>Same 4 values as <code>displayEvent</code>.</td><td>Event not reached → <code>participate_status = not_allow</code>. The calendar type uses the event timestamp to compute the cycle.</td></tr><tr><td><code>participatePeriodLimitType</code></td><td>string</td><td>Yes</td><td><code>no_limit</code> / <code>specific_period</code>.</td><td>Other values → the check-in API never finds the task.</td></tr><tr><td><code>participatePeriodFrom</code></td><td>datetime UTC</td><td>Khi specific_period</td><td>UTC. <code>no_limit</code> → store NULL.</td><td>Check-in allowed when <code>from ≤ now &lt; to</code>.</td></tr><tr><td><code>participatePeriodTo</code></td><td>datetime UTC</td><td>Khi specific_period</td><td>&gt; <code>participatePeriodFrom</code>.</td><td></td></tr><tr><td><code>restartMissedCheckinEnabled</code></td><td>int</td><td>Yes</td><td><code>1</code> streak (miss 1 day or finish the cycle → back to Day 1) / <code>0</code> calendar (the cycle advances by days since the event, whether or not the client checks in).</td><td>Determines the cycle formula and how the points JSON is read.</td></tr><tr><td><code>routineCycleLimitDays</code></td><td>int</td><td>Yes</td><td>1 … 366.</td><td>Number of days per cycle.</td></tr><tr><td><code>routineCycleRepeat</code></td><td>int</td><td>Yes</td><td>≥ 1; streak also has V13.</td><td>Clients with <code>cycle &gt;</code> this value are blocked permanently (<code>OUT_OF_CYCLE</code>, the card shows <code>completed</code>). Column is NOT NULL DEFAULT 1 (I6).</td></tr><tr><td><code>firstDayDefinition</code></td><td>int</td><td>Khi restart = 0</td><td><code>0</code> the event day is Day 1 / <code>1</code> the next day is Day 1. Streak → store 0.</td><td>Calendar type only.</td></tr><tr><td><code>pointDistributeSpecifyEachDay</code></td><td>JSON string</td><td>Yes</td><td><code>{"cycles": [[n, …], …]}</code>, n is an integer 0 … 2147483647 (<code>point_earned</code> is <code>int</code>); shape per V04–V07. Column type <code>json</code>: MySQL normalizes whitespace on save.</td><td>Points for each day. Missing day → 0 points, no error (I4).</td></tr><tr><td><code>expDistributeSpecifyEachDay</code></td><td>JSON string</td><td>No</td><td>Same shape as the points JSON. Left empty → the backend stores all zeros in the same shape.</td><td>EXP is not yet used by other modules.</td></tr><tr><td><code>fixedCashValuePerPointUnit</code></td><td>decimal</td><td>Yes</td><td>0 … 99999999999999.9999, up to 4 decimal places (<code>decimal(18,4)</code>). Suggested default <code>0</code>.</td><td>Snapshotted into the log and lot. The engine treats NULL as 0, but a number should be stored.</td></tr><tr><td><code>claimType</code></td><td>string</td><td>Yes</td><td><code>claim_each_day</code> (points credited immediately on check-in) / <code>claim_each_cycle</code> (the client taps claim after the cycle closes).</td><td></td></tr><tr><td><code>claimRequireDayPerCycle</code></td><td>int</td><td>Khi claim_each_cycle</td><td>1 … <code>routineCycleLimitDays</code>. <code>claim_each_day</code> → store NULL.</td><td>NULL with claim_each_cycle → the app never shows the claim button.</td></tr><tr><td><code>claimValidPeriodType</code></td><td>string</td><td>Khi claim_each_cycle</td><td><code>days_after_completion</code> / <code>no_limit</code>. <code>claim_each_day</code> → store <code>no_limit</code>.</td><td>The task table allows NULL but the log table is NOT NULL: NULL → every check-in fails. Other values → claim deadline NULL → cannot claim (I7).</td></tr><tr><td><code>claimValidCompleteWindow</code></td><td>int</td><td>Khi days_after_completion</td><td>1 … 7300 (days after the cycle closes). Otherwise → store NULL.</td><td>NULL with days_after_completion → the reward expires right at check-in.</td></tr><tr><td><code>pointExpirationType</code></td><td>string</td><td>Yes</td><td><code>days_after_claim</code> / <code>no_limit</code>.</td><td>The task table allows NULL but the log table is NOT NULL: NULL → every check-in fails (I7).</td></tr><tr><td><code>pointExpirationWindow</code></td><td>int</td><td>Khi days_after_claim</td><td>1 … 7300. <code>no_limit</code> → the backend stores <code>7300</code>.</td><td>NULL makes the coins unusable (I5).</td></tr><tr><td><code>pointMultiplierEnabled</code></td><td>—</td><td>Locked</td><td>Always store <code>0</code>.</td><td>Decision 2.4.</td></tr><tr><td><code>pointToCashConvertType</code></td><td>—</td><td>Locked</td><td>Always store <code>by_task_fixed_value</code>.</td><td>Decision 2.4.</td></tr><tr><td><code>checkinAuto</code></td><td>—</td><td>Locked</td><td>Always store <code>0</code>.</td><td>The engine has no automatic check-in job (added to 2.4).</td></tr><tr><td><code>enabled</code></td><td>—</td><td>Not accepted</td><td>Create → 0. Change via C2.</td><td>So that every enable goes through check I2.</td></tr>
</table></div>
<h4>Cross-field rules</h4>
<div class="scroll"><table>
<tr><th style="width:6%">#</th><th style="width:50%">Rule</th><th>message</th></tr><tr><td>V01</td><td>The bundle exists; <code>programId</code> (if sent) = the bundle's <code>program_id</code>; on edit, <code>taskBundleId</code> does not change.</td><td><code>Check-in task bundle does not exist. / Program does not match the bundle's program. / Check-in task cannot be moved to another bundle.</code></td></tr><tr><td>V02</td><td><code>displayPeriodLimitApply = 1</code> → from and to are both present and from &lt; to. 0 → store both as NULL.</td><td><code>Display period from and to are required when the display period is limited. / Display period to must be later than display period from.</code></td></tr><tr><td>V03</td><td><code>specific_period</code> → from and to are both present and from &lt; to. <code>no_limit</code> → store NULL.</td><td><code>Participate period from and to are required for specific_period. / Participate period to must be later than participate period from.</code></td></tr><tr><td>V04</td><td>The points JSON parses and is an object with key <code>cycles</code> = an array of arrays of integers ≥ 0.</td><td><code>Daily points must be JSON like {"cycles": [[5, 8, 10]]} with whole numbers of 0 or more.</code></td></tr><tr><td>V05</td><td>Streak (<code>restart = 1</code>) → exactly 1 cycle.</td><td><code>Streak tasks must have exactly one cycle of daily points.</code></td></tr><tr><td>V06</td><td>Calendar (<code>restart = 0</code>) → number of cycles = <code>routineCycleRepeat</code>.</td><td><code>Calendar tasks need one list of daily points per cycle: expected {repeat}, got {n}.</code></td></tr><tr><td>V07</td><td>Each cycle has exactly <code>routineCycleLimitDays</code> elements.</td><td><code>Each cycle must have exactly {L} days (cycle {k} has {m}).</code></td></tr><tr><td>V08</td><td>The exp JSON (if sent) has the same shape as the points JSON and follows V04.</td><td><code>Daily EXP must have the same cycles and days as daily points.</code></td></tr><tr><td>V09</td><td><code>claim_each_cycle</code> → <code>claimRequireDayPerCycle</code> must be between 1 and L.</td><td><code>Minimum check-ins per cycle must be between 1 and {L}.</code></td></tr><tr><td>V10</td><td><code>claim_each_cycle</code> → <code>claimValidPeriodType</code> must be valid. <code>claim_each_day</code> → the backend stores <code>no_limit</code>, window NULL.</td><td><code>Claim valid period type must be days_after_completion or no_limit.</code></td></tr><tr><td>V11</td><td><code>days_after_completion</code> → window 1 … 7300.</td><td><code>Claim valid window must be between 1 and 7300 days.</code></td></tr><tr><td>V12</td><td><code>days_after_claim</code> → <code>pointExpirationWindow</code> 1 … 7300. <code>no_limit</code> → store 7300.</td><td><code>Point expiration window must be between 1 and 7300 days.</code></td></tr><tr><td>V13</td><td>Streak → <code>routineCycleRepeat</code> ≥ the number of days in the participation window (<code>specific_period</code>, rounded up) or ≥ 9999 (<code>no_limit</code>). At most 1 new cycle opens per day, so this level guarantees no client hits the limit.</td><td><code>For streak tasks, cycle repeat must be at least {days} so that clients are never blocked by the cycle limit.</code></td></tr><tr><td>V14</td><td>Every enum is in its list; every number is within the ranges in the table above; strings do not exceed the lengths in the table above; <code>tzMinutes</code> is a multiple of 15. Fields with DB defaults (<code>tzMinutes</code>, <code>routineCycleLimitDays</code>, <code>routineCycleRepeat</code>, <code>restartMissedCheckinEnabled</code>) must still be sent (I6).</td><td><code>{Field} is required. / {Field} must be one of: {values}. / {Field} must be between {min} and {max}. / {Field} must be at most {n} characters.</code></td></tr><tr><td>V15</td><td><b>I2.</b> If the task is live after save/enable (task enabled, bundle enabled, <code>display_hide_to_all = 0</code>), there must be no other live check-in task in the same program with an overlapping display window. Two windows overlap when either one is unlimited (<code>apply = 0</code>), or <code>from1 &lt; to2 AND from2 &lt; to1</code>. Tasks whose window has ended do not count.</td><td><code>Check-in task {otherId} ({otherName}) is already live for an overlapping display period. Clients can only see one check-in task at a time.</code></td></tr><tr><td>V16</td><td>Once the task has clients → fields locked in the Lock while running tab must stay unchanged; <code>routineCycleRepeat</code> can only increase.</td><td><code>{Field} cannot be changed after clients have checked in to this task. / Cycle repeat can only be increased after clients have checked in.</code></td></tr>
</table></div>
<h4>SQL check for I2 (V15)</h4>
<pre>-- V15: other live check-in tasks of the same program whose display window overlaps the candidate
SELECT d.id, d.task_name
FROM point_task_daily_checkin d
JOIN point_task_bundle b ON b.id = d.task_bundle_id
WHERE d.program_id = #{programId}
  AND d.id &lt;&gt; #{candidateId}                       -- 0 when creating
  AND d.enabled = 1 AND d.display_hide_to_all = 0
  AND (b.enabled = 1 OR b.id = #{enablingBundleId})  -- B3: bundle being enabled counts as on; C1/C2: 0
  AND (d.display_period_limit_apply = 0 OR d.display_period_to &gt; UTC_TIMESTAMP())   -- not finished
  AND ( #{candApply} = 0 OR d.display_period_limit_apply = 0
        OR (d.display_period_from &lt; #{candTo} AND #{candFrom} &lt; d.display_period_to) )
LIMIT 1;</pre>
<h4>Example of valid points JSON</h4>
<pre>-- streak, 7 days (MiTrade):
{"cycles": [[5, 8, 10, 12, 14, 17, 34]]}

-- calendar, routine_cycle_limit_days = 3, routine_cycle_repeat = 2:
{"cycles": [[10, 20, 30], [10, 20, 40]]}</pre>
<p>A calendar type with many cycles (e.g. 52 weeks) produces a long JSON: the FE can let the user enter 1 cycle, then "apply to all cycles", and send the expanded version.</p>


<h3>Validation trading task (T1, T2)</h3>
<p>Applies to T1 and re-runs when enabling via T2. Every field maps 1-1 to a <code>point_task_trading</code> column (camelCase). <code>enabled</code> is not accepted in T1.</p>
<h4>Task fields</h4>
<div class="scroll"><table>
<tr><th style="width:19%">Field</th><th style="width:9%">Type</th><th style="width:11%">Required</th><th style="width:28%">Valid values</th><th>How the engine uses it</th></tr><tr><td><code>taskName</code></td><td>string</td><td>Yes</td><td>Trim, 1–128.</td><td>Shown in admin only.</td></tr><tr><td><code>taskDescription</code></td><td>string</td><td>No</td><td>Trim, ≤ 512; empty → NULL.</td><td>Shown in admin only.</td></tr><tr><td><code>displayHideBookType</code></td><td>int</td><td>Yes</td><td><code>0</code> no block, <code>1</code> blocks A-book, <code>2</code> blocks B-book.</td><td>Blocks both <b>display and coin calculation</b> (J8). Combined with the program and bundle values: any level that matches blocks.</td></tr><tr><td><code>tzMinutes</code></td><td>int</td><td>Yes</td><td>−720 … 840, divisible by 15. HSB: 420.</td><td>Splits trading days, daily cap, coin expiry (23:59:59 task time). Locked once data exists (J7).</td></tr><tr><td><code>displayEvent</code></td><td>string</td><td>Yes</td><td><code>signup</code> / <code>kyc_approve</code> / <code>first_time_deposit</code> / <code>first_trade</code>.</td><td>Used by the app only (J4). The version for not-logged-in clients only shows <code>signup</code> tasks.</td></tr><tr><td><code>displayPeriodLimitApply</code></td><td>int</td><td>Yes</td><td>0 / 1.</td><td>1 = shown only within the window.</td></tr><tr><td><code>displayPeriodFrom, displayPeriodTo</code></td><td>datetime UTC</td><td>Khi apply = 1</td><td>Both required, <code>from &lt; to</code>. Apply = 0 → store NULL.</td><td>App: <code>now &gt;= from AND now &lt; to</code>. Not used by the engine: coins are calculated even outside the display window.</td></tr><tr><td><code>displayHideToAll</code></td><td>int</td><td>Yes</td><td>0 / 1.</td><td>1 = hidden from all clients except those who already have a daily log for the task. The engine <b>still awards coins</b> to all clients: use it for closed testing, not to stop the program (to stop it, disable the task).</td></tr><tr><td><code>participatePeriodLimitType</code></td><td>string</td><td>Yes</td><td><code>no_limit</code> / <code>specific_period</code>.</td><td>The engine only awards coins within the window (J3).</td></tr><tr><td><code>participatePeriodFrom, participatePeriodTo</code></td><td>datetime UTC</td><td>Khi specific_period</td><td>Both required, <code>from &lt; to</code> (J3). no_limit → store NULL.</td><td>Orders must be <b>opened and closed</b> within the window. After <code>to</code>: the app shows <code>ended = true</code> and the engine stops counting.</td></tr><tr><td><code>minPositionHoldSecond</code></td><td>int</td><td>Yes</td><td>0 … 604800 (7 days). HSB: 180.</td><td>Orders held for less → <code>HOLD_TIME_NOT_MET</code>, 0 coin. Snapshotted onto each order at processing time.</td></tr><tr><td><code>pointMaxCapEnabled</code></td><td>int</td><td>Yes</td><td>0 / 1.</td><td>Coin cap per client per day (task timezone).</td></tr><tr><td><code>pointMaxCapValue</code></td><td>long</td><td>Khi enabled = 1</td><td>1 … 100,000,000 when enabled. Disabled → store 0.</td><td>Snapshotted into the daily log at the first order of the day; a change applies only from each client's next new day.</td></tr><tr><td><code>cashValuePerPointUnit</code></td><td>decimal(18,4)</td><td>Yes</td><td>≥ 0, up to 4 decimal places. HSB: 0.</td><td>Only used to compute the reference amount (<code>cash</code> in order details). Unit = <code>point_program.cash_currency</code>.</td></tr><tr><td><code>releaseAutoDelayDay</code></td><td>int</td><td>Yes</td><td>0 … 30. 0 = <code>in-day</code>.</td><td>N &gt; 0: coin for a trading day is credited in one batch at 00:00 (task timezone) on that day + N. Locked once data exists (J7).</td></tr><tr><td><code>pointExpirationWindow</code></td><td>int</td><td>Yes</td><td>1 … 7300 (days). HSB: 180.</td><td>Coin expiry = trading day (or credit day if delayed) + N days, 23:59:59 task timezone. If NULL the engine uses 999999 days — NULL must not be saved.</td></tr><tr><td><code>termsUrl</code></td><td>string</td><td>No</td><td>≤ 1000, starts with <code>https://</code>. Empty → NULL.</td><td>Returned to the app verbatim; NULL / empty hides the terms button.</td></tr>
</table></div>
<p>Per-field error messages follow the pattern: <code>{Field label} is required.</code>, <code>{Field label} must be between {min} and {max}.</code>, <code>{Field label} must be one of: {values}.</code>, <code>Terms URL must start with https:// and be at most 1000 characters.</code></p>

<h4>Rate rows (<code>point_task_trading_point_conversion</code>)</h4>
<div class="scroll"><table>
<tr><th style="width:19%">Field</th><th style="width:9%">Type</th><th style="width:30%">Valid values</th><th>How the engine uses it</th></tr><tr><td><code>mt5Group</code></td><td>string</td><td>Trimmed, 1–64 characters (varchar(64)). Full MT5 group name, e.g. <code>Direct\Mini400</code>.</td><td>Case-insensitive match against the account's <code>mt5_users.Group</code>. Variant groups such as <code>1F\Direct\Mini10</code> are different groups.</td></tr><tr><td><code>conditionType</code></td><td>string</td><td><code>symbol</code> / <code>symbol_group</code> / <code>any</code> (stored in lowercase).</td><td>Priority when one order matches several rows of the same MT5 group: <b>symbol &gt; symbol_group &gt; any</b>. Only rows of the account's own MT5 group are considered.</td></tr><tr><td><code>conditionValue (symbol)</code></td><td>string</td><td>1–64 characters, no dots, stored in uppercase (e.g. <code>XAUUSD</code>).</td><td>The engine compares against the part of the MT5 symbol before the dot (<code>XAUUSD.VIP</code> → <code>XAUUSD</code>).</td></tr><tr><td><code>conditionValue (symbol_group)</code></td><td>string</td><td><code>forex</code> / <code>metal</code> / <code>energy</code> / <code>index</code> / <code>stocks</code> / <code>other</code>.</td><td>The engine derives the group from the symbol path in <code>mt5_symbols</code>: contains forex / metal / energ / index or indices / stock; anything else is other.</td></tr><tr><td><code>conditionValue (any)</code></td><td>string</td><td>The backend always stores <code>other</code> and ignores the value sent by the FE.</td><td>The engine only matches any rows whose value is <code>other</code> or empty (J5). Optional, but without it symbols outside the listed groups get 0 coin (V09).</td></tr><tr><td><code>pointPerLot</code></td><td>decimal(18,4)</td><td>0 … 1,000,000, up to 4 decimal places.</td><td>Order coin = lot × pointPerLot, rounded down. <code>0</code> is valid: used to exclude a symbol from the campaign (a symbol row with 0 stops it falling through to symbol_group / any); the app hides 0 rows from the rate table.</td></tr>
</table></div>
<ul class="rules">
<li><b>Duplicates:</b> the key <code>(mt5Group, conditionType, conditionValue)</code> is compared case-insensitively among the task's non-deleted rows. The table has no unique key, so the API locks the task row (T1 step 2) before checking.</li>
<li><b>Priority:</b> symbol &gt; symbol_group &gt; any within the same MT5 group; no matching row → <code>NO_RATE_CONFIG</code>, 0 coin.</li>
<li><b>any row:</b> optional (warning V09). HSB config: each group has 4 symbol_group rows (metal, forex, energy, index) and 1 any row (covering stocks and all remaining symbols).</li>
<li>Row count: 1 … 500 per task.</li>
</ul>

<p>Smart CRM is an internal admin site, but redeemable codes and PII must still be masked. The IDR "never sent to the frontend" rule applies only to the <b>client app</b>; Smart CRM users may see IDR amounts normally (confirmed).</p>

d>Coin refunded</td><td>Coin 已退还</td><td>A redemption order had its coin refunded. <code>ref_key</code> = <code>redemption_id</code>.</td></tr></table></div>

<h4>send_status</h4>
<p>The comment in the Java entity lists only 0/1/2, but the DDL and code also use <code>-1</code>. The spec follows the DDL.</p><div class="scroll"><table><tr><th style="width:11%">send_status</th><th style="width:17%">EN label</th><th style="width:11%">ZH label</th><th>Meaning</th></tr><tr><td><code>-1</code></td><td>Not sent (by design)</td><td>无需发送</td><td>Row is recorded only, not sent to CleverTap (<code>is_send = 0</code>). It is a final state, <b>not an error</b>. Reason is in <code>send_remark</code>.</td></tr><tr><td><code>0</code></td><td>Pending</td><td>待发送</td><td>Row written, sending in progress. Normally lasts only a few seconds. A row stuck at 0 for a long time is abnormal — report it to the developer.</td></tr><tr><td><code>1</code></td><td>Sent</td><td>发送成功</td><td>CleverTap has <b>received the event</b>. This does not mean the client definitely got the push/email: CleverTap may still not send it due to the account's channel limits, the client having notifications off, or the campaign being disabled. Check the actual delivery result in CleverTap.</td></tr><tr><td><code>2</code></td><td>Failed</td><td>发送失败</td><td>CleverTap call failed and <b>is not retried</b>. Only occurs for <code>loyalty_daily_nudge</code>, <code>loyalty_daily_summary</code>, <code>loyalty_weekly_summary</code> (scheduled messages; sending late means stale content). For the other events, a failure rolls back the whole run and the next run resends, so there is never a row with 2.</td></tr></table></div>
<h4>is_send</h4>
<p><code>1</code> = sent to CleverTap, <code>0</code> = recorded only, not sent. Always paired: <code>is_send = 0</code> ⇔ <code>send_status = -1</code>. The <code>isSend</code> filter is kept as requested, but the FE may only need the <code>sendStatus</code> dropdown.</p>
<h4>send_remark</h4><div class="scroll"><table><tr><th style="width:40%">send_remark</th><th>When</th></tr><tr><td><code>''</code></td><td>Default; the message is sent normally.</td></tr><tr><td><code>Pre-launch eligible existing clients</code></td><td><code>loyalty_enrolled</code> rows pre-written at launch for clients who were already eligible.</td></tr><tr><td><code>non-first coin,current LedgerId=…,first LedgerId=…</code></td><td><code>coin_first_earned</code> blocked because the client already had coin before (with the ledger id for lookup).</td></tr></table></div>
<h4>payload</h4>
<p>Each number also has a <code>&lt;key&gt;_text</code> version in Indonesian format (<code>1540</code> → <code>"1.540"</code>), which is the string CleverTap puts into the copy. Dates in <code>$D_&lt;Unix seconds&gt;</code> form are CleverTap's date format (e.g. <code>enrolled_at</code>). The FE should show the payload as collapsed JSON, click to expand.</p>
<p>Besides their own keys, most events have 3 common keys: <code>coin_balance</code>, <code>next_gift_name</code>, <code>coin_to_next_gift</code> (redeem and coin refund only have <code>coin_balance</code>). Keys without a value are not written (e.g. the client has no next gift).</p>
<div class="scroll"><table><tr><th style="width:34%">event_name</th><th>Event-specific keys</th></tr><tr><td><code>loyalty_enrolled</code></td><td>loyalty_eligible, enrolled_at, coin_per_lot</td></tr><tr><td><code>coin_first_earned</code></td><td>coin_amount</td></tr><tr><td><code>loyalty_daily_nudge</code></td><td>nudge_type, coin_per_lot, last_coin, days_since_ftd</td></tr><tr><td><code>loyalty_daily_summary</code></td><td>today_coin, reachable_gift_name</td></tr><tr><td><code>first_gift_reachable</code></td><td>gift_name, gift_price, gift_image_url</td></tr><tr><td><code>first_gift_almost_reached</code></td><td>gift_name, gift_price, gift_image_url, coin_to_gift, lot_to_gift</td></tr><tr><td><code>loyalty_weekly_summary</code></td><td>week_coin, trading_days, gift_1_… to gift_3_… (name, price, image_url, percent, status)</td></tr><tr><td><code>coin_redeemed</code></td><td>redemption_id, coin_spent</td></tr><tr><td><code>coin_refunded</code></td><td>redemption_id, coin_refunded</td></tr></table></div>
<p class="note">Key list for reference, read from the code; the FE does not need to map each key.</p>

</section><section class="panel" id="locks" role="tabpanel">
<h2>Locked while live</h2>
<p>Which fields can be edited once a task / gift has participating clients. The detail APIs (C4, T3) return <code>lockedFields</code> so the frontend can lock the inputs; the save API re-checks on the server side.</p>

<h3>Editing after clients have participated</h3>
<p>"Has clients" = the task has at least 1 row in <code>point_task_daily_checkin_log</code>. Before that, every field is editable (except bundle). C4 returns <code>lockedFields</code> for the FE; C1 re-checks on the server side (V16).</p>
<h4>Check-in task</h4>
<div class="scroll"><table><tr><th style="width:34%">Field</th><th style="width:15%">Status</th><th>Reason</th></tr><tr><td><code>taskName, taskDescription</code></td><td>Editable</td><td>Display only.</td></tr><tr><td><code>displayHideBookType, displayEvent, displayPeriodLimitApply/From/To, displayHideToAll</code></td><td>Editable</td><td>Only changes who sees the card. If the task is enabled, I2 is re-checked (V15).</td></tr><tr><td><code>participatePeriodLimitType/From/To</code></td><td>Editable</td><td>Changes when check-in is allowed; does not corrupt logs. Setting <code>to</code> in the past ends the campaign immediately. Streak: re-check V13 against the new window.</td></tr><tr><td><code>participateEvent</code></td><td>Streak: editable · Calendar: locked</td><td>Calendar type takes its cycle anchor from the event time; changing the event → every client's cycle/day is recalculated, history cells and pending-claim cycles go out of sync.</td></tr><tr><td><code>tzMinutes</code></td><td>Locked</td><td>Changes the day boundary: a new check-in day may coincide with the old one (reported as already checked in) or skip 2 days (breaking the streak); point expiry shifts.</td></tr><tr><td><code>firstDayDefinition</code></td><td>Locked</td><td>Cycle anchor for the calendar type. Streak does not use it, so no need to edit.</td></tr><tr><td><code>routineCycleLimitDays</code></td><td>Locked</td><td>Calendar: every client's cycle/day is recalculated from scratch. Streak: running streaks may exceed the new length. The JSON shape must change accordingly.</td></tr><tr><td><code>routineCycleRepeat</code></td><td>Increase only</td><td>Decrease → clients already above the new limit are blocked immediately (<code>OUT_OF_CYCLE</code> / <code>completed</code>). Calendar: increasing requires adding cycles to the JSON (V06).</td></tr><tr><td><code>restartMissedCheckinEnabled</code></td><td>Locked</td><td>Changes the entire cycle calculation.</td></tr><tr><td><code>pointDistributeSpecifyEachDay, expDistributeSpecifyEachDay</code></td><td>Values editable</td><td>Applies only to later check-ins; old logs keep the recorded points. Shape still follows V05–V07.</td></tr><tr><td><code>fixedCashValuePerPointUnit</code></td><td>Editable</td><td>The value is snapshotted into each log and lot.</td></tr><tr><td><code>claimType</code></td><td>Locked</td><td>The app renders claim status from the current value: switching from per-cycle to per-day leaves unclaimed parts stuck with no claim button.</td></tr><tr><td><code>claimRequireDayPerCycle</code></td><td>Locked</td><td>The engine reads the current value even for closed cycles → changing it retroactively changes the claim rule.</td></tr><tr><td><code>claimValidPeriodType, claimValidCompleteWindow</code></td><td>Editable</td><td>The claim deadline is computed and stored in the log at check-in; affects only new logs.</td></tr><tr><td><code>pointExpirationType, pointExpirationWindow</code></td><td>Editable</td><td><code>claim_each_day</code>: affects only later check-ins. <code>claim_each_cycle</code>: applied when the client clicks claim, so unclaimed parts of old cycles also follow the new deadline.</td></tr><tr><td><code>taskBundleId, programId</code></td><td>Locked (always)</td><td>I3: history and streaks are looked up by bundle.</td></tr></table></div>
<h4>Program and bundle</h4>
<div class="scroll"><table><tr><th style="width:34%">Field</th><th style="width:15%">Status</th><th>Reason</th></tr><tr><td><code>point_program.cash_currency</code></td><td>Locked once the program has activity</td><td>Unit of every <code>cash_value</code> snapshotted in logs/lots. Check-in currently sets it to 0, so risk is low, but trading does use monetary values: the Trading team confirms the trading side.</td></tr><tr><td><code>point_program.display_hide_book_type</code></td><td>Editable</td><td>Check-in: display filter only. Trading (confirmed by the Trading team): a coin calculation rule; switching to 1 / 2 means A-book / B-book clients stop earning coin in all trading tasks of the program.</td></tr><tr><td><code>point_task_bundle.display_hide_book_type</code></td><td>Editable</td><td>Same as above, scoped to the trading tasks in the bundle.</td></tr><tr><td><code>program_name, program_description, task_bundle_name, task_bundle_description</code></td><td>Editable</td><td>Display only.</td></tr></table></div>
<p>To change a locked field: create a new task in the same bundle (keep display windows non-overlapping, V15), then disable the old task. The old task's history is kept.</p>


<h3>Editing while live</h3>
<p>"Has data" = the task has at least 1 <code>point_task_trading_deal_log</code> row (<code>hasData</code> in T3). Before that every field is editable except program and bundle. T3 returns <code>lockedFields</code>; T1 re-checks on the server side (V06). To change a locked field: create a new task and disable the old one (the old task's history is kept).</p>
<h4>Trading task</h4>
<div class="scroll"><table><tr><th style="width:30%">Field</th><th style="width:18%">Status</th><th>Reason / effect</th></tr><tr><td><code>programId, taskBundleId</code></td><td>Locked (always)</td><td>J1.</td></tr><tr><td><code>tzMinutes</code></td><td>Locked once data exists</td><td>Changes the day boundary: new orders fall into a different <code>period_key</code>, daily logs get split, the daily cap restarts from 0.</td></tr><tr><td><code>releaseAutoDelayDay</code></td><td>Locked once data exists</td><td>J7: the current day would have 2 credit modes; the pending / earning status in the app is wrong for that day.</td></tr><tr><td><code>taskName, taskDescription, termsUrl</code></td><td>Editable</td><td>Display only.</td></tr><tr><td><code>displayEvent, displayPeriod*, displayHideToAll</code></td><td>Editable</td><td>Only changes who sees the task. The engine does not read it.</td></tr><tr><td><code>displayHideBookType</code></td><td>Editable (with confirmation)</td><td>Also changes who earns coin, from the next engine run (J8). Already-processed orders stay unchanged.</td></tr><tr><td><code>participatePeriod*</code></td><td>Editable</td><td>Applies to orders processed after saving. Setting <code>to</code> in the past = ends the campaign immediately (app shows <code>ended</code>).</td></tr><tr><td><code>minPositionHoldSecond</code></td><td>Editable</td><td>Applies to orders processed after saving; old orders keep their results.</td></tr><tr><td><code>pointMaxCapEnabled, pointMaxCapValue</code></td><td>Editable</td><td>Snapshotted into the daily log: clients who already traded today keep the old cap until the day ends; the new cap applies from the next day.</td></tr><tr><td><code>pointExpirationWindow</code></td><td>Editable</td><td>Snapshotted into the daily log: only coin from new days follows the new expiry.</td></tr><tr><td><code>cashValuePerPointUnit</code></td><td>Editable</td><td>Snapshotted into the daily log and order details.</td></tr><tr><td><code>conversions[]</code></td><td>Editable (soft delete + insert)</td><td>The engine re-reads the rate table on every run: applies to orders processed after saving; old orders keep the snapshotted <code>point_per_lot</code>.</td></tr><tr><td><code>enabled</code></td><td>Only via T2</td><td>Convention 1.6.</td></tr></table></div>
<p>General principle: the engine <b>snapshots</b> config onto each order (rate, holding time) and into the daily log at the first order of the day (cap, expiry, monetary value, credit mode). Editing config never changes processed orders or credited coin.</p>
<h4>Program and bundle (Smart CRM question 4.3)</h4>
<div class="scroll"><table><tr><th style="width:30%">Field</th><th style="width:18%">Status</th><th>Reason</th></tr><tr><td><code>point_program.cash_currency</code></td><td>Locked once the program has activity</td><td>Agree with the Check-in team, and trading does use it: <code>cash_value_per_point_unit</code> is snapshotted into order details, daily logs, lots and the coin ledger; the unit of those numbers is <code>cash_currency</code>. Changing the currency breaks the meaning of every snapshotted number.</td></tr><tr><td><code>point_program.display_hide_book_type</code></td><td>Editable (with confirmation)</td><td>On the trading side it is a coin calculation rule (J8): switching to 1 or 2 means A-book/B-book clients stop earning coin in <b>all</b> trading tasks of the program and stop seeing the campaign from the next run. Processed orders and credited coin stay unchanged. Can be switched back at any time.</td></tr><tr><td><code>point_task_bundle.display_hide_book_type</code></td><td>Editable (with confirmation)</td><td>Same as above, scoped to the tasks in the bundle.</td></tr></table></div>


<h3>Editing a gift that has already been redeemed (answer to 4.2)</h3>
<p><code>point_featured_gift</code> is <b>not referenced by a foreign key</b> from order/transaction: each order stores its own <code>coin_amount</code>, so editing a gift is <b>not retroactive</b> for old orders. So no field needs a hard lock at the DB level; only 2 fields need a <b>warning</b> because they relate to price sync with TADA.</p>
<div class="scroll"><table><tr><th style="width:38%">Field</th><th style="width:16%">Status</th><th>Reason</th></tr><tr><td><code>giftName, giftShortName, giftDescription, badge, remark</code></td><td>Editable</td><td>Display only; does not affect old orders or the engine.</td></tr><tr><td><code>giftImageUrl</code></td><td>Editable</td><td>Email image only. Keep the link stable (HSB-hosted) so old emails do not show broken images.</td></tr><tr><td><code>giftCategory</code></td><td>Editable</td><td>Display grouping/filtering only.</td></tr><tr><td><code>showOnDashboard, useInNotification, sortOrder, displayFrom, displayTo</code></td><td>Editable</td><td>Only changes when/where the gift is shown. Does not touch redeemed orders.</td></tr><tr><td><code>cashValue</code></td><td>Editable (with caution)</td><td>Internal statistics value; changing it does not affect old orders (orders store their own coin).</td></tr><tr><td><code>pointPrice</code></td><td>Editable + WARNING</td><td>Not retroactive for old orders (each order stores its own <code>coin_amount</code> in <code>point_redemption_transaction</code>). BUT it must match the TADA price (RI1): changing it here without changing it on TADA → the dashboard differs from the price actually deducted. Show a warning + require re-reconciling with TADA.</td></tr><tr><td><code>externalItemId</code></td><td>Editable + WARNING</td><td>It is the anchor for price reconcile with TADA. A wrong change → maps to the wrong TADA gift. General warning on edit (especially when the gift is enabled).</td></tr><tr><td><code>program_id</code></td><td>Locked (always)</td><td>A gift belongs to exactly 1 program; changing the program changes which clients see it + statistics. G2 never UPDATEs this column.</td></tr><tr><td><code>enabled</code></td><td>Only via G3</td><td>Separated from G2 so that every enable checks <code>external_item_id</code> (RI1).</td></tr></table></div>
<p>Redemption orders come from the TADA catalog in the webview and do <b>not</b> go through the featured list, so "has anyone redeemed this gift yet" cannot be detected (Smart CRM decided not to store <code>gift_id</code> on the order). So when editing <code>point_price</code> / <code>external_item_id</code>, only a <b>general warning</b> + a reminder to re-reconcile with TADA is needed; old orders are not traced.</p>

</section><section class="panel" id="preflight" role="tabpanel">
<h2>Data checks</h2>
<p>Run on UAT / PRD before opening the screens. The screens assume existing data already follows the engine rules; each error-check query must return 0 rows — if it returns rows, fix the data first.</p>
<h3>Permissions and check-in</h3><pre>-- Run on UAT / PRD before opening the screens. Every query should return no rows.
-- (1) I1: client groups attached to more than one point program
SELECT client_group, COUNT(*) AS programs, GROUP_CONCAT(promo_config_id) AS program_ids
FROM mt5_crm.promo_client_group
WHERE promo_table = 'point_program'
GROUP BY client_group HAVING COUNT(*) &gt; 1;

-- (2) I2: programs with more than one live check-in task right now
SELECT d.program_id, COUNT(*) AS live_tasks, GROUP_CONCAT(d.id) AS task_ids
FROM mt5_crm.point_task_daily_checkin d
JOIN mt5_crm.point_task_bundle b ON b.id = d.task_bundle_id
WHERE d.enabled = 1 AND b.enabled = 1 AND d.display_hide_to_all = 0
  AND (d.display_period_limit_apply = 0
       OR (UTC_TIMESTAMP() &gt;= d.display_period_from AND UTC_TIMESTAMP() &lt; d.display_period_to))
GROUP BY d.program_id HAVING COUNT(*) &gt; 1;

-- (3) I3 / I5 / I6 / I7: check-in tasks that break an engine rule
SELECT d.id, d.task_name,
       CONCAT_WS(', ',
         IF(d.program_id &lt;&gt; b.program_id, 'program_id differs from bundle', NULL),
         IF(d.tz_minutes IS NULL, 'tz_minutes NULL', NULL),
         IF(d.routine_cycle_repeat IS NULL, 'routine_cycle_repeat NULL', NULL),
         IF(d.point_expiration_window IS NULL, 'point_expiration_window NULL', NULL),
         IF(d.display_event NOT IN ('signup','kyc_approve','first_time_deposit','first_trade'), 'display_event', NULL),
         IF(d.participate_event NOT IN ('signup','kyc_approve','first_time_deposit','first_trade'), 'participate_event', NULL),
         IF(d.participate_period_limit_type NOT IN ('no_limit','specific_period'), 'participate_period_limit_type', NULL),
         IF(d.claim_type NOT IN ('claim_each_day','claim_each_cycle'), 'claim_type', NULL),
         IF(IFNULL(d.claim_valid_period_type, '') NOT IN ('days_after_completion','no_limit'), 'claim_valid_period_type', NULL),
         IF(d.point_expiration_type NOT IN ('days_after_claim','no_limit'), 'point_expiration_type', NULL),
         IF(d.restart_missed_checkin_enabled = 1
            AND JSON_LENGTH(d.point_distribute_specify_each_day, '$.cycles') &lt;&gt; 1, 'streak needs 1 cycle', NULL),
         IF(JSON_LENGTH(d.point_distribute_specify_each_day, '$.cycles[0]') &lt;&gt; d.routine_cycle_limit_days,
            'cycle 1 length differs from routine_cycle_limit_days', NULL)
       ) AS problems
FROM mt5_crm.point_task_daily_checkin d
LEFT JOIN mt5_crm.point_task_bundle b ON b.id = d.task_bundle_id
HAVING problems &lt;&gt; '';</pre>
<h3>Trading and coin</h3><pre>-- Run on UAT / PRD before opening the screens. Every query should return no rows.
-- (1) J2: programs with more than one live trading task
SELECT d.program_id, COUNT(*) AS live_tasks, GROUP_CONCAT(d.id) AS task_ids
FROM mt5_crm.point_task_trading d
JOIN mt5_crm.point_task_bundle b ON b.id = d.task_bundle_id
JOIN mt5_crm.point_program p ON p.id = d.program_id
WHERE d.enabled = 1 AND b.enabled = 1 AND p.enabled = 1
  AND (d.participate_period_limit_type = 'no_limit' OR d.participate_period_to &gt; UTC_TIMESTAMP())
GROUP BY d.program_id HAVING COUNT(*) &gt; 1;

-- (2) J1 / J3 / J4 / field ranges: trading tasks that break an engine rule
SELECT d.id, d.task_name,
       CONCAT_WS(', ',
         IF(b.id IS NULL OR d.program_id &lt;&gt; b.program_id, 'program_id differs from bundle', NULL),
         IF(d.display_event IS NULL OR d.display_event NOT IN ('signup','kyc_approve','first_time_deposit','first_trade'), 'display_event', NULL),
         IF(d.display_hide_book_type NOT IN (0,1,2), 'display_hide_book_type', NULL),
         IF(d.display_period_limit_apply = 1 AND (d.display_period_from IS NULL OR d.display_period_to IS NULL
            OR d.display_period_from &gt;= d.display_period_to), 'display period', NULL),
         IF(d.participate_period_limit_type NOT IN ('no_limit','specific_period'), 'participate_period_limit_type', NULL),
         IF(d.participate_period_limit_type = 'specific_period' AND (d.participate_period_from IS NULL
            OR d.participate_period_to IS NULL OR d.participate_period_from &gt;= d.participate_period_to), 'participate period', NULL),
         IF(d.point_max_cap_enabled = 1 AND d.point_max_cap_value &lt; 1, 'daily cap', NULL),
         IF(d.point_expiration_window &lt; 1, 'point_expiration_window', NULL),
         IF(d.terms_url = '', 'terms_url empty string', NULL)
       ) AS problems
FROM mt5_crm.point_task_trading d
LEFT JOIN mt5_crm.point_task_bundle b ON b.id = d.task_bundle_id
HAVING problems &lt;&gt; '';

-- (3) J5: duplicate or broken rate rows
SELECT task_id, LOWER(mt5_group) AS grp, LOWER(condition_type) AS ctype, LOWER(IFNULL(condition_value, '')) AS cval,
       COUNT(*) AS n, GROUP_CONCAT(id) AS ids
FROM mt5_crm.point_task_trading_point_conversion
WHERE deleted = 0
GROUP BY 1, 2, 3, 4 HAVING COUNT(*) &gt; 1;

SELECT id, task_id, mt5_group, condition_type, condition_value, point_per_lot
FROM mt5_crm.point_task_trading_point_conversion
WHERE deleted = 0
  AND ( condition_type NOT IN ('symbol','symbol_group','any')
     OR (condition_type = 'any' AND IFNULL(condition_value, '') NOT IN ('', 'other'))
     OR (condition_type = 'symbol_group' AND condition_value NOT IN ('forex','metal','energy','index','stocks','other'))
     OR (condition_type = 'symbol' AND (condition_value IS NULL OR condition_value LIKE '%.%'))
     OR point_per_lot &lt; 0 );

-- (4) J6: enabled tasks with no positive rate
SELECT d.id, d.task_name FROM mt5_crm.point_task_trading d
WHERE d.enabled = 1
  AND NOT EXISTS (SELECT 1 FROM mt5_crm.point_task_trading_point_conversion v
                  WHERE v.task_id = d.id AND v.deleted = 0 AND v.point_per_lot &gt; 0);</pre>
<h3>Gift and redemption</h3><pre>-- Run on UAT / PRD before opening the screens. (1)-(2) should return no rows; (3)-(4) are reference figures.
-- (1) Gift points to a missing program, or the program has no client group (RI1/RI2)
SELECT g.id, g.program_id, g.gift_name
FROM mt5_crm.point_featured_gift g
LEFT JOIN mt5_crm.point_program p ON p.id = g.program_id
LEFT JOIN mt5_crm.promo_client_group cg
       ON cg.promo_table = 'point_program' AND cg.promo_config_id = g.program_id
WHERE p.id IS NULL OR cg.id IS NULL;

-- (2) Enabled gift without external_item_id (price cannot be reconciled with TADA — RI1)
SELECT id, program_id, gift_name, point_price
FROM mt5_crm.point_featured_gift
WHERE enabled = 1 AND (external_item_id IS NULL OR external_item_id = '');

-- (3) Transactions waiting for manual review (reconciled = 1) — backlog to handle by hand (RI5)
SELECT COUNT(*) AS pending_manual_review
FROM mt5_crm.point_redemption_transaction
WHERE external_system = 'tada' AND status = 1 AND reconciled = 1;

-- (4) Redeem blacklist rows pointing to clients that no longer exist (junk data)
SELECT bl.id, bl.client_id, bl.enabled
FROM mt5_crm.client_promotion_blacklist bl
LEFT JOIN mt5_crm.crm_customer_base c ON c.client_id = bl.client_id AND c.deleted = 0
WHERE bl.promo_table = 'point_redemption_transaction'
  AND bl.promo_config_id = 0 AND bl.point_task_bundle_id = 0
  AND c.client_id IS NULL;</pre>
</section><section class="panel" id="log" role="tabpanel"><h2>Changelog</h2><div class="scroll"><table><tr><th style="width:14%">Date</th><th>Changes</th></tr><tr><td>2026-10-21</td><td>Version 1.1: R1 also returns orderDate (new column point_redemption_order.order_date = order placement time on TADA).</td></tr><tr><td>2026-10-21</td><td>Version 1: merged the specs of 4 groups (permissions + check-in v3, trading + coin v2, gift + redemption v2, CleverTap v1) into 1 page; created the task list DEV-01 to DEV-12.</td></tr></table></div></section>
