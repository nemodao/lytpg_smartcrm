<template id="tpl-zh">
<h1>Smart CRM – Loyalty Config: API admin</h1>
<p class="sub">Smart CRM 中 Loyalty 配置页面的 admin API 规格。更新：2026-10-21。</p>
<nav class="tabs" role="tablist"><button type="button" role="tab" data-tab="overview" aria-selected="false">1. 概览</button><button type="button" role="tab" data-tab="dev" aria-selected="false">2. Developer</button><button type="button" role="tab" data-tab="api" aria-selected="false">3. API</button><button type="button" role="tab" data-tab="rules" aria-selected="false">4. 规则</button><button type="button" role="tab" data-tab="locks" aria-selected="false">5. 运行中锁定</button><button type="button" role="tab" data-tab="preflight" aria-selected="false">6. 数据检查</button><button type="button" role="tab" data-tab="log" aria-selected="false">7. 变更日志</button></nav>
<section class="panel" id="overview" role="tabpanel">
<h2>概览</h2>
<p>Smart CRM 中 Loyalty（point system）配置页面的 admin API 规格文档。共 33 个 API，分 7 组：权限、签到任务、交易任务、Coin、礼品、兑换、CleverTap。所有校验均已对照 <code>point_service</code> Q4 版本的引擎及 UAT 上的实际 DDL。</p>
<p>需要 developer 实现或回复的事项见 <a href="#dev" class="ref">tab Developer</a>。打开页面前，请先执行<a href="#preflight" class="ref">数据检查标签页</a>中的查询。</p>

<h3>数据模型</h3>
<p>Point system 分 3 级：<b>积分计划 (program)</b>（<code>point_program</code>，通过 <code>promo_client_group</code> 绑定且仅绑定 1 个客户组）→ <b>任务包</b>（<code>point_task_bundle</code>，任务分组）→ <b>任务</b>（<code>point_task_daily_checkin</code>、<code>point_task_trading</code>）。只有当 4 级全部启用时（客户组、积分计划、任务包、任务），客户才能看到该任务并获得 Coin。</p>
<p>积分计划的客户范围（用于 Coin、Redemption、Omni Marketing 标签页）：</p>
<pre>-- Clients of program P (plan 0.1): every client group attached to P, enabled or not
SELECT c.client_id
FROM crm_customer_base c
WHERE c.deleted = 0
  AND c.group_code IN (SELECT g.client_group FROM promo_client_group g
                       WHERE g.promo_table = 'point_program' AND g.promo_config_id = #{programId})</pre>

<h3>页面与 API</h3>
<div class="scroll"><table>

<h3>通用约定</h3>
<div class="scroll"><table>
<tr><th style="width:22%">内容</th><th>详情</th></tr><tr><td>API 位置</td><td>在 point_service 中使用前缀 <code>/point/admin/…</code>，与现有的 <code>/point/pointAdjust</code> 放在一起。Smart CRM 前端通过 axios 调用（header <code>X-Access-Token</code>）。<span class="pending">PENDING</span> DEV-01。</td></tr><tr><td>调用方式</td><td>读：<code>GET</code> + query params。写：<code>POST</code> + JSON body。字段名 camelCase。时间范围筛选使用后缀 <code>_begin</code> / <code>_end</code>。</td></tr><tr><td>时间</td><td>所有入参/出参 datetime 均为 <b>UTC</b>，格式 <code>yyyy-MM-dd HH:mm:ss</code>，与 DB 中的值完全一致。任务本地时间的日期列（<code>checkin_date</code>、<code>period_key</code>）保持原字符串。不要直接返回 entity，因为 entity 带有 <code>@JsonFormat(timezone = "GMT+7")</code>。<span class="pending">PENDING</span> DEV-03。</td></tr><tr><td>操作人</td><td><code>create_user</code> / <code>update_user</code> 取自 Smart CRM 当前登录用户，不接收前端传入。<span class="pending">PENDING</span> DEV-02。</td></tr><tr><td>分页</td><td>接收 <code>pageNo</code>、<code>pageSize</code>（默认 1 / 10，最大 100）；返回 <code>result.records</code>、<code>result.total</code>。</td></tr><tr><td>错误</td><td><code>success = false</code>、<code>code = 500</code>、<code>message</code> 为英文（前端原样展示）。表单保存类 API 额外返回 <code>result.errors = [{field, message}]</code>，供前端逐个字段标红。</td></tr><tr><td>不删除</td><td>没有删除 API。只做启用/停用，以保留历史。例外：交易任务的兑换比例行（通过 <code>deleted</code> 列软删除）。</td></tr><tr><td>新建即停用</td><td>新建的任务（签到、交易）和礼品一律为 <code>enabled = 0</code>。只能通过启用/停用 API 启用，确保每次启用都经过校验。</td></tr><tr><td>事务与锁</td><td>每个写 API 在 1 个事务中执行。需要跨任务校验规则的 API 先锁积分计划行（<code>SELECT … FROM point_program WHERE id = ? FOR UPDATE</code>）。</td></tr><tr><td>需确认的警告</td><td>同一积分计划内两个交易任务同时运行只会触发<b>警告</b>：API 返回 <code>success = false</code> 并附带 <code>result.duplicateTaskIds</code>；前端再次询问用户，同意后带 <code>confirmDuplicate = true</code> 重新提交。适用于 T1、T2、B3。</td></tr><tr><td>默认时间范围</td><td>日志和 Coin 列表因表数据量大，始终带默认时间范围：deal log 30 天；ledger、lot、notify log 7 天。</td></tr>
</table></div>

<h3>已确定的决定</h3>
<ul class="rules"><li>积分计划与客户组为 1 对 1 关系。积分计划创建后客户组不可更改。DB 没有保证这一点的 key：所有校验都在 API 中（P2、P5）。</li><li>每个 client_id 只属于 1 个客户组（<code>crm_customer_base.group_code</code>）。Coin、redemption、notify log 相关表没有 <code>program_id</code>：某积分计划的数据即 <code>group_code</code> = 该积分计划客户组的客户的数据。客户更换客户组后，历史数据跟随当前客户组。</li><li>积分计划 Active = <code>point_program.enabled = 1</code> 且 <code>promo_client_group.enabled = 1</code>。积分计划的启用/停用状态在 S2 修改，带确认弹窗。</li><li>每个积分计划最多 1 个正在展示的签到任务（硬拦截，I2）。每个积分计划应只有 1 个运行中的交易任务（仅警告，J2）。</li><li>签到任务硬锁定字段：<code>point_multiplier_enabled = 0</code>、<code>point_to_cash_convert_type = by_task_fixed_value</code>、<code>checkin_auto = 0</code>。积分计划：<code>kpi_name_point_multiplier = NULL</code>。<code>point_multiplier</code>、<code>point_program_point_definition</code>、<code>point_notify_event_config</code> 没有页面。</li><li>积分计划、任务包、任务上的 <code>display_hide_book_type</code> 是交易的 Coin 计算规则（不只是隐藏展示）。仍允许修改，但确认弹窗必须说明清楚。</li><li>手工调整 Coin（K3）：原因必填，通过 <code>requestId</code> 防重复提交，每次最多 100,000 Coin，扣减不得超过余额；手工加的 Coin 有效期由用户选择（1–7300 天，默认 180），截止于 23:59:59 GMT+7。</li><li>任务包黑名单（L1、L2）和兑换黑名单（R3、R4）是 <code>client_promotion_blacklist</code> 中两种不同类型的行。兑换黑名单是全局的；在某积分计划的标签页中只展示、只允许添加属于该积分计划的客户。</li><li>Smart CRM 是内部工具：IDR 金额（<code>idr_amount</code>、<code>fees</code>）正常展示。voucher 码 / PIN / token、收件人信息仍需脱敏；不返回 <code>raw_*</code> 列。</li><li>标记交易为已手工对账（R5）：只允许 <code>reconciled</code> 1 → 2，备注必填。</li></ul>
</section><section class="panel" id="dev" role="tabpanel">

</section><section class="panel" id="api" role="tabpanel"><h2>API</h2><p>33 个 admin API，按组划分。点击<b>详细规格</b>查看 request、处理逻辑（含 SQL）、response 示例和错误 message。</p><h3>权限</h3><p class="note">使用于：S1、S2 Section 1、Task Bundles 标签页。</p><div class="scroll"><table class="apiidx"><tr><th style="width:7%">编号</th><th style="width:36%">Endpoint</th><th>用途</th><th style="width:15%">详情</th></tr><tr id="p1"><td><code>P1</code></td><td><code>GET /point/admin/program/list</code></td><td>S1 页面的积分计划列表，每行附带客户组和 Active 状态。</td><td><button type="button" class="specbtn" data-spec="p1">详细规格 ▸</button></td></tr><tr id="p2"><td><code>P2</code></td><td><code>POST /point/admin/program/add</code></td><td>在 1 个事务中创建积分计划及其客户组行（M1）。</td><td><button type="button" class="specbtn" data-spec="p2">详细规格 ▸</button></td></tr><tr id="p3"><td><code>P3</code></td><td><code>GET /point/admin/program/get</code></td><td>1 个积分计划的详情，用于 S2 的 Section 1。</td><td><button type="button" class="specbtn" data-spec="p3">详细规格 ▸</button></td></tr><tr id="p4"><td><code>P4</code></td><td><code>POST /point/admin/program/edit</code></td><td>修改积分计划（Section 1 中的 Modify）。客户组不变。</td><td><button type="button" class="specbtn" data-spec="p4">详细规格 ▸</button></td></tr><tr id="p5"><td><code>P5</code></td><td><code>POST /point/admin/program/clientGroup/enable</code></td><td>启用/停用 1 个积分计划的客户组行（S1 卡片上的开关）。</td><td><button type="button" class="specbtn" data-spec="p5">详细规格 ▸</button></td></tr><tr id="p6"><td><code>P6</code></td><td><code>GET /point/admin/clientGroup/list</code></td><td>创建积分计划时的客户组下拉框：所有客户组及其已绑定的积分计划（如有）。</td><td><button type="button" class="specbtn" data-spec="p6">详细规格 ▸</button></td></tr><tr id="b1"><td><code>B1</code></td><td><code>GET /point/admin/bundle/list</code></td><td>1 个积分计划的任务包看板，每个任务包附带任务摘要（签到 + 交易），用于绘制卡片。</td><td><button type="button" class="specbtn" data-spec="b1">详细规格 ▸</button></td></tr><tr id="b2"><td><code>B2</code></td><td><code>POST /point/admin/bundle/save</code></td><td>创建（无 id）或修改（有 id）任务包（M2）。</td><td><button type="button" class="specbtn" data-spec="b2">详细规格 ▸</button></td></tr><tr id="b3"><td><code>B3</code></td><td><code>POST /point/admin/bundle/enable</code></td><td>启用/停用任务包。</td><td><button type="button" class="specbtn" data-spec="b3">详细规格 ▸</button></td></tr><tr id="l1"><td><code>L1</code></td><td><code>GET /point/admin/blacklist/list</code></td><td>1 个任务包的黑名单列表，包括已加白名单的行（M3）。</td><td><button type="button" class="specbtn" data-spec="l1">详细规格 ▸</button></td></tr><tr id="l2"><td><code>L2</code></td><td><code>POST /point/admin/blacklist/save</code></td><td>将客户加入任务包黑名单，或切换 Blacklisted ↔ Whitelisted。</td><td><button type="button" class="specbtn" data-spec="l2">详细规格 ▸</button></td></tr></table></div><h3>Check-in task</h3><p class="note">使用于：任务弹窗（Check-in）。</p><div class="scroll"><table class="apiidx"><tr><th style="width:7%">编号</th><th style="width:36%">Endpoint</th><th>用途</th><th style="width:15%">详情</th></tr><tr id="c1"><td><code>C1</code></td><td><code>POST /point/admin/checkinTask/save</code></td><td>创建（无 id）或修改（有 id）签到任务（M4 的 Config 标签页）。</td><td><button type="button" class="specbtn" data-spec="c1">详细规格 ▸</button></td></tr><tr id="c4"><td><code>C4</code></td><td><code>GET /point/admin/checkinTask/get</code></td><td>1 个签到任务的详情，用于打开 View/Edit 弹窗。相对列表为<b>新增</b>：B1 只返回摘要。</td><td><button type="button" class="specbtn" data-spec="c4">详细规格 ▸</button></td></tr><tr id="c2"><td><code>C2</code></td><td><code>POST /point/admin/checkinTask/enable</code></td><td>启用/停用签到任务。</td><td><button type="button" class="specbtn" data-spec="c2">详细规格 ▸</button></td></tr><tr id="c3"><td><code>C3</code></td><td><code>GET /point/admin/checkinTask/log/list</code></td><td>1 个任务的签到日志（M4 的 Check-in Log 标签页）。</td><td><button type="button" class="specbtn" data-spec="c3">详细规格 ▸</button></td></tr></table></div><h3>Trading task</h3><p class="note">使用于：任务弹窗（Trading）。</p><div class="scroll"><table class="apiidx"><tr><th style="width:7%">编号</th><th style="width:36%">Endpoint</th><th>用途</th><th style="width:15%">详情</th></tr><tr id="t1"><td><code>T1</code></td><td><code>POST /point/admin/trading/save</code></td><td>一次保存中创建或修改 1 个交易任务及其全部兑换比例行（M4 的 Config 标签页）。</td><td><button type="button" class="specbtn" data-spec="t1">详细规格 ▸</button></td></tr><tr id="t2"><td><code>T2</code></td><td><code>POST /point/admin/trading/enable</code></td><td>启用 / 停用 1 个交易任务（任务卡片上的开关，经 EnableConfirmModal）。</td><td><button type="button" class="specbtn" data-spec="t2">详细规格 ▸</button></td></tr><tr id="t3"><td><code>T3</code></td><td><code>GET /point/admin/trading/get</code></td><td>1 个交易任务的详情，附带未删除的兑换比例行和 <code>lockedFields</code>（以 View/Edit 模式打开 M4）。</td><td><button type="button" class="specbtn" data-spec="t3">详细规格 ▸</button></td></tr><tr id="t4"><td><code>T4</code></td><td><code>GET /point/admin/trading/dealLog/list</code></td><td>1 个任务的逐笔订单明细（M4 的 Deal Log 标签页）。只读。</td><td><button type="button" class="specbtn" data-spec="t4">详细规格 ▸</button></td></tr><tr id="t5"><td><code>T5</code></td><td><code>GET /point/admin/trading/dailyLog/list</code></td><td>1 个任务按客户 / 日期汇总（M4 的 Daily Log 标签页）。只读。</td><td><button type="button" class="specbtn" data-spec="t5">详细规格 ▸</button></td></tr></table></div><h3>Coin</h3><p class="note">使用于：Coin 标签页。</p><div class="scroll"><table class="apiidx"><tr><th style="width:7%">编号</th><th style="width:36%">Endpoint</th><th>用途</th><th style="width:15%">详情</th></tr><tr id="k1"><td><code>K1</code></td><td><code>GET /point/admin/coin/ledger/list</code></td><td>积分计划内客户的 Coin 流水（<code>point_ledger</code>）（Coin 标签页 (S2)，Ledger 标签页）。只读。</td><td><button type="button" class="specbtn" data-spec="k1">详细规格 ▸</button></td></tr><tr id="k2"><td><code>K2</code></td><td><code>GET /point/admin/coin/lot/list</code></td><td>积分计划内客户的 Coin 批次（<code>point_lot</code>）（Coin 标签页 (S2)，Lot 标签页）。只读。</td><td><button type="button" class="specbtn" data-spec="k2">详细规格 ▸</button></td></tr><tr id="k3"><td><code>K3</code></td><td><code>POST /point/admin/coin/adjust</code></td><td>为积分计划内的 1 个客户手工增加 / 扣减 Coin（Adjust Balance 弹窗）。<code>POST /point/pointAdjust</code> 的 Smart CRM 版本。</td><td><button type="button" class="specbtn" data-spec="k3">详细规格 ▸</button></td></tr><tr id="k4"><td><code>K4</code></td><td><code>GET /point/admin/coin/balance</code></td><td>1 个客户的当前余额（保存前在 Adjust Balance 弹窗中显示）。</td><td><button type="button" class="specbtn" data-spec="k4">详细规格 ▸</button></td></tr></table></div><h3>Gift</h3><p class="note">使用于：Gift List 标签页。</p><div class="scroll"><table class="apiidx"><tr><th style="width:7%">编号</th><th style="width:36%">Endpoint</th><th>用途</th><th style="width:15%">详情</th></tr><tr id="g1"><td><code>G1</code></td><td><code>GET /point/admin/gift/list</code></td><td>1 个积分计划的礼品列表（Gift List 标签页 (S2)），按 sort_order 排序。</td><td><button type="button" class="specbtn" data-spec="g1">详细规格 ▸</button></td></tr><tr id="g2"><td><code>G2</code></td><td><code>POST /point/admin/gift/save</code></td><td>创建（无 id）或修改（有 id）1 个礼品。修改时积分计划不变。</td><td><button type="button" class="specbtn" data-spec="g2">详细规格 ▸</button></td></tr><tr id="g3"><td><code>G3</code></td><td><code>POST /point/admin/gift/enable</code></td><td>启用/停用 1 个礼品（Gift List 标签页上的开关）。</td><td><button type="button" class="specbtn" data-spec="g3">详细规格 ▸</button></td></tr></table></div><h3>Redemption</h3><p class="note">使用于：Redemption 标签页。</p><div class="scroll"><table class="apiidx"><tr><th style="width:7%">编号</th><th style="width:36%">Endpoint</th><th>用途</th><th style="width:15%">详情</th></tr><tr id="r1"><td><code>R1</code></td><td><code>GET /point/admin/redemption/order/list</code></td><td>1 个积分计划内客户的兑换订单列表（point_redemption_order）。只读。</td><td><button type="button" class="specbtn" data-spec="r1">详细规格 ▸</button></td></tr><tr id="r2"><td><code>R2</code></td><td><code>GET /point/admin/redemption/transaction/list</code></td><td>1 个积分计划内客户的 Coin 扣减/退还交易列表（point_redemption_transaction）。只读。</td><td><button type="button" class="specbtn" data-spec="r2">详细规格 ▸</button></td></tr><tr id="r3"><td><code>R3</code></td><td><code>GET /point/admin/redemption/blacklist/list</code></td><td>1 个积分计划内客户的兑换黑名单列表（enabled 为 0 和 1 均包含）。</td><td><button type="button" class="specbtn" data-spec="r3">详细规格 ▸</button></td></tr><tr id="r4"><td><code>R4</code></td><td><code>POST /point/admin/redemption/blacklist/save</code></td><td>将客户加入兑换黑名单，或切换 Blacklisted ↔ Whitelisted（全局拦截）。</td><td><button type="button" class="specbtn" data-spec="r4">详细规格 ▸</button></td></tr><tr id="r5"><td><code>R5</code></td><td><code>POST /point/admin/redemption/transaction/reconcile</code></td><td>将 1 笔交易标记为“已手工核对”（reconciled 1 → 2）。回复 4.1。</td><td><button type="button" class="specbtn" data-spec="r5">详细规格 ▸</button></td></tr></table></div><h3>CleverTap</h3><p class="note">使用于：Omni Marketing 标签页。</p><div class="scroll"><table class="apiidx"><tr><th style="width:7%">编号</th><th style="width:36%">Endpoint</th><th>用途</th><th style="width:15%">详情</th></tr><tr id="n1"><td><code>N1</code></td><td><code>GET /point/admin/notifyLog/list</code></td><td>1 个积分计划内客户的 CleverTap 通知日志，最新在前。</td><td><button type="button" class="specbtn" data-spec="n1">详细规格 ▸</button></td></tr></table></div><div hidden><div class="specsrc" id="spec-p1" data-title="P1 · /point/admin/program/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/program/list</code></p><p>S1 页面的积分计划列表，每行附带客户组和 Active 状态。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>pageNo</code></td><td>int</td><td>否</td><td>默认 1。</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>否</td><td>默认 10，最大 100。</td></tr><tr><td><code>programName</code></td><td>string</td><td>否</td><td>筛选 <code>LIKE %x%</code>，已 trim。</td></tr><tr><td><code>clientGroup</code></td><td>string</td><td>否</td><td>精确匹配筛选。</td></tr><tr><td><code>status</code></td><td>string</td><td>否</td><td><code>active</code> 或 <code>inactive</code>。其他值 → 报错。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>校验参数。</li>
<li>执行下方查询（用相同条件统计 <code>total</code>）。</li>
<li><code>active = program.enabled = 1 AND client_group_enabled = 1</code>。积分计划没有客户组行（旧数据）→ <code>clientGroup = null</code>，<code>active = false</code>。</li></ol><pre>SELECT p.id, p.program_name, p.program_description, p.enabled, p.cash_currency,
       p.display_hide_book_type, p.create_user, p.create_date, p.update_user, p.update_date,
       g.id AS client_group_row_id, g.client_group, g.enabled AS client_group_enabled,
       (p.enabled = 1 AND IFNULL(g.enabled, 0) = 1) AS active
FROM point_program p
LEFT JOIN promo_client_group g
       ON g.promo_table = 'point_program' AND g.promo_config_id = p.id
WHERE (#{programName} IS NULL OR p.program_name LIKE CONCAT('%', #{programName}, '%'))
  AND (#{clientGroup} IS NULL OR g.client_group = #{clientGroup})
  AND (#{status} IS NULL
       OR (#{status} = 'active'   AND p.enabled = 1 AND IFNULL(g.enabled, 0) = 1)
       OR (#{status} = 'inactive' AND NOT (p.enabled = 1 AND IFNULL(g.enabled, 0) = 1)))
ORDER BY active DESC, p.id DESC
LIMIT #{offset}, #{pageSize};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": {
    "total": 1,
    "records": [{
      "id": 1101, "programName": "mitrade_point_program", "programDescription": "MiTrade white-label point program",
      "enabled": 1, "cashCurrency": "USD", "displayHideBookType": 0,
      "clientGroupRowId": 10101, "clientGroup": "mitrade_client", "clientGroupEnabled": 1, "active": true,
      "createUser": "admin01", "createDate": "2026-10-20 08:15:00",
      "updateUser": null, "updateDate": null
    }]
  }
}</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Status must be active or inactive.</code></td><td>status 取值错误</td></tr></table></div><div class="specsec"><h4>5. 注意</h4><p>如果旧数据中有积分计划绑定了 2 条客户组行（违反 I1），查询会为该积分计划返回 2 行。打开页面前先执行数据检查标签页中的查询；Smart CRM 不会自动修复旧数据。</p></div></div><div class="specsrc" id="spec-p2" data-title="P2 · /point/admin/program/add"><p class="specmeta"><code>POST</code> · <code>/point/admin/program/add</code></p><p>在 1 个事务中创建积分计划及其客户组行（M1）。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>programName</code></td><td>string</td><td>是</td><td>Trim，1–64 个字符（<code>varchar(64)</code>）。不得与其他积分计划重名，不区分大小写（unique key <code>uk_program_name</code>，collation <code>utf8mb4_0900_ai_ci</code>）。</td></tr><tr><td><code>programDescription</code></td><td>string</td><td>是</td><td>Trim，1–255 个字符（<code>varchar(255)</code>；DB 允许 NULL，必填是页面层面的决定）。</td></tr><tr><td><code>cashCurrency</code></td><td>string</td><td>是</td><td>3 位大写字母代码，regex <code>^[A-Z]{3}$</code>（列为 varchar(16)）。引擎仅用于展示。</td></tr><tr><td><code>displayHideBookType</code></td><td>int</td><td>是</td><td><code>0</code> 对所有人展示，<code>1</code> 对 A-book 隐藏，<code>2</code> 对 B-book 隐藏。</td></tr><tr><td><code>clientGroup</code></td><td>string</td><td>是</td><td>必须存在于 <code>client_group_configuration</code>（<code>group_code</code>，<code>varchar(50)</code>，unique）且 <code>enabled = 1</code>，并且尚未绑定任何积分计划（I1）。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>Validate field.</li>
<li>开启事务。按客户组加锁，防止 2 个 admin 同时创建：<code>SELECT id FROM promo_client_group WHERE promo_table = 'point_program' AND client_group = ? FOR UPDATE</code>。已有行（包括 <code>enabled = 0</code>）→ 报错 "already attached"。</li>
<li>检查重名：<code>SELECT id FROM point_program WHERE program_name = ?</code>（collation 自动按不区分大小写比较）。若 2 个 admin 同时创建，INSERT 仍可能触发 <code>uk_program_name</code> → 捕获 DuplicateKey，返回相同 message。</li>
<li>INSERT <code>point_program</code>：<code>enabled = 1</code>，<code>kpi_name_point_multiplier = NULL</code>（硬锁定），<code>create_user</code> = 当前登录用户。</li>
<li>INSERT <code>promo_client_group</code>：<code>client_group</code>，<code>promo_table = 'point_program'</code>，<code>promo_config_id</code> = 刚创建的 id，<code>enabled = 1</code>。</li>
<li>COMMIT，返回 2 个 id。</li></ol>
<p>创建时即启用积分计划是安全的：没有任务包/任务时引擎不会向客户返回任何内容。</p><pre>SELECT enabled FROM client_group_configuration WHERE group_code = #{clientGroup};

INSERT INTO point_program
  (program_name, program_description, enabled, cash_currency, kpi_name_point_multiplier,
   display_hide_book_type, create_date, create_user)
VALUES (#{programName}, #{programDescription}, 1, #{cashCurrency}, NULL,
        #{displayHideBookType}, UTC_TIMESTAMP(), #{currentUser});

INSERT INTO promo_client_group
  (client_group, promo_table, promo_config_id, enabled, create_date, create_user)
VALUES (#{clientGroup}, 'point_program', #{newProgramId}, 1, UTC_TIMESTAMP(), #{currentUser});</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": { "id": 1102, "clientGroupRowId": 10102 } }</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Program name is required.</code></td><td></td></tr><tr><td><code>Program name must be at most 64 characters.</code></td><td></td></tr><tr><td><code>Program name already exists.</code></td><td></td></tr><tr><td><code>Program description is required.</code></td><td></td></tr><tr><td><code>Cash currency must be a 3-letter code, for example USD.</code></td><td></td></tr><tr><td><code>Display hide book type must be 0, 1 or 2.</code></td><td></td></tr><tr><td><code>Client group does not exist.</code></td><td></td></tr><tr><td><code>Client group {group} is disabled.</code></td><td>client_group_configuration.enabled = 0</td></tr><tr><td><code>Program description must be at most 255 characters.</code></td><td></td></tr><tr><td><code>Client group {group} is already attached to program {id} ({name}).</code></td><td>I1</td></tr></table></div></div><div class="specsrc" id="spec-p3" data-title="P3 · /point/admin/program/get"><p class="specmeta"><code>GET</code> · <code>/point/admin/program/get</code></p><p>1 个积分计划的详情，用于 S2 的 Section 1。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>是</td><td>积分计划必须存在。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>按 P1 的方式读取积分计划 + 客户组行（筛选 <code>p.id = ?</code>）。</li>
<li>另外计算 <code>bundleCount</code>、<code>checkinTaskCount</code> 和 <code>hasActivity</code>（积分计划已有签到日志或交易日志）。前端用 <code>hasActivity</code> 锁定字段 <code>cashCurrency</code>（见运行中锁定标签页）。</li></ol><pre>-- check-in side: go through the task ids (needs index idx_task_date, see DEV-06)
SELECT EXISTS (SELECT 1 FROM point_task_daily_checkin_log l
               JOIN point_task_daily_checkin d ON d.id = l.task_id
               WHERE d.program_id = #{id})
    OR EXISTS (SELECT 1 FROM point_task_trading_log WHERE program_id = #{id}) AS has_activity;</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": {
    "id": 1101, "programName": "mitrade_point_program", "programDescription": "MiTrade white-label point program",
    "enabled": 1, "cashCurrency": "USD", "displayHideBookType": 0,
    "clientGroupRowId": 10101, "clientGroup": "mitrade_client", "clientGroupEnabled": 1, "active": true,
    "bundleCount": 1, "checkinTaskCount": 1, "hasActivity": true,
    "createUser": "admin01", "createDate": "2026-10-20 08:15:00", "updateUser": null, "updateDate": null
  }
}</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr></table></div></div><div class="specsrc" id="spec-p4" data-title="P4 · /point/admin/program/edit"><p class="specmeta"><code>POST</code> · <code>/point/admin/program/edit</code></p><p>修改积分计划（Section 1 中的 Modify）。客户组不变。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>是</td><td>积分计划必须存在。</td></tr><tr><td><code>programName</code></td><td>string</td><td>是</td><td>同 P2；不得与其他积分计划重名（排除自身）。</td></tr><tr><td><code>programDescription</code></td><td>string</td><td>是</td><td>同 P2。</td></tr><tr><td><code>cashCurrency</code></td><td>string</td><td>是</td><td>同 P2。<code>hasActivity</code> = true 时必须保持原值。</td></tr><tr><td><code>displayHideBookType</code></td><td>int</td><td>是</td><td>0 / 1 / 2。可自由修改。</td></tr><tr><td><code>enabled</code></td><td>int</td><td>是</td><td>0 / 1.</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>校验。忽略前端传来的其他所有字段（<code>kpiNamePointMultiplier</code>、<code>clientGroup</code>…）。</li>
<li>若 <code>cashCurrency</code> 与已存值不同且积分计划已有活动（P3 中的查询）→ 报错。</li>
<li>UPDATE <code>point_program</code> 上述字段 + <code>update_user</code>、<code>update_date = UTC_TIMESTAMP()</code>。</li></ol>
<p>停用积分计划：该积分计划的所有任务立即从 app 消失；已发放的 Coin 不变。重新启用无需检查 I2（I2 在 1 个积分计划内计算，与积分计划启用或停用无关）。</p><pre>UPDATE point_program
SET program_name = #{programName}, program_description = #{programDescription},
    cash_currency = #{cashCurrency}, display_hide_book_type = #{displayHideBookType},
    enabled = #{enabled}, update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE id = #{id};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": null }</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Program name already exists.</code></td><td></td></tr><tr><td><code>Cash currency cannot be changed after clients have earned coins in this program.</code></td><td>运行中锁定标签页</td></tr><tr><td><code>Enabled must be 0 or 1.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. 注意</h4><p><code>displayHideBookType</code>：对签到只是展示筛选；对交易则是<b>Coin 计算规则</b>（Trading 组已确认）：改为 <code>1</code> 则 A-book 客户不再获得 Coin，改为 <code>2</code> 则 B-book 客户不再获得 Coin，作用于该积分计划内所有交易任务。API 不变；前端应在修改该值时于确认弹窗中说明清楚。</p></div></div><div class="specsrc" id="spec-p5" data-title="P5 · /point/admin/program/clientGroup/enable"><p class="specmeta"><code>POST</code> · <code>/point/admin/program/clientGroup/enable</code></p><p>启用/停用 1 个积分计划的客户组行（S1 卡片上的开关）。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>是</td><td>积分计划必须有客户组行。</td></tr><tr><td><code>enabled</code></td><td>int</td><td>是</td><td>0 / 1.</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>获取积分计划的 <code>promo_client_group</code> 行。</li>
<li>启用时：检查该客户组没有其他处于 <code>enabled = 1</code> 的 <code>point_program</code> 行（I1，防范旧数据）。</li>
<li>UPDATE <code>enabled</code>, <code>update_user</code>, <code>update_date</code>.</li></ol><pre>UPDATE promo_client_group
SET enabled = #{enabled}, update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE promo_table = 'point_program' AND promo_config_id = #{programId};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": null }</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Program has no client group.</code></td><td></td></tr><tr><td><code>Client group {group} is already enabled for program {id}.</code></td><td>I1</td></tr></table></div></div><div class="specsrc" id="spec-p6" data-title="P6 · /point/admin/clientGroup/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/clientGroup/list</code></p><p>创建积分计划时的客户组下拉框：所有客户组及其已绑定的积分计划（如有）。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>keyword</code></td><td>string</td><td>否</td><td>筛选 <code>group_code LIKE %x%</code>。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>读取 <code>client_group_configuration</code>，LEFT JOIN <code>promo_client_group</code> 的 <code>point_program</code> 行。</li>
<li><code>available = groupEnabled = 1 AND programId IS NULL</code>。前端只允许选择 <code>available = true</code> 的行；如有则在客户组代码旁显示 <code>groupDescription</code>。</li></ol>
<p>不分页（客户组数量少）。Smart CRM 已有 <code>/partner/clientgroupcode/list</code> 读取同一张表；本 API 只是多了积分计划列。</p><pre>SELECT cg.group_code AS client_group, cg.group_description, cg.enabled AS group_enabled,
       g.promo_config_id AS program_id, p.program_name, g.enabled AS client_group_enabled
FROM client_group_configuration cg
LEFT JOIN promo_client_group g
       ON g.client_group = cg.group_code AND g.promo_table = 'point_program'
LEFT JOIN point_program p ON p.id = g.promo_config_id
WHERE (#{keyword} IS NULL OR cg.group_code LIKE CONCAT('%', #{keyword}, '%'))
ORDER BY (g.id IS NULL) DESC, cg.group_code;</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": [
    { "clientGroup": "partner_x_client", "groupDescription": "Partner X clients", "groupEnabled": 1,
      "programId": null, "programName": null, "clientGroupEnabled": null, "available": true },
    { "clientGroup": "mitrade_client", "groupDescription": null, "groupEnabled": 1,
      "programId": 1101, "programName": "mitrade_point_program", "clientGroupEnabled": 1, "available": false }
  ]
}</pre></div><div class="specsec"><h4>4. 错误 message</h4><p>仅通用错误（缺少参数、无权限）。</p></div><div class="specsec"><h4>5. 注意</h4><p>按 DDL：显示名称 = <code>group_description</code>（<code>varchar(255)</code>，可能为 NULL → 前端显示客户组代码），状态 = <code>enabled</code>（1 启用，0 停用）。表中其他列（汇率、默认 MT5 组…）与 loyalty 无关，不返回。<code>group_code</code> 和 <code>promo_client_group.client_group</code> 的 collation 同为 <code>utf8mb4_0900_ai_ci</code>，所以 JOIN 不需要 <code>COLLATE</code>。</p></div></div><div class="specsrc" id="spec-b1" data-title="B1 · /point/admin/bundle/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/bundle/list</code></p><p>1 个积分计划的任务包看板，每个任务包附带任务摘要（签到 + 交易），用于绘制卡片。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>programId</code></td><td>long</td><td>是</td><td>积分计划必须存在。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>获取积分计划的所有任务包。</li>
<li>获取这些任务包下的所有签到任务和交易任务（2 个查询，按 <code>task_bundle_id</code> 归并）。</li>
<li>排序：<code>enabled</code> 的任务包在前，再按 id；任务包内 <code>enabled</code> 的任务在前，再按 id。</li>
<li>签到任务额外返回 <code>live</code>（当前计入 I2），供前端标记。</li></ol>
<p>不分页。<code>blacklistCount</code> = 该任务包中处于 <code>enabled = 1</code> 的黑名单行数。</p><pre>SELECT b.id, b.task_bundle_name, b.task_bundle_description, b.display_hide_book_type, b.enabled,
       (SELECT COUNT(*) FROM client_promotion_blacklist bl
         WHERE bl.enabled = 1 AND bl.promo_table = 'point_program'
           AND bl.promo_config_id = b.program_id AND bl.point_task_bundle_id = b.id) AS blacklist_count
FROM point_task_bundle b WHERE b.program_id = #{programId}
ORDER BY b.enabled DESC, b.id;

SELECT d.id, d.task_bundle_id, d.task_name, d.enabled, d.participate_period_limit_type,
       d.participate_period_from, d.participate_period_to, d.routine_cycle_limit_days, d.claim_type,
       (d.enabled = 1 AND d.display_hide_to_all = 0
        AND (d.display_period_limit_apply = 0 OR UTC_TIMESTAMP() &lt; d.display_period_to)) AS live
FROM point_task_daily_checkin d WHERE d.program_id = #{programId}
ORDER BY d.enabled DESC, d.id;

SELECT t.id, t.task_bundle_id, t.task_name, t.enabled, t.participate_period_limit_type,
       t.participate_period_from, t.participate_period_to, t.min_position_hold_second,
       t.point_max_cap_enabled, t.point_max_cap_value, t.release_auto_delay_day,
       r.rate_min, r.rate_max, IFNULL(r.rate_row_count, 0) AS rate_row_count
FROM point_task_trading t
LEFT JOIN (SELECT task_id, MIN(point_per_lot) AS rate_min, MAX(point_per_lot) AS rate_max,
                  COUNT(*) AS rate_row_count
           FROM point_task_trading_point_conversion
           WHERE deleted = 0
           GROUP BY task_id) r ON r.task_id = t.id
WHERE t.program_id = #{programId}
ORDER BY t.enabled DESC, t.id;</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": [{
    "id": 2101, "taskBundleName": "mitrade_daily_checkin", "taskBundleDescription": "MiTrade daily check-in tasks",
    "displayHideBookType": 0, "enabled": 1, "blacklistCount": 0,
    "tasks": [
      { "taskId": 3101, "taskType": "checkin", "taskName": "mitrade_daily_checkin", "enabled": 1, "live": true,
        "participatePeriodLimitType": "specific_period",
        "participatePeriodFrom": "2026-09-30 17:00:00", "participatePeriodTo": "2027-12-31 17:00:00",
        "routineCycleLimitDays": 7, "claimType": "claim_each_day" },
      { "taskId": 3201, "taskType": "trading", "taskName": "HSB Coin Trading", "enabled": 0,
        "participatePeriodLimitType": "no_limit", "participatePeriodFrom": null, "participatePeriodTo": null,
        "minPositionHoldSecond": 120, "pointMaxCapEnabled": 1, "pointMaxCapValue": 500,
        "releaseAutoDelayDay": 1, "rateMin": 5, "rateMax": 20, "rateRowCount": 4 }
    ]
  }]
}</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. 注意</h4><p>交易字段的含义由 Trading 组负责；此处仅读出用于绘制卡片。交易卡片：<code>releaseAutoDelayDay</code> → 前端显示 T+0 / T+N；<code>rateMin</code> / <code>rateMax</code> / <code>rateRowCount</code> 基于兑换比例行 <code>deleted = 0</code> 计算；<code>rateRowCount = 0</code> 时 <code>rateMin</code> / <code>rateMax</code> 为 <code>null</code>，前端红色提示 No rates；Ended 标签由前端在 <code>specific_period</code> 和 <code>participatePeriodTo</code> 已过时自行加上。</p><p>此处的 <code>live</code> 是简化版（任务启用、未全部隐藏、展示时间窗未结束）；准确的 I2 检查在 C1/C2/B3 中。</p></div></div><div class="specsrc" id="spec-b2" data-title="B2 · /point/admin/bundle/save"><p class="specmeta"><code>POST</code> · <code>/point/admin/bundle/save</code></p><p>创建（无 id）或修改（有 id）任务包（M2）。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>修改时</td><td>任务包必须存在。</td></tr><tr><td><code>programId</code></td><td>long</td><td>创建时</td><td>积分计划必须存在。修改时：忽略；若传入值与当前积分计划不同 → 报错。</td></tr><tr><td><code>taskBundleName</code></td><td>string</td><td>是</td><td>Trim，1–128 个字符（<code>varchar(128)</code>）。同一积分计划内不得与其他任务包重名，不区分大小写。DB 对任务包名称没有 unique key，由 API 自行检查。</td></tr><tr><td><code>taskBundleDescription</code></td><td>string</td><td>是</td><td>Trim，1–255 个字符（<code>varchar(255)</code>）。</td></tr><tr><td><code>displayHideBookType</code></td><td>int</td><td>是</td><td>0 / 1 / 2。可自由修改。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>Validate.</li>
<li>创建：INSERT，<code>enabled = 1</code>。空任务包不影响引擎。</li>
<li>修改：UPDATE 名称、描述、book type、<code>update_user</code>、<code>update_date</code>。绝不 UPDATE <code>program_id</code>（I3）。</li></ol><pre>INSERT INTO point_task_bundle
  (program_id, task_bundle_name, task_bundle_description, enabled, display_hide_book_type, create_date, create_user)
VALUES (#{programId}, #{taskBundleName}, #{taskBundleDescription}, 1, #{displayHideBookType}, UTC_TIMESTAMP(), #{currentUser});

UPDATE point_task_bundle
SET task_bundle_name = #{taskBundleName}, task_bundle_description = #{taskBundleDescription},
    display_hide_book_type = #{displayHideBookType}, update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE id = #{id};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": { "id": 2102 } }</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Bundle does not exist.</code></td><td></td></tr><tr><td><code>Bundle cannot be moved to another program.</code></td><td>I3</td></tr><tr><td><code>Bundle name is required.</code></td><td></td></tr><tr><td><code>Bundle name must be at most 128 characters.</code></td><td></td></tr><tr><td><code>Bundle name already exists in this program.</code></td><td></td></tr><tr><td><code>Bundle description is required.</code></td><td></td></tr><tr><td><code>Bundle description must be at most 255 characters.</code></td><td></td></tr><tr><td><code>Display hide book type must be 0, 1 or 2.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. 注意</h4><p>任务包的 <code>displayHideBookType</code>：同 P4，但范围是本任务包内的交易任务（改为 <code>1</code> / <code>2</code> 则 A-book / B-book 客户在这些任务中不再获得 Coin）。对签到只是展示筛选。</p></div></div><div class="specsrc" id="spec-b3" data-title="B3 · /point/admin/bundle/enable"><p class="specmeta"><code>POST</code> · <code>/point/admin/bundle/enable</code></p><p>启用/停用任务包。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>是</td><td>任务包必须存在。</td></tr><tr><td><code>enabled</code></td><td>int</td><td>是</td><td>0 / 1.</td></tr><tr><td><code>confirmDuplicate</code></td><td>bool</td><td>否</td><td>仅在启用时使用：<code>true</code> = 用户已看过 J2 警告（交易）且仍要启用。不能绕过 I2（签到）。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>开启事务，锁定积分计划：<code>SELECT id FROM point_program WHERE id = ? FOR UPDATE</code>。</li>
<li><b>启用时，第 1 步 – I2 签到（硬拦截）：</b>对任务包内每个 <code>enabled = 1</code> 的签到任务，以 <code>enablingBundleId</code> = 本任务包执行查询 V15（规则标签页）。这样也能捕获同在待启用任务包内的 2 个任务，而不只是其他任务包中的任务。冲突 → 报错，不启用，即使带 <code>confirmDuplicate = true</code> 也一样。</li>
<li><b>启用时，第 2 步 – J2 交易（仅警告，已确定）：</b>取任务包内 <code>enabled = 1</code> 且参与时间窗未结束（<code>no_limit</code> 或 <code>participate_period_to &gt; now</code>）的交易任务。对每个任务执行 Trading 组的 J2 查询（规格 T2），并将待启用的任务包视为已启用。将所有冲突 id 汇总到 <code>duplicateTaskIds</code>（若任务包有 2 个及以上交易任务，也包括本任务包内的其他任务）。有冲突且 <code>confirmDuplicate</code> 不为 <code>true</code> → 返回错误并附带 <code>duplicateTaskIds</code>，不启用；前端再次询问，同意后带 <code>confirmDuplicate = true</code> 重新提交 B3。</li>
<li>停用时：不拦截（见回复 4.2）。</li>
<li>UPDATE <code>enabled</code>, <code>update_user</code>, <code>update_date</code>.</li></ol><pre>-- step 2, J2 (trading spec T2) adapted for B3: run for each candidate trading task #{candId}
SELECT d.id, d.task_name
FROM point_task_trading d
JOIN point_task_bundle b ON b.id = d.task_bundle_id
WHERE d.program_id = #{programId}
  AND d.id &lt;&gt; #{candId}
  AND d.enabled = 1
  AND (b.enabled = 1 OR b.id = #{bundleId})          -- the bundle being enabled counts as on
  AND ( d.participate_period_limit_type = 'no_limit'
        OR d.participate_period_to &gt; UTC_TIMESTAMP() );

UPDATE point_task_bundle
SET enabled = #{enabled}, update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE id = #{id};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": null }

// I2 (check-in): hard block, confirmDuplicate does not help
{ "success": false, "code": 500,
  "message": "Cannot enable this bundle: check-in task 3102 would be live at the same time as check-in task 3101 (mitrade_daily_checkin). Clients can only see one check-in task at a time.",
  "result": null }

// J2 (trading): warning, resend with confirmDuplicate = true to continue
{ "success": false, "code": 500,
  "message": "Program already has a live trading task: 3188 (HSB Coin Trading old). Send confirmDuplicate to continue.",
  "result": { "duplicateTaskIds": [3188] } }</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Bundle does not exist.</code></td><td></td></tr><tr><td><code>Enabled must be 0 or 1.</code></td><td></td></tr><tr><td><code>Cannot enable this bundle: check-in task {id} would be live at the same time as check-in task {otherId} ({otherName}). Clients can only see one check-in task at a time.</code></td><td>I2，硬拦截</td></tr><tr><td><code>Program already has a live trading task: {ids}. Send confirmDuplicate to continue.</code></td><td>J2，警告（message 与 T2 相同）</td></tr></table></div><div class="specsec"><h4>5. 注意</h4><p>固定顺序：先 I2，后 J2。若 I2 已报错则不返回 <code>duplicateTaskIds</code>，避免前端为一次必定失败的启用请求确认。启用积分计划（P4）和客户组（P5）无需 I2 或 J2，因为两者都在 1 个积分计划内计算。</p></div></div><div class="specsrc" id="spec-l1" data-title="L1 · /point/admin/blacklist/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/blacklist/list</code></p><p>1 个任务包的黑名单列表，包括已加白名单的行（M3）。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>bundleId</code></td><td>long</td><td>是</td><td>任务包必须存在。</td></tr><tr><td><code>clientId</code></td><td>long</td><td>否</td><td>精确匹配筛选。</td></tr><tr><td><code>enabled</code></td><td>int</td><td>否</td><td><code>1</code> Blacklisted, <code>0</code> Whitelisted.</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>否</td><td>默认 1。</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>否</td><td>默认 10，最大 100。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>获取任务包的 <code>program_id</code>。</li>
<li>执行下方查询，按 <code>update_date</code> 最新在前排序（该列始终有值，因为 L2 在 INSERT 时也会写入）。</li>
<li>额外返回 <code>programWideCount</code>：拦截<b>整个积分计划</b>的行数（<code>point_task_bundle_id</code> NULL，<code>enabled = 1</code>）。Smart CRM 不创建此类记录，但若存在，该客户在所有任务包中都会被拦截；前端应显示只读警告。</li></ol><pre>SELECT bl.id, bl.client_id, bl.enabled, bl.remark,
       bl.create_user, bl.create_date, bl.update_user, bl.update_date
FROM client_promotion_blacklist bl
WHERE bl.promo_table = 'point_program'
  AND bl.promo_config_id = #{programId}
  AND bl.point_task_bundle_id = #{bundleId}
  AND (#{clientId} IS NULL OR bl.client_id = #{clientId})
  AND (#{enabled} IS NULL OR bl.enabled = #{enabled})
ORDER BY bl.update_date DESC, bl.id DESC
LIMIT #{offset}, #{pageSize};

SELECT COUNT(*) FROM client_promotion_blacklist
WHERE enabled = 1 AND promo_table = 'point_program'
  AND promo_config_id = #{programId} AND point_task_bundle_id IS NULL;</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": {
    "total": 1, "programWideCount": 0,
    "records": [{ "id": 801, "clientId": 7200101, "enabled": 1, "remark": "Abuse, ticket 1234",
                  "createUser": "admin01", "createDate": "2026-10-21 03:00:00",
                  "updateUser": "admin01", "updateDate": "2026-10-21 03:00:00" }]
  }
}</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Bundle does not exist.</code></td><td></td></tr><tr><td><code>Enabled must be 0 or 1.</code></td><td></td></tr></table></div></div><div class="specsrc" id="spec-l2" data-title="L2 · /point/admin/blacklist/save"><p class="specmeta"><code>POST</code> · <code>/point/admin/blacklist/save</code></p><p>将客户加入任务包黑名单，或切换 Blacklisted ↔ Whitelisted。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>bundleId</code></td><td>long</td><td>是</td><td>任务包必须存在。</td></tr><tr><td><code>clientId</code></td><td>long</td><td>是</td><td>正数。</td></tr><tr><td><code>enabled</code></td><td>int</td><td>是</td><td><code>1</code> blacklist, <code>0</code> whitelist.</td></tr><tr><td><code>remark</code></td><td>string</td><td>否</td><td>去首尾空格，≤ 120 字符（<code>varchar(120) NOT NULL</code>）。新增时不传 → 存为 <code>''</code>。修改状态时：传了则覆盖，不传则保留原 remark。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>获取任务包的 <code>program_id</code> 和积分计划的 <code>client_group</code>。</li>
<li>开启事务：<code>SELECT id, enabled FROM client_promotion_blacklist WHERE client_id = ? AND promo_table = 'point_program' AND promo_config_id = ? AND point_task_bundle_id = ? FOR UPDATE</code>。</li>
<li><b>已有记录</b> → UPDATE <code>enabled</code>、<code>remark</code>、<code>update_user</code>、<code>update_date</code>。不校验客户组（允许将已更换客户组的客户加入白名单）。</li>
<li><b>尚无记录</b>：<ul class="rules"><li><code>enabled = 0</code> → 报错（无可加入白名单的对象）。</li>
  <li>校验客户：<code>crm_customer_base</code> 存在 <code>client_id</code>、<code>deleted = 0</code>、<code>group_code</code> = 积分计划的客户组。</li>
  <li>INSERT 新记录：<code>promotion_code = ''</code>（NOT NULL 列，不能写 NULL），<code>remark</code> = 传入值或 <code>''</code>，同时写入 <code>update_user</code> / <code>update_date</code> = 创建人 / 创建时间。</li>
  <li>若 INSERT 触发 <code>uk_client_promo_bundle</code>（2 个管理员同时新增）→ 捕获 DuplicateKey，重新读取刚生成的记录，按“已有记录”分支执行 UPDATE。</li></ul></li>
<li>在客户下一次调用 API 时立即生效（引擎不缓存黑名单）。</li></ol>
<p>所有时间列都用 <code>UTC_TIMESTAMP()</code> 写入，不依赖表的 <code>DEFAULT CURRENT_TIMESTAMP</code>（默认值取决于 MySQL 服务器时区）。</p><pre>SELECT client_id FROM crm_customer_base
WHERE client_id = #{clientId} AND deleted = 0
  AND group_code = #{programClientGroup};

INSERT INTO client_promotion_blacklist
  (client_id, promotion_code, promo_table, promo_config_id, point_task_bundle_id, enabled, remark,
   create_date, create_user, update_date, update_user)
VALUES (#{clientId}, '', 'point_program', #{programId}, #{bundleId}, 1, IFNULL(#{remark}, ''),
        UTC_TIMESTAMP(), #{currentUser}, UTC_TIMESTAMP(), #{currentUser});

UPDATE client_promotion_blacklist
SET enabled = #{enabled}, remark = IFNULL(#{remark}, remark), update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE id = #{id};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": { "id": 801, "enabled": 1 } }</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Bundle does not exist.</code></td><td></td></tr><tr><td><code>Client ID does not exist.</code></td><td></td></tr><tr><td><code>Client {clientId} does not belong to client group {group} of this program.</code></td><td>2.6</td></tr><tr><td><code>Client {clientId} is not on this bundle's blacklist.</code></td><td>无记录时加入白名单</td></tr><tr><td><code>Remark must be at most 120 characters.</code></td><td></td></tr><tr><td><code>Enabled must be 0 or 1.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. 注意</h4><p>该 INSERT 语句已与真实 DDL 一致（UAT 上的真实 DDL）。唯一键 <code>uk_client_promo_bundle</code> 防止任务包级记录重复，但仍需先 SELECT … FOR UPDATE，以返回正确的新增 / 修改状态分支。</p></div></div><div class="specsrc" id="spec-c1" data-title="C1 · /point/admin/checkinTask/save"><p class="specmeta"><code>POST</code> · <code>/point/admin/checkinTask/save</code></p><p>创建（无 id）或修改（有 id）签到任务（M4 的 Config 标签页）。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>修改时</td><td>任务必须存在。</td></tr><tr><td><code>taskBundleId</code></td><td>long</td><td>创建时</td><td>任务包必须存在。修改时：必须等于当前存储值（I3）。</td></tr><tr><td><code>…</code></td><td></td><td></td><td>字段、类型和规则齐全，见<a href="#rules" class="ref">规则标签页</a>。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>获取任务包 → <code>program_id</code>。若前端传了 <code>programId</code>，则必须一致（V01）。</li>
<li>标准化：字符串去首尾空格；覆盖硬锁定字段：<code>point_multiplier_enabled = 0</code>、<code>point_to_cash_convert_type = 'by_task_fixed_value'</code>、<code>checkin_auto = 0</code>；以及规则标签页中的“自动保存”字段（例如 <code>no_limit</code> → <code>point_expiration_window = 7300</code>）。</li>
<li>执行 V01–V14（规则标签页）。收集<b>所有</b>字段错误，在 <code>message</code> 返回第一个错误，在 <code>result.errors</code> 返回全部错误，供前端逐个标红。</li>
<li>修改：若任务已有客户参与（<code>EXISTS log WHERE task_id = ?</code>）→ 按运行中锁定标签页的锁定表，逐字段与当前存储版本比较（V16）。</li>
<li>开启事务，锁定积分计划（<code>SELECT … FOR UPDATE</code>）。修改处于 <code>enabled = 1</code> 状态的任务 → 用新配置执行 V15（I2）。</li>
<li>新建：INSERT 时 <b><code>enabled = 0</code></b>。管理员复核后通过 C2 启用（C2 校验 I2）。修改：UPDATE，不修改 <code>enabled</code>、<code>program_id</code>、<code>task_bundle_id</code>。</li></ol><pre>-- has participants? (needs index idx_task_date, see DEV-06)
SELECT EXISTS (SELECT 1 FROM point_task_daily_checkin_log WHERE task_id = #{id}) AS has_participants;

INSERT INTO point_task_daily_checkin
  (program_id, task_bundle_id, task_name, task_description, display_hide_book_type, enabled, tz_minutes,
   display_event, display_period_limit_apply, display_period_from, display_period_to, display_hide_to_all,
   participate_event, participate_period_limit_type, participate_period_from, participate_period_to,
   first_day_definition, routine_cycle_limit_days, routine_cycle_repeat, restart_missed_checkin_enabled,
   point_multiplier_enabled, point_distribute_specify_each_day, point_to_cash_convert_type,
   fixed_cash_value_per_point_unit, exp_distribute_specify_each_day, checkin_auto, claim_type,
   claim_require_day_per_cycle, claim_valid_period_type, claim_valid_complete_window,
   point_expiration_type, point_expiration_window, create_date, create_user)
VALUES (#{programId}, #{taskBundleId}, #{taskName}, #{taskDescription}, #{displayHideBookType}, 0, #{tzMinutes},
        #{displayEvent}, #{displayPeriodLimitApply}, #{displayPeriodFrom}, #{displayPeriodTo}, #{displayHideToAll},
        #{participateEvent}, #{participatePeriodLimitType}, #{participatePeriodFrom}, #{participatePeriodTo},
        #{firstDayDefinition}, #{routineCycleLimitDays}, #{routineCycleRepeat}, #{restartMissedCheckinEnabled},
        0, #{pointDistributeSpecifyEachDay}, 'by_task_fixed_value',
        #{fixedCashValuePerPointUnit}, #{expDistributeSpecifyEachDay}, 0, #{claimType},
        #{claimRequireDayPerCycle}, #{claimValidPeriodType}, #{claimValidCompleteWindow},
        #{pointExpirationType}, #{pointExpirationWindow}, UTC_TIMESTAMP(), #{currentUser});</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": { "id": 3102, "enabled": 0 } }

// validation failure

    { "field": "pointExpirationWindow", "message": "Point expiration window must be between 1 and 7300 days." } ] } }</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>(see message tables in the Rules and Locks tabs)</code></td><td></td></tr></table></div><div class="specsec"><h4>5. 注意</h4><p><code>result.errors</code> 是对约定 1.6 的补充（仍保留 <code>message</code> = 第一个错误）。若 Smart CRM 不需要可去掉，前端只显示 <code>message</code>。</p></div></div><div class="specsrc" id="spec-c4" data-title="C4 · /point/admin/checkinTask/get"><p class="specmeta"><code>GET</code> · <code>/point/admin/checkinTask/get</code></p><p>1 个签到任务的详情，用于打开 View/Edit 弹窗。相对列表为<b>新增</b>：B1 只返回摘要。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>是</td><td>任务必须存在。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>SELECT 任务的全部字段（datetime 以 UTC 返回）。</li>
<li>计算 <code>participantCount</code>（日志中不同客户数）、<code>hasParticipants</code>、<code>lockedFields</code>（运行中锁定标签页），供前端锁定输入框。</li>
<li><code>pendingClaimClientCount</code>：仅当 <code>claim_type = 'claim_each_cycle'</code> 时返回 —— 仍有未领取且未过期部分的客户数。前端在停用任务/任务包/积分计划的确认弹窗中显示该数字（4.2）。</li></ol><pre>SELECT COUNT(DISTINCT client_id) AS participant_count
FROM point_task_daily_checkin_log WHERE task_id = #{id};

SELECT COUNT(DISTINCT client_id) AS pending_claim_client_count
FROM point_task_daily_checkin_log
WHERE task_id = #{id} AND claim_type = 'claim_each_cycle'
  AND claim_status = 0 AND UTC_TIMESTAMP() &lt; claim_expiration_time;</pre></div><div class="specsec"><h4>3. Response</h4><pre>{

    "firstDayDefinition": 0, "routineCycleLimitDays": 7, "routineCycleRepeat": 9999, "restartMissedCheckinEnabled": 1,

<li>启用时：对当前存储版本重新执行 V01–V14（防止手工录入的历史错误数据），若任务包已启用再执行 V15（I2）。出错 → 不启用。</li>
<li>停用时：不拦截。</li>
<li>UPDATE <code>enabled</code>, <code>update_user</code>, <code>update_date</code>.</li></ol>
<p>通过 C1 新建的任务始终为停用状态，因此 C2 是任务上线到 app 的唯一入口。</p><pre>UPDATE point_task_daily_checkin
SET enabled = #{enabled}, update_user = #{currentUser}, update_date = UTC_TIMESTAMP()
WHERE id = #{id};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": null }</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Check-in task does not exist.</code></td><td></td></tr><tr><td><code>Cannot enable: check-in task {otherId} ({otherName}) is already live for an overlapping display period. Clients can only see one check-in task at a time.</code></td><td>I2</td></tr><tr><td><code>Cannot enable: {first validation error}</code></td><td>V01–V14</td></tr></table></div></div><div class="specsrc" id="spec-c3" data-title="C3 · /point/admin/checkinTask/log/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/checkinTask/log/list</code></p><p>1 个任务的签到日志（M4 的 Check-in Log 标签页）。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>taskId</code></td><td>long</td><td>是</td><td>任务必须存在。</td></tr><tr><td><code>clientId</code></td><td>long</td><td>否</td><td>精确匹配。</td></tr><tr><td><code>checkinDate_begin</code></td><td>string</td><td>否</td><td><code>yyyy-MM-dd</code>。日期按任务的本地时间（该列已按 <code>tz_minutes</code> 预存），不是 UTC。</td></tr><tr><td><code>checkinDate_end</code></td><td>string</td><td>否</td><td><code>yyyy-MM-dd</code>，包含当天。</td></tr><tr><td><code>cycle</code></td><td>int</td><td>否</td><td>≥ 1.</td></tr><tr><td><code>taskStatus</code></td><td>int</td><td>否</td><td><code>1</code> completed, <code>0</code> pending.</td></tr><tr><td><code>claimStatus</code></td><td>string</td><td>否</td><td><code>to_claim</code> / <code>claimed</code> / <code>expired</code>（计算方式与引擎相同，见 SQL）。</td></tr><tr><td><code>pageNo</code></td><td>int</td><td>否</td><td>默认 1。</td></tr><tr><td><code>pageSize</code></td><td>int</td><td>否</td><td>默认 10，最大 100。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>校验，执行查询，按 <code>id DESC</code> 排序。</li>
<li>返回的 <code>claimStatus</code> 是计算后的值；同时附带 <code>claimStatusRaw</code>（DB 中为 0/1）。</li></ol><pre>SELECT l.id, l.client_id, l.checkin_date, l.cycle, l.day_in_cycle, l.task_status, l.claim_type,
       CASE WHEN l.claim_status = 1 THEN 'claimed'
            WHEN UTC_TIMESTAMP() &lt; l.claim_expiration_time THEN 'to_claim'
            ELSE 'expired' END AS claim_status,
       l.claim_status AS claim_status_raw, l.claim_time, l.claim_expiration_time,
       l.point_earned, l.exp_earned, l.cash_value_per_point_unit, l.point_expiration_time,
       l.client_group, l.create_date
FROM point_task_daily_checkin_log l
WHERE l.task_id = #{taskId}
  AND (#{clientId} IS NULL OR l.client_id = #{clientId})
  AND (#{checkinDateBegin} IS NULL OR l.checkin_date &gt;= #{checkinDateBegin})
  AND (#{checkinDateEnd} IS NULL OR l.checkin_date &lt;= #{checkinDateEnd})
  AND (#{cycle} IS NULL OR l.cycle = #{cycle})
  AND (#{taskStatus} IS NULL OR l.task_status = #{taskStatus})
HAVING (#{claimStatus} IS NULL OR claim_status = #{claimStatus})
ORDER BY l.id DESC
LIMIT #{offset}, #{pageSize};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{

  }
}</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Check-in task does not exist.</code></td><td></td></tr><tr><td><code>Check-in date must be in yyyy-MM-dd format.</code></td><td></td></tr><tr><td><code>Claim status must be to_claim, claimed or expired.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. 注意</h4><p>引擎只写 <code>task_status = 1</code>（手动签到）；<code>0</code> 预留给未来。计算列上的 <code>HAVING</code>：developer 可改写为等价的 WHERE 条件以使用索引。</p></div></div><div class="specsrc" id="spec-t1" data-title="T1 · /point/admin/trading/save"><p class="specmeta"><code>POST</code> · <code>/point/admin/trading/save</code></p><p>一次保存中创建或修改 1 个交易任务及其全部兑换比例行（M4 的 Config 标签页）。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>否</td><td>不传 = 新建。传 = 修改；任务必须存在。</td></tr><tr><td><code>programId</code></td><td>long</td><td>是</td><td>积分计划必须存在。修改：必须等于当前存储值（J1）。</td></tr><tr><td><code>taskBundleId</code></td><td>long</td><td>是</td><td>任务包必须存在且 <code>bundle.program_id = programId</code>。修改：必须等于当前存储值（J1）。</td></tr><tr><td><code>taskName</code></td><td>string</td><td>是</td><td>去首尾空格，1–128 字符（varchar(128) NOT NULL）。</td></tr><tr><td><code>taskDescription</code></td><td>string</td><td>否</td><td>去首尾空格，≤ 512 字符。为空 → NULL。</td></tr><tr><td><code>…other fields</code></td><td></td><td></td><td>完整表格见<a href="#rules" class="ref">规则标签页</a>。</td></tr><tr><td><code>conversions[]</code></td><td>array</td><td>是</td><td>任务的全部兑换比例行（全量传，不只传变更部分）。每个元素：<code>id</code>（已有行，不传 = 新行）、<code>mt5Group</code>、<code>conditionType</code>、<code>conditionValue</code>、<code>pointPerLot</code>。校验见规则标签页。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds">
<li>校验各字段及字段间规则（规则标签页）。错误返回 <code>result.errors = [{field, message}]</code>，兑换比例行的字段格式为 <code>conversions[2].pointPerLot</code>。</li>
<li>开启事务。锁定积分计划：<code>SELECT id FROM point_program WHERE id = ? FOR UPDATE</code>。修改：额外锁定任务（<code>SELECT … FROM point_task_trading WHERE id = ? FOR UPDATE</code>）。</li>
<li>修改：按 T3 计算 <code>hasData</code>；<code>lockedFields</code> 中的字段若与当前存储值不同 → 报错（运行中锁定标签页）。</li>
<li>新建：INSERT 时 <code>enabled = 0</code>（约定 1.6）。修改：UPDATE 除 <code>enabled</code>、<code>program_id</code>、<code>task_bundle_id</code> 以外的所有字段；显式写入 <code>update_date = UTC_TIMESTAMP()</code>（该列 <code>ON UPDATE CURRENT_TIMESTAMP</code> 按 MySQL 服务器时间）。</li>
<li>兑换比例行（表中没有 <code>update_*</code> 列，也没有唯一键）：<ul class="rules">
  <li>有 <code>id</code> 且 4 个值相同的行 → 保持不变。</li>
  <li>有 <code>id</code> 但值不同的行 → 对旧行 <code>deleted = 1</code>，INSERT 新行（保留历史，可知创建人）。</li>
  <li>DB 中存在但请求中没有的行 → <code>deleted = 1</code>。</li>
  <li>没有 <code>id</code> 的行 → INSERT，<code>create_user</code> = 当前登录用户。</li>
  </ul></li>
<li>若任务已启用（<code>enabled = 1</code>）且参与时间窗 / book type / 任务包有变更：按 T2 重新执行 J2 校验；存在重叠任务且未传 <code>confirmDuplicate = true</code> → 报错并附带列表（前端再次向用户确认）。</li>
<li>COMMIT。引擎在下一次运行时读取新配置（计算 Coin 每 3 分钟，发放 Coin 每 10 分钟）。</li></ol><pre>INSERT INTO point_task_trading
  (program_id, task_bundle_id, task_name, task_description, display_hide_book_type, enabled, tz_minutes,
   display_event, display_period_limit_apply, display_period_from, display_period_to, display_hide_to_all,
   participate_period_limit_type, participate_period_from, participate_period_to, min_position_hold_second,
   point_max_cap_enabled, point_max_cap_value, cash_value_per_point_unit, release_auto_delay_day,
   point_expiration_window, terms_url, create_date, create_user, update_date, update_user)
VALUES (#{programId}, #{taskBundleId}, #{taskName}, #{taskDescription}, #{displayHideBookType}, 0, #{tzMinutes},
        #{displayEvent}, #{displayPeriodLimitApply}, #{displayPeriodFrom}, #{displayPeriodTo}, #{displayHideToAll},
        #{participatePeriodLimitType}, #{participatePeriodFrom}, #{participatePeriodTo}, #{minPositionHoldSecond},
        #{pointMaxCapEnabled}, #{pointMaxCapValue}, #{cashValuePerPointUnit}, #{releaseAutoDelayDay},
        #{pointExpirationWindow}, #{termsUrl}, UTC_TIMESTAMP(), #{currentUser}, UTC_TIMESTAMP(), #{currentUser});

-- conversion rows: soft delete what is gone or changed, insert what is new or changed
UPDATE point_task_trading_point_conversion SET deleted = 1
WHERE task_id = #{taskId} AND deleted = 0 AND id NOT IN (#{keptIds});

INSERT INTO point_task_trading_point_conversion
  (deleted, task_id, mt5_group, condition_type, condition_value, point_per_lot, create_date, create_user)
VALUES (0, #{taskId}, #{mt5Group}, #{conditionType}, #{conditionValue}, #{pointPerLot}, UTC_TIMESTAMP(), #{currentUser});</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": { "id": 3201, "enabled": 0 } }

// validation error
{ "success": false, "code": 500, "message": "Please fix the highlighted fields.",
  "result": { "errors": [
    { "field": "participatePeriodTo", "message": "Participate end must be after participate start." },
    { "field": "conversions[3].conditionValue", "message": "Duplicate rate row: Direct\\Mini400 / symbol_group / metal." }
  ] } }

// another live trading task in the program (J2)
{ "success": false, "code": 500, "message": "Program already has a live trading task: 3188 (HSB Coin Trading old). Send confirmDuplicate to continue.",
  "result": { "duplicateTaskIds": [3188] } }</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Please fix the highlighted fields.</code></td><td>附带 result.errors</td></tr><tr><td><code>Task does not exist.</code></td><td></td></tr><tr><td><code>Program does not exist.</code></td><td></td></tr><tr><td><code>Task bundle does not exist.</code></td><td></td></tr><tr><td><code>Task bundle does not belong to this program.</code></td><td>J1</td></tr><tr><td><code>Program and task bundle cannot be changed.</code></td><td>J1</td></tr><tr><td><code>Field {field} cannot be changed after clients have traded in this task.</code></td><td>运行中锁定标签页</td></tr><tr><td><code>Program already has a live trading task: {ids}. Send confirmDuplicate to continue.</code></td><td>J2，仅在任务已启用时</td></tr></table></div><div class="specsec"><h4>5. 注意</h4><p>各字段的提示信息见规则标签页。没有删除任务的 API；兑换比例行只能通过 T1 软删除。</p></div></div><div class="specsrc" id="spec-t2" data-title="T2 · /point/admin/trading/enable"><p class="specmeta"><code>POST</code> · <code>/point/admin/trading/enable</code></p><p>启用 / 停用 1 个交易任务（任务卡片上的开关，经 EnableConfirmModal）。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>是</td><td>任务必须存在。</td></tr><tr><td><code>enabled</code></td><td>int</td><td>是</td><td>0 / 1.</td></tr><tr><td><code>confirmDuplicate</code></td><td>bool</td><td>否</td><td>仅在启用时使用：<code>true</code> = 用户已看过 J2 警告但仍要启用。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds">
<li>事务，按 T1 方式锁定积分计划。</li>
<li><b>启用</b>：对当前存储数据（任务 + 未删除的兑换比例行）重新执行 T1 的全部校验，外加 J6（至少 1 条 <code>point_per_lot &gt; 0</code> 行）。不通过 → 报错并附带 <code>result.errors</code>（前端显示 EnableErrorModal）。</li>
<li><b>启用</b>：用下方查询校验 J2。存在其他生效中的任务且 <code>confirmDuplicate</code> 不是 <code>true</code> → 报错并附带 <code>duplicateTaskIds</code>。</li>
<li><b>停用</b>：不拦截。同时返回 <code>pendingDealCount</code> / <code>pendingPoint</code>（已计算、未发放的订单），供前端在确认弹窗中显示。</li>
<li>UPDATE <code>enabled</code>, <code>update_user</code>, <code>update_date = UTC_TIMESTAMP()</code>.</li></ol>
<p><b>停用任务的影响</b>（据代码）：从下一次运行起，Coin 计算引擎不再为该任务生成新订单；app 不再显示该任务（客户会看到其他任务（如有），或 <code>tradingTask = false</code>）。Coin 发放引擎<b>不会</b>校验任务是否仍启用：已计算的订单仍按时发放，已入账的 Coin 保持不变且可使用。</p><pre>-- J2: other live trading tasks in the same program (participate window overlaps now or the future)
SELECT d.id, d.task_name
FROM point_task_trading d
JOIN point_task_bundle b ON b.id = d.task_bundle_id
WHERE d.program_id = #{programId}
  AND d.id &lt;&gt; #{id}
  AND d.enabled = 1 AND b.enabled = 1
  AND ( d.participate_period_limit_type = 'no_limit'
        OR d.participate_period_to &gt; UTC_TIMESTAMP() );

-- pending coins of the task (shown when disabling)
SELECT COUNT(*) AS pending_deal_count, COALESCE(SUM(point), 0) AS pending_point
FROM point_task_trading_deal_log
WHERE task_id = #{id} AND release_status = 0;   -- needs index (task_id, ...), DEV-06</pre></div><div class="specsec"><h4>3. Response</h4><pre>{ "success": true, "code": 200, "message": "", "result": { "enabled": 0, "pendingDealCount": 3, "pendingPoint": 210 } }</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Task does not exist.</code></td><td></td></tr><tr><td><code>Enabled must be 0 or 1.</code></td><td></td></tr><tr><td><code>Task cannot be enabled: please fix the highlighted fields.</code></td><td>附带 result.errors</td></tr><tr><td><code>Task needs at least one rate row with coins per lot above 0.</code></td><td>J6</td></tr><tr><td><code>Program already has a live trading task: {ids}. Send confirmDuplicate to continue.</code></td><td>J2</td></tr></table></div><div class="specsec"><h4>5. 注意</h4><p>B3（启用任务包，Check-in 组的 API）对该任务包内所有已启用的交易任务执行相同的 J2 校验，机制同样为 <code>confirmDuplicate</code>。启用积分计划（P4）和客户组（P5）无需校验 J2，因为 J2 只在 1 个积分计划内计算。</p></div></div><div class="specsrc" id="spec-t3" data-title="T3 · /point/admin/trading/get"><p class="specmeta"><code>GET</code> · <code>/point/admin/trading/get</code></p><p>1 个交易任务的详情，附带未删除的兑换比例行和 <code>lockedFields</code>（以 View/Edit 模式打开 M4）。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>id</code></td><td>long</td><td>是</td><td>任务必须存在。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds">
<li>读取任务及兑换比例行 <code>deleted = 0</code>（按 <code>mt5_group</code> 排序，优先级 symbol → symbol_group → any，<code>condition_value</code>）。</li>
<li><code>hasData</code> = 任务至少有 1 条 <code>point_task_trading_deal_log</code> 行。</li>
<li><code>lockedFields</code>：始终包含 <code>programId</code>、<code>taskBundleId</code>；当 <code>hasData</code> 时额外包含 <code>tzMinutes</code>、<code>releaseAutoDelayDay</code>（运行中锁定标签页）。</li>
<li><code>warnings</code>：字符串数组，前端以黄色显示，不阻止保存：MT5 组没有 <code>any</code> 行；<code>point_per_lot = 0</code> 行；任务已启用且 J2 发现重叠任务。</li>
<li>附带 <code>pendingDealCount</code>、<code>pendingPoint</code>，同 T2。</li></ol><pre>SELECT EXISTS (SELECT 1 FROM point_task_trading_deal_log WHERE task_id = #{id}) AS has_data;

SELECT id, mt5_group, condition_type, condition_value, point_per_lot, create_date, create_user
FROM point_task_trading_point_conversion
WHERE task_id = #{id} AND deleted = 0
ORDER BY mt5_group, FIELD(condition_type, 'symbol', 'symbol_group', 'any'), condition_value;</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": {
    "id": 3201, "programId": 1201, "taskBundleId": 2201,
    "taskName": "HSB Coin Trading", "taskDescription": "HSB Coin Trading",
    "enabled": 1, "displayHideBookType": 0, "tzMinutes": 420,
    "displayEvent": "signup", "displayPeriodLimitApply": 0, "displayPeriodFrom": null, "displayPeriodTo": null,
    "displayHideToAll": 0,
    "participatePeriodLimitType": "no_limit", "participatePeriodFrom": null, "participatePeriodTo": null,
    "minPositionHoldSecond": 180, "pointMaxCapEnabled": 1, "pointMaxCapValue": 2000,
    "cashValuePerPointUnit": 0.0000, "releaseAutoDelayDay": 0, "pointExpirationWindow": 180,
    "termsUrl": "https://.../terms.pdf",
    "createUser": "qa_fe", "createDate": "2026-10-14 09:40:11", "updateUser": "admin01", "updateDate": "2026-10-20 03:12:00",
    "conversions": [
      { "id": 101, "mt5Group": "Direct\\Mini400", "conditionType": "symbol_group", "conditionValue": "energy", "pointPerLot": 70.0000 },

    ],

}</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Task does not exist.</code></td><td></td></tr></table></div></div><div class="specsrc" id="spec-t4" data-title="T4 · /point/admin/trading/dealLog/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/trading/dealLog/list</code></p><p>1 个任务的逐笔订单明细（M4 的 Deal Log 标签页）。只读。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>taskId</code></td><td>long</td><td>是</td><td>任务必须存在。</td></tr><tr><td><code>clientId</code></td><td>long</td><td>否</td><td>精确匹配。</td></tr><tr><td><code>loginId</code></td><td>long</td><td>否</td><td>精确匹配。</td></tr><tr><td><code>periodKey_begin, periodKey_end</code></td><td>yyyy-MM-dd</td><td>否</td><td>交易日期按任务时区，含首尾两端。不传 = 按任务时区最近 30 天。最大跨度 93 天。</td></tr><tr><td><code>releaseStatus</code></td><td>int</td><td>否</td><td><code>0</code> 待发放，<code>1</code> 全额发放，<code>2</code> 部分发放，<code>-1</code> 拒绝，<code>-2</code> 超出上限。</td></tr><tr><td><code>symbol</code></td><td>string</td><td>否</td><td>不带后缀的品种代码，精确匹配（例如 <code>XAUUSD</code>）。</td></tr><tr><td><code>pageNo, pageSize</code></td><td>int</td><td>否</td><td>1 / 10，最大 100。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>校验，应用默认日期范围。</li><li>见下方查询；<code>total</code> 用相同条件计数。</li>
<li>额外返回 <code>reason_code</code> 的英文 <code>reasonText</code>（表格见注意事项）。</li></ol><pre>SELECT l.id, l.client_id, l.login_id, l.mt5_group, l.deal_id, l.symbol_full, l.symbol, l.symbol_group,
       l.lot, l.lot_valid, l.position_open_time_utc, l.deal_time_utc, l.period_key,
       l.position_hold_second, l.min_position_hold_second, l.position_hold_qualified, l.is_blacklisted,
       l.point_per_lot, l.point, l.release_point, l.un_release_point, l.release_status, l.reason_code,
       l.release_schedule_time, l.release_actual_time, l.release_fail_times, l.create_date
FROM point_task_trading_deal_log l
WHERE l.task_id = #{taskId}
  AND (#{clientId} IS NULL OR l.client_id = #{clientId})
  AND (#{loginId} IS NULL OR l.login_id = #{loginId})
  AND (#{periodKey_begin} IS NULL OR l.period_key &gt;= #{periodKey_begin})
  AND (#{periodKey_end} IS NULL OR l.period_key &lt;= #{periodKey_end})
  AND (#{releaseStatus} IS NULL OR l.release_status = #{releaseStatus})
  AND (#{symbol} IS NULL OR l.symbol = #{symbol})
ORDER BY l.deal_id DESC
LIMIT #{offset}, #{pageSize};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
  "success": true, "code": 200, "message": "",
  "result": { "total": 1, "records": [{
    "id": 262301, "clientId": 72000101, "loginId": 31000101, "mt5Group": "Direct\\Mini400",
    "dealId": 5000280112, "symbolFull": "XAUUSD.VIP", "symbol": "XAUUSD", "symbolGroup": "metal",
    "lot": 0.500000, "lotValid": 0.500000, "positionOpenTimeUtc": "2026-10-20 02:01:10", "dealTimeUtc": "2026-10-20 02:09:44",
    "periodKey": "2026-10-20", "positionHoldSecond": 514, "minPositionHoldSecond": 180, "positionHoldQualified": 1,
    "isBlacklisted": 0, "pointPerLot": 70.0000, "point": 35, "releasePoint": 35, "unReleasePoint": 0,
    "releaseStatus": 1, "reasonCode": "", "reasonText": "",

    "createDate": "2026-10-20 02:12:00" }] }
}</pre></div><div class="specsec"><h4>4. 错误 message</h4><table><tr><th>message</th><th style="width:22%">备注</th></tr><tr><td><code>Task does not exist.</code></td><td></td></tr><tr><td><code>Release status is not valid.</code></td><td></td></tr><tr><td><code>Date range must be at most 93 days.</code></td><td></td></tr></table></div><div class="specsec"><h4>5. 注意</h4><p>代码中存在的 <code>reason_code</code>：<code>CLIENT_BLACKLISTED</code>（客户在黑名单中）、<code>TASK_NOT_ACTIVE</code>（订单在参与时间窗外开仓或平仓）、<code>HOLD_TIME_NOT_MET</code>（持仓时间不足）、<code>NO_RATE_CONFIG</code>（无匹配的兑换比例行）、<code>ISSUE_FAILED</code>（发放失败超过 3 次）。为空 = 有效。</p>
<p>该表没有以 <code>task_id</code> 开头的索引（UAT 已约 262,000 行）：需要新增，见 DEV-06。</p></div></div><div class="specsrc" id="spec-t5" data-title="T5 · /point/admin/trading/dailyLog/list"><p class="specmeta"><code>GET</code> · <code>/point/admin/trading/dailyLog/list</code></p><p>1 个任务按客户 / 日期汇总（M4 的 Daily Log 标签页）。只读。</p><div class="specsec"><h4>1. Request</h4><div class="scroll"><table><tr><th style="width:22%">Field</th><th style="width:12%">类型</th><th style="width:12%">必填</th><th>Validation</th></tr><tr><td><code>taskId</code></td><td>long</td><td>是</td><td>任务必须存在。</td></tr><tr><td><code>clientId</code></td><td>long</td><td>否</td><td>精确匹配。</td></tr><tr><td><code>periodKey_begin, periodKey_end</code></td><td>yyyy-MM-dd</td><td>否</td><td>同 T4。</td></tr><tr><td><code>pageNo, pageSize</code></td><td>int</td><td>否</td><td>1 / 10，最大 100。</td></tr></table></div></div><div class="specsec"><h4>2. 处理</h4><ol class="conds"><li>见下方查询，按日期倒序。</li>
<li>额外返回按 app 相同方式计算的 <code>status</code>：<code>pending</code>（预定发放时间仍在未来）/ <code>earning</code>（仍有待发放 Coin 且未触及上限）/ <code>credited</code>，以及 <code>capped</code> = 上限已启用且 <code>point_earned &gt;= point_max_cap_value</code>。</li></ol><pre>SELECT id, client_id, period_key, tz_minutes, lot_total, lot_valid, point_total, point_pending, point_earned,
       points_limit_lost, points_fail_lost, total_txn_count, full_release_count, partial_release_count,

<li>获取积分计划的客户组列表；下方查询附带属于积分计划的条件（范围 SQL 见概览标签页）。</li>
<li>额外返回 <code>sourceName</code>（<code>trading</code> / <code>daily_checkin</code> / <code>adjust</code> / <code>redeem</code>，与 app 一样由批次的 <code>task_log_table</code> 推导）和 <code>typeName</code>。</li></ol><pre>SELECT g.id, g.client_id, g.lot_id, g.source_type, g.type, g.point_amount,
       g.point_balance_before, g.point_balance_after, g.redemption_id, g.external_system, g.external_id,
       g.create_date, g.create_user,
       l.task_log_table, l.point_expiration_time AS lot_expiration_time
FROM point_ledger g
LEFT JOIN point_lot l ON l.id = g.lot_id
WHERE g.create_date &gt;= #{createDate_begin} AND g.create_date &lt; #{createDate_end}
  AND (#{clientId} IS NULL OR g.client_id = #{clientId})
  AND (#{sourceType} IS NULL OR g.source_type = #{sourceType})
  AND (#{type} IS NULL OR g.type = #{type})
  AND g.client_id IN (/* SCOPE_SQL of program */)
ORDER BY g.create_date DESC, g.id DESC
LIMIT #{offset}, #{pageSize};</pre></div><div class="specsec"><h4>3. Response</h4><pre>{
