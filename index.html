<h2>运行中锁定</h2>
<p>任务 / 礼品已有客户参与后哪些字段可以修改。详情 API（C4、T3）直接返回 <code>lockedFields</code> 供前端锁定输入框；保存 API 在服务端再次校验。</p>

<h3>已有客户参与时的修改</h3>
<p>“已有客户” = 任务在 <code>point_task_daily_checkin_log</code> 中至少有 1 行。在此之前所有字段都可修改（任务包除外）。C4 直接返回 <code>lockedFields</code> 给前端；C1 在服务端再次校验（V16）。</p>
<h4>Check-in task</h4>
<div class="scroll"><table><tr><th style="width:34%">Field</th><th style="width:15%">状态</th><th>原因</th></tr><tr><td><code>taskName, taskDescription</code></td><td>可修改</td><td>仅用于展示。</td></tr><tr><td><code>displayHideBookType, displayEvent, displayPeriodLimitApply/From/To, displayHideToAll</code></td><td>可修改</td><td>只改变谁能看到卡片。任务已启用时重新校验 I2（V15）。</td></tr><tr><td><code>participatePeriodLimitType/From/To</code></td><td>可修改</td><td>改变可签到的时间；不会导致日志出错。把 <code>to</code> 设为过去时间即立即结束活动。Streak：按新时间窗重新校验 V13。</td></tr><tr><td><code>participateEvent</code></td><td>Streak：可修改 · 日历：锁定</td><td>日历类型以事件时间作为周期起点；修改事件 → 所有客户的 cycle/day 被重新计算，历史格子和待领取周期错位。</td></tr><tr><td><code>tzMinutes</code></td><td>锁定</td><td>改变日界线：新的签到日可能与旧日重叠（提示已签到）或跳过 2 天（断签）；积分有效期错位。</td></tr><tr><td><code>firstDayDefinition</code></td><td>锁定</td><td>日历类型的周期起点。Streak 不使用，无需修改。</td></tr><tr><td><code>routineCycleLimitDays</code></td><td>锁定</td><td>日历：所有客户的 cycle/day 从头重算。Streak：进行中的连签可能超过新长度。JSON 结构也须随之修改。</td></tr><tr><td><code>routineCycleRepeat</code></td><td>只能增加</td><td>减少 → 已超过新上限的客户立即被拦截（<code>OUT_OF_CYCLE</code> / <code>completed</code>）。日历：增加时须在 JSON 中补充 cycle（V06）。</td></tr><tr><td><code>restartMissedCheckinEnabled</code></td><td>锁定</td><td>会改变整个周期计算方式。</td></tr><tr><td><code>pointDistributeSpecifyEachDay, expDistributeSpecifyEachDay</code></td><td>可修改值</td><td>只对之后的签到生效；旧日志保留已记录的积分。结构仍须符合 V05–V07。</td></tr><tr><td><code>fixedCashValuePerPointUnit</code></td><td>可修改</td><td>该值会快照到每条日志和批次中。</td></tr><tr><td><code>claimType</code></td><td>锁定</td><td>app 按当前值渲染领取状态：从按周期改为按天会导致未领取部分卡住，没有领取按钮。</td></tr><tr><td><code>claimRequireDayPerCycle</code></td><td>锁定</td><td>引擎对已关闭的周期也读取当前值 → 修改即追溯改变领取规则。</td></tr><tr><td><code>claimValidPeriodType, claimValidCompleteWindow</code></td><td>可修改</td><td>领取期限在签到时计算并存入日志；只影响新日志。</td></tr><tr><td><code>pointExpirationType, pointExpirationWindow</code></td><td>可修改</td><td><code>claim_each_day</code>：只影响之后的签到。<code>claim_each_cycle</code>：在客户点击领取时生效，因此旧周期中未领取的部分也按新期限。</td></tr><tr><td><code>taskBundleId, programId</code></td><td>锁定（始终）</td><td>I3：历史和连签按任务包查找。</td></tr></table></div>
<h4>积分计划和任务包</h4>
<div class="scroll"><table><tr><th style="width:34%">Field</th><th style="width:15%">状态</th><th>原因</th></tr><tr><td><code>point_program.cash_currency</code></td><td>积分计划有 activity 后锁定</td><td>日志/批次中所有已快照的 <code>cash_value</code> 的单位。签到目前设为 0，风险低，但交易会使用金额：交易侧由 Trading 组确认。</td></tr><tr><td><code>point_program.display_hide_book_type</code></td><td>可修改</td><td>签到：仅为展示过滤。交易（Trading 组确认）：属于 Coin 计算规则，改为 1 / 2 后 A-book / B-book 客户在该积分计划所有交易任务中不再获得 Coin。</td></tr><tr><td><code>point_task_bundle.display_hide_book_type</code></td><td>可修改</td><td>同上，范围为任务包内的交易任务。</td></tr><tr><td><code>program_name, program_description, task_bundle_name, task_bundle_description</code></td><td>可修改</td><td>仅用于展示。</td></tr></table></div>
<p>要修改被锁定的字段：在同一任务包中新建任务（展示时间窗不要重叠，V15），再停用旧任务。旧任务的历史保留。</p>


<h3>运行中修改</h3>
<p>“有数据” = 任务已有至少 1 行 <code>point_task_trading_deal_log</code>（T3 中的 <code>hasData</code>）。在此之前除积分计划和任务包外所有字段都可修改。T3 直接返回 <code>lockedFields</code>；T1 在服务端再次校验（V06）。要修改被锁定的字段：新建任务，停用旧任务（旧任务历史保持不变）。</p>
<h4>Trading task</h4>
<div class="scroll"><table><tr><th style="width:30%">Field</th><th style="width:18%">状态</th><th>原因 / 影响</th></tr><tr><td><code>programId, taskBundleId</code></td><td>锁定（始终）</td><td>J1.</td></tr><tr><td><code>tzMinutes</code></td><td>有数据后锁定</td><td>改变日界线：新订单落入不同的 <code>period_key</code>，每日日志被拆分，每日上限从 0 重新计算。</td></tr><tr><td><code>releaseAutoDelayDay</code></td><td>有数据后锁定</td><td>J7：当天会出现 2 种发放方式；app 上该日的 pending / earning 状态出错。</td></tr><tr><td><code>taskName, taskDescription, termsUrl</code></td><td>可修改</td><td>仅用于展示。</td></tr><tr><td><code>displayEvent, displayPeriod*, displayHideToAll</code></td><td>可修改</td><td>只改变谁能看到任务。引擎不读取。</td></tr><tr><td><code>displayHideBookType</code></td><td>可修改（需确认）</td><td>同时改变谁能获得 Coin，从下一次引擎运行起生效（J8）。已计算的订单保持不变。</td></tr><tr><td><code>participatePeriod*</code></td><td>可修改</td><td>对保存后处理的订单生效。把 <code>to</code> 设为过去时间 = 立即结束活动（app 显示 <code>ended</code>）。</td></tr><tr><td><code>minPositionHoldSecond</code></td><td>可修改</td><td>对保存后处理的订单生效；旧订单保留原结果。</td></tr><tr><td><code>pointMaxCapEnabled, pointMaxCapValue</code></td><td>可修改</td><td>快照到每日日志：今天已交易的客户当天沿用旧上限，次日起才按新上限。</td></tr><tr><td><code>pointExpirationWindow</code></td><td>可修改</td><td>快照到每日日志：只有新一天的 Coin 按新有效期。</td></tr><tr><td><code>cashValuePerPointUnit</code></td><td>可修改</td><td>快照到每日日志和订单明细。</td></tr><tr><td><code>conversions[]</code></td><td>可修改（软删除 + 新增）</td><td>引擎每次运行都重新读取比例表：对保存后处理的订单生效；旧订单保留已快照的 <code>point_per_lot</code>。</td></tr><tr><td><code>enabled</code></td><td>仅通过 T2</td><td>约定 1.6。</td></tr></table></div>
<p>总原则：引擎把配置<b>快照</b>到每笔订单（比例、持仓时间），并在当天第一笔订单时快照到每日日志（上限、有效期、金额、发放方式）。修改配置绝不会改变已计算的订单或已入账的 Coin。</p>
<h4>积分计划和任务包（Smart CRM 问题 4.3）</h4>
<div class="scroll"><table><tr><th style="width:30%">Field</th><th style="width:18%">状态</th><th>原因</th></tr><tr><td><code>point_program.cash_currency</code></td><td>积分计划有 activity 后锁定</td><td>同意签到组的意见，且交易侧确实使用：<code>cash_value_per_point_unit</code> 会快照到订单明细、每日日志、批次和 Coin 流水；这些数值的单位是 <code>cash_currency</code>。更改币种会使所有已快照数值含义错误。</td></tr><tr><td><code>point_program.display_hide_book_type</code></td><td>可修改（需确认）</td><td>交易侧属于 Coin 计算规则（J8）：改为 1 或 2 后，A-book/B-book 客户从下一次运行起在该积分计划<b>所有</b>交易任务中不再获得 Coin，也不再看到活动。已计算的订单、已入账的 Coin 保持不变。可随时改回。</td></tr><tr><td><code>point_task_bundle.display_hide_book_type</code></td><td>可修改（需确认）</td><td>同上，范围为任务包内的任务。</td></tr></table></div>


<h3>已有人兑换的礼品的修改（回复 4.2）</h3>
<p><code>point_featured_gift</code> <b>没有被 order/transaction 外键引用</b>：每个订单都单独存了 <code>coin_amount</code>，因此修改礼品<b>不会追溯</b>旧订单。所以没有字段需要在 DB 层硬锁定；只有 2 个字段需要<b>警告</b>，因为涉及与 TADA 的价格同步。</p>
<div class="scroll"><table><tr><th style="width:38%">Field</th><th style="width:16%">状态</th><th>原因</th></tr><tr><td><code>giftName, giftShortName, giftDescription, badge, remark</code></td><td>可修改</td><td>仅展示；不影响旧订单或引擎。</td></tr><tr><td><code>giftImageUrl</code></td><td>可修改</td><td>仅用于邮件图片。应保持链接稳定（HSB 托管），避免旧邮件图片失效。</td></tr><tr><td><code>giftCategory</code></td><td>可修改</td><td>仅用于展示分组/筛选。</td></tr><tr><td><code>showOnDashboard, useInNotification, sortOrder, displayFrom, displayTo</code></td><td>可修改</td><td>只改变礼品何时/何处显示。不影响已兑换的订单。</td></tr><tr><td><code>cashValue</code></td><td>可修改（谨慎）</td><td>内部统计值；修改不影响旧订单（订单单独存储 Coin）。</td></tr><tr><td><code>pointPrice</code></td><td>可修改 + 警告</td><td>不追溯旧订单（每个订单在 <code>point_redemption_transaction</code> 中单独存了 <code>coin_amount</code>）。但必须与 TADA 价格一致（RI1）：只改这里不改 TADA → dashboard 与实际扣除价格不一致。弹出警告 + 要求重新与 TADA 对账。</td></tr><tr><td><code>externalItemId</code></td><td>可修改 + 警告</td><td>是与 TADA 价格对账的锚点。改错 → 映射到错误的 TADA 礼品。修改时给出通用警告（尤其是礼品已启用时）。</td></tr><tr><td><code>program_id</code></td><td>锁定（始终）</td><td>礼品只属于 1 个积分计划；更换积分计划即改变可见客户 + 统计。G2 永远不 UPDATE 此列。</td></tr><tr><td><code>enabled</code></td><td>仅通过 G3</td><td>从 G2 中拆出，以便每次启用都校验 <code>external_item_id</code>（RI1）。</td></tr></table></div>
<p>兑换订单来自 webview 中的 TADA 商品目录，<b>不</b>经过 featured list，因此无法判断“该礼品是否已有人兑换”（Smart CRM 已确定不在订单中存 <code>gift_id</code>）。所以修改 <code>point_price</code> / <code>external_item_id</code> 时只需<b>通用警告</b> + 提醒重新与 TADA 对账，无需追查旧订单。</p>

</section><section class="panel" id="preflight" role="tabpanel">
<h2>数据检查</h2>
<p>开放页面前先在 UAT / PRD 上运行。页面假定现有数据已符合引擎规则；错误检查 query 必须返回 0 行，有返回行则先修复数据。</p>
<h3>权限与签到</h3><pre>-- Run on UAT / PRD before opening the screens. Every query should return no rows.
-- (1) I1: client groups attached to more than one point program
SELECT client_group, COUNT(*) AS programs, GROUP_CONCAT(promo_config_id) AS program_ids
FROM mt5_crm.promo_client_group
WHERE promo_table = 'point_program'
GROUP BY client_group HAVING COUNT(*) &gt; 1;

-- (2) I2: programs with more than one live check-in task right now
SELECT d.program_id, COUNT(*) AS live_tasks, GROUP_CONCAT(d.id) AS task_ids
FROM mt5_crm.point_task_daily_checkin d
JOIN mt5_crm.point_task_bundle b ON b.id = d.task_bundle_id
WHERE d.enabled = 1 AND b.enabled = 1 AND d.display_hide_to_all = 0
  AND (d.display_period_limit_apply = 0
       OR (UTC_TIMESTAMP() &gt;= d.display_period_from AND UTC_TIMESTAMP() &lt; d.display_period_to))
GROUP BY d.program_id HAVING COUNT(*) &gt; 1;

-- (3) I3 / I5 / I6 / I7: check-in tasks that break an engine rule
SELECT d.id, d.task_name,
       CONCAT_WS(', ',
         IF(d.program_id &lt;&gt; b.program_id, 'program_id differs from bundle', NULL),
         IF(d.tz_minutes IS NULL, 'tz_minutes NULL', NULL),
         IF(d.routine_cycle_repeat IS NULL, 'routine_cycle_repeat NULL', NULL),
         IF(d.point_expiration_window IS NULL, 'point_expiration_window NULL', NULL),
         IF(d.display_event NOT IN ('signup','kyc_approve','first_time_deposit','first_trade'), 'display_event', NULL),
         IF(d.participate_event NOT IN ('signup','kyc_approve','first_time_deposit','first_trade'), 'participate_event', NULL),
         IF(d.participate_period_limit_type NOT IN ('no_limit','specific_period'), 'participate_period_limit_type', NULL),
         IF(d.claim_type NOT IN ('claim_each_day','claim_each_cycle'), 'claim_type', NULL),
         IF(IFNULL(d.claim_valid_period_type, '') NOT IN ('days_after_completion','no_limit'), 'claim_valid_period_type', NULL),
         IF(d.point_expiration_type NOT IN ('days_after_claim','no_limit'), 'point_expiration_type', NULL),
         IF(d.restart_missed_checkin_enabled = 1
            AND JSON_LENGTH(d.point_distribute_specify_each_day, '$.cycles') &lt;&gt; 1, 'streak needs 1 cycle', NULL),
         IF(JSON_LENGTH(d.point_distribute_specify_each_day, '$.cycles[0]') &lt;&gt; d.routine_cycle_limit_days,
            'cycle 1 length differs from routine_cycle_limit_days', NULL)
       ) AS problems
FROM mt5_crm.point_task_daily_checkin d
LEFT JOIN mt5_crm.point_task_bundle b ON b.id = d.task_bundle_id
HAVING problems &lt;&gt; '';</pre>
<h3>交易与 Coin</h3><pre>-- Run on UAT / PRD before opening the screens. Every query should return no rows.
-- (1) J2: programs with more than one live trading task
SELECT d.program_id, COUNT(*) AS live_tasks, GROUP_CONCAT(d.id) AS task_ids
FROM mt5_crm.point_task_trading d
JOIN mt5_crm.point_task_bundle b ON b.id = d.task_bundle_id
JOIN mt5_crm.point_program p ON p.id = d.program_id
WHERE d.enabled = 1 AND b.enabled = 1 AND p.enabled = 1
  AND (d.participate_period_limit_type = 'no_limit' OR d.participate_period_to &gt; UTC_TIMESTAMP())
GROUP BY d.program_id HAVING COUNT(*) &gt; 1;

-- (2) J1 / J3 / J4 / field ranges: trading tasks that break an engine rule
SELECT d.id, d.task_name,
       CONCAT_WS(', ',
         IF(b.id IS NULL OR d.program_id &lt;&gt; b.program_id, 'program_id differs from bundle', NULL),
         IF(d.display_event IS NULL OR d.display_event NOT IN ('signup','kyc_approve','first_time_deposit','first_trade'), 'display_event', NULL),
         IF(d.display_hide_book_type NOT IN (0,1,2), 'display_hide_book_type', NULL),
         IF(d.display_period_limit_apply = 1 AND (d.display_period_from IS NULL OR d.display_period_to IS NULL
            OR d.display_period_from &gt;= d.display_period_to), 'display period', NULL),
         IF(d.participate_period_limit_type NOT IN ('no_limit','specific_period'), 'participate_period_limit_type', NULL),
         IF(d.participate_period_limit_type = 'specific_period' AND (d.participate_period_from IS NULL
            OR d.participate_period_to IS NULL OR d.participate_period_from &gt;= d.participate_period_to), 'participate period', NULL),
         IF(d.point_max_cap_enabled = 1 AND d.point_max_cap_value &lt; 1, 'daily cap', NULL),
         IF(d.point_expiration_window &lt; 1, 'point_expiration_window', NULL),
         IF(d.terms_url = '', 'terms_url empty string', NULL)
       ) AS problems
FROM mt5_crm.point_task_trading d
LEFT JOIN mt5_crm.point_task_bundle b ON b.id = d.task_bundle_id
HAVING problems &lt;&gt; '';

-- (3) J5: duplicate or broken rate rows
SELECT task_id, LOWER(mt5_group) AS grp, LOWER(condition_type) AS ctype, LOWER(IFNULL(condition_value, '')) AS cval,
       COUNT(*) AS n, GROUP_CONCAT(id) AS ids
FROM mt5_crm.point_task_trading_point_conversion
WHERE deleted = 0
GROUP BY 1, 2, 3, 4 HAVING COUNT(*) &gt; 1;

SELECT id, task_id, mt5_group, condition_type, condition_value, point_per_lot
FROM mt5_crm.point_task_trading_point_conversion
WHERE deleted = 0
  AND ( condition_type NOT IN ('symbol','symbol_group','any')
     OR (condition_type = 'any' AND IFNULL(condition_value, '') NOT IN ('', 'other'))
     OR (condition_type = 'symbol_group' AND condition_value NOT IN ('forex','metal','energy','index','stocks','other'))
     OR (condition_type = 'symbol' AND (condition_value IS NULL OR condition_value LIKE '%.%'))
     OR point_per_lot &lt; 0 );

-- (4) J6: enabled tasks with no positive rate
SELECT d.id, d.task_name FROM mt5_crm.point_task_trading d
WHERE d.enabled = 1
  AND NOT EXISTS (SELECT 1 FROM mt5_crm.point_task_trading_point_conversion v
                  WHERE v.task_id = d.id AND v.deleted = 0 AND v.point_per_lot &gt; 0);</pre>
<h3>礼品与兑换</h3><pre>-- Run on UAT / PRD before opening the screens. (1)-(2) should return no rows; (3)-(4) are reference figures.
-- (1) Gift points to a missing program, or the program has no client group (RI1/RI2)
SELECT g.id, g.program_id, g.gift_name
FROM mt5_crm.point_featured_gift g
LEFT JOIN mt5_crm.point_program p ON p.id = g.program_id
LEFT JOIN mt5_crm.promo_client_group cg
       ON cg.promo_table = 'point_program' AND cg.promo_config_id = g.program_id
WHERE p.id IS NULL OR cg.id IS NULL;

-- (2) Enabled gift without external_item_id (price cannot be reconciled with TADA — RI1)
SELECT id, program_id, gift_name, point_price
FROM mt5_crm.point_featured_gift
WHERE enabled = 1 AND (external_item_id IS NULL OR external_item_id = '');

-- (3) Transactions waiting for manual review (reconciled = 1) — backlog to handle by hand (RI5)
SELECT COUNT(*) AS pending_manual_review
FROM mt5_crm.point_redemption_transaction
WHERE external_system = 'tada' AND status = 1 AND reconciled = 1;

-- (4) Redeem blacklist rows pointing to clients that no longer exist (junk data)
SELECT bl.id, bl.client_id, bl.enabled
FROM mt5_crm.client_promotion_blacklist bl
LEFT JOIN mt5_crm.crm_customer_base c ON c.client_id = bl.client_id AND c.deleted = 0
WHERE bl.promo_table = 'point_redemption_transaction'
  AND bl.promo_config_id = 0 AND bl.point_task_bundle_id = 0
  AND c.client_id IS NULL;</pre>
</section><section class="panel" id="log" role="tabpanel"><h2>更新日志</h2><div class="scroll"><table><tr><th style="width:14%">日期</th><th>变更</th></tr><tr><td>2026-10-21</td><td>版本 1.1：R1 新增返回 orderDate（新列 point_redemption_order.order_date = 在 TADA 下单的时间）。</td></tr><tr><td>2026-10-21</td><td>第 1 版：将 4 组规格（权限 + 签到第 3 版、交易 + Coin 第 2 版、礼品 + 兑换第 2 版、CleverTap 第 1 版）合并为 1 页；建立工作项清单 DEV-01 至 DEV-12。</td></tr></table></div></section>

<template id="tpl-vi">
<h1>Smart CRM – Loyalty Config: API admin</h1>
<p class="sub">Spec API admin cho các màn hình cấu hình Loyalty trong Smart CRM. Cập nhật: 2026-10-21.</p>
<nav class="tabs" role="tablist"><button type="button" role="tab" data-tab="overview" aria-selected="false">1. Tổng quan</button><button type="button" role="tab" data-tab="dev" aria-selected="false">2. Developer</button><button type="button" role="tab" data-tab="api" aria-selected="false">3. API</button><button type="button" role="tab" data-tab="rules" aria-selected="false">4. Quy tắc</button><button type="button" role="tab" data-tab="locks" aria-selected="false">5. Khoá khi đang chạy</button><button type="button" role="tab" data-tab="preflight" aria-selected="false">6. Kiểm tra dữ liệu</button><button type="button" role="tab" data-tab="log" aria-selected="false">7. Nhật ký</button></nav>
<section class="panel" id="overview" role="tabpanel">
<h2>Tổng quan</h2>
<p>Tài liệu spec API admin cho các màn hình cấu hình Loyalty (point system) trong Smart CRM. Gồm 33 API ở 7 nhóm: phân quyền, check-in task, trading task, coin, gift, redemption, CleverTap. Mọi validation đã đối chiếu với engine trong <code>point_service</code> bản Q4 và DDL thật trên UAT.</p>
<p>Việc developer cần làm hoặc trả lời nằm ở <a href="#dev" class="ref">tab Developer</a>. Trước khi mở màn hình, chạy các query ở <a href="#preflight" class="ref">tab Kiểm tra dữ liệu</a>.</p>

<h3>Mô hình dữ liệu</h3>
<p>Point system có 3 cấp: <b>program</b> (<code>point_program</code>, gắn đúng 1 client group qua <code>promo_client_group</code>) → <b>bundle</b> (<code>point_task_bundle</code>, nhóm task) → <b>task</b> (<code>point_task_daily_checkin</code>, <code>point_task_trading</code>). Khách chỉ thấy và nhận coin của 1 task khi cả 4 cấp đều bật: client group, program, bundle, task.</p>
<p>Phạm vi khách của 1 program (dùng cho tab Coin, Redemption, Omni Marketing):</p>
<pre>-- Clients of program P (plan 0.1): every client group attached to P, enabled or not
SELECT c.client_id
FROM crm_customer_base c
WHERE c.deleted = 0
  AND c.group_code IN (SELECT g.client_group FROM promo_client_group g
                       WHERE g.promo_table = 'point_program' AND g.promo_config_id = #{programId})</pre>

<h3>Quy ước chung</h3>
<div class="scroll"><table>
<tr><th style="width:22%">Nội dung</th><th>Chi tiết</th></tr><tr><td>Nơi đặt API</td><td>Prefix <code>/point/admin/…</code> trong point_service, cùng chỗ với <code>/point/pointAdjust</code> đang có. Frontend Smart CRM gọi qua axios (header <code>X-Access-Token</code>). <span class="pending">PENDING</span> DEV-01.</td></tr><tr><td>Kiểu gọi</td><td>Đọc: <code>GET</code> + query params. Ghi: <code>POST</code> + JSON body. Tên field camelCase. Lọc khoảng thời gian dùng hậu tố <code>_begin</code> / <code>_end</code>.</td></tr><tr><td>Thời gian</td><td>Mọi datetime vào/ra là <b>UTC</b>, dạng <code>yyyy-MM-dd HH:mm:ss</code>, đúng giá trị trong DB. Riêng các cột ngày theo giờ của task (<code>checkin_date</code>, <code>period_key</code>) giữ nguyên chuỗi. Không trả entity trực tiếp vì entity có <code>@JsonFormat(timezone = "GMT+7")</code>. <span class="pending">PENDING</span> DEV-03.</td></tr><tr><td>Người thao tác</td><td><code>create_user</code> / <code>update_user</code> lấy từ user đăng nhập Smart CRM, không nhận từ frontend. <span class="pending">PENDING</span> DEV-02.</td></tr><tr><td>Phân trang</td><td>Nhận <code>pageNo</code>, <code>pageSize</code> (mặc định 1 / 10, tối đa 100); trả <code>result.records</code>, <code>result.total</code>.</td></tr><tr><td>Lỗi</td><td><code>success = false</code>, <code>code = 500</code>, <code>message</code> tiếng Anh (frontend hiển thị nguyên văn). API lưu form trả thêm <code>result.errors = [{field, message}]</code> để frontend tô đỏ từng ô.</td></tr><tr><td>Không xoá</td><td>Không có API xoá. Chỉ bật/tắt để giữ lịch sử. Ngoại lệ: dòng quy đổi điểm của trading task (xoá mềm bằng cột <code>deleted</code>).</td></tr><tr><td>Tạo mới ở trạng thái tắt</td><td>Task (check-in, trading) và quà mới tạo luôn <code>enabled = 0</code>. Chỉ bật bằng API bật/tắt, để mọi lần bật đều qua kiểm tra.</td></tr><tr><td>Transaction và khoá</td><td>Mỗi API ghi chạy trong 1 transaction. API có kiểm quy tắc chéo nhiều task thì khoá dòng program trước (<code>SELECT … FROM point_program WHERE id = ? FOR UPDATE</code>).</td></tr><tr><td>Cảnh báo cần xác nhận</td><td>Hai trading task cùng chạy trong 1 program chỉ bị <b>cảnh báo</b>: API trả <code>success = false</code> kèm <code>result.duplicateTaskIds</code>; frontend hỏi lại người dùng, đồng ý thì gửi lại với <code>confirmDuplicate = true</code>. Áp dụng ở T1, T2, B3.</td></tr><tr><td>Khoảng thời gian mặc định</td><td>Danh sách log và coin luôn có khoảng thời gian mặc định vì bảng lớn: deal log 30 ngày; ledger, lot, notify log 7 ngày.</td></tr>
</table></div>

<h3>Quyết định đã chốt</h3>
<ul class="rules"><li>Program và client group là quan hệ 1-1. Client group không đổi sau khi tạo program. DB không có key bảo đảm điều này: toàn bộ kiểm nằm ở API (P2, P5).</li><li>Mỗi client_id chỉ có 1 client group (<code>crm_customer_base.group_code</code>). Các bảng coin, redemption, notify log không có <code>program_id</code>: dữ liệu của 1 program là dữ liệu của các khách có <code>group_code</code> = client group của program. Khách đổi group thì lịch sử đi theo group hiện tại.</li><li>Program Active = <code>point_program.enabled = 1</code> và <code>promo_client_group.enabled = 1</code>. Trạng thái bật/tắt program sửa ở S2, có hộp xác nhận.</li><li>Mỗi program có tối đa 1 check-in task đang hiển thị (chặn cứng, I2). Mỗi program chỉ nên có 1 trading task đang chạy (chỉ cảnh báo, J2).</li><li>Khoá cứng ở check-in task: <code>point_multiplier_enabled = 0</code>, <code>point_to_cash_convert_type = by_task_fixed_value</code>, <code>checkin_auto = 0</code>. Program: <code>kpi_name_point_multiplier = NULL</code>. Không có màn hình cho <code>point_multiplier</code>, <code>point_program_point_definition</code>, <code>point_notify_event_config</code>.</li><li><code>display_hide_book_type</code> ở program, bundle, task là luật tính coin của trading (không chỉ ẩn hiển thị). Vẫn cho sửa, hộp xác nhận phải nói rõ.</li><li>Điều chỉnh coin thủ công (K3): lý do bắt buộc, chống bấm 2 lần bằng <code>requestId</code>, tối đa 100.000 coin mỗi lần, không trừ quá số dư; coin cộng tay có hạn do người dùng chọn (1–7300 ngày, mặc định 180), chốt 23:59:59 GMT+7.</li><li>Blacklist theo bundle (L1, L2) và blacklist đổi quà (R3, R4) là 2 loại dòng khác nhau trong <code>client_promotion_blacklist</code>. Blacklist đổi quà là toàn cục; trong tab của 1 program chỉ hiện và chỉ cho thêm khách thuộc program.</li><li>Smart CRM là công cụ nội bộ: tiền IDR (<code>idr_amount</code>, <code>fees</code>) hiển thị bình thường. Vẫn che mã voucher / PIN / token, thông tin người nhận; không trả các cột <code>raw_*</code>.</li><li>Đánh dấu giao dịch đã đối soát tay (R5): chỉ cho <code>reconciled</code> 1 → 2, ghi chú bắt buộc.</li></ul>
</section><section class="panel" id="dev" role="tabpanel">

DEV-07</td><td>DDL</td><td>Thêm cột lý do cho điều chỉnh coin thủ công: <code>point_ledger.remark</code>.</td><td>K3</td><td><span class="pending">OPEN</span></td></tr><tr id="dev-08"><td>DEV-08</td><td>Sửa code</td><td><code>ManualPointService.addPoints / deductPoints</code> nhận thêm <code>remark</code>, <code>externalSystem</code>, <code>externalId</code>, <code>expireDays</code>. Hạn lô cộng tay = 23:59:59 GMT+7 của (ngày cộng theo GMT+7 + <code>expireDays</code>), lưu UTC. API cũ <code>/point/pointAdjust</code> không gửi <code>expireDays</code> thì giữ cách hiện tại.</td><td>K3</td><td><span class="pending">OPEN</span></td></tr><tr id="dev-09"><td>DEV-09</td><td>DDL</td><td>Thêm 3 cột lưu người đối soát tay: <code>point_redemption_transaction.reconcile_user</code>, <code>reconcile_remark</code>, <code>reconcile_date</code>.</td><td>R2, R5</td><td><span class="pending">OPEN</span></td></tr><tr id="dev-10"><td>DEV-10</td><td>DDL</td><td>Sửa COMMENT cột <code>point_redemption_transaction.reconciled</code> theo giá trị thật <code>0/1/2</code> (đang ghi <code>0/1</code>).</td><td>R2</td><td><span class="pending">OPEN</span></td></tr><tr id="dev-11"><td>DEV-11</td><td>Câu hỏi</td><td><code>crm_customer_base.fake_account</code> có <code>DEFAULT 1</code>: cột này có thật là cờ tài khoản test không?</td><td>—</td><td><span class="pending">OPEN</span></td></tr><tr id="dev-12"><td>DEV-12</td><td>Tuỳ chọn</td><td>Bảng quy đổi điểm trading không có unique key. Không bắt buộc (T1 đã khoá task và tự kiểm trùng).</td><td>T1</td><td>—</td></tr>
